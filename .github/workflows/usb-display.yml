name: USB display

on:
  pull_request:
    paths:
      - 'scripts/usb-display/**'
      - '.github/workflows/usb-display.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/usb-display/**'
      - '.github/workflows/usb-display.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/usb-display/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m unittest discover -s scripts/usb-display -p 'test_*.py'
