name: Validate agent configs

on:
  pull_request:
  push:
    branches: [main]

# Collapse a burst of pushes/PR updates on the same ref to a single run: a newer
# commit cancels the superseded one instead of queueing behind it on the single
# self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compute the runner matrix. Trusted events (push, same-repo PRs) validate on
  # BOTH hosted ubuntu (full Linux coverage) and the self-hosted Apple Silicon Mac
  # mini (macOS-native coverage). Fork PRs from a public repo run on ubuntu ONLY,
  # so untrusted code never executes on the self-hosted host even if a maintainer
  # approves the run. A static matrix cannot drop a leg conditionally, hence this
  # setup job.
  setup:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.pick.outputs.runners }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            echo 'runners=[["ubuntu-latest"]]' >> "$GITHUB_OUTPUT"
          else
            echo 'runners=[["ubuntu-latest"],["self-hosted","macmini"]]' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.setup.outputs.runners) }}
    runs-on: ${{ matrix.runner }}

    steps:
      # fetch-depth: 0 stays: stable-tag version resolution needs the full tag
      # list, and a shallow clone makes the runtime fall back to 0.0.0-SNAPSHOT
      # so the update-check tests fail as unversioned.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # Pin JDK 21 explicitly: the self-hosted host's default java may differ, and
      # the project targets 21. setup-java provisions it into the runner tool cache.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Kotlin runtime checks
        run: (cd runtime-kotlin && ./gradlew check --no-build-cache)

      - name: Run agnix
        run: |
          set +e
          output_file="$(mktemp)"
          npx --yes agnix --strict . >"$output_file" 2>&1
          status=$?
          cat "$output_file"
          if grep -q "Found 0 errors" "$output_file"; then
            exit 0
          fi
          exit "$status"

      - name: Run repo-native validation
        run: scripts/validate_agent_configs
