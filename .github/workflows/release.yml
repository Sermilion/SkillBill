name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.*.*"
  # AC6: a maintainer can stage a real, downloadable asset set for subtask 4
  # testing without cutting a tag. The staging_version input names the assets and
  # the (pre)release; see RELEASING.md "Staging a release for downstream testing".
  workflow_dispatch:
    inputs:
      staging_version:
        description: >-
          SemVer prerelease label for a manual run (e.g. v0.4.0-staging.1).
          Produces a downloadable prerelease asset set without requiring a pushed tag.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # On a tag push GITHUB_REF_NAME is the tag; on workflow_dispatch it is the
  # branch. Either way the group is unique per release attempt.
  group: release-${{ github.ref_name }}-${{ inputs.staging_version }}
  cancel-in-progress: false

jobs:
  # Phase 1: per-OS artifact producers. Each matrix leg runs on a host whose
  # native toolchain can build that OS/arch's runtime images (jlink cannot
  # cross-compile). fail-fast:false so one host failing
  # does not abort the others. The canonical <os>-<arch> token (host_token) is the
  # SAME contract subtasks 1-2 bake into the artifact filenames and subtask 4
  # resolves by host (resolveHostRuntimeToken).
  build:
    name: Build ${{ matrix.host_token }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon) — built natively on the self-hosted Mac
          # mini. Apple Silicon is the only supported macOS target; the Intel
          # (macos-x64) leg was dropped. The mini must be online when a release
          # tag is pushed, or this leg queues until it is (fail-fast:false lets
          # the hosted legs publish regardless). runner is a JSON array so a
          # self-hosted label set and the hosted single-label legs share one
          # `runs-on: ${{ fromJSON(matrix.runner) }}` expression.
          - runner: '["self-hosted", "macmini"]'
            host_token: macos-arm64
          # Windows x64.
          - runner: '["windows-latest"]'
            host_token: windows-x64
          # Linux x64.
          - runner: '["ubuntu-latest"]'
            host_token: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # AC7: pin the build toolchain to JDK 21 (temurin) on every runner so the
      # jlink image + jpackage installer are produced with a consistent JDK.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux tray build dependencies
        if: matrix.host_token == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libsystemd-dev

      # Derive RELEASE_VERSION from the pushed tag (v0.2.0 → 0.2.0) or the
      # staging_version input (workflow_dispatch). Gradle reads this env var in
      # build.gradle.kts so every artifact name embeds the correct version.
      - name: Set release version
        shell: bash
        env:
          STAGING_VERSION: ${{ inputs.staging_version }}
        run: |
          validation_args=()
          raw="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$STAGING_VERSION"
            validation_args+=(--force-prerelease)
          fi
          scripts/validate_release_ref "$raw" "${validation_args[@]}"
          echo "RELEASE_VERSION=${raw#v}" >> "$GITHUB_ENV"

      # AC1/AC5: self-contained per-OS runtime images for CLI + MCP. runtimeZip is
      # finalizedBy its .sha256 task, so each produces archive + .sha256. Badass
      # Runtime tasks are not configuration-cache compatible; opt out explicitly
      # because gradle.properties enables configuration-cache by default. bash +
      # the Unix-style ./gradlew launcher works on every hosted runner (Git Bash
      # on Windows runs the POSIX wrapper).
      - name: Build runtime images
        shell: bash
        env:
          SKILL_BILL_INSTALL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cd runtime-kotlin
          ./gradlew --no-configuration-cache :runtime-cli:runtimeZip :runtime-mcp:runtimeZip

      - name: Build desktop tray distribution
        shell: bash
        env:
          SKILL_BILL_INSTALL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: (cd desktop-tray && ./gradlew clean check createDistributable --no-build-cache --no-configuration-cache)

      # The installer refuses a runtime and desktop pair whose build identity
      # records differ, so a release must never publish one.
      - name: Verify runtime and desktop build identities match
        shell: bash
        run: |
          set -euo pipefail
          runtime_record="runtime-kotlin/runtime-cli/build/install/runtime-cli/build-identity.properties"
          mapfile -t desktop_records < <(find desktop-tray/composeApp/build/compose/binaries/main/app \
            -name build-identity.properties -type f)
          if [[ "${#desktop_records[@]}" -ne 1 ]]; then
            echo "Expected one desktop build identity record, found ${#desktop_records[@]}." >&2
            exit 1
          fi
          cat "$runtime_record"
          cmp "$runtime_record" "${desktop_records[0]}"

      - name: Bundle skills archive
        if: matrix.host_token == 'linux-x64'
        shell: bash
        run: |
          archive="skill-bill-skills-${RELEASE_VERSION}.tar.gz"
          tar -czf "$archive" LICENSE skills/ platform-packs/ orchestration/ uninstall.sh
          sha256sum "$archive" > "${archive}.sha256"

      - name: Bundle desktop tray archive
        shell: bash
        env:
          HOST_TOKEN: ${{ matrix.host_token }}
        run: |
          set -euo pipefail
          app_dir="desktop-tray/composeApp/build/compose/binaries/main/app"
          [[ -d "$app_dir" ]] || { echo "Missing desktop distribution: $app_dir." >&2; exit 1; }
          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT
          cp -R "$app_dir/." "$stage_dir/"
          cp LICENSE "$stage_dir/LICENSE"
          archive="skill-bill-desktop-${RELEASE_VERSION}-${HOST_TOKEN}.tar.gz"
          tar -czf "$archive" -C "$stage_dir" .
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$archive" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$digest" "$archive" > "${archive}.sha256"

      - name: Verify desktop archive excludes runtime modules
        shell: bash
        run: |
          set -euo pipefail
          archive="skill-bill-desktop-${RELEASE_VERSION}-${{ matrix.host_token }}.tar.gz"
          python3 - "$archive" <<'PYTHON'
          import io
          import sys
          import tarfile
          import zipfile

          with tarfile.open(sys.argv[1]) as archive:
              for member in archive.getmembers():
                  if not member.isfile() or not member.name.endswith(".jar"):
                      continue
                  with zipfile.ZipFile(io.BytesIO(archive.extractfile(member).read())) as jar:
                      if any(name.startswith("skillbill/") and name.endswith(".class") for name in jar.namelist()):
                          raise SystemExit(f"Desktop release archive contains Skill Bill runtime classes: {member.name}")
          PYTHON

      - name: Verify packaged licenses and checksums
        shell: bash
        run: |
          set -euo pipefail
          host_token="${{ matrix.host_token }}"
          artifacts=(
            "runtime-kotlin/runtime-cli/build/runtime-image/runtime-cli-${RELEASE_VERSION}-${host_token}.zip"
            "runtime-kotlin/runtime-mcp/build/runtime-image/runtime-mcp-${RELEASE_VERSION}-${host_token}.zip"
            "skill-bill-desktop-${RELEASE_VERSION}-${host_token}.tar.gz"
          )
          case "${host_token}" in
            macos-arm64|windows-x64)
              ;;
            linux-x64)
              artifacts+=("skill-bill-skills-${RELEASE_VERSION}.tar.gz")
              ;;
            *)
              echo "Unsupported release host token: ${host_token}." >&2
              exit 1
              ;;
          esac
          for artifact in "${artifacts[@]}"; do
            [[ -f "${artifact}" ]] || { echo "Missing canonical artifact: ${artifact}." >&2; exit 1; }
            [[ -f "${artifact}.sha256" ]] || { echo "Missing checksum sidecar: ${artifact}.sha256." >&2; exit 1; }
          done
          scripts/verify_release_artifact_licenses "${artifacts[@]}"
          verifier_probe="$(mktemp -d)"
          # The verifier resolves its repo root as <script dir>/.., so the probe
          # copy must sit under scripts/ for the drifted LICENSE to be the one
          # it compares against.
          mkdir -p "${verifier_probe}/scripts"
          cp scripts/verify_release_artifact_licenses "${verifier_probe}/scripts/verify_release_artifact_licenses"
          printf '%s\n' 'intentional license drift probe' > "${verifier_probe}/LICENSE"
          for artifact in "${artifacts[@]}"; do
            probe_log="${verifier_probe}/$(basename "${artifact}").log"
            if "${verifier_probe}/scripts/verify_release_artifact_licenses" "${artifact}" >"${probe_log}" 2>&1; then
              echo "License drift probe unexpectedly accepted ${artifact}." >&2
              exit 1
            fi
            if ! grep -q 'LICENSE bytes differ' "${probe_log}"; then
              echo "License drift probe failed for an unrelated reason in ${artifact}." >&2
              cat "${probe_log}" >&2
              exit 1
            fi
          done
          mkdir release-assets
          for artifact in "${artifacts[@]}"; do
            cp "${artifact}" "${artifact}.sha256" release-assets/
          done

      # AC2/AC5: upload every verified archive + its .sha256 under an artifact
      # named with the canonical host token so the publish job can collect them.
      # The runtime-image zips live under <module>/build/runtime-image/.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.host_token }}
          if-no-files-found: error
          retention-days: 7
          path: release-assets/

  # Phase 2: validation gate + GitHub Release publish. needs: build so the release
  # only happens once every host's artifacts exist. The maintainer validation gate
  # is preserved EXACTLY and runs fail-closed BEFORE any download/attach step.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # validate_release_ref delegates to ./gradlew :runtime-cli:run, and `gradlew
      # check` runs here too, so this job needs the same pinned JDK 21 (AC7).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Kotlin runtime checks
        run: (cd runtime-kotlin && ./gradlew check)

      - name: Run agnix
        run: |
          set +e
          output_file="$(mktemp)"
          npx --yes agnix --strict . >"$output_file" 2>&1
          status=$?
          cat "$output_file"
          if grep -q "Found 0 errors" "$output_file"; then
            exit 0
          fi
          exit "$status"

      - name: Run repo-native validation
        run: scripts/validate_agent_configs

      - name: Validate release tag
        id: release_meta
        if: github.event_name != 'workflow_dispatch'
        run: scripts/validate_release_ref "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

      - name: Resolve staging release metadata
        id: staging_meta
        if: github.event_name == 'workflow_dispatch'
        env:
          STAGING_VERSION: ${{ inputs.staging_version }}
        run: >-
          scripts/validate_release_ref "$STAGING_VERSION" --force-prerelease
          --github-output "$GITHUB_OUTPUT"

      # AC2/AC5: collect every host's archives + .sha256 into one flat directory.
      # merge-multiple flattens the per-host artifact dirs so every asset lands
      # directly under dist/ for the attach step.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: List downloaded artifacts
        run: |
          echo "Collected release assets:"
          ls -la dist
          echo "Total asset count: $(find dist -type f | wc -l)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag || steps.staging_meta.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release_meta.outputs.prerelease || steps.staging_meta.outputs.prerelease }}
          IS_STAGING: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "No release tag resolved; refusing to publish." >&2
            exit 1
          fi

          expected_commit="${GITHUB_SHA}"
          if [[ "${IS_STAGING}" != "true" ]]; then
            expected_commit="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
            if [[ -z "${expected_commit}" ]]; then
              expected_commit="$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
            fi
            if [[ -z "${expected_commit}" || "${expected_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Release tag ${RELEASE_TAG} does not peel to the validated commit ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          release_version="${RELEASE_TAG#v}"
          artifact_names=(
            "runtime-cli-${release_version}-macos-arm64.zip"
            "runtime-mcp-${release_version}-macos-arm64.zip"
            "skill-bill-desktop-${release_version}-macos-arm64.tar.gz"
            "runtime-cli-${release_version}-windows-x64.zip"
            "runtime-mcp-${release_version}-windows-x64.zip"
            "skill-bill-desktop-${release_version}-windows-x64.tar.gz"
            "runtime-cli-${release_version}-linux-x64.zip"
            "runtime-mcp-${release_version}-linux-x64.zip"
            "skill-bill-desktop-${release_version}-linux-x64.tar.gz"
            "skill-bill-skills-${release_version}.tar.gz"
          )
          asset_names=()
          for artifact_name in "${artifact_names[@]}"; do
            asset_names+=("${artifact_name}" "${artifact_name}.sha256")
          done
          for asset_name in "${asset_names[@]}"; do
            [[ -f "dist/${asset_name}" ]] || { echo "Missing expected release asset: ${asset_name}." >&2; exit 1; }
          done
          for downloaded_asset in dist/*; do
            [[ -f "${downloaded_asset}" ]] || continue
            downloaded_name="$(basename "${downloaded_asset}")"
            expected=false
            for asset_name in "${asset_names[@]}"; do
              if [[ "${downloaded_name}" == "${asset_name}" ]]; then
                expected=true
                break
              fi
            done
            if [[ "${expected}" != "true" ]]; then
              echo "Unexpected release asset: ${downloaded_name}." >&2
              exit 1
            fi
          done
          assets=()
          for asset_name in "${asset_names[@]}"; do
            assets+=("dist/${asset_name}")
          done

          release_exists=false
          release_published=false
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [[ "${release_exists}" == "true" ]]; then
            release_metadata="$(gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" --json isDraft,isPrerelease,targetCommitish,tagName --jq '[.isDraft, .isPrerelease, .targetCommitish, .tagName] | @tsv')"
            IFS=$'\t' read -r existing_draft existing_prerelease existing_target existing_tag <<< "${release_metadata}"
            if [[ "${existing_tag}" != "${RELEASE_TAG}" || "${existing_prerelease}" != "${RELEASE_PRERELEASE}" ]]; then
              echo "Existing draft ${RELEASE_TAG} does not match this validated tag, commit, and prerelease classification." >&2
              exit 1
            fi
            if [[ "${IS_STAGING}" == "true" && "${existing_target}" != "${expected_commit}" ]]; then
              echo "Existing staging release ${RELEASE_TAG} does not target the validated commit ${expected_commit}." >&2
              exit 1
            fi
            if [[ "${existing_draft}" != "true" ]]; then
              release_published=true
            fi
          else
            if [[ "${IS_STAGING}" == "true" ]] && git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Staging tag ${RELEASE_TAG} already exists without a resumable draft release." >&2
              exit 1
            fi

            echo "Creating draft ${RELEASE_TAG} at ${GITHUB_SHA} with ${#assets[@]} verified assets (prerelease=${RELEASE_PRERELEASE})."
            args=(
              "${RELEASE_TAG}"
              --repo "${{ github.repository }}"
              --title "${RELEASE_TAG}"
              --generate-notes
              --target "${GITHUB_SHA}"
            )
            if [[ "${IS_STAGING}" != "true" ]]; then
              args+=(--verify-tag)
            fi
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}" --draft
          fi

          existing_assets_dir="$(mktemp -d)"
          trap 'rm -rf "${existing_assets_dir}"' EXIT
          uploaded_names="$(gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)"
          while IFS= read -r uploaded_name; do
            [[ -n "${uploaded_name}" ]] || continue
            expected=false
            for asset_name in "${asset_names[@]}"; do
              if [[ "${uploaded_name}" == "${asset_name}" ]]; then
                expected=true
                break
              fi
            done
            if [[ "${expected}" != "true" ]]; then
              echo "Draft release contains an unexpected asset: ${uploaded_name}." >&2
              exit 1
            fi
          done <<< "${uploaded_names}"
          for asset_name in "${asset_names[@]}"; do
            if grep -Fxq "${asset_name}" <<< "${uploaded_names}"; then
              gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" --pattern "${asset_name}" --dir "${existing_assets_dir}"
              if ! cmp -s "dist/${asset_name}" "${existing_assets_dir}/${asset_name}"; then
                echo "Existing draft asset bytes differ from the validated asset: ${asset_name}." >&2
                exit 1
              fi
            else
              if [[ "${release_published}" == "true" ]]; then
                echo "Published release is missing expected asset: ${asset_name}." >&2
                exit 1
              fi
              gh release upload "${RELEASE_TAG}" "dist/${asset_name}" --repo "${{ github.repository }}"
            fi
          done
          uploaded_names="$(gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)"
          for asset_name in "${asset_names[@]}"; do
            if ! grep -Fxq "${asset_name}" <<< "${uploaded_names}"; then
              echo "Draft release is missing uploaded asset: ${asset_name}." >&2
              exit 1
            fi
          done
          uploaded_count="$(printf '%s\n' "${uploaded_names}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "${uploaded_count}" != "${#asset_names[@]}" ]]; then
            echo "Draft release contains an unexpected number of assets: ${uploaded_count}." >&2
            exit 1
          fi
          if [[ "${release_published}" == "true" ]]; then
            echo "Published release ${RELEASE_TAG} already matches the validated metadata and assets."
          else
            gh release edit "${RELEASE_TAG}" --repo "${{ github.repository }}" --draft=false
          fi

      - name: Delete downloads from older runtime releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag || steps.staging_meta.outputs.tag }}
        run: scripts/prune_old_release_assets "${GITHUB_REPOSITORY}" "${RELEASE_TAG}"

      - name: Remove release build artifacts from Actions storage
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prefix = "release-assets-";
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "release.yml",
              status: "completed",
              per_page: 100,
            });
            const completedRunIds = new Set(runs.map((run) => run.id));
            completedRunIds.add(context.runId);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (!artifact.name.startsWith(prefix) || !completedRunIds.has(artifact.workflow_run?.id)) {
                continue;
              }
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted ${artifact.name} from completed release build ${artifact.workflow_run.id}.`);
            }
