name: Desktop tray CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Everything but prose, so a reintroduced root source set or a wrapper change still reaches the guards.
      - "desktop-tray/**"
      - "!desktop-tray/**/*.md"
      - "runtime-kotlin/**"
      - "build-identity/**"
      - ".github/workflows/desktop-tray-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SKILL_BILL_INSTALL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Linux tray build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libsystemd-dev xvfb xauth
      - name: Provision runtime for desktop packaging
        run: (cd runtime-kotlin && ./gradlew :runtime-cli:installDist)
      - name: Run desktop checks
        run: |
          cd desktop-tray
          run_gradle() {
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              xvfb-run --auto-servernum ./gradlew "$@"
            else
              ./gradlew "$@"
            fi
          }
          run_gradle clean check --no-build-cache
          for attempt in 1 2 3; do
            if run_gradle createDistributable --no-build-cache; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Print jpackage diagnostics after a failed build
        if: failure()
        shell: bash
        run: |
          for error_log in desktop-tray/composeApp/build/compose/logs/createDistributable/*-err.txt; do
            [[ -f "$error_log" ]] || continue
            echo "jpackage error log: $error_log"
            cat "$error_log"
          done
      - name: Smoke packaged work data without CLI discovery
        run: (cd desktop-tray && ./gradlew :composeApp:packagedDataSmoke --no-build-cache)
      - name: Upload desktop snapshot
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tray-snapshot-${{ matrix.os }}
          path: desktop-tray/composeApp/build/compose/binaries/main/app/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
