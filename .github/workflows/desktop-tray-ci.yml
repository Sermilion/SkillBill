name: Desktop tray CI

on:
  pull_request:
    paths:
      - "desktop-tray/**"
      - "runtime-kotlin/**"
      - ".github/workflows/desktop-tray-ci.yml"
  push:
    branches: [main]
    paths:
      - "desktop-tray/**"
      - "runtime-kotlin/**"
      - ".github/workflows/desktop-tray-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Linux tray build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libsystemd-dev
      - name: Run desktop checks
        run: (cd desktop-tray && ./gradlew clean check createDistributable --no-build-cache)
      - name: Smoke packaged work data without CLI discovery
        run: python desktop-tray/scripts/packaged-data-smoke.py
