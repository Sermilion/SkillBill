<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Skill Bill</title>
  <desc id="desc">Skill Bill application icon: the Ping mark, three bands clipped to a disc, on a dark tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1E24"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="ping-clip">
      <circle cx="50" cy="50" r="44"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="36" y="36" width="952" height="952" rx="220" fill="none" stroke="url(#edge)" stroke-width="8"/>

  <!-- Ping mark from design/sona-logo-linear.html (100 px box), sized 46/72 of the tile as in the study. -->
  <g transform="translate(205.33 205.33) scale(6.1333)">
    <g clip-path="url(#ping-clip)" fill="none" stroke="#EDEDF0">
      <circle cx="18.9" cy="81.1" r="13" stroke-width="26"/>
      <circle cx="18.9" cy="81.1" r="47" stroke-width="22"/>
      <circle cx="18.9" cy="81.1" r="80" stroke-width="22"/>
    </g>
  </g>
</svg>
