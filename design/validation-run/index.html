<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validation run detail</title>
<!-- Design reference only. Colors, type and spacing come from the Linear study tokens, which match SkillBillColors. Every scenario is a real standalone_phase_status row for phase_id = 'validation', with home directories anonymized and one provider org id redacted. The agent-signal line in "Running" is sample data shaped like an agent_activity_stamps row. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../linear-study/ds/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  select { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }
  :focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
  code, .mono { font: 400 var(--t-xs) var(--font-mono); }
  code { color: var(--fg-2); background: var(--bg-active); padding: 1px 4px; border-radius: var(--r-xs); overflow-wrap: anywhere; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); font-size: var(--t-sm); }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .scenario { display: flex; align-items: center; gap: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .scenario select { height: 30px; padding: 0 var(--sp-2); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); }
  .chrome-btn { height: 30px; padding: 0 var(--sp-3); background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); }
  .chrome-btn:hover { color: var(--fg); background: var(--bg-hover); }

  .stage { flex: 1; min-height: 0; display: flex; gap: var(--sp-6); padding: var(--sp-3) var(--sp-4) var(--sp-4); overflow: auto; }
  .column { flex: none; width: 640px; display: flex; flex-direction: column; gap: 6px; min-height: 640px; }
  .column-label { flex: none; font-size: var(--t-xs); font-weight: 500; color: var(--fg-faint); }
  .notes { flex: 1 1 380px; min-width: 320px; max-width: 540px; overflow: auto; padding: 18px var(--sp-1) 0; font-size: var(--t-sm); color: var(--fg-muted); }
  .notes h2 { margin: 0 0 var(--sp-2); font-size: var(--t-sm); font-weight: 500; color: var(--fg); }
  .notes section + section { margin-top: var(--sp-5); }
  .notes ul { margin: 0; padding: 0 0 0 var(--sp-4); display: flex; flex-direction: column; gap: 6px; }
  .notes p { margin: 0 0 var(--sp-2); }
  .notes b { color: var(--fg-2); font-weight: 500; }
  .src { width: 100%; border-collapse: collapse; font-size: var(--t-xs); }
  .src td { padding: 5px 6px 5px 0; vertical-align: top; border-top: 1px solid var(--border-subtle); }
  .src td:first-child { color: var(--fg-2); white-space: nowrap; }
  .tag { display: inline-block; padding: 0 5px; border-radius: var(--r-xs); font-size: var(--t-2xs); line-height: 16px; background: var(--bg-active); color: var(--fg-muted); white-space: nowrap; }
  .tag.stored { background: rgba(63, 185, 80, 0.12); color: var(--st-done); }
  .tag.derived { background: var(--accent-tint); color: var(--accent-text); }
  .tag.sample { background: rgba(226, 112, 60, 0.12); color: var(--st-blocked); }

  /* Details pane */
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .head { flex: none; height: var(--header-h, 44px); display: flex; align-items: center; padding: 0 var(--sp-2) 0 var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
  .head h1 { margin: 0; font-size: var(--t-base); font-weight: 500; flex: 1; }
  .iconbtn { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; background: transparent; border: 0; border-radius: var(--r-sm); color: var(--fg-muted); }
  .iconbtn:hover { background: var(--bg-active); color: var(--fg); }
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: var(--sp-4) var(--sp-4) var(--sp-8); }

  /* Document header */
  .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: var(--sp-2); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-full); font-size: var(--t-xs); color: var(--fg-2); }
  .pill .dot { width: 7px; height: 7px; }
  .keytxt { font: 500 var(--t-xs) var(--font-mono); color: var(--fg-muted); }
  .title { margin: 0 0 6px; font-size: var(--t-xl); font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .title code { font-size: 0.82em; font-weight: 500; padding: 1px 5px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px var(--sp-4); font-size: var(--t-sm); color: var(--fg-muted); margin-bottom: var(--sp-3); }
  .meta span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .meta .mono { color: var(--fg-2); overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: var(--t-sm); color: var(--fg-2); }
  .btn:hover { background: var(--bg-overlay); color: var(--fg); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--st-failed); }
  .btn.sm { height: 22px; padding: 0 8px; font-size: var(--t-xs); }

  /* Outcome card */
  .outcome { margin-top: var(--sp-5); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-raised); overflow: hidden; }
  .outcome-top { display: flex; gap: var(--sp-3); padding: var(--sp-4); border-left: 3px solid var(--tone, var(--fg-faint)); }
  .outcome-icon { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); flex: none; }
  .outcome-icon .ico { width: 18px; height: 18px; stroke-width: 2; }
  .outcome-icon.live::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--tone) 45%, transparent); animation: pulse 1.6s var(--ease, ease-out) infinite; }
  @keyframes pulse { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
  .outcome-main { flex: 1; min-width: 0; }
  .outcome-label { font-size: var(--t-xs); color: var(--fg-faint); margin-bottom: 2px; display: flex; gap: 6px; align-items: center; }
  .outcome-label b { color: var(--tone); font-weight: 600; letter-spacing: .02em; }
  .outcome-head { margin: 0; font-size: var(--t-md); font-weight: 500; line-height: 1.45; color: var(--fg); }
  .outcome-text { margin: 6px 0 0; color: var(--fg-2); font-size: var(--t-sm); line-height: 1.55; }
  .outcome-when { font-size: var(--t-xs); color: var(--fg-faint); text-align: right; white-space: nowrap; }
  .outcome-when b { display: block; font-size: var(--t-sm); color: var(--fg-2); font-weight: 500; font-variant-numeric: tabular-nums; }
  .signal { display: flex; align-items: center; gap: 6px; margin-top: var(--sp-2); font-size: var(--t-xs); color: var(--fg-muted); }
  .signal .dot { width: 6px; height: 6px; color: var(--st-active); }
  .score { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border-subtle); }
  .score-cell { padding: 10px var(--sp-3); min-width: 0; border-right: 1px solid var(--border-subtle); }
  .score-cell:last-child { border-right: 0; }
  .score-k { font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); font-family: var(--font-mono); }
  .score-v { font-size: var(--t-md); font-weight: 600; margin: 2px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score-s { font-size: var(--t-xs); color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tone-done { --tone: var(--st-done); }
  .tone-active { --tone: var(--st-active); }
  .tone-blocked { --tone: var(--st-blocked); }
  .tone-failed { --tone: var(--st-failed); }
  .tone-neutral { --tone: var(--fg-2); }
  .tone-faint { --tone: var(--fg-faint); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }

  /* Flagged strip */
  .flagged { margin-top: var(--sp-3); padding: 10px var(--sp-3); border: 1px solid rgba(226, 112, 60, 0.35); background: rgba(226, 112, 60, 0.07); border-radius: var(--r-md); display: flex; gap: var(--sp-2); align-items: flex-start; font-size: var(--t-sm); color: var(--fg-2); }
  .flagged .ico { color: var(--st-blocked); margin-top: 2px; }
  .flagged-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .flagged-main b { color: var(--fg); font-weight: 500; }
  .jumps { display: flex; flex-wrap: wrap; gap: 6px; }
  .jump { height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: var(--t-xs); color: var(--fg-2); }
  .jump:hover { border-color: var(--border-strong); color: var(--fg); }

  /* Sections */
  .sec { margin-top: var(--sp-6); }
  .sec-head { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
  .sec-head h2 { margin: 0; font-size: var(--t-base); font-weight: 500; }
  .sec-head .n { color: var(--fg-faint); font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
  .sec-head .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent-text); font-size: var(--t-xs); }
  .linkbtn:hover { text-decoration: underline; }
  .box { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--bg-panel); }
  .quiet { color: var(--fg-faint); font-size: var(--t-sm); padding: 10px var(--sp-3); }

  /* Report parts */
  .part + .part { border-top: 1px solid var(--border-subtle); }
  .part-head { width: 100%; display: grid; grid-template-columns: 14px auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-2); padding: 9px var(--sp-3); background: transparent; border: 0; text-align: left; }
  .part-head:hover { background: var(--bg-hover); }
  .part-head .chev { color: var(--fg-faint); transition: transform var(--dur-fast, .12s) ease; }
  .part-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .part-head .label { font-weight: 500; color: var(--fg); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .part-head .label .flag { color: var(--st-blocked); }
  .part-head .preview { color: var(--fg-faint); font-size: var(--t-sm); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .part-head[aria-expanded="true"] .preview { visibility: hidden; }
  .part-head .cnt { font: 400 var(--t-2xs) var(--font-mono); color: var(--fg-faint); }
  .part.flag .part-head { box-shadow: inset 2px 0 0 var(--st-blocked); }
  .part-body { padding: 0 var(--sp-4) var(--sp-3) 36px; font-size: var(--t-sm); color: var(--fg-2); line-height: 1.55; }
  .part-body[hidden] { display: none; }
  .part-body p { margin: 0 0 var(--sp-2); }
  .part-body ol, .part-body ul { margin: 0 0 var(--sp-2); padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .part-body li ul { margin: 6px 0 0; }
  .part-body li::marker { color: var(--fg-faint); }
  .part-body b { color: var(--fg); font-weight: 500; }
  .part-body > :last-child { margin-bottom: 0; }

  /* Runs on this branch */
  .run { display: grid; grid-template-columns: 14px 52px minmax(0, 1fr) auto; gap: 2px var(--sp-2); align-items: center; padding: 8px var(--sp-3); }
  .run + .run { border-top: 1px solid var(--border-subtle); }
  button.run { width: 100%; background: transparent; border: 0; text-align: left; }
  button.run:hover { background: var(--bg-hover); }
  .run.current { background: var(--bg-selected); }
  .run .seq { font: 500 var(--t-xs) var(--font-mono); color: var(--fg-muted); }
  .run .line { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-2); }
  .run .side { display: inline-flex; gap: var(--sp-3); font-size: var(--t-xs); color: var(--fg-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .run .side .st { min-width: 64px; text-align: right; }
  .here { font-size: var(--t-2xs); color: var(--accent-text); margin-left: 6px; }

  /* Reported checks (proposed) */
  .tag.new { background: rgba(111, 168, 220, 0.14); color: var(--st-planning); }
  .seg-bar { display: flex; gap: 2px; height: 5px; margin-top: var(--sp-3); }
  .seg-bar i { flex: 1; border-radius: 2px; background: var(--bg-active); }
  .seg-bar i.passed { background: var(--st-done); }
  .seg-bar i.failed, .seg-bar i.blocked { background: var(--st-blocked); }
  .seg-bar i.running { background: color-mix(in srgb, var(--st-active) 45%, transparent); animation: breathe 1.6s ease-in-out infinite; }
  .seg-bar i.skipped { background: repeating-linear-gradient(135deg, var(--border-strong) 0 3px, transparent 3px 6px); }
  @keyframes breathe { 50% { opacity: .45; } }
  .tally { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: var(--t-xs); color: var(--fg-muted); }
  .tally span { display: inline-flex; align-items: center; gap: 5px; }
  .tally .dot { width: 6px; height: 6px; }
  .now-cmd { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--fg-muted); min-width: 0; }
  .now-cmd > span { white-space: nowrap; flex: none; }
  .now-cmd code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chk + .chk { border-top: 1px solid var(--border-subtle); }
  .chk-head { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px var(--sp-2); padding: 9px var(--sp-3); background: transparent; border: 0; text-align: left; align-items: start; }
  button.chk-head:hover { background: var(--bg-hover); }
  .chk.pending .chk-name { color: var(--fg-faint); font-weight: 400; }
  .chk.running { background: color-mix(in srgb, var(--st-active) 5%, transparent); }
  .chk-glyph { padding-top: 2px; display: grid; place-items: center; }
  .chk-glyph .ico { width: 13px; height: 13px; stroke-width: 2.25; }
  .chk-glyph .ring { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--border-strong); margin-top: 1px; }
  .chk-glyph .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--st-active) 30%, transparent); border-top-color: var(--st-active); margin-top: 1px; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chk-main { min-width: 0; }
  .chk-name { font-weight: 500; color: var(--fg); }
  .chk-cmd { margin-top: 2px; font: 400 var(--t-2xs) var(--font-mono); color: var(--fg-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chk-cmd .dir { color: var(--fg-muted); }
  .chk-reason { margin-top: 4px; font-size: var(--t-sm); color: var(--fg-2); }
  .chk-reason.blocked { color: var(--st-blocked); }
  .chk-side { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--t-xs); color: var(--fg-faint); white-space: nowrap; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .chk-side .w { min-width: 54px; text-align: right; }
  .chk-side .chev { transition: transform var(--dur-fast, .12s) ease; }
  .chk-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .retry { font: 500 var(--t-2xs) var(--font-mono); color: var(--st-blocked); background: rgba(226, 112, 60, 0.1); border-radius: var(--r-xs); padding: 0 5px; line-height: 16px; }
  .attempts { padding: 0 var(--sp-3) var(--sp-3) 36px; display: flex; flex-direction: column; gap: 6px; }
  .attempts[hidden] { display: none; }
  .att { display: grid; grid-template-columns: 22px 40px 56px 52px 1fr; gap: 2px var(--sp-2); font-size: var(--t-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .att .no { font-family: var(--font-mono); color: var(--fg-faint); }
  .att .note { grid-column: 2 / 6; color: var(--fg-2); font-size: var(--t-sm); }

  /* Activity stand-in (existing section, unchanged) */
  .act-tiles { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: var(--r-md); font-family: var(--font-mono); font-size: var(--t-xs); }
  .act-tiles > div { padding: 10px; }
  .act-tiles > div + div { border-left: 1px solid var(--border); }
  .act-tiles .k { color: var(--fg-faint); font-size: var(--t-2xs); letter-spacing: .06em; }
  .act-tiles .v { font: 600 var(--t-md) var(--font-sans); color: var(--fg); margin: 2px 0; }
  .act-tiles .s { color: var(--fg-muted); }
  .act-bar { height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--data-2) 55%, var(--bg-raised)); margin-top: var(--sp-2); }
  .act-row { margin-top: var(--sp-2); display: grid; grid-template-columns: 14px auto 1fr auto auto; gap: var(--sp-2); align-items: center; padding: 8px var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-md); font-size: var(--t-sm); }
  .act-row .faint { color: var(--fg-faint); font-family: var(--font-mono); font-size: var(--t-xs); }
  .unchanged { font-size: var(--t-2xs); color: var(--fg-faint); border: 1px dashed var(--border-strong); border-radius: var(--r-xs); padding: 0 5px; }

  /* Today view */
  .t-metrics { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--r-md); margin-top: var(--sp-5); }
  .t-metrics > div { padding: var(--sp-3); }
  .t-metrics > div + div { border-left: 1px solid var(--border); }
  .t-k { font-size: var(--t-xs); color: var(--fg-faint); }
  .t-v { font: 500 var(--t-md) var(--font-mono); margin-top: 4px; }
  .t-pipe { display: flex; gap: 6px; align-items: center; font: 400 var(--t-xs) var(--font-mono); }
  .t-stage { padding: 3px 8px; border-radius: var(--r-sm); border: 1px solid var(--st-active); color: var(--st-active); }
  .t-report { padding: var(--sp-3); font-size: var(--t-sm); color: var(--fg-2); max-height: 64px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 40%, transparent); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; padding: 8px 14px; background: var(--bg-overlay); border: 1px solid var(--border-strong); border-radius: var(--r-md); font-size: var(--t-sm); transition: opacity .15s, transform .15s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="chrome">
  <div class="designs" role="group" aria-label="Design">
    <button type="button" data-view="new" aria-pressed="true">Redesign</button>
    <button type="button" data-view="today" aria-pressed="false">Today</button>
  </div>
  <label class="scenario">Scenario
    <select id="scenario"></select>
  </label>
  <button type="button" class="chrome-btn" id="expand">Expand report</button>
</div>
<div class="stage">
  <div class="column">
    <div class="column-label" id="source"></div>
    <div class="pane">
      <div class="head">
        <h1>Details</h1>
        <button type="button" class="iconbtn" aria-label="Close details"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="scroll" id="pane"></div>
    </div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="toast" id="toast" role="status"></div>

const REPORTS = {

    const label = !bold && line.match(/^(Warnings?|Risk|Notes?):\s+(.*)$/);
    if (bold || label) {
      parts.push(cur);
      const m = bold || label;
      cur = { title: m[1].replace(/[.:]\s*$/, ""), lines: m[2] ? [m[2]] : [] };
    } else cur.lines.push(line);
  }
  parts.push(cur);
  const lead = parts.shift();
  const paras = lead.lines.join("\n").trim().split(/\n\s*\n/);
  const [headline, rest] = splitSentence(paras.shift().replace(/\n/g, " "));
  if (paras.length) parts.unshift({ title: "Details", lines: paras.join("\n\n").split("\n") });
  return { headline, rest, parts: parts.filter(p => p.lines.join("").trim()) };
}
function renderBody(lines) {
  let html = "", para = [], list = null;
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.tag}>${list.items.map(i => `<li>${inline(i.text)}${i.sub.length ? `<ul>${i.sub.map(s => `<li>${inline(s)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</${list.tag}>`; list = null; } };
  for (const raw of lines) {
    const m = raw.match(/^(\s*)(\d+\.|[-*])\s+(.*)$/);
    if (!raw.trim()) { flushPara(); continue; }
    if (m) {
      flushPara();
      const nested = m[1].length >= 2 && list;
      if (nested) list.items[list.items.length - 1].sub.push(m[3]);
      else { const tag = /\d/.test(m[2]) ? "ol" : "ul"; if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; } list.items.push({ text: m[3], sub: [] }); }
    } else if (list && /^\s+/.test(raw)) {
      const last = list.items[list.items.length - 1];
      if (last.sub.length) last.sub[last.sub.length - 1] += " " + raw.trim(); else last.text += " " + raw.trim();
    } else { flushList(); para.push(raw.trim()); }
  }
  flushPara(); flushList();
  return html;
}
const topItems = lines => lines.filter(l => /^(\d+\.|[-*])\s+/.test(l)).length;

/* Rendering */
let view = "new", scenario = SCENARIOS[0], open = new Set(), ticker = null;
const $ = id => document.getElementById(id);

function header(s) {
  const st = s.outcome ? { ...STATE[s.state], pill: OUTCOME[s.outcome].word, tone: OUTCOME[s.outcome].tone } : STATE[s.state];
  const live = s.state === "active" ? `<span class="pill"><span class="dot" style="color:var(--st-active)"></span>fresh</span>` : "";
  const acts = {
    active: `<button class="btn danger" type="button">${ico("x", "sm")}Cancel</button>`,
    blocked: `<button class="btn primary" type="button">Resume</button><button class="btn danger" type="button">${ico("x", "sm")}Cancel</button>`,
    terminal: `<button class="btn" type="button">Run again</button><button class="btn" type="button" data-copy>${ico("copy", "sm")}Copy report</button>`,
    canceled: `<button class="btn" type="button">Run again</button>`,
  }[s.state];
  return `<div class="chips"><span class="pill ${st.tone}"><span class="dot" style="color:var(--tone)"></span>${st.pill}</span><span class="keytxt">validation</span><span class="pill">phase</span>${live}</div>
    <h2 class="title">Validation on <code>${esc(s.branch)}</code></h2>
    <div class="meta"><span>${ico("folder", "sm")}<span class="mono">${esc(s.repo)}</span></span><span>${ico("agent", "sm")}${s.agent}</span></div>
    <div class="actions">${acts}</div>`;
}

function checkTally(checks) {
  const n = {}; checks.forEach(c => { const f = finalOf(c); n[f] = (n[f] || 0) + 1; });
  const retries = checks.reduce((t, c) => t + retriesOf(c), 0);
  const parts = ["passed", "running", "blocked", "failed", "skipped", "pending"].filter(k => n[k]).map(k => `<span><span class="dot" style="color:${CHECK_WORD[k][1]}"></span>${n[k]} ${CHECK_WORD[k][0].toLowerCase()}</span>`);
  if (retries) parts.push(`<span>${retries} failed ${retries === 1 ? "attempt" : "attempts"} fixed</span>`);
  return { n, retries, html: `<div class="tally">${parts.join("")}</div>`, bar: `<div class="seg-bar">${checks.map(c => `<i class="${finalOf(c)}"></i>`).join("")}</div>` };
}

function card(s, shaped) {
  const st = s.outcome && s.live === "available" ? { ...STATE[s.state], ...OUTCOME[s.outcome] } : STATE[s.state];
  const reported = s.live === "available" && s.checks && s.checks.length ? s.checks : null;
  const tally = reported ? checkTally(reported) : null;
  let head, text = "", when, signal = "";
  if (s.state === "active" && reported) {
    const cur = reported.find(c => finalOf(c) === "running");
    head = `Running <b style="font-weight:600">${esc(cur.name)}</b>`;
    text = `<span class="now-cmd">${cur.dir === "." ? "" : `<span>${esc(cur.dir)}</span>`}<code>${esc(cur.cmd)}</code><span id="tick3">${dur(cur.attempts[0].ms)}</span></span>`;
    when = `<b id="tick">${dur(s.active)}</b>active`;
    signal = tally.html + tally.bar;
  } else if (s.state === "active") {
    head = esc(s.activity);
    text = "The report appears here when the agent finishes.";
    when = `<b id="tick">${dur(s.active)}</b>active`;
    signal = `<div class="signal"><span class="dot"></span>Last agent signal: ${s.signal.label}, ${s.signal.ago}</div>`;
  } else if (s.state === "canceled") {
    head = esc(s.cancelText); when = `<b>${s.wall}</b>wall clock`;
  } else {
    head = inline(shaped.headline); text = shaped.rest ? inline(shaped.rest) : "";
    when = s.wall ? `<b>${s.wall}</b>wall clock` : `<b>${dur(s.active)}</b>active`;
    if (tally) signal = tally.html + tally.bar;
  }
  const done = tally ? reported.filter(c => !["pending", "running"].includes(finalOf(c))).length : 0;
  const fourth = tally
    ? `<div class="score-cell"><div class="score-k">Checks</div><div class="score-v">${done} / ${reported.length}</div><div class="score-s">${tally.retries ? tally.retries + " retried" : "no retries"}</div></div>`
    : "";
  const order = s.runs.length > 1 ? `${s.runs.findIndex(r => r.seq === s.seq) + 1} of ${s.runs.length} on branch` : "only run on branch";
  return `<div class="outcome ${st.tone}">
    <div class="outcome-top">
      <div class="outcome-icon ${s.state === "active" ? "live" : ""}">${ico(st.icon)}</div>
      <div class="outcome-main">
        <div class="outcome-label"><b>${st.word}</b>${s.outcome === "blocked" ? "<span>· needs an operator</span>" : ""}${s.state === "terminal" ? "<span>· agent's summary below</span>" : ""}</div>
        <p class="outcome-head">${head}</p>
        ${text ? `<p class="outcome-text">${text}</p>` : ""}${signal}
      </div>
      <div class="outcome-when">${when}</div>
    </div>
    <div class="score">
      <div class="score-cell"><div class="score-k">Active</div><div class="score-v" ${s.state === "active" ? 'id="tick2"' : ""}>${dur(s.active)}</div><div class="score-s">${s.state === "active" ? "ticking" : "agent working time"}</div></div>
      <div class="score-cell"><div class="score-k">Started</div><div class="score-v">${s.started.split(" ").slice(2).join(" ") || s.started}</div><div class="score-s">${s.started.split(" ").slice(0, 2).join(" ")}${s.finished ? ` → ${s.finished}` : ""}</div></div>
      ${fourth || `<div class="score-cell"><div class="score-k">Agent</div><div class="score-v">${s.agent}</div><div class="score-s">--agent ${s.agent}</div></div>`}
      <div class="score-cell"><div class="score-k">Run</div><div class="score-v">#${s.seq}</div><div class="score-s">${order}</div></div>
    </div>
  </div>`;
}

function reportSection(s, shaped) {
  if (!shaped || !shaped.parts.length) return "";
  const flagged = shaped.parts.map((p, i) => ({ p, i })).filter(x => FLAG.test(x.p.title));
  const strip = flagged.length ? `<div class="flagged">${ico("warn")}<div class="flagged-main"><b>The report flags ${flagged.length === 1 ? "one thing" : flagged.length + " things"} to read</b><div class="jumps">${flagged.map(x => `<button type="button" class="jump" data-jump="${x.i}">${esc(plain(x.p.title))}</button>`).join("")}</div></div></div>` : "";
  const rows = shaped.parts.map((p, i) => {
    const isOpen = open.has(i);
    const flag = FLAG.test(p.title);
    const n = topItems(p.lines);
    const preview = plain(p.lines.find(l => l.trim()) || "").replace(/^\s*(\d+\.|[-*])\s+/, "");
    return `<div class="part ${flag ? "flag" : ""}" id="part-${i}">
      <button type="button" class="part-head" data-part="${i}" aria-expanded="${isOpen}">${ico("chev", "sm chev")}<span class="label">${inline(p.title)}</span><span class="preview">${esc(preview)}</span><span class="cnt">${n ? n + (n === 1 ? " item" : " items") : ""}</span></button>
      <div class="part-body" ${isOpen ? "" : "hidden"}>${renderBody(p.lines)}</div></div>`;
  }).join("");
  return { strip, section: `<section class="sec"><div class="sec-head"><h2>Report</h2><span class="n">${shaped.parts.length} parts</span><span class="end"><button type="button" class="linkbtn" data-all>${open.size === shaped.parts.length ? "Collapse all" : "Expand all"}</button></span></div><div class="box">${rows}</div></section>` };

let openChecks = new Set();
function glyph(state) {
  if (state === "running") return '<span class="spin"></span>';
  if (state === "pending") return '<span class="ring"></span>';
  const icon = { passed: "check", failed: "x", blocked: "warn", skipped: "minus" }[state];
  return `<span style="color:${CHECK_WORD[state][1]}">${ico(icon)}</span>`;
}
function checksSection(s) {

    ? `<section class="sec"><div class="sec-head"><h2>Checks</h2><span class="end"><span class="tag new">reported by the agent</span></span></div><div class="box"><div class="quiet">Waiting for the agent to list its checks.</div></div></section>`
    : "";

  const rows = s.checks.map((c, i) => {

    const retries = retriesOf(c);
    const total = c.attempts.reduce((t, x) => t + x.ms, 0);
    const expandable = c.attempts.length > 1 || (last && last.note && !["blocked", "skipped"].includes(f));
    const isOpen = expandable && openChecks.has(i);
    const reason = ["blocked", "skipped"].includes(f) && last.note ? `<div class="chk-reason ${f}">${inline(last.note)}</div>` : "";
    const side = `<span class="chk-side">${retries ? `<span class="retry">attempt ${c.attempts.length}</span>` : ""}<span ${f === "running" ? 'id="tick4"' : ""}>${f === "pending" || f === "skipped" ? "" : dur(total)}</span><span class="w" style="color:${color}">${w}</span>${expandable ? ico("chev", "sm chev") : '<span style="width:12px"></span>'}</span>`;
    const head = `<span class="chk-glyph">${glyph(f)}</span><span class="chk-main"><div class="chk-name">${esc(c.name)}</div><div class="chk-cmd">${c.dir === "." ? "" : `<span class="dir">${esc(c.dir)}</span>  `}${esc(c.cmd)}</div>${reason}</span>${side}`;
    const atts = expandable ? `<div class="attempts" ${isOpen ? "" : "hidden"}>${c.attempts.map((x, n) => `<div class="att"><span class="no">#${n + 1}</span><span>${x.at}</span><span style="color:${CHECK_WORD[x.outcome][1]}">${CHECK_WORD[x.outcome][0]}</span><span>${x.exit == null ? "" : "exit " + x.exit}</span><span>${dur(x.ms)}</span>${x.note ? `<span class="note">${inline(x.note)}</span>` : ""}</div>`).join("")}</div>` : "";
    return `<div class="chk ${f}">${expandable ? `<button type="button" class="chk-head" data-check="${i}" aria-expanded="${isOpen}">${head}</button>` : `<div class="chk-head">${head}</div>`}${atts}</div>`;
  }).join("");
  return `<section class="sec"><div class="sec-head"><h2>Checks</h2><span class="n">${s.checks.length}</span><span class="end"><span class="tag new">reported by the agent</span></span></div><div class="box">${rows}</div></section>`;
}

function runsSection(s) {
  if (s.runs.length < 2) return "";
  const word = { active: ["Running", "var(--st-active)"], blocked: ["Paused", "var(--st-blocked)"], terminal: ["Finished", "var(--fg-2)"], canceled: ["Canceled", "var(--fg-faint)"] };

function activitySection(s) {

function render() {

  $("source").textContent = `${view === "new" ? "Redesign" : "Today"} · ${s.source}`;
  $("pane").innerHTML = view === "new" ? renderNew(s) : renderToday(s);
  $("notes").innerHTML = view === "new" ? notes(s) : `<section><h2>Today</h2><p>The current standalone phase layout, as in the pr screenshot: Step and Phase elapsed tiles, a one-stage pipeline, Activity, and the result folded to its first line.</p></section>`;

    const cur = s.live === "available" && s.checks && s.checks.find(c => finalOf(c) === "running");
    let cms = cur ? cur.attempts[0].ms : 0;
    ticker = setInterval(() => {
      ms += 1000; cms += 1000;
      for (const id of ["tick", "tick2"]) { const el = $(id); if (el) el.textContent = dur(ms); }
      for (const id of ["tick3", "tick4"]) { const el = $(id); if (el) el.textContent = dur(cms); }
    }, 1000);
  }
  const shaped = s.report ? shapeReport(REPORTS[s.report]) : null;
  $("expand").disabled = !shaped;
  $("expand").textContent = shaped && open.size === shaped.parts.length ? "Collapse report" : "Expand report";
}

function defaultOpen() {
  open = new Set();
  openChecks = new Set();
  if (scenario.live === "available" && scenario.checks && scenario.state === "active") scenario.checks.forEach((c, i) => { if (retriesOf(c)) openChecks.add(i); });
  if (!scenario.report || (scenario.live === "available" && scenario.checks && scenario.checks.length)) return;
  shapeReport(REPORTS[scenario.report]).parts.forEach((p, i) => { if (OPEN.test(p.title)) open.add(i); });
}

function toggleAll() {
  const shaped = scenario.report && shapeReport(REPORTS[scenario.report]);
  if (!shaped) return;
  open = open.size === shaped.parts.length ? new Set() : new Set(shaped.parts.map((_, i) => i));
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-part],[data-check],[data-jump],[data-all],[data-copy],#expand");
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view)); render(); }
  else if (t.dataset.check) { const i = +t.dataset.check; openChecks.has(i) ? openChecks.delete(i) : openChecks.add(i); render(); }
  else if (t.dataset.part) { const i = +t.dataset.part; open.has(i) ? open.delete(i) : open.add(i); render(); }
  else if (t.dataset.jump) { const i = +t.dataset.jump; open.add(i); render(); $("part-" + i).scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if ("all" in t.dataset || t.id === "expand") toggleAll();
  else if ("copy" in t.dataset) { const el = $("toast"); el.textContent = "Report copied"; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1400); }
});
const opts = g => SCENARIOS.filter(s => s.group === g).map(s => `<option value="${s.id}">${esc(s.label)}</option>`).join("");
$("scenario").innerHTML = `<optgroup label="Stored today (real rows)">${opts("today")}</optgroup><optgroup label="With reported checks (proposed)">${opts("live")}</optgroup>`;
$("scenario").addEventListener("change", e => { scenario = SCENARIOS.find(s => s.id === e.target.value); openChecks = new Set(); defaultOpen(); render(); });
const fromHash = SCENARIOS.find(s => s.id === location.hash.slice(1));
if (fromHash) { scenario = fromHash; $("scenario").value = fromHash.id; }
defaultOpen();
render();
</script>
</body>
