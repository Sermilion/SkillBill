<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan detail: live agent activity</title>
<!-- Design reference only. Tokens come from the Linear study, which match SkillBillColors. Sample data is modelled on the SKILL-512 plan run. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../linear-study/ds/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; font-feature-settings: "cv11", "ss01"; }
  button { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }
  .mono { font-family: var(--font-mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .chrome-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .chrome label { display: flex; align-items: center; gap: 6px; color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; }
  .note { margin: 0; max-width: 1080px; color: var(--fg-muted); font-size: var(--t-sm); }
  .note b { color: var(--fg-2); font-weight: 500; }
  .note code { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-2); }

  /* App window */
  .window { flex: 1; min-height: 0; padding: var(--sp-2); display: flex; gap: var(--sp-2); }
  .panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .head { flex: none; height: var(--header-h); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-4); border-bottom: 1px solid var(--border-subtle); font-size: var(--t-sm); }
  .head .dim { color: var(--fg-muted); }
  .head .key { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-muted); }
  .head .crumb { font-weight: 500; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; justify-content: center; padding: var(--sp-6); }
  .content { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: var(--sp-6); }

  /* Stage strip, as shipped */
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: var(--r-md); }
  .stage { padding: 8px; display: flex; flex-direction: column; gap: 3px; }
  .stage + .stage { border-left: 1px solid var(--border-subtle); }
  .stage .t { font-size: var(--t-sm); font-weight: 500; color: var(--fg-faint); }
  .stage.done .t { color: var(--fg-2); }
  .stage.active .t { color: var(--st-active); }
  .stage .m { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--fg-faint); }
  .stage .m .d { color: var(--fg-muted); }
  .lbl { height: 16px; padding: 0 5px; display: inline-flex; align-items: center; border-radius: var(--r-xs); font-size: var(--t-2xs); color: var(--fg-faint); background: rgba(255,255,255,.04); }
  .lbl.active { color: var(--st-active); background: rgba(63,185,80,.12); }
  .lbl.done { color: var(--st-done); background: rgba(130,140,255,.12); }
  .lbl.blocked { color: var(--st-blocked); background: rgba(226,112,60,.12); }

  .status { font-size: var(--t-md); }
  .beat { display: flex; align-items: center; gap: 10px; font-size: var(--t-sm); color: var(--fg-muted); margin-top: 8px; }
  .beat .v { color: var(--fg); }
  .beat .live { display: inline-flex; align-items: center; gap: 6px; }
  .beat .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--st-active); box-shadow: 0 0 0 3px rgba(63,185,80,.14); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 5px rgba(63,185,80,.04); } }

  /* Collapsed sections, as shipped */
  .sec { display: flex; flex-direction: column; gap: var(--sp-2); }
  .sec-head { display: flex; align-items: center; gap: var(--sp-2); min-height: 24px; }
  .sec-head .t { font-size: var(--t-sm); font-weight: 500; color: var(--fg-muted); }
  .sec-head .c { font-size: var(--t-xs); color: var(--fg-faint); }
  .sec-head .sp { flex: 1; }
  .sec-head .chev { color: var(--fg-faint); }
  .collapsed { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); }
  .collapsed:hover { background: var(--bg-hover); }
  .empty { padding: 10px 12px; border: 1px dashed var(--border); border-radius: var(--r-md); color: var(--fg-faint); font-size: var(--t-sm); }

  /* Now card */
  .now { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid rgba(63,185,80,.22); border-radius: var(--r-md); background: linear-gradient(90deg, rgba(63,185,80,.06), transparent 60%); }
  .now .g { width: 26px; height: 26px; border-radius: var(--r-sm); display: grid; place-items: center; background: rgba(63,185,80,.12); color: var(--st-active); }
  .now .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .now .what { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .what code { font: 400 var(--t-sm) var(--font-mono); color: var(--accent-text); }
  .now .sub { font-size: var(--t-xs); color: var(--fg-muted); }
  .now .t { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-faint); }
  .now.quiet { border-color: rgba(226,112,60,.3); background: linear-gradient(90deg, rgba(226,112,60,.07), transparent 60%); }
  .now.quiet .g { background: rgba(226,112,60,.12); color: var(--st-blocked); }

  /* Activity feed */
  .seg { display: flex; gap: 2px; }
  .seg button { height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--fg-faint); font-size: var(--t-sm); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
  .seg button:hover { color: var(--fg-2); }
  .seg button[aria-pressed="true"] { background: var(--bg-active); color: var(--fg); }
  .seg button .n { font-size: var(--t-2xs); color: var(--fg-faint); }
  .ghost { height: 22px; padding: 0 6px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); }
  .ghost:hover { background: var(--bg-hover); color: var(--fg); }
  .ghost[aria-pressed="true"] { color: var(--st-active); }

  /* Fixed window: ten 28px rows tall, scrolls inside, never grows the page */
  .feedwrap { position: relative; }
  .feed { --row: 28px; height: calc(var(--row) * 10 + 2px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; border: 1px solid var(--border-subtle); border-radius: var(--r-md); background: rgba(255,255,255,.012); }
  .jump { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); height: 24px; padding: 0 10px; display: none; align-items: center; gap: 6px; border: 0; border-radius: var(--r-full); background: var(--bg-overlay); box-shadow: var(--shadow-pop); color: var(--fg-2); font-size: var(--t-xs); cursor: pointer; }
  .jump.on { display: inline-flex; }
  .jump:hover { color: var(--fg); }
  .grp { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; height: var(--row); padding: 0 12px; background: var(--bg-panel); border-bottom: 1px solid var(--border-subtle); font-size: var(--t-sm); cursor: pointer; }
  .grp .name { color: var(--fg-2); font-weight: 500; }
  .grp .id { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-faint); }
  .grp .sum { margin-left: auto; font-size: var(--t-xs); color: var(--fg-faint); }
  .grp .chev { color: var(--fg-faint); transition: transform var(--dur-fast) var(--ease); }
  .grp.shut .chev { transform: rotate(-90deg); }
  .grp + .ev, .ev + .ev { box-shadow: inset 0 1px 0 var(--border-subtle); }
  .ev { display: grid; grid-template-columns: 62px 18px 1fr auto; align-items: start; gap: 8px; min-height: var(--row); padding: 4px 12px; font-size: var(--t-sm); cursor: default; }
  .ev:hover { background: var(--bg-hover); }
  .ev .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.open .x { white-space: normal; }
  .ev.note, .ev[data-kids] { cursor: pointer; }
  .ev .ts { font: 400 var(--t-xs)/20px var(--font-mono); color: var(--fg-faint); }
  .ev .k { height: 20px; display: grid; place-items: center; color: var(--fg-faint); }
  .ev .k.write { color: var(--st-done); }
  .ev .k.cmd { color: var(--data-3); }
  .ev .k.note { color: var(--fg-muted); }
  .ev .k.phase { color: var(--st-active); }
  .ev .k.mcp { color: var(--data-2); }
  .ev .k.err { color: var(--st-blocked); }
  .ev .x { min-width: 0; line-height: 20px; color: var(--fg-2); }
  .ev .x .verb { color: var(--fg-muted); }
  .ev .x code { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-2); background: var(--bg-inset); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
  .ev .x a { color: var(--accent-text); text-decoration: none; font: 400 var(--t-xs) var(--font-mono); }
  .ev .x a:hover { text-decoration: underline; }
  .ev .x .prose { color: var(--fg-2); font-size: var(--t-sm); border-left: 2px solid var(--border); padding-left: 8px; }
  .ev.open .x .prose { display: block; margin: 2px 0; }
  .ev .x .more { color: var(--fg-faint); font-size: var(--t-xs); cursor: pointer; }
  .ev .x .more:hover { color: var(--fg-2); }
  .ev .x .kids { display: none; flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 4px; }
  .ev.open .x .kids { display: flex; }
  .ev .dur { font: 400 var(--t-xs)/20px var(--font-mono); color: var(--fg-faint); }
  .ev.err .x { color: var(--st-blocked); }
  .ev.hide { display: none; }
  .ev.phase .x { color: var(--fg-muted); }
  .ev.live .ts { color: var(--st-active); }
  .tailrow { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: var(--t-xs); color: var(--fg-faint); box-shadow: inset 0 1px 0 var(--border-subtle); }
  .tailrow .dots span { display: inline-block; width: 3px; height: 3px; margin-right: 3px; border-radius: 50%; background: var(--st-active); animation: dot 1.2s infinite; }
  .tailrow .dots span:nth-child(2) { animation-delay: .2s; } .tailrow .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* Subtasks and bundle */
  .unit { display: flex; flex-direction: column; padding: 5px 0; }
  .unit .r { display: flex; align-items: center; gap: 10px; }
  .unit .n { flex: 1; color: var(--fg-2); }
  .unit .line { margin: 3px 0 0 74px; font-size: var(--t-xs); color: var(--fg-muted); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unit .time { font-size: var(--t-xs); color: var(--fg-faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--r-sm); font: 400 var(--t-xs) var(--font-mono); color: var(--fg-2); cursor: pointer; }
  .chip:hover { background: var(--bg-hover); }
  .chip.new { border-color: rgba(130,140,255,.35); }

  @media (prefers-reduced-motion: reduce) { .beat .live::before, .tailrow .dots span { animation: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-read" viewBox="0 0 16 16"><path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3"/></symbol>
  <symbol id="i-write" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13.5 13.5"/></symbol>
  <symbol id="i-cmd" viewBox="0 0 16 16"><path d="M3 4.5l3.5 3.5L3 11.5M8 12h5"/></symbol>
  <symbol id="i-note" viewBox="0 0 16 16"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5V11.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-flag" viewBox="0 0 16 16"><path d="M4 14V2.5M4 3h7.5l-1.5 2.5L11.5 8H4"/></symbol>
  <symbol id="i-plug" viewBox="0 0 16 16"><path d="M6 2v3M10 2v3M4.5 5h7v2.5a3.5 3.5 0 0 1-7 0zM8 11v3"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M8 5v3.5M8 11h.01"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></symbol>
  <symbol id="i-ext" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3L7.5 8.5M11 9.5V13H3V5h3.5"/></symbol>
  <symbol id="i-follow" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4"/></symbol>
  <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3M6 9h4M6 11h3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></symbol>
</svg>

<header class="chrome">
  <div class="chrome-row">
    <div class="designs" role="group" aria-label="Design">
      <button data-d="today">Today</button>
      <button data-d="proposed">Proposed</button>
    </div>
    <label><input type="checkbox" id="quiet"> Agent quiet for 6 min</label>
    <label><input type="checkbox" id="nostream"> Agent without a structured stream</label>
  </div>
  <p class="note" id="note"></p>
</header>

<div class="window">
  <main class="panel">
    <div class="head"><span class="dim">Executions</span><span class="dim">/</span><span class="key">SKILL-512</span><span class="crumb">Move removed worktree goals to main checkout</span></div>
    <div class="scroll"><div class="content" id="content"></div></div>
  </main>
</div>

<script>
const ic = (id, cls = '') => `<svg class="ico ${cls}"><use href="#i-${id}"/></svg>`;
const SPEC = 'SKILL-512-move-removed-worktree-goals-to-main-checkout';

// Sample feed, modelled on the real SKILL-512 transcripts. Every row maps to a stream-json event:
// tool_use (name + input.file_path / pattern / command / description), assistant text, or a runtime phase event.
const STAGES = [
  { id: 'preplan', title: 'Reading the repo', status: 'done', dur: '2m 38s', agent: 'claude · sonnet', events: [
    ['12:17:14', 'phase', 'flag', 'Phase started', '', ''],
    ['12:17:21', 'read', 'read', 'Read', 'intake/SKILL-512-removed-worktree-main-checkout.md', '0.1s'],
    ['12:17:40', 'search', 'search', 'Searched', '"worktree remove" in runtime-kotlin · 14 matches', '0.4s'],
    ['12:17:52', 'read', 'read', 'Read', 'runtime-goalrunner/…/monitoring/GoalWorktreeCompletionSettlement.kt', '0.1s', [
      'runtime-infra/workflow/…/goalworktree/GitGoalWorktreeResources.kt',
      'runtime-infra/workflow/…/worktree/WorktreeRetention.kt',
      'desktop/feature/chat/…/chat/ChatTurns.kt',
      'desktop/core/data/…/chat/ClaudeSessionStore.kt',
    ]],
    ['12:18:44', 'cmd', 'cmd', 'Ran', 'git log --oneline -8 -- runtime-infra/workflow', '0.3s'],
    ['12:19:31', 'note', 'note', '', 'The stale path comes from three places: the goal runner keeps the removed worktree as the checkout root, the desktop caches the old root for chats, and agent sessions are keyed by that path. These can land independently.', ''],
    ['12:19:50', 'mcp', 'plug', 'Settled', 'feature_task_phase_complete · decomposed, 3 subtasks', '0.2s'],
    ['12:19:52', 'phase', 'flag', 'Phase finished', '', ''],
  ]},
  { id: 'plan', title: 'Splitting the work', status: 'done', dur: '6m 12s', agent: 'claude · opus', events: [
    ['12:19:53', 'phase', 'flag', 'Phase started', '', ''],
    ['12:20:04', 'read', 'read', 'Read', 'memory/specs-must-be-independent.md', '0.1s'],
    ['12:20:31', 'read', 'read', 'Read', 'runtime-goalrunner/…/GoalWorktreeCompletionSettlement.kt', '0.1s', [
      'desktop/feature/chat/…/ChatTurns.kt',
      '.codex/sessions/2026/11/06/rollout-…-01a1b0c5.jsonl',
    ]],
    ['12:22:47', 'write', 'write', 'Wrote', `specs/${SPEC}/spec.md`, '0.1s', null, true],
    ['12:24:18', 'write', 'write', 'Wrote', `specs/${SPEC}/decomposition-manifest.yaml`, '0.1s', null, true],
    ['12:25:02', 'note', 'note', '', 'Subtask 1 owns the runtime switch to the main checkout and reports the outcome; subtasks 2 and 3 only read that outcome.', ''],
    ['12:26:05', 'phase', 'flag', 'Phase finished', '', ''],
  ]},
  { id: 'plan_subtasks', title: 'Writing subtask specs', status: 'active', dur: '3m 40s', agent: 'claude · opus', events: [
    ['12:26:06', 'phase', 'flag', 'Phase started', '', ''],
    ['12:26:09', 'read', 'read', 'Read', 'desktop/core/data/…/chat/GoalWorktreeNotice.kt', '0.1s'],
    ['12:26:40', 'write', 'write', 'Wrote', `specs/${SPEC}/spec_subtask_1_runtime-main-checkout-switch.md`, '0.1s', null, true],
    ['12:27:58', 'search', 'search', 'Searched', '"GoalWorktreeState.Removed" in desktop · 6 matches', '0.3s'],
    ['12:28:20', 'cmd', 'cmd', 'Ran', './gradlew :desktop:core:data:compileKotlinJvm --dry-run', '4.1s', null, false, true],
    ['12:28:31', 'note', 'note', '', 'Desktop stale-root fix only needs the outcome field; no new contract version.', ''],
    ['12:29:46', 'write', 'write', 'Writing', `specs/${SPEC}/spec_subtask_2_desktop-stale-root.md`, '', null, true, false, true],
  ]},
];

const UNITS = [
  ['saved', 1, 'Runtime switch to main checkout', '12:26', 'Wrote spec_subtask_1_runtime-main-checkout-switch.md'],
  ['writing', 2, 'Desktop stale-root fix', '', 'Writing spec_subtask_2_desktop-stale-root.md'],
  ['queued', 3, 'Agent sessions and notice wording', '', ''],
];

const NOTES = {
  today: '<b>Today.</b> What you saw on SKILL-512: every stage reads <b>queued</b> although preplan and plan had finished, and "Agent output" and "Activity" are collapsed and empty. Two causes: the goal\'s plan phase is not a <code>STANDALONE</code> launch, so <code>standalonePlanProgress</code> is null and the strip has no stages. And <code>capturePlanOutput</code> is off, so <code>plan_output_tail</code> stays empty.',
  proposed: '<b>Proposed.</b> The stage strip gets real stage records for goal plans too, and the activity feed is open by default while the run is live. Data source: Claude already runs with <code>--output-format stream-json</code> when streaming, so each <code>tool_use</code> event (Read, Grep, Edit/Write, Bash, MCP) and each assistant text block becomes one row. Codex has the same events in its rollout JSONL. The runtime stores a bounded, parsed event list per phase next to <code>plan_output_tail</code>; raw transcript stays one click away. The feed is a fixed window ten rows tall that scrolls inside itself, like tool calls in the chat: it follows the newest row, scrolling up pauses Follow, and "Jump to latest" resumes it. Rows are one line; click a note or a folded read to expand it. Consecutive reads fold into one row. Spec writes link to the file. No row is invented: a phase without a stream (toggle above) falls back to phase events and saved files only.',
};

let design = 'proposed', filter = 'all', follow = true;
const shut = new Set();
const $ = (id) => document.getElementById(id);

function strip(today) {
  return `<div class="strip">${STAGES.map(s => {
    const st = today ? 'queued' : s.status;
    return `<div class="stage ${st}"><div class="t">${s.title}</div><div class="m"><span>${s.id}</span><span class="lbl ${st}">${st}</span>${today ? '' : `<span class="d num">${s.dur}</span>`}</div></div>`;
  }).join('')}</div>`;
}

function renderToday() {
  return `
    ${strip(true)}
    <div><div class="status">Active</div>
      <div class="beat"><span class="lbl active">Active</span>Elapsed <span class="v num">12m 32s</span></div></div>
    <div class="sec"><div class="sec-head"><span class="t">Agent output</span><span class="sp"></span></div>
      <div class="empty">Nothing yet. This section only appears once the plan phase writes output lines, and for goal plans it never does.</div></div>
    <div class="sec"><div class="collapsed">${ic('chev')}Activity</div>
      <div class="collapsed">${ic('chev')}Briefing</div></div>`;
}

function evRow(e, stage) {
  const [ts, kind, icon, verb, text, dur, kids, isSpec, err, live] = e;
  if (filter === 'files' && !['read', 'write', 'search'].includes(kind)) return '';
  if (filter === 'cmds' && !['cmd', 'mcp'].includes(kind)) return '';
  if (filter === 'notes' && kind !== 'note') return '';
  const nostream = $('nostream').checked;
  if (nostream && !(kind === 'phase' || (kind === 'write' && !live))) return '';
  let body;
  if (kind === 'note') body = `<span class="prose">${text}</span>`;
  else if (kind === 'phase') body = `${verb} <span class="verb">· ${stage.agent}</span>`;
  else if (isSpec) body = `<span class="verb">${verb}</span> <a href="#" onclick="return false">${text.split('/').pop()}</a>`;
  else body = `<span class="verb">${verb}</span> <code>${text}</code>`;
  if (kids) body += ` <span class="more">+${kids.length} more files</span><span class="kids">${kids.map(k => `<code>${k}</code>`).join('')}</span>`;
  const k = err ? 'err' : (kind === 'search' ? 'read' : kind);
  return `<div class="ev ${kind}${err ? ' err' : ''}${live ? ' live' : ''}"${kids ? ' data-kids' : ''}><span class="ts">${ts}</span><span class="k ${k}">${ic(err ? 'warn' : icon, 'sm')}</span><span class="x">${body}${err ? ' <span class="verb">· exit 1</span>' : ''}</span><span class="dur">${dur}</span></div>`;
}

function summary(s) {
  const c = (k) => s.events.filter(e => e[1] === k).length + s.events.filter(e => e[1] === k && e[6]).reduce((n, e) => n + e[6].length, 0);
  const parts = [];
  if (c('read') + c('search')) parts.push(`read ${c('read')} · searched ${c('search')}`);
  if (c('write')) parts.push(`wrote ${c('write')}`);
  if (c('cmd') + c('mcp')) parts.push(`${c('cmd') + c('mcp')} commands`);
  return parts.join(' · ');
}

function renderProposed() {
  const quiet = $('quiet').checked, nostream = $('nostream').checked;
  const all = STAGES.flatMap(s => s.events);
  const count = (pred) => all.filter(pred).length;
  const now = quiet
    ? `<div class="now quiet"><span class="g">${ic('clock')}</span><div class="body"><span class="what">No new activity for 6m 10s</span><span class="sub">Last: wrote <code>spec_subtask_1_runtime-main-checkout-switch.md</code> at 12:26:40. The agent may be thinking on a long step.</span></div><span class="t">12:32:50</span></div>`
    : nostream
    ? `<div class="now"><span class="g">${ic('clock')}</span><div class="body"><span class="what">Writing subtask specs</span><span class="sub">This agent does not stream its steps. Saved files appear here as they land.</span></div><span class="t">12:29:46</span></div>`
    : `<div class="now"><span class="g">${ic('write')}</span><div class="body"><span class="what">Writing <code>spec_subtask_2_desktop-stale-root.md</code></span><span class="sub">plan_subtasks · subtask 2 of 3 · claude · opus</span></div><span class="t">4s ago</span></div>`;
  const groups = STAGES.map(s => {
    const rows = shut.has(s.id) ? '' : s.events.map(e => evRow(e, s)).join('');
    return `<div class="grp${shut.has(s.id) ? ' shut' : ''}" data-grp="${s.id}">${ic('chev', 'sm chev')}<span class="name">${s.title}</span><span class="id">${s.id}</span><span class="lbl ${s.status}">${s.status}</span><span class="sum">${nostream ? '' : summary(s)} · ${s.dur}</span></div>${rows}`;
  }).join('');
  return `
    ${strip(false)}
    <div><div class="status">Writing subtask spec 2 of 3. 1 spec saved.</div>
      <div class="beat"><span class="lbl active">Active</span>Elapsed <span class="v num">12m 32s</span>${quiet ? '<span style="color:var(--st-blocked);font-weight:500">No output for 6m 10s</span>' : '<span class="live">Last output 4s ago</span>'}</div></div>
    ${now}
    <div class="sec">
      <div class="sec-head"><span class="t">Activity</span><span class="c num">${all.length} events</span><span class="sp"></span>
        <div class="seg" role="group" aria-label="Filter">
          <button data-f="all" aria-pressed="${filter === 'all'}">All</button>
          <button data-f="files" aria-pressed="${filter === 'files'}">Files <span class="n">${count(e => ['read', 'write', 'search'].includes(e[1]))}</span></button>
          <button data-f="cmds" aria-pressed="${filter === 'cmds'}">Commands <span class="n">${count(e => ['cmd', 'mcp'].includes(e[1]))}</span></button>
          <button data-f="notes" aria-pressed="${filter === 'notes'}">Notes <span class="n">${count(e => e[1] === 'note')}</span></button>
        </div>
        <button class="ghost" id="follow" aria-pressed="${follow}">${ic('follow', 'sm')}Follow</button>
        <button class="ghost">${ic('ext', 'sm')}Transcript</button>
      </div>
      <div class="feedwrap">
        <div class="feed" id="feed">${groups}${quiet ? '' : '<div class="tailrow"><span class="dots"><span></span><span></span><span></span></span>Agent is working</div>'}</div>
        <button class="jump" id="jump">${ic('follow', 'sm')}Jump to latest</button>
      </div>
    </div>
    <div class="sec">
      <div class="sec-head"><span class="t">Subtasks</span><span class="c">1/3 saved · wave 1 · 3 capacity</span></div>
      <div>${UNITS.map(([st, id, name, t, line]) => `<div class="unit"><div class="r"><span class="lbl ${st === 'saved' ? 'done' : st === 'writing' ? 'active' : ''}" style="width:54px;justify-content:center">${st}</span>${ic(st === 'saved' ? 'file' : 'clock', 'sm')}<span class="n">${id}. ${name}</span><span class="time">${t}</span></div>${line && !nostream ? `<div class="line">${line}</div>` : ''}</div>`).join('')}</div>
    </div>
    <div class="sec">
      <div class="sec-head"><span class="t">Spec bundle</span></div>
      <div class="chips"><span class="chip">${ic('file', 'sm')}decomposition-manifest.yaml</span><span class="chip">${ic('file', 'sm')}spec.md</span><span class="chip new">${ic('file', 'sm')}spec_subtask_1_runtime-main-checkout-switch.md</span></div>
    </div>`;
}

function render() {
  document.querySelectorAll('.designs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === design));
  $('quiet').disabled = $('nostream').disabled = design === 'today';
  $('note').innerHTML = NOTES[design];
  $('content').innerHTML = design === 'today' ? renderToday() : renderProposed();
  const feed = $('feed');
  if (!feed) return;
  if (follow) feed.scrollTop = feed.scrollHeight; else feed.scrollTop = feedScroll;
  // Scrolling up inside the feed pauses Follow; reaching the bottom resumes it, as in the chat transcript.
  feed.addEventListener('scroll', () => {
    feedScroll = feed.scrollTop;
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 4;
    if (atBottom !== follow) { follow = atBottom; $('follow').setAttribute('aria-pressed', follow); }
    $('jump').classList.toggle('on', !atBottom);
  });
}
let feedScroll = 0;

document.querySelector('.designs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { design = b.dataset.d; render(); } });
$('quiet').addEventListener('change', render);
$('nostream').addEventListener('change', render);
$('content').addEventListener('click', (e) => {
  const f = e.target.closest('[data-f]'); if (f) { filter = f.dataset.f; render(); return; }
  const g = e.target.closest('[data-grp]'); if (g) { const id = g.dataset.grp; shut.has(id) ? shut.delete(id) : shut.add(id); render(); return; }
  if (e.target.closest('#follow') || e.target.closest('#jump')) { follow = e.target.closest('#jump') ? true : !follow; render(); return; }
  if (e.target.closest('a')) return;
  const row = e.target.closest('.ev.note, .ev[data-kids]'); if (row) row.classList.toggle('open');
});
render();
</script>
</body>
</html>
