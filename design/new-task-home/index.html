<!-- Design reference only. Tokens come from the Linear study, which match SkillBillColors. All data is sample data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; font-feature-settings: "cv11", "ss01"; }
  button, input, textarea { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }
  .mono { font-family: var(--font-mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .chrome-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .chrome label { display: flex; align-items: center; gap: 6px; color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; }
  .note { margin: 0; max-width: 1040px; color: var(--fg-muted); font-size: var(--t-sm); }
  .note b { color: var(--fg-2); font-weight: 500; }
  kbd, .kbd { font: 400 var(--t-2xs) var(--font-mono); padding: 1px 4px; border: 1px solid var(--border); border-radius: 3px; color: var(--fg-muted); background: var(--bg-inset); }

  /* App window */
  .window { flex: 1; min-height: 0; padding: var(--sp-2); display: flex; gap: var(--sp-2); }
  .appnav { flex: none; width: 196px; display: flex; flex-direction: column; gap: 2px; padding: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .appnav .nav { height: 28px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2); border-radius: var(--r-sm); }
  .appnav .nav.on { background: var(--bg-active); color: var(--fg); }
  .appnav .nav .count { margin-left: auto; font-size: var(--t-xs); color: var(--fg-faint); }
  .panel { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .head { flex: none; height: var(--header-h); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
  .head .crumb { font-weight: 500; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: var(--sp-6); }
  .content { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: var(--sp-10); margin: auto 0; }

  /* Hero */
  .hero h1 { margin: 0 0 var(--sp-2); font-size: var(--t-2xl); font-weight: 600; letter-spacing: -0.015em; }
  .hero p { margin: 0; color: var(--fg-muted); }

  /* Step line */
  .steps { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); }
  .steps::before { content: ""; position: absolute; left: calc(100% / 14); right: calc(100% / 14); top: 5px; height: 1px; background: var(--border); }
  .steps .sweep { position: absolute; left: calc(100% / 14); top: 5px; height: 1px; width: 0; background: linear-gradient(90deg, transparent, var(--accent)); animation: sweep 4.2s var(--ease) infinite; }
  @keyframes sweep { 0% { width: 0; opacity: 0; } 15% { opacity: 1; } 85% { width: calc(100% - 100% / 7); opacity: 1; } 100% { width: calc(100% - 100% / 7); opacity: 0; } }
  .step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .step .dot { width: 11px; height: 11px; border-radius: 50%; display: grid; place-items: center; }
  .step .dot::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); }
  .step .lbl { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-faint); }
  .steps.old .step .lbl { font-size: var(--t-sm); color: var(--fg-muted); }
  .steps.old .step.cur .dot::after { width: 8px; height: 8px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .steps-cap { margin-top: var(--sp-3); color: var(--fg-muted); font-size: var(--t-sm); }
  /* Live step line: runs sit on the stage they are in */
  .steps.live { margin-top: 18px; }
  .steps.live .pips { position: absolute; top: -18px; display: flex; gap: 3px; }
  .pip { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; position: relative; }
  .pip.active { background: var(--st-active); box-shadow: 0 0 0 3px rgba(63, 185, 80, .14); animation: breathe 2.4s ease-in-out infinite; }
  .pip.blocked { background: var(--st-blocked); box-shadow: 0 0 0 3px rgba(226, 112, 60, .18); }
  @keyframes breathe { 50% { box-shadow: 0 0 0 5px rgba(63, 185, 80, .05); } }
  .pip .tip { display: none; position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 4px 8px; border-radius: var(--r-sm); background: var(--bg-overlay); box-shadow: var(--shadow-pop); font-size: var(--t-xs); color: var(--fg-2); z-index: 3; }
  .pip:hover .tip, .pip:focus-visible .tip { display: block; }
  .steps.live .step.has .lbl { color: var(--fg-2); }
  .steps.live .step.has .dot::after { background: var(--fg-muted); }
  @media (prefers-reduced-motion: reduce) { .steps .sweep, .pip.active { animation: none; } }

  /* Sections */
  .sec { display: flex; flex-direction: column; gap: var(--sp-2); }
  .sec-head { display: flex; align-items: center; gap: var(--sp-2); min-height: 22px; }
  .sec-head .t { font-size: var(--t-sm); font-weight: 500; color: var(--fg-muted); }
  .sec-head .c { font-size: var(--t-xs); color: var(--fg-faint); }
  .sec-head .sp { flex: 1; }
  .ghost { height: 22px; padding: 0 6px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); }
  .ghost:hover { background: var(--bg-hover); color: var(--fg); }
  .ghost .kbd { font-size: 10px; }

  /* Baseline ("Today") rows */
  .old-list { display: flex; flex-direction: column; gap: 8px; }
  .old-row { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: var(--r-sm); cursor: pointer; }
  .old-row:hover { background: var(--bg-hover); }
  .old-row .ttl { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .old-row .ttl code { font: 400 var(--t-sm) var(--font-mono); color: var(--accent-text); background: var(--bg-overlay); padding: 1px 3px; border-radius: 3px; }
  .old-row .ttl-wrap { flex: 2 1 0; min-width: 0; display: flex; }
  .old-row .gap { flex: 1 1 0; }
  .old-row .repo { color: var(--fg-muted); font-size: var(--t-sm); }
  .old-row .ago { color: var(--fg-faint); font-size: var(--t-sm); }
  .old-row .key { font: 400 var(--t-sm) var(--font-mono); color: var(--fg-muted); }
  .old-row .strong { font-weight: 500; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .old-row .why { flex: 1; min-width: 0; color: var(--fg-muted); font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Card list: shared by Tidy, Inbox and Launcher */
  .card { background: rgba(255,255,255,.012); border: 1px solid var(--border-subtle); border-radius: var(--r-md); overflow: hidden; }
  .row { position: relative; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; cursor: pointer; outline: none; transition: background var(--dur-fast) var(--ease), height var(--dur) var(--ease), opacity var(--dur) var(--ease); }
  .row + .row { box-shadow: inset 0 1px 0 var(--border-subtle); }
  .row:hover, .row.sel { background: var(--bg-hover); }
  .row.sel::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; border-radius: 2px; background: var(--accent); }
  .row.gone { height: 0; opacity: 0; }
  .row .g { width: 16px; display: grid; place-items: center; color: var(--fg-faint); }
  .row .g.img { color: var(--data-2); }
  .row .g.warn { color: var(--st-blocked); }
  .row .g.run { color: var(--st-active); }
  .row .ttl { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; overflow: hidden; white-space: nowrap; }
  .row .ttl .main { overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); }
  .row:hover .ttl .main, .row.sel .ttl .main { color: var(--fg); }
  .row .ttl .sub { flex: 0 100 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--fg-faint); font-size: var(--t-sm); }
  .row .key { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-muted); flex: none; }
  .row .badge { flex: none; height: 18px; padding: 0 6px; display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-full); font-size: var(--t-2xs); color: var(--fg-muted); border: 1px solid var(--border); }
  .row .badge.open { color: var(--st-active); border-color: rgba(63,185,80,.3); }
  .row .badge.repo .sw { width: 6px; height: 6px; border-radius: 2px; }
  .row .meta { position: relative; flex: none; width: 52px; text-align: right; font-size: var(--t-xs); color: var(--fg-faint); }
  .row .meta .x { position: absolute; right: -4px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; display: none; place-items: center; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--fg-muted); cursor: pointer; }
  .row .meta .x:hover { background: var(--bg-active); color: var(--st-failed); }
  .row:hover .meta .t, .row.sel .meta .t { visibility: hidden; }
  .row:hover .meta .x, .row.sel .meta .x { display: grid; }
  .row .hot { flex: none; width: 16px; text-align: center; font: 400 10px var(--font-mono); color: var(--fg-faint); opacity: 0; }
  .card:hover .row .hot, .card:focus-within .row .hot { opacity: 1; }
  .row.need { background: linear-gradient(90deg, rgba(226,112,60,.07), transparent 40%); }
  .row.need:hover, .row.need.sel { background: linear-gradient(90deg, rgba(226,112,60,.11), rgba(255,255,255,.03) 40%); }
  .row.need::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--st-blocked); }
  .row.need.sel::before { display: none; }
  .grp { height: 26px; display: flex; align-items: flex-end; padding: 0 12px 4px; font-size: var(--t-2xs); letter-spacing: .04em; text-transform: uppercase; color: var(--fg-faint); background: var(--bg-panel); }
  .row + .grp, .grp + .row { box-shadow: none; }
  .grp + .row { box-shadow: none; }
  .empty { padding: 14px 12px; color: var(--fg-faint); font-size: var(--t-sm); }

  /* Filter tabs inside the Inbox header */
  .seg { display: flex; gap: 2px; }
  .seg button { height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--fg-faint); font-size: var(--t-sm); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
  .seg button:hover { color: var(--fg-2); }
  .seg button[aria-pressed="true"] { background: var(--bg-active); color: var(--fg); }
  .seg button .n { font-size: var(--t-2xs); color: var(--fg-faint); }
  .seg button .n.hot { color: var(--st-blocked); }

  /* Composer (bottom, as in the app today) */
  .dock { flex: none; padding: var(--sp-3) var(--sp-6) var(--sp-4); display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
  .dock > * { width: 100%; max-width: 760px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 26px; padding: 0 10px; border: 1px solid var(--border); border-radius: 13px; background: transparent; color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { background: var(--bg-hover); color: var(--fg-2); }
  .input { height: 40px; display: flex; align-items: center; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-inset); color: var(--fg-faint); }
  .input:focus-within { border-color: var(--border-strong); }
  .input input { flex: 1; border: 0; outline: none; background: transparent; color: var(--fg); }
  .input input::placeholder { color: var(--fg-faint); }
  .foot { display: flex; align-items: center; gap: 8px; }
  .pill { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 13px; font: 400 var(--t-sm) var(--font-mono); color: var(--fg-muted); }
  .send { margin-left: auto; height: 28px; padding: 0 10px 0 12px; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: var(--r-sm); background: var(--accent); color: var(--accent-fg); font-weight: 500; cursor: pointer; }
  .send.dim { background: rgba(233,168,28,.55); }

  /* Launcher composer (top, large) */
  .launch { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-inset); box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 18px 48px rgba(0,0,0,.35); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .launch:focus-within { border-color: var(--border-strong); box-shadow: 0 0 0 4px var(--accent-tint), 0 18px 48px rgba(0,0,0,.4); }
  .launch textarea { width: 100%; min-height: 64px; resize: none; border: 0; outline: none; background: transparent; padding: 14px 16px 6px; color: var(--fg); font-size: var(--t-md); line-height: 1.5; }
  .launch textarea::placeholder { color: var(--fg-faint); }
  .launch .bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px 10px 12px; }
  .launch .route { font-size: var(--t-xs); color: var(--fg-faint); display: flex; align-items: center; gap: 6px; margin-left: 4px; }
  .launch .route b { color: var(--accent-text); font-weight: 500; }
  .launch .chip { height: 24px; font-size: var(--t-xs); }

  /* Toast */
  .toast { position: absolute; left: 50%; bottom: 128px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 6px 0 14px; border-radius: var(--r-md); background: var(--bg-overlay); box-shadow: var(--shadow-pop); font-size: var(--t-sm); color: var(--fg-2); transition: all var(--dur) var(--ease); z-index: 5; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { height: 26px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--accent-text); font-weight: 500; cursor: pointer; }
  .toast button:hover { background: var(--bg-hover); }

  .hint { display: flex; gap: 14px; justify-content: center; color: var(--fg-faint); font-size: var(--t-xs); }
  .hint span { display: inline-flex; gap: 5px; align-items: center; }
</style>
</head>

const CURRENT_REPO = "SkillBill";

const NOTES = {
  today: "<b>Today.</b> The repo name takes <code>weight(0.5f, fill = false)</code>, so each row reserves about a third of its width and leaves it empty. Discard floats mid-row and the right edges don't line up with Needs you. Pasted paths render as yellow inline code.",
  tidy: "<b>A · Tidy.</b> Same layout, fixed. Both lists sit in one quiet card with 34px rows and hairline dividers. A glyph column anchors the left edge, a fixed-width time column anchors the right, and the × replaces the time on hover. The repo shows only when it isn't the current one. Image chats show the text the user wrote and keep the file name as a faint suffix. <kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd> <kbd>Del</kbd> work when the list has focus.",
  inbox: "<b>B · Inbox.</b> Recent chats and Needs you are both \"things to pick back up\", so they share one list. Blocked runs pin to the top with an orange edge, running runs follow, then chats grouped by day. The filter in the header narrows it down. Number keys <kbd>1</kbd>–<kbd>9</kbd> open a row and show up on hover.",
  launch: "<b>C · Launcher.</b> The composer moves to the top, because typing is the main action. The step line shows live runs as dots on the stage each run is in: orange is blocked, green is running. Hover a dot. Typing filters the chat list below, so the composer doubles as /resume. Press <kbd>Tab</kbd> to jump into the matches. The start chips sit inside the composer.",
};

let design = new URLSearchParams(location.search).get("d") || "tidy";
let chats = CHATS0.map(c => ({ ...c }));
let filter = "all";
let query = "";
let sel = 0;
let lastDiscard = null;
let toastTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ico = (id, cls = "") => `<svg class="ico ${cls}"><use href="#i-${id}"/></svg>`;
const short = m => m < 1 ? "now" : m < 60 ? `${m}m` : m < 1440 ? `${Math.floor(m / 60)}h` : m < 2880 ? "1d" : `${Math.floor(m / 1440)}d`;
const long = m => m < 1 ? "just now" : `${short(m)} ago`;
const mixed = () => $("#mixed").checked;
const calm = () => $("#calm").checked;
const visibleChats = () => chats.filter(c => mixed() || c.repo === CURRENT_REPO);
const blocked = () => calm() ? [] : RUNS.filter(r => r.status === "blocked");
const running = () => RUNS.filter(r => r.status === "active");

function hero() {
  return `<div class="hero"><h1>What should we ship?</h1><p>Describe the work or paste an issue. Skill Bill plans it, builds it, audits it and opens the PR.</p></div>`;
}

function stepLine({ old = false, live = false } = {}) {
  const runs = live ? [...running(), ...blocked()] : [];
  const steps = STAGES.map(s => {
    const here = runs.filter(r => r.stage === s);
    const pips = here.length ? `<div class="pips">${here.map(r => `<button class="pip ${r.status}" aria-label="${r.key} ${r.status} in ${s}"><span class="tip"><span class="mono">${r.key}</span> · ${esc(r.title)}</span></button>`).join("")}</div>` : "";
    return `<div class="step ${old && s === "qa" ? "cur" : ""} ${here.length ? "has" : ""}">${pips}<span class="dot"></span><span class="lbl">${s}</span></div>`;
  }).join("");
  return `<div><div class="steps ${old ? "old" : ""} ${live ? "live" : ""}">${old ? "" : `<span class="sweep"></span>`}${steps}</div>${old ? `<div class="steps-cap">Every goal runs this path</div>` : ""}</div>`;
}

function rawTitle(c) {
  return esc(c.raw).replace(/`([^`]+)`/g, "<code>$1</code>");
}

/* ---------- Today ---------- */
function renderToday() {
  const list = visibleChats().slice(0, 6);
  const recent = list.length ? `<section class="sec"><div class="sec-head"><span class="t">Recent chats</span></div><div class="old-list">${list.map(c => `
    <div class="old-row" data-id="${c.id}"><div class="ttl-wrap"><span class="ttl">${rawTitle(c)}</span></div><span class="repo">${c.repo}</span><span class="ago">${long(c.min)}</span><button class="ghost" data-discard="${c.id}">Discard</button><span class="gap"></span></div>`).join("")}
    ${visibleChats().length > 6 ? `<div><button class="ghost">Show all</button></div>` : ""}</div></section>` : "";
  const b = blocked();
  const needs = `<section class="sec"><div class="sec-head">${b.length ? `<span class="t">Needs you</span>` : ""}<span class="sp"></span><button class="ghost">2 running · 9 finished today</button></div>
    ${b.map(r => `<div class="old-row"><span style="color:var(--st-blocked)">${ico("warn")}</span><span class="key">${r.key}</span><span class="strong">[${r.key}] ${esc(r.title)}</span><span class="why">${esc(r.reason)}</span><span class="ago">${long(r.min)}</span></div>`).join("")}</section>`;
  $("#content").innerHTML = hero() + stepLine({ old: true }) + recent + needs;
  $("#content").style.gap = "40px";
  dockBottom();
}

/* ---------- Shared row ---------- */
function chatRow(c, i, { hot = false } = {}) {
  const repo = c.repo !== CURRENT_REPO ? `<span class="badge repo"><span class="sw" style="background:${REPO_COLOR[c.repo]}"></span>${c.repo}</span>` : "";
  const sub = c.sub ? `<span class="sub mono">${esc(c.sub)}</span>` : "";
  return `<div class="row" role="option" tabindex="-1" data-id="${c.id}" data-i="${i}">
    <span class="g ${c.img ? "img" : ""}">${ico(c.img ? "img" : "chat", "sm")}</span>
    <span class="ttl"><span class="main">${esc(c.title)}</span>${sub}</span>
    ${c.open ? `<span class="badge open">open</span>` : ""}${repo}
    <span class="meta num"><span class="t">${short(c.min)}</span><button class="x" data-discard="${c.id}" aria-label="Discard ${esc(c.title)}" title="Discard">${ico("x", "sm")}</button></span>
    ${hot ? `<span class="hot">${i < 9 ? i + 1 : ""}</span>` : ""}
  </div>`;
}
function runRow(r, i, { hot = false } = {}) {
  const need = r.status === "blocked";
  return `<div class="row ${need ? "need" : ""}" role="option" tabindex="-1" data-run="${r.key}" data-i="${i}">
    <span class="g ${need ? "warn" : "run"}">${ico(need ? "warn" : "run", "sm")}</span>
    <span class="key">${r.key}</span>
    <span class="ttl"><span class="main">${esc(r.title)}</span><span class="sub">${esc(r.reason)}</span></span>
    <span class="badge">${r.stage}</span>
    <span class="meta num"><span class="t">${short(r.min)}</span></span>
    ${hot ? `<span class="hot">${i < 9 ? i + 1 : ""}</span>` : ""}
  </div>`;
}

/* ---------- A · Tidy ---------- */
function renderTidy() {
  const list = visibleChats();
  const shown = list.slice(0, 5);
  const b = blocked();
  const recent = list.length ? `<section class="sec">
      <div class="sec-head"><span class="t">Recent chats</span><span class="sp"></span>${list.length > 5 ? `<button class="ghost">Show all ${list.length} <span class="kbd">/resume</span></button>` : ""}</div>
      <div class="card" role="listbox" tabindex="0" aria-label="Recent chats">${shown.map((c, i) => chatRow(c, i)).join("")}</div>
    </section>` : "";
  const needs = `<section class="sec">
      <div class="sec-head">${b.length ? `<span class="t">Needs you</span><span class="c">${b.length}</span>` : `<span class="t">All clear</span>`}<span class="sp"></span><button class="ghost"><span style="color:var(--st-active)">●</span> 2 running · 9 finished today ${ico("arrow", "sm")}</button></div>
      ${b.length ? `<div class="card" role="listbox" tabindex="0" aria-label="Needs you">${b.map((r, i) => runRow(r, i)).join("")}</div>` : ""}
    </section>`;
  $("#content").innerHTML = hero() + stepLine() + recent + needs;
  $("#content").style.gap = "32px";
  dockBottom();
}

/* ---------- B · Inbox ---------- */
function inboxItems() {
  const items = [];
  const wantRuns = filter !== "chats";
  const wantChats = filter !== "needs";
  if (wantRuns) blocked().forEach(r => items.push({ kind: "run", r }));
  if (filter === "all") running().forEach(r => items.push({ kind: "run", r }));
  if (wantChats) {
    const list = visibleChats();
    const today = list.filter(c => c.min < 1440), earlier = list.filter(c => c.min >= 1440);
    if (today.length) { items.push({ kind: "grp", label: "Today" }); today.forEach(c => items.push({ kind: "chat", c })); }
    if (earlier.length) { items.push({ kind: "grp", label: "Yesterday" }); earlier.forEach(c => items.push({ kind: "chat", c })); }
  }
  return items;
}
function renderInbox() {
  const b = blocked().length, c = visibleChats().length;
  const items = inboxItems();
  let i = 0;
  const rows = items.map(it => it.kind === "grp" ? `<div class="grp">${it.label}</div>` : it.kind === "run" ? runRow(it.r, i++, { hot: true }) : chatRow(it.c, i++, { hot: true })).join("");
  $("#content").innerHTML = hero() + stepLine() + `<section class="sec">
    <div class="sec-head"><span class="t">Pick up where you left off</span><span class="sp"></span>
      <div class="seg" role="group" aria-label="Filter">
        <button data-f="all" aria-pressed="${filter === "all"}">All</button>
        <button data-f="needs" aria-pressed="${filter === "needs"}">Needs you <span class="n ${b ? "hot" : ""}">${b}</span></button>
        <button data-f="chats" aria-pressed="${filter === "chats"}">Chats <span class="n">${c}</span></button>
      </div></div>
    <div class="card" role="listbox" tabindex="0" aria-label="Pick up">${rows || `<div class="empty">Nothing here. Start something below.</div>`}</div>
    <div class="hint"><span><kbd>1</kbd>–<kbd>9</kbd> open</span><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Del</kbd> discard chat</span><span>9 finished today ${ico("arrow", "sm")}</span></div>
  </section>`;
  $("#content").style.gap = "32px";
  dockBottom();
}

/* ---------- C · Launcher ---------- */
function matches() {
  const q = query.trim().toLowerCase();
  const list = visibleChats();
  if (!q) return list.slice(0, 5);
  return list.filter(c => (c.title + " " + (c.sub || "") + " " + c.raw).toLowerCase().includes(q)).slice(0, 5);
}
function renderLaunch(keepFocus) {
  const b = blocked();
  const m = matches();
  const q = query.trim();
  const listHead = q ? `<span class="t">${m.length ? "Resume a matching chat" : "No matching chats"}</span>` : `<span class="t">Jump back in</span>`;
  const startRow = q ? `<div class="row" data-i="${m.length}" role="option" tabindex="-1"><span class="g" style="color:var(--accent)">${ico("enter", "sm")}</span><span class="ttl"><span class="main">Start a new goal: “${esc(q)}”</span></span><span class="meta"><span class="kbd">⏎</span></span></div>` : "";
  const needs = b.length && !q ? `<div class="card">${b.map((r, i) => runRow(r, i)).join("")}</div>` : "";
  $("#content").innerHTML = `
    <div class="hero" style="text-align:center"><h1>What should we ship?</h1><p>Plan, build, audit, open the PR. Or pick up something below.</p></div>
    <div class="launch">
      <textarea id="ask" rows="2" placeholder="Describe the work, paste an issue key, or search your chats">${esc(query)}</textarea>
      <div class="bar">
        <span class="pill">${ico("folder", "sm")} SkillBill / main</span>
        <span class="pill">${ico("cpu", "sm")} claude · opus-5-5</span>
        <span class="route">${q ? `runs as <b>${/^[A-Z]+-\d+$/.test(q) ? "goal from issue" : "goal"}</b>` : ""}</span>
        <span style="flex:1"></span>
        <button class="chip">Review</button><button class="chip">Checks</button><button class="chip">QA</button><button class="chip">PR</button>
        <button class="send ${q ? "" : "dim"}">Send ${ico("enter", "sm")}</button>
      </div>
    </div>
    ${stepLine({ live: true })}
    <section class="sec">
      <div class="sec-head">${listHead}<span class="sp"></span>${q ? "" : `<button class="ghost">All chats <span class="kbd">/resume</span></button>`}</div>
      ${needs}
      <div class="card" role="listbox" tabindex="0" aria-label="Chats">${m.map((c, i) => chatRow(c, i)).join("")}${startRow}</div>
    </section>`;
  $("#content").style.gap = "28px";
  $("#dock").innerHTML = "";
  const ta = $("#ask");
  ta.addEventListener("input", e => {
    query = e.target.value;
    const pos = e.target.selectionStart;
    renderLaunch(true);
    const t = $("#ask"); t.focus(); t.setSelectionRange(pos, pos);
  });
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.shiftKey && query.trim()) { e.preventDefault(); sel = 0; focusList(); }
  });
  if (keepFocus) ta.focus();
}

function dockBottom() {
  $("#dock").innerHTML = `
    <div class="chips"><button class="chip">Review my branch</button><button class="chip">Run the checks</button><button class="chip">QA my branch</button><button class="chip">Open a PR</button></div>
    <label class="input"><input placeholder="Describe the work, or paste an issue key or spec path"></label>
    <div class="foot"><span class="pill">${ico("folder", "sm")} SkillBill / main</span><span class="pill">${ico("cpu", "sm")} claude · claude-opus-5-5</span><button class="send">Send ${ico("enter", "sm")}</button></div>`;
}

/* ---------- Interaction ---------- */
function render() {
  document.querySelectorAll(".designs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.d === design));
  $("#note").innerHTML = NOTES[design];
  $("#nav-inbox").textContent = blocked().length || "";
  ({ today: renderToday, tidy: renderTidy, inbox: renderInbox, launch: renderLaunch })[design]();
}

function rows(list) { return [...list.querySelectorAll(".row")]; }
function focusList() {
  const list = document.querySelector('.card[role="listbox"]:not(:empty)');
  if (!list) return;
  list.focus();
  paintSel(list);
}
function paintSel(list) {
  const r = rows(list);
  sel = Math.max(0, Math.min(sel, r.length - 1));
  r.forEach((el, i) => el.classList.toggle("sel", i === sel));
  r[sel]?.scrollIntoView({ block: "nearest" });
}

function discard(id) {
  const idx = chats.findIndex(c => c.id === id);
  if (idx < 0) return;
  const el = document.querySelector(`[data-id="${id}"]`);
  const finish = () => {
    lastDiscard = { chat: chats[idx], idx };
    chats.splice(idx, 1);
    render();
    toast(`Discarded “${lastDiscard.chat.title}”`);
  };
  if (el && el.classList.contains("row")) { el.classList.add("gone"); setTimeout(finish, 160); } else finish();
}
function toast(text) {
  $("#toast-text").textContent = text.length > 52 ? text.slice(0, 50) + "…”" : text;
  $("#toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("on"), 5000);
}
$("#undo").addEventListener("click", () => {
  if (!lastDiscard) return;
  chats.splice(lastDiscard.idx, 0, lastDiscard.chat);
  lastDiscard = null;
  $("#toast").classList.remove("on");
  render();
});

document.addEventListener("click", e => {
  const d = e.target.closest("[data-d]");
  if (d) { design = d.dataset.d; sel = 0; query = ""; history.replaceState(null, "", `?d=${design}`); render(); return; }
  const x = e.target.closest("[data-discard]");
  if (x) { e.stopPropagation(); discard(x.dataset.discard); return; }
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; sel = 0; render(); return; }
  const row = e.target.closest(".row, .old-row");
  if (row) {
    const what = row.dataset.run ? `Open run ${row.dataset.run}` : row.dataset.id ? `Resume “${(chats.find(c => c.id === row.dataset.id) || {}).title}”` : "Start a new goal";
    toast(what); $("#undo").style.display = "none"; setTimeout(() => $("#undo").style.display = "", 5000);
  }
});
document.addEventListener("keydown", e => {
  const list = e.target.closest?.('.card[role="listbox"]');
  if (design === "inbox" && /^[1-9]$/.test(e.key) && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    const r = rows(document.querySelector('.card[role="listbox"]'))[+e.key - 1];
    if (r) { sel = +e.key - 1; paintSel(r.parentElement); r.click(); }
    return;
  }
  if (!list) return;
  const r = rows(list);
  if (e.key === "ArrowDown") { e.preventDefault(); sel++; paintSel(list); }
  else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (sel === 0 && design === "launch") { $("#ask").focus(); r.forEach(el => el.classList.remove("sel")); return; }
    sel--; paintSel(list);
  }
  else if (e.key === "Enter") { e.preventDefault(); r[sel]?.click(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && r[sel]?.dataset.id) { e.preventDefault(); const id = r[sel].dataset.id; discard(id); setTimeout(focusList, 200); }
});
document.addEventListener("focusin", e => { if (e.target.matches?.('.card[role="listbox"]')) paintSel(e.target); });
document.addEventListener("focusout", e => { if (e.target.matches?.('.card[role="listbox"]')) e.target.querySelectorAll(".sel").forEach(el => el.classList.remove("sel")); });
$("#mixed").addEventListener("change", render);
$("#calm").addEventListener("change", render);

render();
</script>
</body>
</html>
