Desktop module \`:app\`, main class \`dev.skillbill.desktop.app.DesktopLauncherKt\`. The app used ${RUN}home as its home and ${RUN}tmp for \`TMPDIR\` and \`java.io.tmpdir\`. Its state path was inside the isolated home. The benchmark used a synthetic store and the same on-disk temp directory. The private Xvfb display connected, but no visible app window appeared. Backend and web environments were not created because those target kinds have empty scope. No database or outbound substitutes were needed.

None.

  },
  {

      { id: 'QA-1', title: 'Save button stays disabled after editing a field', state: 'fixed', observed: 'The button stayed disabled until the window lost focus.', expected: 'The button enables on the first edit.', steps: 'Open Settings, change the retention field.', evidence: [SAMPLE + 'save-disabled.png'] },
      { id: 'QA-2', title: 'Retention field accepts a negative number', state: 'fixed', observed: 'A value of -1 saved without an error.', expected: 'The field rejects values below 1.', steps: 'Type -1 in the retention field and save.', evidence: [SAMPLE + 'retention.log'] },
      { id: 'QA-3', title: 'Error toast covers the Save button', state: 'fixed', observed: 'The toast sat on top of the button for 5 seconds.', expected: 'The toast leaves the button clickable.', steps: 'Trigger a save failure.', evidence: [SAMPLE + 'toast.png'] },
    ],
    gaps: [], passed: SAMPLE_PASSED(['Open settings', 'Edit retention', 'Save and reload', 'Reject invalid values', 'Save failure toast', 'Keyboard order', 'Restart keeps values']),

  },
  {

    sentence: 'All 7 checks passed.',
    legacyLine: '',
    findings: [], gaps: [], passed: SAMPLE_PASSED(['Open settings', 'Edit retention', 'Save and reload', 'Reject invalid values', 'Save failure toast', 'Keyboard order', 'Restart keeps values']),
    targets: [['Desktop', 'tested'], [NOT_IN_SCOPE, 'not in scope']],

  },
  {

      { title: 'Process still running', detail: 'Gradle daemon, pid 48213. Release reported it as retained.', copy: '48213', copyLabel: 'Copy pid' },
      { title: 'Temporary edit', detail: '`desktop/gradle.properties`: set `org.gradle.jvmargs` to `-Xmx1g` for the QA run and did not restore it.', copy: 'desktop/gradle.properties', copyLabel: 'Copy path' },
    ],
    targets: [['Desktop', 'tested'], [NOT_IN_SCOPE, 'not in scope']],
    report: 'Verdict: passed\n\nI exercised settings editing in the running desktop app.\n\n## Temporary edits\n\n`desktop/gradle.properties`: set `org.gradle.jvmargs`.\n\n## Cleanup\n\nThe Gradle daemon was retained.',
    why: 'Isolation and cleanup stay hidden when they went fine, which is nearly always. A leftover process or edit is the one part of them the operator must act on, so it jumps to the top.',
  },
  {
    id: 'skipped', label: 'Nothing to test',
    tone: 'faint', word: 'Skipped', outcome: 'skipped',

    findings: [], gaps: [], passed: [],
    targets: [['Android, desktop, backend, web', 'not in scope']],

    why: '`empty_scope` is the system working as intended, so it reads as grey. A skip for any other reason, such as `docker_unavailable`, would be orange and say what was missing.',
  },
  {
    id: 'failed', label: 'QA stopped before writing a report',
    tone: 'failed', word: 'Did not finish', outcome: 'failed',
    sentence: 'QA stopped before it wrote a report, so this change has no QA result.',

    findings: [], gaps: [], passed: [],
    targets: [],
    runDetails: 'Agent exited with status 137 during step 4 of 9.',
    report: '',
    why: 'Same layout with the verdict doing all the work. Run details, which the card has today, stay available as a fold.',
  },
  {
    id: 'legacy', label: 'Older report with no tagged checks',
    tone: 'failed', word: 'Needs your review', outcome: 'attempted', legacy: true,
    sentence: 'QA could not fix 1 problem.',
    legacyLine: 'QA could not fix 1 finding. Review them yourself.',
    findings: [{ id: 'QA-1', title: 'Benchmark run times out before producing figures', state: 'open', evidence: [RUN + 'benchmark.log'] }],
    gaps: [], passed: [], targets: [],
    report: REAL_REPORT,
    why: 'Runs recorded before the format change have no tags and only id, title and one evidence path per finding. They get the verdict and findings, then the first paragraph of the report above a fold. Nothing pretends to know which checks passed.',
  },
];

const PIPELINE = ['goal_assessment', 'goal_assessment_fix', 'qa', 'qa_fix', 'validate', 'pr', 'monitor', 'monitor_fix'];

const state = { view: 'new', scenario: SCENARIOS[0], open: new Set(), closed: new Set(), all: false };

function fileName(path) { return path.slice(path.lastIndexOf('/') + 1); }
function fileChip(path) {
  const kind = /\.(png|jpe?g)$/.test(path) ? 'image' : 'file';
  return `<button type="button" class="chip file" title="${esc(path)}" data-act="evidence" data-arg="${esc(path)}">${icon(kind, 'sm')}${esc(fileName(path))}</button>`;
}
function isOpen(key) { return state.all ? !state.closed.has(key) : state.open.has(key); }

function reportHtml(text) {
  const lines = text.split('\n');
  const out = [];
  let list = null;
  const flush = () => { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } };
  const paths = (html) => html.replace(/\/home\/you\/[^\s,<]+/g, (p) => `<span class="file-ref">${state.view === 'today' ? p : fileName(p)}</span>`);
  lines.forEach((raw) => {
    const line = raw.trim();
    if (!line) { flush(); return; }
    if (line.startsWith('#')) { flush(); out.push(`<h3>${inline(line.replace(/^#+\s*/, ''))}</h3>`); return; }
    if (line.startsWith('- ')) { (list = list || []).push(`<li>${paths(inline(line.slice(2)))}</li>`); return; }
    flush();
    out.push(`<p>${paths(inline(line))}</p>`);
  });
  flush();
  return out.join('');
}

function chrome(s) {
  const qaSettled = s.tone === 'done' || s.id === 'left' || s.id === 'skipped';
  const nowIndex = qaSettled ? 4 : 2;
  const steps = PIPELINE.map((id, i) => {
    const done = i < nowIndex;
    const now = i === nowIndex;
    return `<span class="step ${done ? 'done' : ''} ${now ? 'now' : ''}">${done ? icon('check', 'sm') : ''}${id}</span>`;
  }).join('<i></i>');
  return `
    <div class="tabs"><span>Assessment</span><span class="on">QA</span></div>
    <div class="finish"><span class="ring"></span>Goal finish<span class="end">Pending</span></div>
    <div class="pipe">${steps}</div>`;
}

function findingItem(f) {
  const key = 'f:' + f.id;
  const openNow = isOpen(key);
  const fixed = f.state === 'fixed';
  const body = openNow ? `<div class="item-body">
    ${f.expected ? `<div><div class="field-label">Expected</div>${inline(f.expected)}</div>` : ''}
    ${f.steps ? `<div><div class="field-label">Steps</div>${inline(f.steps)}</div>` : ''}
    <div class="actions">
      ${f.evidence.map(fileChip).join('')}
      ${f.steps ? `<button type="button" class="chip" data-act="copy" data-arg="${esc(f.steps.replace(/`/g, ''))}">${icon('copy', 'sm')}Copy steps</button>` : ''}
    </div>
  </div>` : '';
  return `<div class="item">
    <button type="button" class="item-head" aria-expanded="${openNow}" data-act="toggle" data-arg="${key}">
      <span class="glyph ${fixed ? 'tone-done' : 'tone-failed'}">${icon(fixed ? 'check' : 'bug')}</span>
      <span class="item-title"><span class="ref"${fixed ? ' style="color:var(--fg-muted)"' : ''}>${esc(f.id)}</span>${esc(f.title)}</span>
      <span class="item-state ${fixed ? 'tone-done' : 'tone-failed'}">${fixed ? 'Fixed' : 'Not fixed'}${icon('chev', 'sm')}</span>
      ${f.observed ? `<span class="item-line">${inline(f.observed)}</span>` : ''}
    </button>${body}
  </div>`;
}

function gapItem(g, i) {
  const key = 'g:' + i;
  const openNow = isOpen(key);
  if (!g.evidence.length) {
    return `<div class="item"><div class="item-head" style="cursor:default">
      <span class="glyph tone-blocked">${icon('gap')}</span>
      <span class="item-title">${esc(g.title)}</span>
      <span></span>
      <span class="item-line" style="display:block">${inline(g.detail)}</span>
    </div></div>`;
  }
  return `<div class="item">
    <button type="button" class="item-head" aria-expanded="${openNow}" data-act="toggle" data-arg="${key}">
      <span class="glyph tone-blocked">${icon('gap')}</span>
      <span class="item-title">${esc(g.title)}</span>
      <span class="item-state">${icon('chev', 'sm')}</span>
      <span class="item-line">${inline(g.detail)}</span>
    </button>
    ${openNow ? `<div class="item-body"><div class="actions">${g.evidence.map(fileChip).join('')}</div></div>` : ''}
  </div>`;
}

function leftItem(l) {
  return `<div class="item">
    <div class="item-head" style="cursor:default">
      <span class="glyph tone-blocked">${icon('left')}</span>
      <span class="item-title">${esc(l.title)}</span>
      <span></span>
      <span class="item-line" style="display:block">${inline(l.detail)}</span>
    </div>
    <div class="item-body"><div class="actions"><button type="button" class="chip" data-act="copy" data-arg="${esc(l.copy)}">${icon('copy', 'sm')}${esc(l.copyLabel)}</button></div></div>
  </div>`;
}

function unblockItem(u) {
  return `<div class="item">
    <div class="item-head" style="cursor:default">
      <span class="glyph tone-blocked">${icon('gap')}</span>
      <span class="item-title">${esc(u.capability)}</span>
      <span></span>
      <span class="item-line" style="display:block">${u.target ? `Target: ${esc(u.target)}` : ''}</span>
    </div>
    <div class="item-body">
      ${u.remedy ? `<div><div class="field-label">Remedy</div>${inline(u.remedy)}</div>` : ''}
      ${u.tried ? `<div><div class="field-label">Tried</div>${inline(u.tried)}</div>` : ''}
      <div class="actions">${u.evidence.map(fileChip).join('')}<button type="button" class="chip" data-act="copy" data-arg="${esc(u.snippet)}">${icon('copy', 'sm')}Copy for qa.md</button></div>
    </div>
  </div>`;
}

function fold(key, glyph, label, preview, inner) {
  const openNow = isOpen(key);
  return `<button type="button" class="fold" aria-expanded="${openNow}" data-act="toggle" data-arg="${key}">
    ${glyph}<span class="label">${esc(label)}</span><span class="preview">${esc(preview)}</span>${icon('chev', 'chev')}
  </button>${openNow ? inner : ''}`;
}

function group(label, count, inner) {
  return `<div class="group"><h3 class="group-label">${esc(label)}${count ? `<span class="n">${count}</span>` : ''}</h3><div class="box">${inner}</div></div>`;
}

function redesign(s) {
  const open = s.findings.filter((f) => f.state === 'open');
  const fixed = s.findings.filter((f) => f.state === 'fixed');
  const parts = [];
  parts.push(`<div class="sec-head"><h2>Goal QA</h2><span class="verdict tone-${s.tone}"><span class="dot"></span>${esc(s.word)}</span></div>`);
  parts.push(`<p class="sentence">${esc(s.sentence)}</p>`);

  if (open.length) parts.push(group('Needs you', open.length, open.map(findingItem).join('')));
  if (s.left) parts.push(group('Left behind', s.left.length, s.left.map(leftItem).join('')));
  if (s.gaps.length) parts.push(group('Not tested', s.gaps.length, s.gaps.map(gapItem).join('')));
  if (s.unblock?.length) {
    const openChip = '<div class="item-body"><div class="actions"><button type="button" class="chip" data-act="open-qa-md">' + icon('open', 'sm') + 'Open qa.md</button></div></div>';
    parts.push(group('Unblock', s.unblock.length, s.unblock.map(unblockItem).join('') + openChip));
  }

  const folds = [];
  if (fixed.length) {
    folds.push(`<div class="item">${fold('fixed', `<span class="tone-done">${icon('check')}</span>`, `Fixed by QA · ${fixed.length}`, fixed.map((f) => f.title).join(', '), `<div class="sublist">${fixed.map((f) => `<div class="sub"><b>${esc(f.id)} ${esc(f.title)}</b>${inline(f.observed)}<div class="actions">${f.evidence.map(fileChip).join('')}</div></div>`).join('')}</div>`)}</div>`);
  }
  if (s.passed.length) {
    folds.push(`<div class="item">${fold('passed', `<span class="tone-done">${icon('check')}</span>`, `Passed · ${s.passed.length}`, s.passed.map((p) => p.title).join(', '), `<div class="sublist">${s.passed.map((p) => `<div class="sub"><b>${esc(p.title)}</b>${inline(p.detail)}<div class="actions">${p.evidence.map(fileChip).join('')}</div></div>`).join('')}</div>`)}</div>`);
  }
  if (s.runDetails) {
    folds.push(`<div class="item">${fold('details', `<span style="color:var(--fg-faint)">${icon('doc')}</span>`, 'Run details', '', `<div class="report">${inline(s.runDetails)}</div>`)}</div>`);
  }
  if (s.report) {
    const paragraph = s.report.split('\n\n').find((block) => !block.startsWith('Verdict:')) || '';
    const reportInner = `<div class="report">${reportHtml(s.report)}<div class="report-foot actions"><button type="button" class="chip" data-act="evidence" data-arg="${esc((s.real || s.legacy ? RUN : SAMPLE) + 'report.md')}">${icon('open', 'sm')}Open report.md</button></div></div>`;
    if (s.legacy && !isOpen('report')) folds.push(`<div class="item"><div class="report" style="border-top:0">${reportHtml(paragraph)}</div></div>`);
    folds.push(`<div class="item">${fold('report', `<span style="color:var(--fg-faint)">${icon('doc')}</span>`, 'Full report', s.legacy ? 'No tagged checks in this run' : 'Isolation, cleanup and the agent\'s notes', reportInner)}</div>`);
  }
  if (folds.length) parts.push(`<div class="group"><div class="box">${folds.join('')}</div></div>`);

  if (s.targets.length) parts.push(`<div class="quiet">${s.targets.map(([kind, word]) => `<span><b>${esc(kind)}</b> ${esc(word)}</span>`).join('<span>·</span>')}</div>`);
  return chrome(s) + parts.join('');
}

function today(s) {
  const open = s.findings;
  const body = s.report ? reportHtml(s.report) : `<p>${inline(s.runDetails || '')}</p>`;
  return chrome(s) + `
    <div class="sec-head"><h2>Goal QA</h2><span class="tone-faint" style="font-size:var(--t-sm);color:var(--fg-faint)">${esc(s.outcome)}</span><span class="chev">${icon('down', 'sm')}</span></div>
    ${s.legacyLine ? `<p class="muted-line">${esc(s.legacyLine)}</p>` : ''}
    <div class="today">${body}</div>
    ${open.map((f) => `<div class="today-row" style="margin-bottom:6px"><span class="ref">${esc(f.id)}</span>${esc(f.title)}<span class="end"${f.state === 'fixed' ? ' style="color:var(--st-done)"' : ''}>${f.state === 'fixed' ? 'Fixed' : 'Not fixed'}</span></div>`).join('')}`;
}

function notes(s) {
  const scenario = `<section><h2>This scenario</h2><p>${inline(s.why)}</p></section>`;
  if (state.view === 'today') {
    return scenario + `<section><h2>What is wrong with today's card</h2><ul>
      <li><b>It shows the agent's file as the UI.</b> <code>QaReportCard</code> renders the report markdown whole, 4.7K in this run.</li>
      <li><b>Three status words disagree.</b> <code>attempted</code> in the header, <code>findings_open</code> in the text, and "could not fix 1 finding" between them.</li>
      <li><b>The finding comes last.</b> The one thing the header tells you to review sits below Coverage and seven Assertions, with Isolation and Cleanup after it.</li>
      <li><b>Untested work has no signal.</b> "I could not exercise live startup or input" is the fifth Assertions bullet.</li>
      <li><b>11 full evidence paths.</b> Each repeats the same directory of nearly 100 characters, so the filename, the only useful part, wraps onto the next line.</li>
    </ul></section>`;
  }
  return scenario + `
    <section><h2>Reading order</h2><ul>
      <li><b>Verdict and one sentence.</b> The app writes these from counts. The agent's prose never sets them, so they can't drift from the data.</li>
      <li><b>Needs you.</b> Open findings with what was observed. Expected, steps and evidence sit one click down.</li>
      <li><b>Not tested.</b> Same weight as a finding, because an untested area is a risk the operator would otherwise not know about.</li>
      <li><b>Passed.</b> A count and names. Click for details.</li>
      <li><b>Full report.</b> Isolation, cleanup and the agent's notes. Nothing is deleted, it just stops being the first thing you read.</li>
    </ul></section>
    <section><h2>Where each piece comes from</h2>
      <dl class="source">
        <dt>Verdict, sentence</dt><dd>Derived in the app from the fields below</dd>
        <dt>Open or fixed</dt><dd><code>GoalQaFinding.fixed</code> <span class="tag">exists</span></dd>
        <dt>Observed, steps</dt><dd><code>QaReportFinding.section</code> in the runtime. Needs parsing into fields and passing to the desktop <span class="tag new">new</span></dd>
        <dt>Evidence chips</dt><dd><code>evidencePaths</code> in the runtime, one path on the desktop today. <code>OpenQaEvidence</code> is the open action <span class="tag new">new</span></dd>
        <dt>Not tested, passed</dt><dd>Assertions are free prose. The QA prompt has to tag each one as passed, failed or not exercised <span class="tag new">new</span></dd>
        <dt>Targets line</dt><dd><code>QaTargetCoverage</code> in the runtime, missing from <code>GoalQaResult</code> <span class="tag new">new</span></dd>
        <dt>Left behind</dt><dd><code>QaRetainedResource</code> exists. Temporary edits are prose only <span class="tag new">new</span></dd>
      </dl>
    </section>
    <section><h2>Rules worth arguing about</h2><ul>
      <li>A failed assertion doesn't get its own row. "Benchmark completion" and QA-1 say the same thing, so only the finding shows.</li>
      <li>Green requires zero open findings, zero untested items and nothing left behind.</li>
      <li><code>Copy for qa.md</code> gives the operator the exact snippet to paste. <code>Open qa.md</code> opens the repository file the runtime reads, and the desktop app never writes it.</li>
      <li>The same block would replace <code>qaFindingsSection</code> and <code>qaReportSection</code> on standalone QA. Its live checklist stays.</li>
    </ul></section>`;
}

const paneEl = document.getElementById('pane');
const selectEl = document.getElementById('scenario');
const expandEl = document.getElementById('expand');
const toastEl = document.getElementById('toast');
let toastTimer;

function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2400);
}

function render() {
  const s = state.scenario;
  paneEl.innerHTML = state.view === 'new' ? redesign(s) : today(s);
  document.getElementById('notes').innerHTML = notes(s);
  document.getElementById('source').textContent = s.real ? 'Real report from QA run qa-4f7e0edf' : (s.legacy ? 'Real report, recorded before the format change' : 'Sample data');
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  selectEl.value = s.id;
  expandEl.textContent = state.all ? 'Collapse all' : 'Expand all';
  expandEl.style.visibility = state.view === 'new' ? 'visible' : 'hidden';
  history.replaceState(null, '', `#${s.id}/${state.view}${state.all ? '/open' : ''}`);
}

selectEl.innerHTML = SCENARIOS.map((s) => `<option value="${s.id}">${esc(s.label)}</option>`).join('');
selectEl.addEventListener('change', () => {
  state.scenario = SCENARIOS.find((s) => s.id === selectEl.value);
  state.open.clear();
  state.closed.clear();
  paneEl.scrollTop = 0;
  render();
});
expandEl.addEventListener('click', () => {
  state.all = !state.all;
  state.open.clear();
  state.closed.clear();
  render();
});
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  paneEl.scrollTop = 0;
  render();
}));
paneEl.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, arg } = el.dataset;
  if (act === 'toggle') {
    const set = state.all ? state.closed : state.open;
    if (set.has(arg)) set.delete(arg);
    else set.add(arg);
    render();
    const again = paneEl.querySelector(`[data-act="toggle"][data-arg="${arg}"]`);
    if (again) again.focus();
  } else if (act === 'evidence') {
    toast(`Opens ${arg}`);
  } else if (act === 'copy') {
    if (navigator.clipboard) navigator.clipboard.writeText(arg).catch(() => {});
    toast('Copied');
  } else if (act === 'open-qa-md') {
    toast('Opens .skill-bill/phases/qa.md in the default app. The app never writes it.');
  }
});

const [hashId, hashView, hashOpen] = location.hash.slice(1).split('/');
const fromHash = SCENARIOS.find((s) => s.id === hashId);
if (fromHash) state.scenario = fromHash;
if (hashView === 'today') state.view = 'today';
if (hashOpen === 'open') state.all = true;
render();
</script>
</body>
</html>
