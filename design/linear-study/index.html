<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Bill Linear Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<style>
/* Documentation chrome only (top bar, library and foundations pages). Product UI lives in ds/. */
#root { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.doc-bar { display: flex; align-items: center; gap: 10px; height: 44px; flex: none; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--border-subtle); background: var(--bg-frame); }
.doc-bar-ti { font: 600 var(--t-base)/1 var(--font-sans); }
.doc-bar-sub { font-size: var(--t-sm); color: var(--fg-faint); }
.doc-body { flex: 1; min-height: 0; display: flex; }
.doc-body > .sb-app { flex: 1; height: auto; min-width: 0; }
.doc-split { flex: 1; min-width: 0; display: flex; position: relative; }
.doc-index-hd { font: 500 var(--t-xs)/1 var(--font-sans); color: var(--fg-faint); padding: 8px 8px 0; }
.doc-main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); margin: 8px; }
.doc-split > .doc-main { margin-left: 0; }
.doc-inner { max-width: 940px; margin: 0 auto; padding: 36px 40px 80px; }
.doc-intro h1 { margin: 0 0 8px; font: 600 var(--t-2xl)/1.2 var(--font-sans); letter-spacing: -0.015em; }
.doc-intro p { margin: 0; color: var(--fg-muted); max-width: 660px; line-height: 1.6; }
.doc-h2 { margin: 44px 0 14px; font: 600 var(--t-lg)/1.2 var(--font-sans); letter-spacing: -0.01em; }
.doc-h3 { margin: 0; font: 500 var(--t-xs)/1 var(--font-sans); color: var(--fg-faint); }
.doc-p { margin: -4px 0 14px; color: var(--fg-muted); max-width: 680px; line-height: 1.6; }
.doc-card { border: 1px solid var(--border-subtle); border-radius: var(--r-lg); background: var(--bg-panel); margin-bottom: 14px; overflow: hidden; scroll-margin-top: 16px; }
.doc-card-hd { display: flex; flex-direction: column; gap: 8px; padding: 14px 20px; background: var(--bg-raised); border-bottom: 1px solid var(--border-subtle); }
.doc-card-hd p { margin: 0; color: var(--fg-muted); font-size: var(--t-sm); line-height: 1.55; max-width: 680px; }
.doc-name { font: 600 var(--t-base)/1 var(--font-mono); color: var(--accent-text); }
.doc-stage-wrap { padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-x: auto; }
.doc-stage { display: flex; }
.doc-stage .sb-layer { display: none; }
.doc-stage .sb-pop { position: relative; left: auto !important; top: auto !important; animation: none; width: max-content; z-index: auto; }
.doc-stage .sb-modal-layer { position: relative; inset: auto; z-index: auto; padding: 24px 16px; width: 100%; background: var(--bg-inset); border-radius: var(--r-md); animation: none; }
.doc-stage .sb-cmdk, .doc-stage .sb-dialog { animation: none; margin-top: 0; }
.doc-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.doc-swatch { display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); }
.doc-swatch i { grid-row: span 2; width: 30px; height: 30px; border-radius: var(--r-sm); border: 1px solid var(--border); }
.doc-swatch code { font: 500 var(--t-2xs)/1.4 var(--font-mono); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; }
.doc-swatch span { font: 400 10px/1.4 var(--font-mono); color: var(--fg-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-type { display: grid; grid-template-columns: 80px 100px 170px minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 12px 20px; border-top: 1px solid var(--border-subtle); font-size: var(--t-sm); }
.doc-type:first-child { border-top: 0; }
.doc-type code, .doc-space code, .doc-radius code, .doc-status code { font: 500 var(--t-2xs)/1.3 var(--font-mono); color: var(--fg-2); }
.doc-type-s { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.doc-grid2 > .doc-card { padding: 8px 0; margin: 0; }
.doc-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.doc-space { display: grid; grid-template-columns: 60px minmax(0, 1fr) 40px; gap: 12px; align-items: center; padding: 7px 20px; font-size: var(--t-sm); }
.doc-space i { height: 8px; border-radius: 2px; background: var(--accent); display: block; }
.doc-radius { display: grid; grid-template-columns: 32px 72px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 20px; font-size: var(--t-sm); }
.doc-radius i { width: 32px; height: 32px; display: block; border: 1px solid var(--border-strong); background: var(--bg-raised); }
.doc-elev { height: 100px; border-radius: var(--r-lg); display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 14px; font-weight: 500; }
.doc-elev span { font: 400 var(--t-2xs)/1 var(--font-mono); color: var(--fg-faint); }
.doc-status { display: grid; grid-template-columns: 18px 80px 190px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 20px; border-top: 1px solid var(--border-subtle); font-size: var(--t-sm); }
.doc-status:first-child { border-top: 0; }
.doc-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 2px; padding: 10px; }
.doc-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: var(--r-sm); color: var(--fg-2); }
.doc-icon:hover { background: var(--bg-hover); }
.doc-icon code { font: 400 10px/1 var(--font-mono); color: var(--fg-faint); }
.doc-card > .sb-shortcuts { padding: 12px 20px; }
.doc-principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.doc-principle { padding: 16px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); }
.doc-principle b { display: block; font-weight: 500; margin-bottom: 6px; }
.doc-principle p { margin: 0; color: var(--fg-muted); font-size: var(--t-sm); line-height: 1.55; }
@media (max-width: 900px) { .doc-principles, .doc-grid3 { grid-template-columns: 1fr 1fr; } .doc-type { grid-template-columns: 80px minmax(0, 1fr); } .doc-type > span:nth-child(2) { display: none; } }
@media (max-width: 760px) {
  .doc-bar-sub { display: none; }
  .doc-main { margin: 0; border: 0; border-radius: 0; }
  .doc-inner { padding: 24px 16px 64px; }
  .doc-principles, .doc-grid2, .doc-grid3 { grid-template-columns: 1fr; }
  .doc-status { grid-template-columns: 18px minmax(0, 1fr); } .doc-status > span:nth-child(3) { display: none; } .doc-status > span:last-child { grid-column: 2; }
  .doc-type { grid-template-columns: minmax(0, 1fr); gap: 4px; } .doc-type > span:nth-child(3) { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-root"></div>

<script src="ds/components.js"></script>
<script src="app/data.js"></script>
<script src="app/screens.js"></script>
<script src="app/library.js"></script>
<script src="app/main.js"></script>
</body>
</html>
