<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specs panel: how Linear would organize it</title>
<!-- Design reference only. Colors, type and spacing come from the Linear study tokens, which match SkillBillColors. Run verdicts follow SpecBundleControlPolicy.kt. All data is sample data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../linear-study/ds/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }
  .ico.fill { fill: currentColor; }
  :focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); font-size: var(--t-sm); display: flex; align-items: center; gap: 6px; }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .pick-tag { font-size: var(--t-2xs); color: var(--accent-text); }
  .scenario { display: flex; align-items: center; gap: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .scenario select { height: 30px; padding: 0 var(--sp-2); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); }
  .hint-keys { color: var(--fg-faint); font-size: var(--t-sm); }

  .stage { flex: 1; min-height: 0; display: flex; gap: var(--sp-4); padding: var(--sp-3) var(--sp-4) var(--sp-4); overflow: auto; }
  .column { flex: none; width: 400px; min-height: 640px; display: flex; flex-direction: column; gap: 6px; }
  .column-label { flex: none; font-size: var(--t-xs); font-weight: 500; color: var(--fg-faint); }
  .notes { flex: 1 1 340px; min-width: 320px; max-width: 460px; min-height: 640px; overflow: auto; padding: 18px var(--sp-1) 0; font-size: var(--t-sm); color: var(--fg-muted); }
  .notes h2 { margin: 0 0 var(--sp-2); font-size: var(--t-sm); font-weight: 500; color: var(--fg); }
  .notes section + section { margin-top: var(--sp-5); }
  .notes ul { margin: 0; padding: 0 0 0 var(--sp-4); display: flex; flex-direction: column; gap: 6px; }
  .notes p { margin: 0 0 var(--sp-2); }
  .notes b { color: var(--fg-2); font-weight: 500; }
  .notes code { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-2); }

  /* Pane */
  .pane { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .head { flex: none; height: var(--header-h); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2) 0 var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
  .head h1 { margin: 0; font-size: var(--t-base); font-weight: 500; }
  .spacer { flex: 1; min-width: 0; }
  .picker { height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 var(--sp-2); background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--fg-2); font-size: var(--t-sm); font-weight: 500; }
  .picker:hover { background: var(--bg-hover); color: var(--fg); }
  .picker .chev { color: var(--fg-faint); }
  .repo { width: 16px; height: 16px; border-radius: var(--r-xs); display: grid; place-items: center; background: var(--bg-active); color: var(--fg-2); font-size: var(--t-2xs); font-weight: 600; }
  .iconbtn { flex: none; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; background: transparent; border: 0; border-radius: var(--r-sm); color: var(--fg-muted); }
  .iconbtn:hover, .iconbtn[aria-expanded="true"] { background: var(--bg-active); color: var(--fg); }
  .iconbtn.on { color: var(--accent); }
  .iconbtn.sm { width: 22px; height: 22px; }

  .btn { flex: none; height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-sm); font-size: var(--t-sm); font-weight: 500; white-space: nowrap; background: var(--bg-raised); border: 1px solid var(--border); color: var(--fg-2); }
  .btn:hover:not(:disabled) { background: var(--bg-overlay); color: var(--fg); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
  .btn.danger { background: transparent; color: var(--st-failed); }
  .btn.danger-solid { background: var(--st-failed); border-color: var(--st-failed); color: #16080A; }
  .btn.danger-solid:hover:not(:disabled) { background: #F4777C; border-color: #F4777C; color: #16080A; }
  .btn:disabled { color: var(--fg-faint); background: transparent; border-color: var(--border-subtle); cursor: default; }
  .btn.danger:disabled { color: rgba(240, 85, 91, 0.45); }

  .status-word { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: var(--fg-muted); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-faint); }
  .count { font-size: var(--t-xs); color: var(--fg-faint); font-variant-numeric: tabular-nums; }

  /* List rows */
  .list { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--sp-1) 0; outline: none; }
  .row { position: relative; height: 32px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3) 0 var(--sp-2); cursor: default; outline: none; }
  .row:hover { background: var(--bg-hover); }
  .row.selected { background: var(--bg-active); }
  .row.selected::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .row:focus-visible { box-shadow: inset 0 0 0 1px var(--accent-ring); }
  .row.child { padding-left: 32px; color: var(--fg-muted); }
  .row.file .title { font-family: var(--font-mono); font-size: var(--t-sm); font-weight: 400; }
  .row.muted .title, .row.muted .key { color: var(--fg-faint); }
  .twist { flex: none; width: 16px; height: 16px; display: grid; place-items: center; padding: 0; background: transparent; border: 0; border-radius: var(--r-xs); color: var(--fg-faint); }
  .twist:hover { color: var(--fg); background: var(--bg-active); }
  .twist.open svg { transform: rotate(90deg); }
  .key { flex: none; font: 400 var(--t-sm) var(--font-mono); color: var(--fg-muted); }
  .title { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
  .row.child .title { font-weight: 400; }
  .row-star { color: var(--accent); }
  .trail { flex: none; display: flex; align-items: center; gap: 2px; min-width: 22px; justify-content: flex-end; }
  .trail .hover-only { display: none; }
  .row:hover .trail .hover-only, .row:focus-within .trail .hover-only, .row.selected .trail .hover-only { display: grid; }
  .row:hover .trail .count, .row:focus-within .trail .count, .row.selected .trail .count { display: none; }

  /* Today: sections as SpecRunToolbar and SpecsPane draw them */
  .toolbar { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
  .toolbar .id-line { display: flex; align-items: center; gap: var(--sp-2); min-height: 22px; }
  .toolbar .id-line .title { font-size: var(--t-sm); }
  .flow { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .tool-hint { font-size: var(--t-sm); color: var(--fg-faint); }
  .callout { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2) 10px; border: 1px solid rgba(240, 85, 91, 0.35); border-radius: var(--r-sm); font-size: var(--t-sm); color: var(--fg-2); }
  .callout div { display: flex; justify-content: flex-end; gap: var(--sp-2); }
  .filters { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: 10px var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
  .input { height: 30px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 10px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--fg-faint); }
  .input:focus-within { border-color: var(--accent-ring); }
  .input input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: var(--fg); }
  .input input::placeholder { color: var(--fg-faint); }
  .seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--r-sm); }
  .seg button { height: 24px; padding: 0 var(--sp-2); background: transparent; border: 0; border-radius: var(--r-xs); color: var(--fg-muted); font-size: var(--t-sm); }
  .seg button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .foot { flex: none; display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4); border-top: 1px solid var(--border-subtle); font: 400 var(--t-2xs) var(--font-mono); color: var(--fg-faint); }
  .foot span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .foot .btn { font-family: var(--font-sans); }

  /* Proposal: filter row */
  .tabs { flex: none; height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 var(--sp-2) 0 10px; border-bottom: 1px solid var(--border-subtle); }
  .tab { height: 26px; padding: 0 var(--sp-2); display: flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); font-weight: 500; }
  .tab:hover { color: var(--fg); background: var(--bg-hover); }
  .tab[aria-pressed="true"] { color: var(--fg); background: var(--bg-active); }
  .tab .count { font-weight: 400; }
  .tabs .search { flex: 1; display: flex; align-items: center; gap: var(--sp-2); padding-left: 6px; color: var(--fg-faint); height: 100%; }
  .tabs .search input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: var(--fg); }
  .tabs .search input::placeholder { color: var(--fg-faint); }

  /* Proposal A: selection bar */
  .bar { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: 10px var(--sp-3) var(--sp-3) var(--sp-4); background: var(--bg-raised); border-top: 1px solid var(--border); }
  .bar .line { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
  .bar .title { font-size: var(--t-base); }
  .bar .sep { color: var(--border-strong); }
  .bar-note { font-size: var(--t-xs); color: var(--fg-muted); }
  .bar-note.error { color: var(--st-blocked); }
  .pill { height: 26px; min-width: 0; padding: 0 var(--sp-2) 0 9px; display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--border); border-radius: var(--r-full); color: var(--fg-2); font-size: var(--t-sm); }
  .pill:hover { background: var(--bg-hover); border-color: var(--border-strong); color: var(--fg); }
  .pill[aria-expanded="true"] { background: var(--bg-active); border-color: var(--border-strong); }
  .pill.need { color: var(--fg-muted); }
  .pill .chev { color: var(--fg-faint); }
  .pill.static { cursor: default; padding-right: 10px; color: var(--fg-muted); }
  .pill.static:hover { background: transparent; border-color: var(--border); color: var(--fg-muted); }
  .avatar { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; font-size: 8.5px; font-weight: 600; color: var(--accent-fg); }
  @media (prefers-reduced-motion: no-preference) {
    .bar.enter { animation: rise var(--dur) var(--ease); }
    @keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
  }

  /* Proposal C: detail view */
  .detail { flex: 1; min-height: 0; overflow: auto; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
  .detail h2 { margin: 0; font-size: var(--t-lg); font-weight: 500; letter-spacing: -0.005em; }
  .props { display: flex; flex-direction: column; }
  .prop { min-height: 28px; display: flex; align-items: center; font-size: var(--t-sm); }
  .prop > span:first-child { flex: none; width: var(--prop-label-w); color: var(--fg-faint); }
  .prop .mono { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sub-head { font-size: var(--t-sm); font-weight: 500; color: var(--fg-muted); display: flex; justify-content: space-between; margin-bottom: var(--sp-1); }
  .detail .row { height: 28px; margin: 0 calc(var(--sp-4) * -1); padding: 0 var(--sp-4); }
  .detail .row.child { padding-left: var(--sp-4); }
  .bar-actions { display: flex; align-items: center; gap: var(--sp-2); }

  /* Menu */
  #overlay:empty { display: none; }
  .menu { position: fixed; z-index: 30; width: 244px; max-height: calc(100vh - 16px); overflow: auto; padding: var(--sp-1); background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-pop); outline: none; }
  .menu-head { padding: 6px var(--sp-2) var(--sp-1); font-size: var(--t-2xs); font-weight: 500; color: var(--fg-faint); }
  .menu hr { height: 1px; margin: var(--sp-1) calc(var(--sp-1) * -1); border: 0; background: var(--border-subtle); }
  .item { width: 100%; min-height: 28px; display: grid; grid-template-columns: 16px 1fr auto; column-gap: var(--sp-2); align-items: center; padding: 5px var(--sp-2); background: transparent; border: 0; border-radius: var(--r-sm); color: var(--fg-2); font-size: var(--t-sm); text-align: left; }
  .item:focus { background: var(--bg-active); color: var(--fg); outline: none; }
  .item.danger { color: var(--st-failed); }
  .item.danger:focus { background: rgba(240, 85, 91, 0.12); color: #F4777C; }
  .item:disabled { color: var(--fg-faint); cursor: default; }
  .item .kbd { font-size: var(--t-2xs); color: var(--fg-faint); }
  .item .reason { grid-column: 2 / -1; font-size: var(--t-2xs); line-height: 1.3; color: var(--fg-faint); }
  .item .path { grid-column: 2 / -1; font: 400 var(--t-2xs)/1.3 var(--font-mono); color: var(--fg-faint); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .item .tick { color: var(--accent); }

  /* Dialog */
  .scrim { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--scrim); }
  .dialog { width: 440px; max-width: calc(100vw - 32px); padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-modal); font-size: var(--t-sm); color: var(--fg-muted); }
  .dialog h2 { margin: 0; display: flex; align-items: center; gap: var(--sp-2); font-size: var(--t-md); font-weight: 500; color: var(--fg); }
  .dialog p { margin: 0; }
  .dialog .mono { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-2); word-break: break-all; }
  .ledger { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .ledger b { display: block; margin-bottom: var(--sp-1); color: var(--fg-2); font-weight: 500; }
  .ledger ul { margin: 0; padding-left: var(--sp-4); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-1); }

  .toast { position: fixed; z-index: 50; left: 50%; bottom: var(--sp-5); transform: translateX(-50%); padding: 6px var(--sp-3); background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-sm); box-shadow: var(--shadow-pop); font-size: var(--t-sm); color: var(--fg-2); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="chrome">
  <div class="designs" id="designs" role="group" aria-label="Design"></div>
  <label class="scenario">Selected spec's state
    <select id="scenario"></select>
  </label>
  <span class="hint-keys">Right-click a row. Keys when no input has focus: J K, ↵, R, P, A, F, /, esc.</span>
</div>
<div class="stage">
  <div class="column"><div class="column-label">Today, built from SpecRunToolbar.kt</div><div class="pane" id="current"></div></div>
  <div class="column"><div class="column-label" id="proposal-label"></div><div class="pane" id="proposal"></div></div>
  <aside class="notes" id="notes"></aside>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Lucide outlines, drawn at 24 units */
const PATHS = {
  play: '<path d="M6 3l14 9-14 9V3z"/>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
  reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
  bot: '<path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  up: '<path d="M18 15l-6-6-6 6"/>',
  right: '<path d="M9 18l6-6-6-6"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  folder: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/>',
  copy: '<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  collapse: '<path d="M7 20l5-5 5 5M7 4l5 5 5-5"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
};
const icon = (name, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[name]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const STORE = '.feature-specs';
const FULL_STORE = '/home/you/IdeaProjects/SkillBill/.feature-specs';
const AGENTS = ['claude', 'codex', 'junie', 'cursor'];

const RUN = {
  NotStarted: { word: 'Not started', low: 'not started', dot: '--st-pending', group: 'pending' },
  Running: { word: 'Running', low: 'running', dot: '--st-active', group: 'active' },
  PauseRequested: { word: 'Pausing', low: 'pausing', dot: '--st-pending', group: 'active' },
  Paused: { word: 'Paused', low: 'paused', dot: '--st-blocked', group: 'active' },
  Blocked: { word: 'Blocked', low: 'blocked', dot: '--st-blocked', group: 'active' },
  Canceled: { word: 'Canceled', low: 'canceled', dot: '--st-pending', group: 'done' },
  Complete: { word: 'Complete', low: 'complete', dot: '--st-done', group: 'done' },
  Unavailable: { word: 'Unavailable', low: 'unavailable', dot: '--st-pending', group: 'pending' },
};

const specs = [
  { key: 'SKILL-471', title: 'Favourite spec bundles in the sidebar', run: 'Running', ever: true, agent: 'claude', fav: true, done: 2, subs: ['persist-favorites', 'toolbar-toggle', 'sidebar-section', 'reorder', 'telemetry'] },
  { key: 'SKILL-468', title: 'Goal worktree cleanup after merge', run: 'Paused', ever: true, agent: 'codex', done: 1, subs: ['detect-merged-branch', 'remove-worktree', 'prune-refs'] },
  { key: 'SKILL-451', title: 'Linear progress sync through the connector', run: 'NotStarted', subs: [] },

const state = {
  design: 'a',
  sel: 'SKILL-482',
  child: null,
  detail: null,
  filter: 'all',
  q: '',
  searchOpen: false,
  exp: new Set(),
  menu: null,
  dialog: null,
  confirmingCancel: false,
  barEnter: false,
};

const spec = (key) => specs.find((s) => s.key === key);
const selected = () => spec(state.sel);
const isLive = (s) => s.run === 'Running' || s.run === 'PauseRequested';

/* SpecBundleControlPolicy.kt, as far as this page needs it */
function verdict(s) {
  const v = { canStart: false, startLabel: 'Start', canPause: false, pauseRequested: false, canCancel: false, purgeVisible: !!s.ever && s.run !== 'Unavailable', canPurge: !!s.ever && !isLive(s), canDelete: !isLive(s), reason: null };
  switch (s.run) {
    case 'NotStarted': v.canStart = true; break;
    case 'Running': v.canPause = true; v.canCancel = true; break;
    case 'PauseRequested': v.pauseRequested = true; v.canCancel = true; break;
    case 'Paused': case 'Blocked': v.canStart = true; v.startLabel = 'Resume'; v.canCancel = true; break;
    case 'Canceled': v.canStart = true; v.startLabel = 'Run again'; break;
    case 'Unavailable': v.reason = 'Run controls are unavailable: the runtime could not read this goal.'; break;
  }
  return v;
}

const progress = (s) => (s.subs.length ? `${s.done ?? 0}/${s.subs.length}` : '');
const avatar = (a) => `<span class="avatar" style="background:var(--data-${AGENTS.indexOf(a) + 1})">${esc(a[0].toUpperCase())}</span>`;
const specSlug = (s) => s.key.toLowerCase();

function statusIcon(run, cls = '') {
  const svg = (color, inner) => `<svg class="ico ${cls}" viewBox="0 0 14 14" style="color:var(${color});stroke-width:1.4" aria-hidden="true">${inner}</svg>`;
  const ring = '<circle cx="7" cy="7" r="5.5"/>';
  switch (run) {
    case 'Running': return svg('--st-active', `${ring}<path d="M7 3.5a3.5 3.5 0 0 1 0 7z" fill="currentColor" stroke="none"/>`);
    case 'PauseRequested': return svg('--st-paused', `${ring}<path d="M7 3.5a3.5 3.5 0 0 1 0 7z" fill="currentColor" stroke="none"/>`);
    case 'Paused': return svg('--st-blocked', `${ring}<path d="M5.5 5v4M8.5 5v4"/>`);
    case 'Blocked': return svg('--st-blocked', `${ring}<path d="M7 4.2v3.3M7 9.8v.01"/>`);
    case 'Canceled': return svg('--st-pending', `${ring}<path d="M5 5l4 4M9 5l-4 4"/>`);
    case 'Complete': return svg('--st-done', `<circle cx="7" cy="7" r="6" fill="currentColor" stroke="none"/><path d="M4.4 7.2l1.8 1.8 3.4-3.8" stroke="#111114"/>`);
    case 'Unavailable': return svg('--st-pending', '<circle cx="7" cy="7" r="5.5" stroke-dasharray="2 2"/>');
    default: return svg('--st-pending', ring);
  }
}

function subRun(s, i) {
  if (i < (s.done ?? 0)) return 'Complete';
  if (i === (s.done ?? 0)) {
    if (s.run === 'Running' || s.run === 'PauseRequested' || s.run === 'Paused' || s.run === 'Blocked') return s.run;
    if (s.run === 'Canceled') return 'Canceled';
  }
  return 'NotStarted';
}

function visibleSpecs() {
  const needle = state.q.trim().toLowerCase();
  return specs.filter((s) => (state.filter === 'all' || RUN[s.run].group === state.filter) && (!needle || s.key.toLowerCase().includes(needle) || s.title.toLowerCase().includes(needle)));
}

const countFor = (f) => specs.filter((s) => f === 'all' || RUN[s.run].group === f).length;

/* Rows */
function childRows(s, pane, opts = {}) {
  const padded = (i) => String(i + 1).padStart(2, '0');
  const subs = s.subs.map((name, i) => {
    const id = `${s.key}/${padded(i)}`;
    return `<div class="row child ${state.child === id ? 'selected' : ''}" role="treeitem" tabindex="-1" data-act="select-child" data-key="${s.key}" data-child="${id}" data-fk="${pane}:row:${id}">
      ${statusIcon(subRun(s, i))}<span class="key">${padded(i)}</span><span class="title">${esc(name)}</span></div>`;
  });
  const parent = `${s.key}/spec`;
  const file = `<div class="row child file ${state.child === parent ? 'selected' : ''}" role="treeitem" tabindex="-1" data-act="select-child" data-key="${s.key}" data-child="${parent}" data-fk="${pane}:row:${parent}">
    ${icon('file')}<span class="title">spec.md</span></div>`;
  return opts.subsOnly ? subs.join('') : file + subs.join('');
}

function rows(pane, trail) {
  const list = visibleSpecs();
  if (!list.length) {
    return `<div class="tool-hint" style="padding:var(--sp-5) var(--sp-4)">No specs match. <button class="btn ghost" data-act="clear-filters">Clear filters</button></div>`;
  }
  const tabStop = list.some((s) => s.key === state.sel) ? state.sel : list[0].key;
  return list.map((s) => {
    const open = state.exp.has(s.key);
    const isSel = state.sel === s.key && !state.child;
    return `<div class="row ${isSel ? 'selected' : ''} ${s.run === 'Canceled' ? 'muted' : ''}" role="treeitem" aria-selected="${isSel}" aria-expanded="${open}" tabindex="${tabStop === s.key ? 0 : -1}" data-act="select" data-key="${s.key}" data-fk="${pane}:row:${s.key}">
      <button class="twist ${open ? 'open' : ''}" data-act="toggle" data-key="${s.key}" aria-label="${open ? 'Collapse' : 'Expand'} ${s.key}" tabindex="-1">${icon('right', 'sm')}</button>
      ${statusIcon(s.run)}<span class="key">${s.key}</span><span class="title" title="${esc(s.title)}">${esc(s.title)}</span>
      ${trail(s)}
    </div>${open ? childRows(s, pane) : ''}`;
  }).join('');
}

const moreButton = (s) => `<button class="iconbtn sm hover-only" data-act="open-spec-menu" data-key="${s.key}" aria-label="${s.key} actions" aria-haspopup="menu" title="Actions" tabindex="-1">${icon('more')}</button>`;

/* Today's pane */
function renderCurrent() {
  const s = selected();
  const fileSelected = state.child !== null;
  let toolbar;
  if (!s) toolbar = '<div class="tool-hint">Select a spec folder to start, pause or cancel it.</div>';
  else if (fileSelected) toolbar = `<div class="tool-hint">Actions run a whole spec folder, not one subtask. Select ${s.key} to control it.</div>`;
  else {
    const v = verdict(s);
    toolbar = `
      <div class="id-line"><span class="key">${s.key}</span><span class="title">${esc(s.title)}</span>
        <span class="status-word"><span class="dot" style="background:var(${RUN[s.run].dot})"></span>${RUN[s.run].low}</span>
        <button class="iconbtn sm ${s.fav ? 'on' : ''}" data-act="favorite" data-fk="c:star" aria-label="${s.fav ? 'Remove favorite' : 'Add favorite'}" title="${s.fav ? 'Remove favorite' : 'Add favorite'}">${icon('star', s.fav ? 'fill' : '')}</button></div>
      <div class="flow">
        <button class="btn ${v.canStart ? 'primary' : ''}" data-act="start" data-fk="c:start" ${v.canStart ? '' : 'disabled'}>${icon('play')}${v.startLabel}</button>
        <button class="btn" data-act="open-agent-menu" data-fk="c:agent" ${v.canStart ? '' : 'disabled'}>${icon('bot')}${s.agent ? `Agent: ${esc(s.agent)}` : 'Choose agent'}</button>
        <button class="btn" data-act="pause" data-fk="c:pause" ${v.canPause ? '' : 'disabled'}>${icon('pause')}${v.pauseRequested ? 'Pause requested' : 'Pause'}</button>
        <button class="btn danger" data-act="current-cancel" data-fk="c:cancel" ${v.canCancel ? '' : 'disabled'}>${icon('x')}Cancel</button>
        ${v.purgeVisible ? `<button class="iconbtn" data-act="${v.canPurge ? 'ask-purge' : 'noop'}" data-fk="c:purge" aria-label="${v.canPurge ? `Purge ${s.key} run history` : 'Pause or cancel the goal before purging'}" title="${v.canPurge ? `Purge ${s.key} run history` : 'Pause or cancel the goal before purging'}">${icon('trash')}</button>` : ''}
      </div>
      ${v.reason ? `<div class="tool-hint" style="color:var(--st-failed)">${esc(v.reason)}</div>` : ''}
      ${state.confirmingCancel ? `<div class="callout">Cancel ${s.key}? The run stops and the goal is marked canceled. Its branch and commits stay.<div><button class="btn" data-act="current-keep" data-fk="c:keep">Keep running</button><button class="btn danger-solid" data-act="confirm-cancel" data-fk="c:confirm">Cancel goal</button></div></div>` : ''}
      ${v.pauseRequested ? '<div class="tool-hint" style="color:var(--st-planning)">Pause recorded. The goal stops after its current subtask.</div>' : ''}`;
  }
  const seg = ['all', 'active', 'pending', 'done'].map((f) => `<button data-act="filter" data-f="${f}" data-fk="c:seg:${f}" aria-pressed="${state.filter === f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('');
  document.getElementById('current').innerHTML = `
    <div class="head"><h1>Specs</h1>
      <button class="picker" data-act="open-project-menu" data-fk="c:picker"><span class="repo">S</span>SkillBill${icon('down', 'sm chev')}</button>
      <span class="spacer"></span>
      <button class="iconbtn" data-act="collapse-all" data-fk="c:collapse" aria-label="Collapse all" title="Collapse all">${icon('up')}</button>
      <button class="iconbtn" data-act="noop" aria-label="Close specs pane" title="Close specs pane">${icon('x')}</button></div>
    <div class="toolbar">${toolbar}</div>
    <div class="filters">
      <label class="input">${icon('search')}<span class="sr-only">Filter</span><input data-input="q" data-fk="c:filter" placeholder="Filter by key, title or file" value="${esc(state.q)}"></label>
      <div class="seg">${seg}</div>
    </div>
    <div class="list" role="tree" aria-label="Specs, today" data-pane="c">${rows('c', (s) => `<span class="trail"><span class="count">${progress(s)}</span></span>`)}</div>
    <div class="foot"><span>${STORE}</span><button class="btn ghost" data-act="reveal-store">Reveal</button></div>`;
}

/* Proposal pieces */
function proposalHead(extra = '') {
  return `<div class="head"><h1>Specs</h1>
    <button class="picker" data-act="open-project-menu" data-fk="p:picker" aria-haspopup="menu"><span class="repo">S</span>SkillBill${icon('down', 'sm chev')}</button>
    <span class="spacer"></span>${extra}
    <button class="iconbtn" data-act="open-panel-menu" data-fk="p:panel-menu" aria-label="Panel actions" aria-haspopup="menu" title="Panel actions">${icon('more')}</button>
    <button class="iconbtn" data-act="noop" aria-label="Close specs pane" title="Close specs pane">${icon('x')}</button></div>`;
}

function tabsRow() {
  if (state.searchOpen) {
    return `<div class="tabs"><label class="search">${icon('search')}<span class="sr-only">Filter</span><input data-input="q" data-fk="p:filter" placeholder="Filter by key, title or file" value="${esc(state.q)}"></label>
      <button class="iconbtn" data-act="close-search" data-fk="p:close-search" aria-label="Close filter" title="Close filter (esc)">${icon('x')}</button></div>`;
  }
  const tabs = ['all', 'active', 'pending', 'done'].map((f) => `<button class="tab" data-act="filter" data-f="${f}" data-fk="p:tab:${f}" aria-pressed="${state.filter === f}">${f[0].toUpperCase() + f.slice(1)}<span class="count">${countFor(f)}</span></button>`).join('');
  return `<div class="tabs">${tabs}<span class="spacer"></span>
    <button class="iconbtn ${state.q ? 'on' : ''}" data-act="open-search" data-fk="p:open-search" aria-label="Filter by key, title or file" title="Filter (/)">${icon('search')}</button></div>`;
}

function primaryAction(s, fkPrefix = 'p') {
  const v = verdict(s);
  if (v.canStart) return `<button class="btn primary" data-act="start" data-fk="${fkPrefix}:primary" title="${v.startLabel} (R)">${icon('play')}${v.startLabel}</button>`;
  if (v.canPause) return `<button class="btn" data-act="pause" data-fk="${fkPrefix}:primary" title="Pause after subtask (P)">${icon('pause')}Pause</button>`;
  return '';
}

function agentControl(s) {
  const v = verdict(s);
  if (v.canStart) {
    return `<button class="pill ${s.agent ? '' : 'need'}" data-act="open-agent-menu" data-fk="p:agent" aria-haspopup="menu" title="Agent (A)">${s.agent ? avatar(s.agent) + esc(s.agent) : icon('bot') + 'Choose agent'}${icon('down', 'sm chev')}</button>`;
  }
  return s.agent ? `<span class="pill static" title="Agent">${avatar(s.agent)}${esc(s.agent)}</span>` : '';
}

const statusPill = (s) => `<span class="pill static" title="Status">${statusIcon(s.run, 'sm')}${RUN[s.run].word}</span>`;

function noteFor(s) {
  const v = verdict(s);
  if (v.reason) return `<div class="bar-note error">${esc(v.reason)}</div>`;
  if (v.pauseRequested) return '<div class="bar-note">Pause recorded. The goal stops after its current subtask.</div>';
  return '';
}

function renderA() {
  const s = selected();
  const bar = s ? `
    <div class="bar ${state.barEnter ? 'enter' : ''}" role="region" aria-label="${s.key} controls">
      <div class="line"><span class="key">${s.key}</span><span class="title" title="${esc(s.title)}">${esc(s.title)}</span>
        ${progress(s) ? `<span class="count">${progress(s)}</span>` : ''}
        <button class="iconbtn sm ${s.fav ? 'on' : ''}" data-act="favorite" data-fk="p:star" aria-label="${s.fav ? 'Remove favorite' : 'Add favorite'}" title="${s.fav ? 'Remove favorite' : 'Add favorite'} (F)">${icon('star', s.fav ? 'fill' : '')}</button></div>
      <div class="line">${statusPill(s)}${agentControl(s)}<span class="spacer"></span>
        <button class="iconbtn" data-act="open-spec-menu" data-key="${s.key}" data-fk="p:spec-menu" aria-label="${s.key} actions" aria-haspopup="menu" title="Actions">${icon('more')}</button>
        ${primaryAction(s)}</div>
      ${noteFor(s)}
    </div>` : '';
  return `${proposalHead()}${tabsRow()}
    <div class="list" role="tree" aria-label="Specs" data-pane="p">${rows('p', (x) => `<span class="trail"><span class="count">${progress(x)}</span>${moreButton(x)}</span>`)}</div>${bar}`;
}

function renderB() {
  const trail = (x) => {
    const v = verdict(x);
    const quick = v.canStart
      ? `<button class="iconbtn sm hover-only" data-act="start" data-key="${x.key}" aria-label="${v.startLabel} ${x.key}" title="${v.startLabel} (R)" tabindex="-1">${icon('play')}</button>`
      : v.canPause
        ? `<button class="iconbtn sm hover-only" data-act="pause" data-key="${x.key}" aria-label="Pause ${x.key}" title="Pause after subtask (P)" tabindex="-1">${icon('pause')}</button>`
        : '';
    return `<span class="trail"><span class="count">${progress(x)}</span>${quick}${moreButton(x)}</span>`;
  };
  return `${proposalHead()}${tabsRow()}<div class="list" role="tree" aria-label="Specs" data-pane="p">${rows('p', trail)}</div>`;
}

function renderC() {
  const s = spec(state.detail);
  if (!s) {
    return `${proposalHead()}${tabsRow()}
      <div class="list" role="tree" aria-label="Specs" data-pane="p">${rows('p', (x) => `<span class="trail"><span class="count">${progress(x)}</span>${moreButton(x)}</span>`)}</div>`;
  }
  const primary = primaryAction(s);
  return `
    <div class="head" style="padding-left:var(--sp-2)">
      <button class="iconbtn" data-act="back" data-fk="p:back" aria-label="Back to specs" title="Back (esc)">${icon('back')}</button>
      <span class="key">${s.key}</span><span class="spacer"></span>
      <button class="iconbtn ${s.fav ? 'on' : ''}" data-act="favorite" data-fk="p:star" aria-label="${s.fav ? 'Remove favorite' : 'Add favorite'}" title="${s.fav ? 'Remove favorite' : 'Add favorite'} (F)">${icon('star', s.fav ? 'fill' : '')}</button>
      <button class="iconbtn" data-act="open-spec-menu" data-key="${s.key}" data-fk="p:spec-menu" aria-label="${s.key} actions" aria-haspopup="menu" title="Actions">${icon('more')}</button>
      <button class="iconbtn" data-act="noop" aria-label="Close specs pane" title="Close specs pane">${icon('x')}</button>
    </div>
    <div class="detail">
      <h2>${esc(s.title)}</h2>
      ${primary ? `<div class="bar-actions">${primary}</div>` : ''}
      ${noteFor(s)}
      <div class="props">
        <div class="prop"><span>Status</span>${statusPill(s)}</div>
        <div class="prop"><span>Agent</span>${agentControl(s) || '<span class="count">None</span>'}</div>
        <div class="prop"><span>Progress</span><span class="count">${progress(s) || 'No subtasks'}</span></div>
        <div class="prop"><span>Folder</span><span class="mono">${STORE}/${specSlug(s)}</span></div>
      </div>
      <div>
        <div class="sub-head"><span>Subtasks</span><span class="count">${progress(s)}</span></div>
        ${s.subs.length ? childRows(s, 'p', { subsOnly: true }) : '<div class="tool-hint">This spec has no subtasks.</div>'}
      </div>
      <div>
        <div class="sub-head"><span>Files</span></div>
        <div class="row child file" role="treeitem" tabindex="-1" data-act="open-file" data-fk="p:file">${icon('file')}<span class="title">spec.md</span></div>
      </div>
    </div>`;
}

const DESIGNS = {
  a: { label: 'A: selection bar', pick: true, render: renderA },
  b: { label: 'B: row actions', render: renderB },
  c: { label: 'C: detail view', render: renderC },
};

/* Menus */
function specMenuEntries(s) {
  const v = verdict(s);
  const run = [];
  if (v.canStart) run.push({ label: v.startLabel, icon: 'play', act: 'start', shortcut: 'R' });
  if (v.canPause) run.push({ label: 'Pause after subtask', icon: 'pause', act: 'pause', shortcut: 'P' });
  if (v.pauseRequested) run.push({ label: 'Pause requested', icon: 'pause', disabled: true });
  if (v.canStart) run.push({ label: s.agent ? `Change agent, now ${s.agent}` : 'Choose agent', icon: 'bot', act: 'open-agent-menu', shortcut: 'A' });
  const danger = [];
  if (v.canCancel) danger.push({ label: 'Cancel goal…', icon: 'x', act: 'ask-cancel', danger: true });
  if (v.purgeVisible) danger.push({ label: 'Purge run history…', icon: 'reset', act: 'ask-purge', danger: true, disabled: !v.canPurge, reason: v.canPurge ? null : 'Pause or cancel the goal first' });
  danger.push({ label: 'Delete spec files…', icon: 'trash', act: 'ask-delete', danger: true, disabled: !v.canDelete, reason: v.canDelete ? null : 'Pause or cancel the goal first' });
  const out = [
    { label: 'Open spec', icon: 'file', act: 'open-file', shortcut: '↵' },
    { label: 'Reveal folder', icon: 'folder', act: 'reveal-spec' },
    { label: 'Copy key', icon: 'copy', act: 'copy-key' },
    { label: s.fav ? 'Remove favorite' : 'Add favorite', icon: 'star', act: 'favorite', shortcut: 'F' },
  ];
  if (run.length) out.push({ sep: true }, ...run);
  out.push({ sep: true }, ...danger);
  return out;
}

function menuEntries(m) {
  const s = m.key ? spec(m.key) : selected();
  switch (m.kind) {
    case 'spec': return specMenuEntries(s);
    case 'row-today': return [{ label: 'Delete spec files…', icon: 'trash', act: 'ask-delete', danger: true }];
    case 'agent': return [{ head: 'Run on' }, ...AGENTS.map((a) => ({ label: a, lead: avatar(a), act: 'choose-agent', agent: a, checked: s.agent === a }))];
    case 'project': return [{ head: 'Choose project' }, { label: 'SkillBill', lead: '<span class="repo">S</span>', act: 'noop', checked: true }, { label: 'runwell-android', lead: '<span class="repo">R</span>', act: 'noop' }];
    case 'panel': return [
      { label: 'Collapse all', icon: 'collapse', act: 'collapse-all' },
      { label: 'Reveal specs folder', icon: 'folder', act: 'reveal-store', path: STORE },
    ];
    default: return [];
  }
}

function renderMenu() {
  const m = state.menu;
  const items = menuEntries(m).map((e) => {
    if (e.sep) return '<hr>';
    if (e.head) return `<div class="menu-head">${esc(e.head)}</div>`;
    return `<button class="item ${e.danger ? 'danger' : ''}" role="menuitem" tabindex="-1" ${e.disabled ? 'disabled' : ''} data-act="${e.act || 'noop'}" ${m.key ? `data-key="${m.key}"` : ''} ${e.agent ? `data-agent="${e.agent}"` : ''} ${e.shortcut ? `data-shortcut="${e.shortcut.toLowerCase()}"` : ''}>
      ${e.lead || (e.icon ? icon(e.icon) : '<span></span>')}<span>${esc(e.label)}</span>
      ${e.checked ? `<span class="tick">${icon('check')}</span>` : e.shortcut ? `<span class="kbd">${e.shortcut}</span>` : '<span></span>'}
      ${e.reason ? `<span class="reason">${esc(e.reason)}</span>` : ''}${e.path ? `<span class="path">${esc(e.path)}</span>` : ''}
    </button>`;
  }).join('');
  return `<div class="menu" role="menu" tabindex="-1" id="menu">${items}</div>`;
}

function placeMenu() {
  const el = document.getElementById('menu');
  if (!el) return;
  const m = state.menu;
  const { width: w, height: h } = el.getBoundingClientRect();
  const pad = 8;
  let x; let y;
  if (m.rect) {
    x = m.alignStart ? m.rect.left : m.rect.right - w;
    y = m.rect.bottom + 4;
    if (y + h > innerHeight - pad) y = m.rect.top - h - 4;
  } else {
    x = m.x; y = m.y;
    if (y + h > innerHeight - pad) y = innerHeight - h - pad;
  }
  el.style.left = `${Math.max(pad, Math.min(x, innerWidth - w - pad))}px`;
  el.style.top = `${Math.max(pad, y)}px`;
}

/* Dialogs: one shape for cancel, purge and delete. Copy comes from SpecsContract.kt. */
function renderDialog() {
  const d = state.dialog;
  const s = spec(d.key);
  const shell = (iconName, title, body, keep, go, act) => `
    <div class="scrim" data-act="dialog-scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">${icon(iconName)}${esc(title)}</h2>${body}
      <div class="dialog-actions"><button class="btn ghost" data-act="dialog-keep" id="dialog-keep">${esc(keep)}</button><button class="btn danger-solid" data-act="${act}">${esc(go)}</button></div>
    </div></div>`;
  if (d.kind === 'cancel') return shell('x', `Cancel ${s.key}?`, '<p>The run stops and the goal is marked canceled. Its branch and commits stay.</p>', 'Keep running', 'Cancel goal', 'confirm-cancel');
  if (d.kind === 'purge') {
    return shell('reset', `Purge ${s.key} run history?`, `
      <p>Purge deletes everything Skill Bill recorded while running this spec, so it can start again from scratch.</p>
      <div class="ledger"><div><b>Deleted</b><ul><li>Goal and subtask run history</li><li>Run evidence and task tracking</li><li>Checkpoint refs</li><li>Subtask progress, back to not started</li></ul></div>
      <div><b>Kept</b><ul><li>Every spec file in the folder</li><li>Your branch and its commits</li><li>Open pull requests</li></ul></div></div>
      <p>This can't be undone. Afterwards the spec shows as not started and Start runs it from the first subtask.</p>`, 'Keep run history', `Purge ${s.key}`, 'confirm-purge');
  }
  return shell('trash', `Delete ${s.key} spec files?`, `
    <p>${esc(s.title)}</p><p>This removes the spec folder and every file in it from disk.</p>
    <p class="mono">${STORE}/${specSlug(s)}</p>
    <p>Run history stays in the database. Use Purge to remove it.</p><p>This can't be undone.</p>`, 'Keep spec files', 'Delete spec files', 'confirm-delete');
}

/* Render */
function render() {
  const active = document.activeElement;
  const fk = active?.dataset?.fk;
  const caret = active?.tagName === 'INPUT' ? active.selectionStart : null;
  const listScroll = [...document.querySelectorAll('.list')].map((l) => [l.dataset.pane, l.scrollTop]);

  document.getElementById('designs').innerHTML = Object.entries(DESIGNS).map(([id, d]) => `<button data-act="design" data-id="${id}" aria-pressed="${state.design === id}">${d.label}${d.pick ? '<span class="pick-tag">My pick</span>' : ''}</button>`).join('');
  const select = document.getElementById('scenario');
  const s = selected();
  select.disabled = !s;
  select.value = s ? s.run : '';
  document.getElementById('proposal-label').textContent = `Proposal ${DESIGNS[state.design].label}`;
  renderCurrent();
  document.getElementById('proposal').innerHTML = DESIGNS[state.design].render();
  document.getElementById('notes').innerHTML = NOTES[state.design] + NOTES.shared + NOTES.needs;

  const overlay = document.getElementById('overlay');
  overlay.innerHTML = (state.menu ? renderMenu() : '') + (state.dialog ? renderDialog() : '');
  placeMenu();

  listScroll.forEach(([pane, top]) => { const l = document.querySelector(`.list[data-pane="${pane}"]`); if (l) l.scrollTop = top; });
  if (!state.menu && !state.dialog && fk) {
    const again = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
    if (again) { again.focus({ preventScroll: true }); if (caret !== null) again.setSelectionRange(caret, caret); }
  }
  state.barEnter = false;
}

function focusFk(fk) {
  const el = fk && document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
  if (el) el.focus({ preventScroll: true });
}

/* Actions */
let toastTimer;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
}

function closeMenu() {
  const back = state.menu?.returnFk;
  state.menu = null;
  render();
  focusFk(back);
}

function openMenu(menu) {
  state.menu = menu;
  render();
  const el = document.getElementById('menu');
  if (!el) return;
  if (menu.keyboard) el.querySelector('.item:not(:disabled)')?.focus({ preventScroll: true });
  else el.focus({ preventScroll: true });
}

function select(key) {
  if (state.sel === null && state.design === 'a') state.barEnter = true;
  state.sel = key; state.child = null; state.confirmingCancel = false;
}

function target(el) { return el?.dataset?.key ? spec(el.dataset.key) : selected(); }

function doStart(s, anchorEl) {
  if (!s || !verdict(s).canStart) return;
  if (!s.agent) {
    /* SpecsPaneModel.start(): with no agent chosen, Start opens the agent menu first. */
    state.sel = s.key;
    render();
    openAgent(s, { startAfter: true, anchorEl });
    return;
  }
  s.run = 'Running'; s.ever = true; state.confirmingCancel = false;
  render();
  toast(`${s.key} started on ${s.agent}`);
}

function openAgent(s, { startAfter = false, anchorEl, keyboard = false } = {}) {
  const fallback = document.querySelector('#proposal [data-fk="p:agent"]') || document.querySelector('#proposal [data-fk="p:spec-menu"]') || document.querySelector(`#proposal [data-fk="p:row:${s.key}"]`);
  const anchor = anchorEl && anchorEl.isConnected ? anchorEl : fallback;
  const rect = anchor.getBoundingClientRect();
  openMenu({ kind: 'agent', key: s.key, rect, alignStart: true, startAfter, returnFk: anchor.dataset?.fk, keyboard });
}

function doPause(s) {
  if (!s || !verdict(s).canPause) return;
  s.run = 'PauseRequested';
  render();
  const key = s.key;
  setTimeout(() => { const x = spec(key); if (x && x.run === 'PauseRequested') { x.run = 'Paused'; render(); } }, 3000);
}

function ask(kind, s) {
  const returnFk = document.activeElement?.dataset?.fk;
  state.menu = null;
  state.dialog = { kind, key: s.key, returnFk };
  render();
  document.getElementById('dialog-keep')?.focus();
}

function closeDialog() {
  const back = state.dialog?.returnFk;
  state.dialog = null;
  render();
  focusFk(back);
}

const actions = {
  noop() { if (state.menu) closeMenu(); },
  design(el) { state.design = el.dataset.id; state.detail = null; state.menu = null; render(); },
  select(el) {
    select(el.dataset.key);
    if (state.design === 'c') state.detail = el.dataset.key;
    render();
    if (state.design !== 'c') focusFk(`p:row:${el.dataset.key}`);
  },
  'select-child'(el) { state.sel = el.dataset.key; state.child = el.dataset.child; state.confirmingCancel = false; render(); },
  toggle(el) { const k = el.dataset.key; state.exp.has(k) ? state.exp.delete(k) : state.exp.add(k); render(); },
  filter(el) { state.filter = el.dataset.f; render(); },
  'clear-filters'() { state.filter = 'all'; state.q = ''; state.searchOpen = false; render(); },
  'open-search'() { state.searchOpen = true; render(); focusFk('p:filter'); },
  'close-search'() { state.searchOpen = false; state.q = ''; render(); focusFk('p:open-search'); },
  'collapse-all'() { state.exp.clear(); state.menu = null; render(); },
  'reveal-store'() { state.menu = null; render(); toast(`Reveals ${FULL_STORE}`); },
  'reveal-spec'(el) { const s = target(el); state.menu = null; render(); toast(`Reveals ${STORE}/${specSlug(s)}`); },
  'copy-key'(el) { const s = target(el); state.menu = null; render(); toast(`Copied ${s.key}`); },
  'open-file'(el) { const s = target(el); state.menu = null; render(); toast(`Opens ${s.key} spec.md`); },
  favorite(el) { const s = target(el); if (!s) return; s.fav = !s.fav; state.menu = null; render(); },
  start(el) { const s = target(el); const inMenu = !!el.closest('.menu'); state.menu = null; render(); doStart(s, inMenu ? null : el); },
  pause(el) { const s = target(el); state.menu = null; doPause(s); },
  'open-spec-menu'(el) {
    const s = target(el);
    if (state.sel !== s.key) { select(s.key); }
    render();
    const anchor = document.querySelector(`[data-fk="${CSS.escape(el.dataset.fk || '')}"]`) || document.querySelector(`#proposal [data-fk="p:row:${s.key}"] [data-act="open-spec-menu"]`);
    openMenu({ kind: 'spec', key: s.key, rect: (anchor || el).getBoundingClientRect(), returnFk: el.dataset.fk || `p:row:${s.key}` });
  },
  'open-panel-menu'(el) { openMenu({ kind: 'panel', rect: el.getBoundingClientRect(), returnFk: el.dataset.fk }); },
  'open-project-menu'(el) { openMenu({ kind: 'project', rect: el.getBoundingClientRect(), alignStart: true, returnFk: el.dataset.fk }); },
  'open-agent-menu'(el) {
    const s = target(el);
    const inMenu = !!el.closest('.menu');
    if (inMenu) state.menu = null;
    render();
    openAgent(s, { anchorEl: inMenu ? null : el, keyboard: inMenu });
  },
  'choose-agent'(el) {
    const s = target(el);
    const startAfter = state.menu?.startAfter;
    s.agent = el.dataset.agent;
    closeMenu();
    if (startAfter) doStart(s);
  },
  'current-cancel'() { state.confirmingCancel = true; render(); focusFk('c:keep'); },
  'current-keep'() { state.confirmingCancel = false; render(); focusFk('c:cancel'); },
  'ask-cancel'(el) { ask('cancel', target(el)); },
  'ask-purge'(el) { ask('purge', target(el)); },
  'ask-delete'(el) { ask('delete', target(el)); },
  'dialog-keep'() { closeDialog(); },
  'dialog-scrim'(el, ev) { if (ev.target === el) closeDialog(); },
  'confirm-cancel'() {
    const s = spec(state.dialog?.key) || selected();
    s.run = 'Canceled'; state.confirmingCancel = false; state.dialog = null; render();
  },
  'confirm-purge'() {
    const s = spec(state.dialog.key);
    s.run = 'NotStarted'; s.ever = false; s.done = s.subs.length ? 0 : undefined; state.dialog = null; render();
    toast(`${s.key} run history purged`);
  },
  'confirm-delete'() {
    const key = state.dialog.key;
    specs.splice(specs.findIndex((x) => x.key === key), 1);
    state.dialog = null;
    if (state.sel === key) { state.sel = null; state.child = null; }
    if (state.detail === key) state.detail = null;
    state.exp.delete(key);
    render();
    toast(`${key} spec files deleted. Reload the page to restore the sample.`);
  },
  back() { state.detail = null; render(); focusFk(`p:row:${state.sel}`); },
};

/* Wiring */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (state.menu && !ev.target.closest('.menu')) {
    state.menu = null;
    render();
    if (!el) return;
    const again = el.dataset.fk && document.querySelector(`[data-fk="${CSS.escape(el.dataset.fk)}"]`);
    if (el.dataset.act.startsWith('open-')) return;
    if (again) { actions[el.dataset.act]?.(again, ev); return; }
  }
  if (!el || el.disabled) return;
  actions[el.dataset.act]?.(el, ev);
});

document.addEventListener('mousemove', (ev) => {
  const item = ev.target.closest?.('.menu .item:not(:disabled)');
  if (item && document.activeElement !== item) item.focus({ preventScroll: true });
});

document.addEventListener('contextmenu', (ev) => {
  const row = ev.target.closest('.row[data-key]');
  if (!row) return;
  ev.preventDefault();
  const today = !!row.closest('#current');
  const isChild = row.classList.contains('child');
  if (today && isChild) return;
  select(row.dataset.key);
  if (isChild) { state.child = row.dataset.child; }
  openMenu({ kind: today ? 'row-today' : 'spec', key: row.dataset.key, x: ev.clientX, y: ev.clientY, returnFk: row.dataset.fk });
});

document.addEventListener('input', (ev) => {
  if (ev.target.dataset.input === 'q') { state.q = ev.target.value; render(); }
});

document.getElementById('scenario').addEventListener('change', (ev) => {
  const s = selected();
  if (!s) return;
  s.run = ev.target.value;
  if (s.run !== 'NotStarted') s.ever = true;
  state.confirmingCancel = false;
  render();
});

function moveSelection(delta) {
  const list = visibleSpecs();
  if (!list.length) return;
  const i = list.findIndex((s) => s.key === state.sel);
  const next = list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + delta))];
  select(next.key);
  render();
  const row = document.querySelector(`#proposal [data-fk="p:row:${next.key}"]`);
  if (row) { row.focus({ preventScroll: true }); row.scrollIntoView({ block: 'nearest' }); }
}

function menuKeys(ev) {
  const items = [...document.querySelectorAll('#menu .item:not(:disabled)')];
  const i = items.indexOf(document.activeElement);
  const key = ev.key;
  if (key === 'ArrowDown' || key === 'j') { ev.preventDefault(); items[(i + 1) % items.length]?.focus(); return; }
  if (key === 'ArrowUp' || key === 'k') { ev.preventDefault(); items[(i - 1 + items.length) % items.length]?.focus(); return; }
  if (key === 'Home') { ev.preventDefault(); items[0]?.focus(); return; }
  if (key === 'End') { ev.preventDefault(); items[items.length - 1]?.focus(); return; }
  if (key === 'Escape' || key === 'Tab') { ev.preventDefault(); closeMenu(); return; }
  const hit = items.find((it) => it.dataset.shortcut === key.toLowerCase());
  if (hit) { ev.preventDefault(); hit.click(); }
}

document.addEventListener('keydown', (ev) => {
  if (state.dialog) {
    if (ev.key === 'Escape') { ev.preventDefault(); closeDialog(); return; }
    if (ev.key === 'Tab') {
      const btns = [...document.querySelectorAll('.dialog button')];
      const i = btns.indexOf(document.activeElement);
      ev.preventDefault();
      btns[(i + (ev.shiftKey ? -1 : 1) + btns.length) % btns.length].focus();
    }
    return;
  }
  if (state.menu) { menuKeys(ev); return; }
  const inInput = /^(INPUT|SELECT)$/.test(ev.target.tagName);
  if (inInput) {
    if (ev.key === 'Escape' && state.searchOpen) { ev.preventDefault(); actions['close-search'](); }
    return;
  }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const s = selected();
  const live = document.activeElement?.closest?.('.row[data-key]') || document.querySelector(`#proposal .row[data-key="${s?.key}"]`);
  if ((ev.key === 'ContextMenu' || (ev.key === 'F10' && ev.shiftKey)) && s) {
    ev.preventDefault();
    const rect = (live || document.body).getBoundingClientRect();
    openMenu({ kind: 'spec', key: s.key, x: rect.left + 40, y: rect.bottom, returnFk: `p:row:${s.key}`, keyboard: true });
    return;
  }
  switch (ev.key.toLowerCase()) {
    case 'j': case 'arrowdown': ev.preventDefault(); moveSelection(1); break;
    case 'k': case 'arrowup': ev.preventDefault(); moveSelection(-1); break;
    case 'enter':
      if (s && ev.target.tagName !== 'BUTTON') {
        ev.preventDefault();
        if (state.design === 'c') { state.detail = s.key; render(); } else toast(`Opens ${s.key} spec.md`);
      }
      break;
    case 'r': if (s) { ev.preventDefault(); doStart(s); } break;
    case 'p': if (s && !ev.shiftKey) { ev.preventDefault(); doPause(s); } break;
    case 'a': if (s && verdict(s).canStart) { ev.preventDefault(); openAgent(s, { keyboard: true }); } break;
    case 'f': if (s) { ev.preventDefault(); s.fav = !s.fav; render(); } break;
    case '/': ev.preventDefault(); actions['open-search'](); break;
    case 'escape':
      if (state.detail) { actions.back(); } else if (state.sel) { state.sel = null; state.child = null; render(); }
      break;
    default:
  }
});

addEventListener('resize', () => { if (state.menu && !state.menu.rect) placeMenu(); });

document.getElementById('scenario').innerHTML = Object.entries(RUN).map(([id, r]) => `<option value="${id}">${r.word}</option>`).join('');

/* Deep links for review: #design=a&spec=SKILL-471&state=Running&menu=spec&dialog=purge&expand=SKILL-460 */
const params = new URLSearchParams(location.hash.slice(1));
if (DESIGNS[params.get('design')]) state.design = params.get('design');
if (params.get('spec') && spec(params.get('spec'))) state.sel = params.get('spec');
if (params.get('state') && RUN[params.get('state')] && selected()) { selected().run = params.get('state'); if (selected().run !== 'NotStarted') selected().ever = true; }
if (params.get('expand')) state.exp.add(params.get('expand'));
if (state.design === 'c' && params.get('detail')) state.detail = state.sel;
render();
if (params.get('menu') === 'spec') document.querySelector('#proposal [data-fk="p:spec-menu"]')?.click();
if (params.get('menu') === 'panel') document.querySelector('#proposal [data-fk="p:panel-menu"]')?.click();
if (params.get('dialog') && selected()) ask(params.get('dialog'), selected());
</script>
</body>
</html>
