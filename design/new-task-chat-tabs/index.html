<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New task: several chats at once</title>
<!-- Design reference only. Colors, type and spacing come from the Linear study tokens, which match SkillBillColors. All data is sample data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../linear-study/ds/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; }
  button, input, textarea, select { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .chrome-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .scenario { display: flex; align-items: center; gap: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .scenario select { height: 30px; padding: 0 var(--sp-2); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); }
  .reset { height: 30px; padding: 0 var(--sp-3); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; }
  .note { margin: 0; max-width: 1040px; color: var(--fg-muted); font-size: var(--t-sm); }
  .note b { color: var(--fg-2); font-weight: 500; }
  .note kbd, .kbd { font: 400 var(--t-2xs) var(--font-mono); padding: 1px 4px; border: 1px solid var(--border); border-radius: 3px; color: var(--fg-muted); }

  /* App window: a sidebar stub plus the New task panel */
  .window { flex: 1; min-height: 0; padding: var(--sp-2); display: flex; gap: var(--sp-2); }
  .appnav { flex: none; width: 196px; display: flex; flex-direction: column; gap: 2px; padding: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .appnav .nav { height: 28px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2); border-radius: var(--r-sm); }
  .appnav .nav.on { background: var(--bg-active); color: var(--fg); }
  .appnav .nav .count { margin-left: auto; font-size: var(--t-xs); color: var(--fg-faint); }
  .panel { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .head { flex: none; height: var(--header-h, 44px); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3) 0 var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
  .head .crumb { font-weight: 500; }
  .head .crumb-sub { color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .head .spacer { flex: 1; }
  .btn { height: 26px; padding: 0 var(--sp-3); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--r-sm); background: transparent; color: var(--fg-2); font-size: var(--t-sm); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--bg-hover); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 500; }
  .btn.danger { background: var(--st-failed); color: #fff; border-color: transparent; font-weight: 500; }
  .iconbtn { width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; }
  .iconbtn:hover { background: var(--bg-hover); color: var(--fg); }

  /* Status markers shared by every design */
  .agent-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .ag-claude { background: var(--data-1); } .ag-codex { background: var(--data-2); } .ag-cursor { background: var(--data-4); }
  .mark { width: 14px; height: 14px; display: grid; place-items: center; flex: none; }
  .mark .unread { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .mark .spin { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--border-strong); border-top-color: var(--st-active); animation: spin .8s linear infinite; }
  .mark .warn { color: var(--st-blocked); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mark .spin { animation: none; border-color: var(--st-active); } }

  /* Tabs layout */
  .tabs { flex: none; display: flex; align-items: stretch; height: 36px; padding: 0 var(--sp-2); gap: 2px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-frame); }
  .tabs-scroll { flex: 0 1 auto; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 4px; }
  .tab { position: relative; flex: 0 1 196px; min-width: 112px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 10px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--r-sm) var(--r-sm) 0 0; color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; user-select: none; }
  .tab:hover { background: var(--bg-hover); color: var(--fg-2); }
  .tab.on { background: var(--bg-panel); color: var(--fg); border-color: var(--border-subtle); margin-bottom: -1px; }
  .tab .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x { visibility: hidden; width: 20px; height: 20px; }
  .tab:hover .x, .tab.on .x { visibility: visible; }
  .tab.unread .label { color: var(--fg); font-weight: 500; }
  .tabs .add { align-self: center; flex: none; }
  .tabs-scroll.fade-r { mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
  .tabs-scroll.fade-l { mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
  .tabs-scroll.fade-l.fade-r { mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); }
  .tabs .overflow { align-self: center; flex: none; margin-left: auto; width: auto; padding: 0 6px; gap: 4px; display: flex; align-items: center; font-size: var(--t-xs); }
  .tabs .overflow[hidden] { display: none; }
  .tabs .overflow .mark { width: 8px; }

  /* Chat body (shared) */
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; min-width: 0; }
  .transcript { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: var(--sp-6) var(--sp-6) var(--sp-4); }
  .transcript-inner { width: 100%; max-width: 728px; display: flex; flex-direction: column; gap: var(--sp-4); margin-top: auto; }
  .msg { display: flex; flex-direction: column; gap: 4px; }
  .msg .who { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 500; color: var(--fg-faint); }
  .msg.you { align-items: flex-end; }
  .msg.you .txt { max-width: 80%; padding: var(--sp-2) var(--sp-3); background: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--r-md); color: var(--fg); }
  .msg .txt { color: var(--fg-2); white-space: pre-wrap; }
  .msg .caret { display: inline-block; width: 7px; height: 14px; vertical-align: -2px; background: var(--fg-muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .notice { align-self: center; font-size: var(--t-xs); color: var(--fg-faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--r-full); background: transparent; color: var(--fg-2); font-size: var(--t-sm); cursor: pointer; }
  .chip.start { border-color: var(--accent-ring); color: var(--accent-text); background: var(--accent-tint); }

  /* Home for an empty chat (shared) */
  .home { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: var(--sp-6); }
  .home-inner { width: 100%; max-width: 680px; margin: auto 0; display: flex; flex-direction: column; gap: var(--sp-8); }
  .home h1 { margin: 0 0 var(--sp-2); font-size: var(--t-2xl); font-weight: 500; letter-spacing: -0.01em; }
  .home p { margin: 0; color: var(--fg-muted); }
  .section-head { display: flex; justify-content: space-between; margin-bottom: var(--sp-2); font-size: var(--t-sm); font-weight: 500; color: var(--fg-muted); }
  .home-row { height: 34px; display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-2); margin: 0 calc(var(--sp-2) * -1); border-radius: var(--r-sm); color: var(--fg-2); cursor: pointer; }
  .home-row:hover { background: var(--bg-hover); }
  .home-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .home-row .meta { font-size: var(--t-sm); color: var(--fg-faint); white-space: nowrap; }
  .home-row .open { font-size: var(--t-xs); color: var(--accent-text); border: 1px solid var(--accent-ring); border-radius: var(--r-full); padding: 0 6px; }

  /* Composer (shared) */
  .dock { flex: none; display: flex; justify-content: center; padding: var(--sp-3) var(--sp-6) var(--sp-4); }
  .composer { width: 100%; max-width: 728px; display: flex; flex-direction: column; gap: var(--sp-2); }
  textarea.task { width: 100%; height: 64px; resize: none; padding: var(--sp-2) 10px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-sm); outline: none; display: block; }
  textarea.task:focus { border-color: var(--accent-ring); }
  .foot { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .pill { height: 26px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--r-full); color: var(--fg-muted); font: 400 var(--t-sm) var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .foot .spacer { flex: 1; }
  .send { height: 26px; padding: 0 10px; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: var(--r-sm); font-size: var(--t-sm); font-weight: 500; cursor: pointer; white-space: nowrap; }
  .send:disabled { background: var(--bg-raised); color: var(--fg-faint); cursor: default; }
  .send.stop { background: var(--bg-raised); color: var(--fg-2); }

  /* Side list layout */
  .rail-wrap { flex: 1; min-height: 0; display: flex; }
  .rail { flex: none; width: 248px; display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); background: var(--bg-frame); }
  .rail-head { flex: none; display: flex; align-items: center; gap: var(--sp-2); height: 38px; padding: 0 var(--sp-2) 0 var(--sp-3); font-size: var(--t-xs); font-weight: 500; color: var(--fg-faint); }
  .rail-head .n { margin-right: auto; }
  .rail-list { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--sp-1) var(--sp-2); }
  .ritem { display: flex; align-items: flex-start; gap: var(--sp-2); padding: 6px var(--sp-2); border-radius: var(--r-sm); color: var(--fg-2); cursor: pointer; }
  .ritem:hover { background: var(--bg-hover); }
  .ritem.on { background: var(--bg-active); color: var(--fg); }
  .ritem .mark { margin-top: 2px; }
  .ritem .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .ritem .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--t-sm); }
  .ritem.unread .t { color: var(--fg); font-weight: 500; }
  .ritem .sub { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--fg-faint); white-space: nowrap; overflow: hidden; }
  .ritem .sub .mono { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; }
  .ritem .x { visibility: hidden; width: 20px; height: 20px; }
  .ritem:hover .x { visibility: visible; }
  .rail-foot { flex: none; padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--border-subtle); font-size: var(--t-xs); color: var(--fg-faint); display: flex; flex-direction: column; gap: 4px; }
  .rail-foot span { display: flex; justify-content: space-between; }

  /* Settings page */
  .settings { flex: 1; min-height: 0; display: flex; }
  .set-nav { flex: none; width: 200px; padding: var(--sp-3) var(--sp-2); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 2px; font-size: var(--t-sm); color: var(--fg-muted); }
  .set-nav div { height: 28px; display: flex; align-items: center; padding: 0 var(--sp-2); border-radius: var(--r-sm); }
  .set-nav .on { background: var(--bg-active); color: var(--fg); }
  .set-body { flex: 1; min-width: 0; overflow: auto; padding: var(--sp-6) var(--sp-8); }
  .set-inner { max-width: 720px; display: flex; flex-direction: column; gap: var(--sp-6); }
  .set-inner h1 { margin: 0; font-size: var(--t-xl); font-weight: 500; }
  .group-title { font-size: var(--t-sm); font-weight: 500; color: var(--fg-muted); margin-bottom: var(--sp-2); }
  .group-box { border: 1px solid var(--border-subtle); border-radius: var(--r-md); background: var(--bg-raised); }
  .srow { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-4); }
  .srow + .srow { border-top: 1px solid var(--border-subtle); }
  .srow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .srow .lbl { color: var(--fg); }
  .srow .desc { font-size: var(--t-sm); color: var(--fg-muted); }
  .srow.new { box-shadow: inset 2px 0 0 var(--accent); }
  .seg { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .seg button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); display: flex; align-items: center; gap: 6px; }
  .seg button[aria-checked="true"] { background: var(--bg-overlay); color: var(--fg); }
  .toggle { width: 30px; height: 18px; border-radius: 9px; background: var(--bg-inset); border: 1px solid var(--border); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg-faint); }
  .appnav .nav { cursor: pointer; }
  .appnav .nav:hover { color: var(--fg-2); }
  .appnav .bottom { margin-top: auto; }

  /* Menu and dialog */
  .menu { position: absolute; z-index: 10; min-width: 300px; max-height: 360px; overflow: auto; padding: var(--sp-1); background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-pop); }
  .menu .ritem .x { display: none; }
  .menu-filter { position: sticky; top: calc(var(--sp-1) * -1); z-index: 1; width: 100%; height: 32px; margin-bottom: 4px; padding: 0 var(--sp-2); background: var(--bg-overlay); border: 0; border-bottom: 1px solid var(--border-subtle); outline: none; }
  .scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim, rgba(0,0,0,.45)); display: grid; place-items: center; }
  .dialog { width: min(420px, calc(100% - 48px)); padding: var(--sp-4); background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-modal); display: flex; flex-direction: column; gap: var(--sp-3); }
  .dialog h2 { margin: 0; font-size: var(--t-md); font-weight: 500; }
  .dialog p { margin: 0; color: var(--fg-muted); font-size: var(--t-sm); }
  .dialog .row { display: flex; justify-content: flex-end; gap: var(--sp-2); }
  .toast { position: absolute; z-index: 30; left: 50%; bottom: 96px; transform: translateX(-50%); padding: var(--sp-2) var(--sp-3); background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-pop); font-size: var(--t-sm); color: var(--fg-2); display: flex; gap: var(--sp-3); align-items: center; }
  .toast button { background: none; border: 0; color: var(--accent-text); cursor: pointer; padding: 0; }
</style>
</head>
<body>
<header class="chrome">
  <div class="chrome-row">
    <div class="designs" id="designs" role="group" aria-label="Design direction"></div>
    <label class="scenario">State <select id="scenario"></select></label>
    <button class="reset" id="reset">Reset state</button>
  </div>
  <p class="note" id="note"></p>
</header>
<main class="window">
  <nav class="appnav" aria-label="App">
    <div class="nav" data-view="newtask">New task<span class="count" id="nav-count"></span></div>
    <div class="nav">Needs you<span class="count">2</span></div>
    <div class="nav">Active<span class="count">3</span></div>
    <div class="nav">Specs</div>
    <div class="nav">Activity</div>
    <div class="nav bottom" data-view="settings">Settings</div>
  </nav>
  <div class="panel" id="stage"></div>
</main>

<script>
const ICON = {
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  tabs: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 3v6"/>',
  list: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
};
const icon = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = m => m < 1 ? 'just now' : m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`;

/* ---------- Sample chats ---------- */
const SEED = [
  { title: 'When Verify should park for confirmation', agent: 'claude', repo: 'SkillBill', branch: 'main', m: 4, lines: [
    ['you', 'i would like to talk about Verify operation and when it should park'],
    ['agent', 'Verify parks at awaiting_confirmation after it lists the criteria it could not prove. Right now it also parks when every criterion passed, which is one click with nothing to decide.'],
    ['you', 'yes, that second park feels pointless'],
    ['agent', 'Then the rule would be: park only when at least one criterion is unproven or contradicted. A clean pass finishes on its own and records the audit.'],
  ] },
  { title: 'Specs panel is slow to open the first time', agent: 'codex', repo: 'SkillBill', branch: 'main', m: 1, lines: [
    ['you', 'when i open Specs panel (at least first time after app start) it takes a few seconds to show anything'],
    ['agent', 'The first open reads every bundle under the specs root on the UI dispatcher. With 510 bundles that is about 2.8 seconds on your machine.'],
    ['you', 'can we show the list before the bodies load?'],
  ], reply: 'Yes. SpecsRepository can return names and keys from the directory listing first, then fill in titles and status as each spec.md is parsed. The panel shows rows within one frame and updates them in place. I would also move the parse to Dispatchers.IO and cache it by mtime so the second open costs nothing.' },
  { title: 'Token cost per phase on the run page', agent: 'claude', repo: 'SkillBill', branch: 'main', m: 12, lines: [
    ['you', 'what do you think about showing the token cost per phase on the run page?'],
    ['agent', 'The data is there: each phase record already stores input and output tokens. A small column on the phase list would cost little. I would show totals per phase and keep per-call detail in the inspector.', ['Run phase:goal', 'Use SKILL-511']],
  ] },
  { title: 'Offline banner covers the toolbar', agent: 'claude', repo: 'readian-android', branch: 'feature/offline-sync', m: 30, lines: [
    ['you', 'why is the offline banner on top of the toolbar'],
    ['agent', 'The banner is drawn in the root Box after the Scaffold, so it sits above the TopAppBar. Moving it into the Scaffold topBar slot under the app bar fixes the overlap.'],
  ] },
  { title: 'Passkey enrollment screen design', agent: 'claude', repo: 'ZeroAccount', branch: '0AC-72-passkey-enrollment', m: 80, lines: [
    ['you', 'i want to implement this new design for the passkey enrollment screen'],
    ['agent', 'I read the mock. Three states: intro, system prompt open, success. The current screen has no success state, it navigates straight away.'],
  ] },
  { title: 'Planning phase context budget', agent: 'claude', repo: 'SkillBill', branch: 'main', m: 120, lines: [
    ['you', 'I want to discuss Planning phase and how much context it gets'],
    ['agent', 'Planning gets the intake, AGENTS.md and the files it asks for. It does not get earlier specs unless the intake names them.'],
  ] },
  { title: 'Board column counts are off by one', agent: 'codex', repo: 'SkillBill', branch: 'main', m: 200, lines: [
    ['you', 'the board column counts are off by one'],
    ['agent', 'The count includes the archived run that is filtered out of the list. The fix is to count after the filter.'],
  ] },
  { title: 'Boss wave 3 spawns behind the camera', agent: 'cursor', repo: 'space-anime-survivors', branch: 'boss-wave-3', m: 900, lines: [
    ['you', 'boss wave 3 spawns behind the camera'],
    ['agent', 'The spawn ring uses world space but the camera follows with a lag, so the "off-screen" point is computed from a stale position.'],
  ] },
  { title: 'Migrate the build to Gradle 9', agent: 'codex', repo: 'ZeroAccount', branch: 'chore/gradle-9-upgrade', m: 1400, lines: [
    ['you', 'migrate the build to gradle 9'],
    ['agent', 'Two plugins block it: the old protobuf plugin and a custom task that uses Project at execution time.'],
  ] },
];
const SAVED_ONLY = [
  { title: 'Have we fixed RAM overuse with many runs open?', agent: 'claude', repo: 'SkillBill', m: 1500 },
  { title: 'TWS-1 shows monitoring after the PR merged', agent: 'codex', repo: 'SkillBill', m: 1620 },
  { title: 'Session refresh loops during sync', agent: 'claude', repo: 'ZeroAccount', m: 5800 },
];

let nextId = 1;
function mkChat(seed) {
  return {
    id: nextId++, title: seed?.title ?? '', agent: seed?.agent ?? 'claude', repo: seed?.repo ?? 'SkillBill', branch: seed?.branch ?? 'main', m: seed?.m ?? 0,
    lines: (seed?.lines ?? []).map(([who, txt, chips]) => ({ who, txt, chips })),
    reply: seed?.reply ?? null, stream: null, unread: false, draft: '',
  };
}

/* ---------- Views and states ---------- */
const VIEWS = {
  tabs: { label: 'Tabs (default)',
    note: '<b>Default layout: tabs under the New task header.</b> Each tab is one chat with its own repository, branch, agent and draft text. A spinner means the agent is replying; an accent dot and bold title mean it finished while you were on another tab. <kbd>Ctrl+T</kbd> opens a tab with the New task home, <kbd>Ctrl+W</kbd> closes it, <kbd>Ctrl+Tab</kbd> cycles, <kbd>Ctrl+1</kbd>…<kbd>9</kbd> jumps. Closing keeps the chat in Recent chats; Discard in the header deletes it. No cap on open chats. When tabs stop fitting they shrink to 112px, then the strip scrolls sideways (the mouse wheel works too), the clipped edge fades, and a chevron with the count appears. It lists every open chat, with a filter field once more than 8 are open, and carries a dot when a chat out of view is replying or has a new reply. Selecting a tab scrolls it into view.' },
  list: { label: 'Side list',
    note: '<b>Alternative layout, picked in Settings › General.</b> The same open chats as a list on the left of the New task panel: title, then repository and status. Same markers, shortcuts and close behavior as tabs. The list scrolls on its own, and the footer counts chats that are replying or have new replies, so nothing hides off screen. Better when you keep many chats open or work across repositories. Switching the setting keeps every open chat and the selected one.' },
  settings: { label: 'Settings › General',
    note: '<b>Where the layout is picked.</b> A new "New task" group on the General page with one Segmented row, the same control History retention uses. Tabs is the default. The choice saves to AppSettings and applies right away; open chats are untouched. Pick one, then click New task in the sidebar.' },
};
const SCENARIOS = {
  two: 'Two chats, both idle',
  busy: 'One chat replying in the background',
  mixed: 'Chats in different repositories',
  many: 'Nine open chats',
  lots: 'Twenty open chats (overflow)',
  fresh: 'New empty chat',
  closing: 'Closing a chat that is replying',
};

const params = new URLSearchParams(location.hash.slice(1));
const s = {
  layout: params.get('layout') === 'list' ? 'list' : 'tabs',
  view: params.get('view') === 'settings' ? 'settings' : 'newtask',
  scenario: SCENARIOS[params.get('state')] ? params.get('state') : 'busy',
  chats: [], active: 0, menu: false, confirm: null, toast: null,
};
const viewKey = () => s.view === 'settings' ? 'settings' : s.layout;

function applyScenario() {
  stopAllStreams();
  nextId = 1;
  const pick = (...i) => i.map(n => mkChat(SEED[n]));
  s.menu = false; s.confirm = null; s.toast = null;
  switch (s.scenario) {
    case 'two': s.chats = pick(0, 2); s.active = 0; break;
    case 'busy': s.chats = pick(0, 1, 2); s.active = 0; s.chats[2].unread = true; break;
    case 'mixed': s.chats = pick(0, 3, 4); s.active = 1; break;
    case 'many': s.chats = pick(0, 1, 2, 3, 4, 5, 6, 7, 8); s.active = 4; s.chats[2].unread = true; s.chats[6].unread = true; break;
    case 'fresh': s.chats = [...pick(0, 2), mkChat()]; s.active = 2; break;
    case 'lots': {
      s.chats = Array.from({ length: 20 }, (_, i) => { const c = mkChat(SEED[i % SEED.length]); if (i >= SEED.length) c.title = `${c.title} (${Math.floor(i / SEED.length) + 1})`; return c; });
      s.active = 3; s.chats[15].unread = true; s.chats[18].unread = true; break;
    }
    case 'closing': s.chats = pick(0, 1, 2); s.active = 1; break;
  }
  if (s.scenario === 'busy' || s.scenario === 'many') startStream(s.chats[1]);
  if (s.scenario === 'lots') startStream(s.chats[17]);
  if (s.scenario === 'closing') { startStream(s.chats[1]); s.confirm = s.chats[1].id; }
}

const cur = () => s.chats[s.active];
const byId = id => s.chats.find(c => c.id === id);
const label = c => c.title || 'New chat';

/* ---------- Agent replies (simulated) ---------- */
const CANNED = [
  'I checked the code path. The state lives in one place today, so the change is mostly moving it into a per-chat holder and keeping the screen as a thin view over the selected one.',
  'Short answer: yes. The longer one is that two things need care. The agent session must keep running when its chat is not on screen, and the saved draft must update from whichever chat changed.',
  'I would keep it simple for the first cut and leave persistence of the open set for later, unless you want it now.',
];
const timers = new Map();
function startStream(c) {
  const full = c.reply || CANNED[(c.id + c.lines.length) % CANNED.length];
  c.reply = null;
  c.stream = { full, shown: 0 };
  const t = setInterval(() => {
    if (!c.stream) { clearInterval(t); return; }
    c.stream.shown = Math.min(full.length, c.stream.shown + 3 + Math.floor(Math.random() * 4));
    if (c.stream.shown >= full.length) {
      c.lines.push({ who: 'agent', txt: full });
      c.stream = null; clearInterval(t); timers.delete(c.id);
      if (s.view !== 'newtask' || cur()?.id !== c.id) c.unread = true;
    }
    render();
  }, 90);
  timers.set(c.id, t);
}
function stopStream(c) {
  if (!c.stream) return;
  clearInterval(timers.get(c.id)); timers.delete(c.id);
  c.lines.push({ who: 'agent', txt: c.stream.full.slice(0, c.stream.shown) });
  c.lines.push({ who: 'notice', txt: 'Stopped.' });
  c.stream = null;
}
function stopAllStreams() { timers.forEach(t => clearInterval(t)); timers.clear(); }

/* ---------- Actions ---------- */
function focusChat(id) {
  const i = s.chats.findIndex(c => c.id === id);
  if (i < 0) return;
  s.active = i; s.chats[i].unread = false; s.menu = false;
  render('composer');
}
function newChat() { const c = mkChat(); s.chats.push(c); focusChat(c.id); }
function askClose(id) {
  if (byId(id).stream) { s.confirm = id; render(); return; }
  closeChat(id);
}
function removeChat(c) {
  const i = s.chats.indexOf(c);
  s.chats.splice(i, 1);
  if (!s.chats.length) s.chats.push(mkChat());
  if (i < s.active) s.active--;
  s.active = Math.min(s.active, s.chats.length - 1);
}
function closeChat(id) {
  const c = byId(id);
  stopStream(c);
  removeChat(c);
  s.confirm = null;
  s.toast = c.lines.length ? { text: `Closed "${label(c)}". It stays in Recent chats.`, chat: c } : null;
  render('composer');
}
function reopen(saved) {
  const open = s.chats.find(c => c.title === saved.title);
  if (open) { focusChat(open.id); return; }
  const c = cur();
  const seed = SEED.find(x => x.title === saved.title) || { ...saved, branch: 'main', lines: [['you', saved.title.toLowerCase()], ['agent', 'Picking this up where we left it.']] };
  const fresh = mkChat(seed);
  if (c && !c.lines.length) s.chats[s.chats.indexOf(c)] = fresh; else s.chats.push(fresh);
  s.toast = null;
  focusChat(fresh.id);
}
function send(c) {
  const text = c.draft.trim();
  if (!text || c.stream) return;
  if (!c.title) c.title = text.length > 60 ? text.slice(0, 58) + '…' : text;
  c.lines.push({ who: 'you', txt: text });
  c.draft = '';
  render('composer');
  setTimeout(() => startStream(c), 400);
}
function cycle(d) { const n = s.chats.length; focusChat(s.chats[(s.active + d + n) % n].id); }

/* ---------- Pieces ---------- */
function markHTML(c) {
  if (c.stream) return `<span class="mark" title="${esc(c.agent)} is replying" aria-label="Replying"><span class="spin"></span></span>`;
  if (c.unread) return `<span class="mark" title="New reply" aria-label="New reply"><span class="unread"></span></span>`;
  return `<span class="mark"></span>`;
}
function transcriptHTML(c) {
  const lines = c.lines.map(l => {
    if (l.who === 'notice') return `<div class="notice">${esc(l.txt)}</div>`;
    const chips = l.chips ? `<div class="chips">${l.chips.map((t, i) => `<button class="chip ${i === 0 ? 'start' : ''}">${esc(t)}</button>`).join('')}</div>` : '';
    return l.who === 'you'
      ? `<div class="msg you"><span class="txt">${esc(l.txt)}</span></div>`
      : `<div class="msg"><span class="who"><span class="agent-dot ag-${c.agent}"></span>${esc(c.agent)}</span><span class="txt">${esc(l.txt)}</span>${chips}</div>`;
  }).join('');
  const live = c.stream ? `<div class="msg"><span class="who"><span class="agent-dot ag-${c.agent}"></span>${esc(c.agent)}</span><span class="txt">${esc(c.stream.full.slice(0, c.stream.shown))}<span class="caret"></span></span></div>` : '';
  return `<div class="transcript" id="tr-${c.id}"><div class="transcript-inner">${lines}${live}</div></div>`;
}
function homeHTML() {
  const openTitles = new Set(s.chats.map(x => x.title));
  const saved = [...SEED.slice(0, 6), ...SAVED_ONLY].sort((a, b) => a.m - b.m).slice(0, 6);
  s._saved = saved;
  const rows = saved.map((x, i) => `<div class="home-row" data-saved="${i}"><span class="agent-dot ag-${x.agent}"></span><span class="t">${esc(x.title)}</span>${openTitles.has(x.title) ? '<span class="open">open</span>' : ''}<span class="meta">${esc(x.repo)} · ${ago(x.m)}</span></div>`).join('');
  return `<div class="home"><div class="home-inner">
    <div><h1>What should we ship?</h1><p>Describe the work or paste an issue. Skill Bill plans it, builds it, audits it and opens the PR.</p></div>
    <div><div class="section-head"><span>Recent chats</span><span>Show all</span></div>${rows}</div>
  </div></div>`;
}
function composerHTML(c) {
  const ph = c.lines.length ? `Reply to ${c.agent}` : 'Describe the work, or ask anything';
  return `<div class="dock"><div class="composer">
    <textarea class="task" id="composer-${c.id}" data-chat="${c.id}" aria-label="Message for ${esc(label(c))}" placeholder="${ph}">${esc(c.draft)}</textarea>
    <div class="foot"><span class="pill">${icon('folder', 'sm')}${esc(c.repo)} · ${esc(c.branch)}</span><span class="pill"><span class="agent-dot ag-${c.agent}"></span>${esc(c.agent)}</span><span class="spacer"></span>
      ${c.stream ? `<button class="send stop" data-act="stop" data-chat="${c.id}">Stop</button>` : `<button class="send" data-act="send" data-chat="${c.id}" ${c.draft.trim() ? '' : 'disabled'}>Send ↵</button>`}
    </div>
  </div></div>`;
}
const chatBody = c => `${c.lines.length || c.stream ? transcriptHTML(c) : homeHTML()}${composerHTML(c)}`;
function headerHTML(c) {
  const sub = c.lines.length ? `<span class="crumb-sub">/ ${esc(label(c))}</span>` : '';
  return `<div class="head"><span class="crumb">New task</span>${sub}<span class="spacer"></span>
    ${c.lines.length ? `<button class="btn" data-act="discard">Discard</button>` : ''}</div>`;
}
function listItem(c) {
  const on = c.id === cur().id;
  return `<div class="ritem ${on ? 'on' : ''} ${c.unread ? 'unread' : ''}" data-focus="${c.id}" role="tab" aria-selected="${on}">
    ${markHTML(c)}
    <div class="body"><span class="t">${esc(label(c))}</span><span class="sub"><span class="mono">${esc(c.repo)}</span><span>·</span><span>${c.stream ? 'replying…' : c.unread ? 'new reply' : esc(c.agent)}</span></span></div>
    <button class="iconbtn x" data-close="${c.id}" aria-label="Close ${esc(label(c))}" title="Close (Ctrl+W)">${icon('x', 'sm')}</button>
  </div>`;
}
function overlaysHTML() {
  let out = '';
  if (s.confirm) {
    const c = byId(s.confirm);
    out += `<div class="scrim"><div class="dialog" role="alertdialog" aria-labelledby="dlg-t">
      <h2 id="dlg-t">Close "${esc(label(c))}"?</h2>
      <p>${esc(c.agent)} is still replying. Closing stops the reply. The chat stays in Recent chats with everything up to this point.</p>
      <div class="row"><button class="btn" data-act="cancel-close">Keep open</button><button class="btn danger" data-act="confirm-close">Stop and close</button></div>
    </div></div>`;
  }
  if (s.toast) out += `<div class="toast">${esc(s.toast.text)}<button data-act="undo-close">Reopen</button></div>`;
  return out;
}

/* ---------- Screens ---------- */
function tabsScreen() {
  const c = cur();
  const tabs = s.chats.map(t => `<div class="tab ${t.id === c.id ? 'on' : ''} ${t.unread ? 'unread' : ''}" data-focus="${t.id}" role="tab" aria-selected="${t.id === c.id}" title="${esc(label(t))}\n${esc(t.repo)} · ${esc(t.agent)}">
      ${markHTML(t)}<span class="label">${esc(label(t))}</span>
      <button class="iconbtn x" data-close="${t.id}" aria-label="Close ${esc(label(t))}" title="Close (Ctrl+W)">${icon('x', 'sm')}</button>
    </div>`).join('');
  const q = (s.menuQ || '').trim().toLowerCase();
  const matches = s.chats.filter(x => !q || [label(x), x.repo, x.agent].some(v => v.toLowerCase().includes(q)));
  const filter = s.chats.length > 8 ? `<input class="menu-filter" id="menu-filter" placeholder="Filter ${s.chats.length} open chats" value="${esc(s.menuQ || '')}" aria-label="Filter open chats">` : '';
  const menu = s.menu ? `<div class="menu" role="menu" style="right: 8px; top: 82px;">${filter}${matches.map(listItem).join('') || '<div class="notice" style="padding: 8px">No open chat matches.</div>'}</div>` : '';
  return `${headerHTML(c)}
    <div class="tabs" role="tablist" aria-label="Open chats">
      <div class="tabs-scroll" id="tabs-scroll">${tabs}</div>
      <button class="iconbtn add" data-act="new" aria-label="New chat" title="New chat (Ctrl+T)">${icon('plus')}</button>
      <button class="iconbtn overflow" id="tabs-more" data-act="menu" aria-label="All ${s.chats.length} open chats" title="All open chats" hidden><span class="mark" id="tabs-more-mark"></span>${s.chats.length}${icon('chevron', 'sm')}</button>
    </div>
    <div class="main">${chatBody(c)}</div>${menu}${overlaysHTML()}`;
}
function listScreen() {
  const c = cur();
  const busy = s.chats.filter(x => x.stream).length, unread = s.chats.filter(x => x.unread).length;
  return `${headerHTML(c)}
    <div class="rail-wrap">
      <aside class="rail" aria-label="Open chats">
        <div class="rail-head"><span class="n">Open chats · ${s.chats.length}</span><button class="iconbtn" data-act="new" aria-label="New chat" title="New chat (Ctrl+T)">${icon('plus')}</button></div>
        <div class="rail-list" role="tablist" aria-orientation="vertical">${s.chats.map(listItem).join('')}</div>
        <div class="rail-foot"><span>Replying<b>${busy}</b></span><span>New replies<b>${unread}</b></span></div>
      </aside>
      <div class="main">${chatBody(c)}</div>
    </div>${overlaysHTML()}`;
}
function settingsScreen() {
  const opt = (v, ic, text) => `<button role="radio" aria-checked="${s.layout === v}" data-layout="${v}">${icon(ic, 'sm')}${text}</button>`;
  return `<div class="head"><span class="crumb">Settings</span><span class="crumb-sub">/ General</span></div>
    <div class="settings">
      <nav class="set-nav"><div class="on">General</div><div>Notifications</div><div>Agents</div><div>About</div></nav>
      <div class="set-body"><div class="set-inner">
        <h1>General</h1>
        <div><div class="group-title">Database</div><div class="group-box"><div class="srow"><div class="txt"><span class="lbl">Database file</span><span class="desc">Current database: runtime default</span></div><span class="pill">~/.skill-bill/skill-bill.db</span></div></div></div>
        <div><div class="group-title">New task</div><div class="group-box">
          <div class="srow new"><div class="txt"><span class="lbl">Open chats</span><span class="desc">Show the chats you have open as tabs above the chat, or as a list beside it.</span></div>
            <div class="seg" role="radiogroup" aria-label="Open chats">${opt('tabs', 'tabs', 'Tabs')}${opt('list', 'list', 'Side list')}</div></div>
        </div></div>
        <div><div class="group-title">History retention</div><div class="group-box"><div class="srow"><div class="txt"><span class="lbl">Keep finished work for</span><span class="desc">How long History and the tray list finished work.</span></div>
          <div class="seg"><button>1 day</button><button aria-checked="true">7 days</button><button>30 days</button><button>Forever</button></div></div></div></div>
        <div><div class="group-box"><div class="srow"><div class="txt"><span class="lbl">Start at login</span><span class="desc">Keeps the tray icon running in the background.</span></div><span class="toggle"></span></div></div></div>
      </div></div>
    </div>`;
}

/* Tab strip overflow: fades on clipped edges, and the chevron appears only when tabs are hidden.
   Its dot lights when a hidden tab is replying or has a new reply. */
function updateOverflow() {
  const ts = document.getElementById('tabs-scroll'); if (!ts) return;
  const over = ts.scrollWidth > ts.clientWidth + 1;
  ts.classList.toggle('fade-l', over && ts.scrollLeft > 1);
  ts.classList.toggle('fade-r', over && ts.scrollLeft + ts.clientWidth < ts.scrollWidth - 1);
  const more = document.getElementById('tabs-more');
  more.hidden = !over;
  const box = ts.getBoundingClientRect();
  const hidden = [...ts.querySelectorAll('.tab')].filter(el => { const r = el.getBoundingClientRect(); return r.right > box.right - 8 || r.left < box.left + 8; }).map(el => byId(+el.dataset.focus));
  const busy = hidden.some(c => c.stream), unread = hidden.some(c => c.unread);
  document.getElementById('tabs-more-mark').innerHTML = unread ? '<span class="unread"></span>' : busy ? '<span class="spin"></span>' : '';
}
window.addEventListener('resize', updateOverflow);

/* ---------- Render and events ---------- */
const stage = document.getElementById('stage');
function render(focus) {
  const a = document.activeElement;
  const keep = a && (a.tagName === 'TEXTAREA' || a.id === 'menu-filter') ? { id: a.id, start: a.selectionStart, end: a.selectionEnd } : null;
  const scrolls = {};
  stage.querySelectorAll('.transcript').forEach(t => { scrolls[t.id] = t.scrollHeight - t.scrollTop - t.clientHeight < 24 ? 'bottom' : t.scrollTop; });
  const tabScroll = document.getElementById('tabs-scroll')?.scrollLeft;

  stage.innerHTML = s.view === 'settings' ? settingsScreen() : s.layout === 'list' ? listScreen() : tabsScreen();

  stage.querySelectorAll('.transcript').forEach(t => { const v = scrolls[t.id]; t.scrollTop = v === undefined || v === 'bottom' ? t.scrollHeight : v; });
  const ts = document.getElementById('tabs-scroll');
  if (ts) {
    if (tabScroll != null) ts.scrollLeft = tabScroll;
    ts.querySelector('.tab.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    ts.addEventListener('scroll', updateOverflow);
    ts.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { ts.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
    updateOverflow();
  }
  if (keep && document.getElementById(keep.id)) { const el = document.getElementById(keep.id); el.focus(); el.setSelectionRange(keep.start, keep.end); }
  else if (focus === 'composer' && s.view === 'newtask') document.getElementById(`composer-${cur().id}`)?.focus();

  const shortcuts = s.view === 'settings' ? '' : ' <span class="kbd">In this mock, use Alt instead of Ctrl; the browser keeps Ctrl+T, Ctrl+W and Ctrl+Tab.</span>';
  document.getElementById('note').innerHTML = VIEWS[viewKey()].note + shortcuts;
  document.getElementById('nav-count').textContent = s.chats.length > 1 ? s.chats.length : '';
  document.querySelectorAll('.appnav [data-view]').forEach(n => n.classList.toggle('on', n.dataset.view === s.view));
  document.querySelectorAll('#designs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === viewKey()));
  document.getElementById('scenario').disabled = s.view === 'settings';
  history.replaceState(null, '', `#layout=${s.layout}&view=${s.view}&state=${s.scenario}`);
}

stage.addEventListener('click', e => {
  const layout = e.target.closest('[data-layout]');
  if (layout) { s.layout = layout.dataset.layout; render(); return; }
  const close = e.target.closest('[data-close]');
  if (close) { e.stopPropagation(); askClose(+close.dataset.close); return; }
  const saved = e.target.closest('[data-saved]');
  if (saved) { reopen(s._saved[+saved.dataset.saved]); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  const chatOf = el => byId(+el.closest('[data-chat]').dataset.chat);
  switch (act) {
    case 'new': newChat(); return;
    case 'menu': s.menu = !s.menu; s.menuQ = ''; render(); document.getElementById('menu-filter')?.focus(); document.querySelector('.menu .ritem.on')?.scrollIntoView({ block: 'nearest' }); return;
    case 'send': send(chatOf(e.target)); return;
    case 'stop': stopStream(chatOf(e.target)); render(); return;
    case 'cancel-close': s.confirm = null; render(); return;
    case 'confirm-close': closeChat(s.confirm); return;
    case 'discard': { const c = cur(); stopStream(c); removeChat(c); s.toast = null; render('composer'); return; }
    case 'undo-close': { const c = s.toast.chat; s.chats.push(c); s.toast = null; focusChat(c.id); return; }
  }
  const f = e.target.closest('[data-focus]');
  if (f) { focusChat(+f.dataset.focus); return; }
  if (s.menu && !e.target.closest('.menu')) { s.menu = false; render(); }
  if (e.target.closest('.menu')) return;
});
stage.addEventListener('input', e => {
  if (e.target.id === 'menu-filter') { s.menuQ = e.target.value; render(); return; }
  if (!e.target.dataset.chat) return;
  const c = byId(+e.target.dataset.chat);
  c.draft = e.target.value;
  const btn = stage.querySelector(`.send[data-chat="${c.id}"]`);
  if (btn && !c.stream) btn.disabled = !c.draft.trim();
});
document.addEventListener('keydown', e => {
  if (e.target.dataset?.chat && e.key === 'Enter' && !e.shiftKey && !e.altKey) { e.preventDefault(); send(byId(+e.target.dataset.chat)); return; }
  if (e.key === 'Escape') { if (s.confirm) { s.confirm = null; render(); } else if (s.menu) { s.menu = false; render(); } return; }
  if (!e.altKey || s.view !== 'newtask') return;
  const k = e.key.toLowerCase();
  if (k === 't') { e.preventDefault(); newChat(); }
  else if (k === 'w') { e.preventDefault(); askClose(cur().id); }
  else if (k === 'tab' || k === ']' || k === '[') { e.preventDefault(); cycle(e.shiftKey || k === '[' ? -1 : 1); }
  else if (/^[1-9]$/.test(k)) { e.preventDefault(); const c = s.chats[Math.min(+k, s.chats.length) - 1]; if (c) focusChat(c.id); }
});
document.querySelector('.appnav').addEventListener('click', e => {
  const n = e.target.closest('[data-view]');
  if (n) { s.view = n.dataset.view; render('composer'); }
});

const designs = document.getElementById('designs');
designs.innerHTML = Object.entries(VIEWS).map(([k, d]) => `<button data-d="${k}">${d.label}</button>`).join('');
designs.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d === 'settings') s.view = 'settings'; else { s.view = 'newtask'; s.layout = b.dataset.d; }
  render('composer');
});
const sel = document.getElementById('scenario');
sel.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}" ${k === s.scenario ? 'selected' : ''}>${v}</option>`).join('');
sel.addEventListener('change', () => { s.scenario = sel.value; applyScenario(); render(); });
document.getElementById('reset').addEventListener('click', () => { applyScenario(); render(); });
window.addEventListener('hashchange', () => {
  const p = new URLSearchParams(location.hash.slice(1));
  s.layout = p.get('layout') === 'list' ? 'list' : 'tabs';
  s.view = p.get('view') === 'settings' ? 'settings' : 'newtask';
  if (SCENARIOS[p.get('state')]) { s.scenario = p.get('state'); sel.value = s.scenario; }
  applyScenario(); render();
});

applyScenario();
render();
</script>

</body>
</html>
