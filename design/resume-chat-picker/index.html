<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New task: resume a chat</title>
<!-- Design reference only. Colors, type and spacing come from the Linear study tokens, which match SkillBillColors. All data is sample data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../linear-study/ds/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; }
  button, input, textarea, select { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .chrome-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .scenario { display: flex; align-items: center; gap: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .scenario select { height: 30px; padding: 0 var(--sp-2); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); }
  .reopen { height: 30px; padding: 0 var(--sp-3); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; }
  .note { margin: 0; max-width: 980px; color: var(--fg-muted); font-size: var(--t-sm); }
  .note b { color: var(--fg-2); font-weight: 500; }

  /* App panel */
  .window { flex: 1; min-height: 0; padding: var(--sp-2); display: flex; }
  .panel { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .head { flex: none; height: var(--header-h, 44px); display: flex; align-items: center; padding: 0 var(--sp-4); border-bottom: 1px solid var(--border-subtle); font-weight: 500; }
  .home { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: var(--sp-6); }
  .home-inner { width: 100%; max-width: 728px; margin: auto 0; display: flex; flex-direction: column; gap: var(--sp-8); }
  .home h1 { margin: 0 0 var(--sp-2); font-size: var(--t-2xl); font-weight: 500; letter-spacing: -0.01em; }
  .home p { margin: 0; color: var(--fg-muted); }
  .section-head { display: flex; justify-content: space-between; margin-bottom: var(--sp-2); font-size: var(--t-sm); font-weight: 500; color: var(--fg-muted); }
  .home-row { height: 34px; display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-2); margin: 0 calc(var(--sp-2) * -1); border-radius: var(--r-sm); color: var(--fg-2); }

  /* Composer */
  .dock { flex: none; display: flex; justify-content: center; padding: var(--sp-3) var(--sp-6) var(--sp-4); border-top: 1px solid var(--border-subtle); }
  .composer { position: relative; width: 100%; max-width: 728px; display: flex; flex-direction: column; gap: var(--sp-2); }
  .input-box { position: relative; }
  textarea.task { width: 100%; height: 64px; resize: none; padding: var(--sp-2) 10px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-sm); outline: none; display: block; }
  textarea.task:focus { border-color: var(--accent-ring); }
  .cmd { color: var(--accent-text); background: var(--accent-tint); border-radius: 3px; padding: 0 2px; font-weight: 500; }
  .fake-task { position: absolute; inset: 0; padding: var(--sp-2) 11px; pointer-events: none; }

  .spacer { flex: 1; }

  /* Shared list parts */
  .filter { flex: none; display: flex; align-items: center; gap: var(--sp-2); height: 38px; padding: 0 var(--sp-3); border-bottom: 1px solid var(--border-subtle); color: var(--fg-faint); }
  .filter input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: var(--fg); }
  .filter input::placeholder { color: var(--fg-faint); }
  .where { flex: none; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-full); font: 400 var(--t-xs) var(--font-mono); color: var(--fg-muted); }
  .list { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--sp-1); outline: none; }
  .group { position: sticky; top: calc(var(--sp-1) * -1); z-index: 1; padding: var(--sp-2) var(--sp-2) var(--sp-1); font-size: var(--t-2xs); font-weight: 500; color: var(--fg-faint); background: var(--bg-overlay); }
  .row { display: flex; align-items: center; gap: var(--sp-2); padding: 6px var(--sp-2); border-radius: var(--r-sm); color: var(--fg-2); cursor: pointer; }
  .row:hover { background: var(--bg-hover); }
  .row.active { background: var(--bg-active); color: var(--fg); }
  .row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .row .title { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .row .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .title .ico { color: var(--fg-faint); }
  .row .sub { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--t-xs); color: var(--fg-faint); white-space: nowrap; overflow: hidden; }
  .row .sub .mono { font-family: var(--font-mono); }
  .row .sub .branch { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row .when { flex: none; align-self: flex-start; padding-top: 1px; font-size: var(--t-xs); color: var(--fg-faint); }
  .row mark { background: none; color: var(--accent-text); }
  .agent-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .ag-claude { background: var(--data-1); } .ag-codex { background: var(--data-2); } .ag-cursor { background: var(--data-4); }
  .foot-keys { flex: none; display: flex; gap: var(--sp-4); align-items: center; padding: 0 var(--sp-3); height: 30px; border-top: 1px solid var(--border-subtle); font-size: var(--t-xs); color: var(--fg-faint); }
  .foot-keys kbd { font: 400 var(--t-2xs) var(--font-mono); padding: 1px 4px; border: 1px solid var(--border); border-radius: 3px; color: var(--fg-muted); margin-right: 4px; }
  .foot-keys .count { margin-left: auto; }
  .message { padding: var(--sp-6) var(--sp-4); text-align: center; font-size: var(--t-sm); color: var(--fg-muted); }
  .message b { display: block; color: var(--fg-2); font-weight: 500; margin-bottom: 2px; }
  .more { display: block; width: 100%; margin-top: var(--sp-1); height: 28px; background: none; border: 0; border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; }
  .more:hover { background: var(--bg-hover); color: var(--fg-2); }

  /* A: anchored popover */
  .pop { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 10; max-height: min(440px, 62vh); display: flex; flex-direction: column; background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-pop); overflow: hidden; }

  /* B: palette with preview */
  .scrim { position: absolute; inset: 0; z-index: 9; background: var(--scrim, rgba(0,0,0,.45)); }
  .palette { position: absolute; z-index: 10; left: 50%; top: 12%; transform: translateX(-50%); width: min(860px, calc(100% - 48px)); height: min(520px, 76%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-modal); overflow: hidden; }
  .palette .filter { grid-column: 1 / -1; height: 44px; }
  .palette .list { border-right: 1px solid var(--border-subtle); }
  .palette .foot-keys { grid-column: 1 / -1; }
  .preview { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .pv-head { flex: none; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: var(--sp-2); }
  .pv-head h2 { margin: 0; font-size: var(--t-md); font-weight: 500; line-height: 1.35; }
  .props { display: grid; grid-template-columns: 64px 1fr; gap: 2px var(--sp-3); font-size: var(--t-xs); }
  .props dt { color: var(--fg-faint); }
  .props dd { margin: 0; color: var(--fg-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .props dd.mono { font-family: var(--font-mono); }
  .pv-lines { flex: 1; min-height: 0; overflow: auto; padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); font-size: var(--t-sm); }
  .line { display: flex; flex-direction: column; gap: 2px; }
  .line .who { font-size: var(--t-2xs); font-weight: 500; color: var(--fg-faint); }
  .line .txt { color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .line.you .txt { color: var(--fg); }
  .attach { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; margin-right: 4px; border: 1px solid var(--border); border-radius: var(--r-sm); font: 400 var(--t-2xs) var(--font-mono); color: var(--fg-muted); vertical-align: 1px; }
  .pv-empty { margin: auto; text-align: center; color: var(--fg-faint); font-size: var(--t-sm); max-width: 240px; }
  .pv-foot { flex: none; display: flex; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border-subtle); }
  .btn { height: 28px; padding: 0 var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-sm); background: transparent; color: var(--fg-2); font-size: var(--t-sm); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 500; }

  /* C: one-line table */
  .pop.table { left: 50%; right: auto; transform: translateX(-50%); width: min(920px, calc(100vw - 80px)); }
  .table .row { padding: 0 var(--sp-2); height: 30px; }
  .table .cols { display: grid; grid-template-columns: 14px minmax(0, 1fr) 132px 72px 58px; gap: var(--sp-3); align-items: center; width: 100%; }
  .table .cols > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table .c-repo { font: 400 var(--t-xs) var(--font-mono); color: var(--fg-muted); }
  .table .c-agent { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--fg-muted); }
  .table .c-when { font-size: var(--t-xs); color: var(--fg-faint); text-align: right; }
  .table .list, .table .colhead { scrollbar-gutter: stable; }
  .table .colhead { flex: none; overflow: hidden; height: 26px; padding: 0 calc(var(--sp-2) + var(--sp-1)); display: flex; align-items: center; border-bottom: 1px solid var(--border-subtle); font-size: var(--t-2xs); font-weight: 500; color: var(--fg-faint); }
  .table.no-repo .cols { grid-template-columns: 14px minmax(0, 1fr) 72px 58px; }
</style>
</head>
<body>
<header class="chrome">
  <div class="chrome-row">
    <div class="designs" id="designs" role="group" aria-label="Design direction"></div>
    <label class="scenario">State <select id="scenario"></select></label>
    <button class="reopen" id="reopen">Type /resume again</button>
  </div>
  <p class="note" id="note"></p>
</header>
<main class="window"><div class="panel" id="stage"></div></main>

<script>
const ICON = {
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  terminal: '<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
};
const icon = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Sample chats, taken from the screenshot. title is the raw first message, as the app stores it today.
   minutes = age. lines = latest messages; null means an agent CLI session whose lines load on open. */
const SHOT = n => `/home/sermilion/Pictures/Screenshots/Screenshot_20261106_${n}.png`;
const RAW = [
  { t: 'when i open Specs panel (at least first time after app start) it takes a few seconds to show anything', ag: 'codex', m: 0, repo: 'SkillBill', br: 'main' },
  { t: `${SHOT('080102')} this is how the QA results header looks when the run is still going`, ag: 'codex', m: 1, repo: 'SkillBill', br: 'feat/SKILL-504-redesign-qa-results-view' },
  { t: 'can you check if current UI for QA matches the mock we did yesterday?', ag: 'claude', m: 1, repo: 'SkillBill', br: 'main' },
  { t: SHOT('072033'), ag: 'claude', m: 40, repo: 'SkillBill', br: 'main' },
  { t: `${SHOT('070915')}\n${SHOT('070921')} both of these show the same branch twice`, ag: 'claude', m: 53, repo: 'SkillBill', br: 'feat/SKILL-507-new-task-chats-across-repos' },
  { t: `${SHOT('231400')} why is the offline banner on top of the toolbar`, ag: 'claude', m: 540, repo: 'readian-android', br: 'feature/offline-sync' },
  { t: `${SHOT('230012')} spacing in the reader settings sheet`, ag: 'codex', m: 545, repo: 'readian-android', br: 'feature/reader-themes' },
  { t: SHOT('225510'), ag: 'codex', m: 560, repo: 'SkillBill', br: 'main' },
  { t: 'what do you think about showing the token cost per phase on the run page?', ag: 'claude', m: 600, repo: 'SkillBill', br: 'main' },
  { t: 'i would like to tak about Verify operation and when it should park', ag: 'claude', m: 610, repo: 'SkillBill', br: 'main' },
  { t: 'I want to discuss Planning phase and how much context it gets', ag: 'claude', m: 660, repo: 'SkillBill', br: 'main' },
  { t: 'need to run full QA of this brahc before i open the PR', ag: 'claude', m: 670, repo: 'ZeroAccount', br: '0AC-86-implement-the-new-desktop-app-onboarding-flow' },
  { t: 'i want to implement this new design for the passkey enrollment screen', ag: 'claude', m: 1200, repo: 'ZeroAccount', br: '0AC-72-passkey-enrollment' },
  { t: 'lets restart SKILL-483', ag: 'claude', m: 1380, repo: 'SkillBill', br: 'main' },
  { t: 'have we fixed skill bill ram overuse when many runs are open?', ag: 'claude', m: 1500, repo: 'SkillBill', br: 'main' },
  { t: `${SHOT('091200')} the board column counts are off by one`, ag: 'claude', m: 1560, repo: 'SkillBill', br: 'main' },
  { t: 'TWS-1 shows as monitoring, but the PR was merged an hour ago', ag: 'codex', m: 1620, repo: 'SkillBill', br: 'main' },
  { t: 'wftr-20261104-162307-wmha', ag: 'codex', m: 1700, repo: 'SkillBill', br: 'main', cli: true },
  { t: 'i want to implement new design for the specs panel selection bar', ag: 'codex', m: 1720, repo: 'SkillBill', br: 'feat/SKILL-503-specs-panel-selection-bar' },
  { t: 'wftr-20261104-062703-2dm1 exact replay of the failed audit step', ag: 'codex', m: 1800, repo: 'SkillBill', br: 'main', cli: true },
  { t: 'The live desktop app flow remains blocked on the agent picker', ag: 'cursor', m: 1850, repo: 'SkillBill', br: 'main', cli: true },
  { t: `${SHOT('083000')} boss wave 3 spawns behind the camera`, ag: 'cursor', m: 4300, repo: 'space-anime-survivors', br: 'boss-wave-3' },
  { t: 'session refresh loops when the token expires during sync', ag: 'claude', m: 5800, repo: 'ZeroAccount', br: '0AC-79-session-refresh' },
  { t: 'migrate the build to gradle 9', ag: 'codex', m: 9000, repo: 'ZeroAccount', br: 'chore/gradle-9-upgrade' },
];

/* Title cleanup: pull leading image paths out as attachments, keep the words. */
function clean(raw) {
  const paths = [];
  let rest = raw;
  const re = /^\s*(\/\S+\.(?:png|jpe?g|gif|webp))\s*/i;
  let m;
  while ((m = rest.match(re))) { paths.push(m[1]); rest = rest.slice(m[0].length); }
  rest = rest.replace(/\s+/g, ' ').trim();
  const file = p => p.split('/').pop();
  const title = rest || (paths.length ? file(paths[0]) : 'Untitled chat');
  return { title, images: paths.map(file), onlyImage: !rest && paths.length > 0 };
}
const ago = m => m < 1 ? 'just now' : m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`;
const groupOf = m => m < 8 * 60 + 2 ? 'Today' : m < 32 * 60 ? 'Yesterday' : m < 7 * 1440 ? 'This week' : 'Older';

const CHATS = RAW.map((r, i) => {
  const c = clean(r.t);
  const lines = r.cli ? null : [
    { who: 'You', you: true, images: c.images, txt: c.onlyImage ? '' : c.title },
    { who: r.ag, txt: 'I looked at the screen and the code behind it. The list uses the shared menu component with no height limit, so it grows to the top of the window.' },
    { who: 'You', you: true, images: [], txt: 'ok, can we fix that and also show which repo each chat is from' },
    { who: r.ag, txt: 'Yes. I would cap the height, add a filter field and put the repository and branch under each title.' },
  ].slice(0, 2 + (i % 3));
  return { id: i, ...c, raw: r.t, agent: r.ag, minutes: r.m, repo: r.repo, branch: r.br, cli: !!r.cli, lines };
});

const DESIGNS = {
  a: { label: 'A. Anchored popover',
    note: '<b>Same place as today, built for a long list.</b> It opens above the input at the composer\'s width, stops at 440px, and gets a filter field. It lists only chats from the repository picked in the composer. Rows are two lines: the title with screenshot paths pulled out, then branch and agent. Date headers break up the list. Only the newest 30 show until you filter or press "Show all". <b>Trade-off:</b> no way to read the chat before you resume it.' },
  b: { label: 'B. Palette with preview (picked)',
    note: '<b>A centered dialog: list on the left, the last few messages on the right.</b> It lists only chats from the repository picked in the composer; the filter bar names it. Arrow keys move through chats and the preview follows. This settles "which of the five screenshot chats was it?" without resuming the wrong one. Agent CLI sessions have no saved lines, so the preview says so. <b>Trade-off:</b> biggest build, and it covers the whole page.' },
  c: { label: 'C. One-line table',
    note: '<b>Dense single-line rows with columns.</b> Title, agent, age, for the repository picked in the composer. Fits about twice as many chats as A. <b>Trade-off:</b> the branch is gone (hover shows it), and long titles cut sooner on a narrow window.' },
};
const SCENARIOS = {
  default: 'Many chats in SkillBill',
  filtered: 'Filter "qa"',
  noMatch: 'Filter with no match',
  empty: 'No saved chats',
  run: 'Run chat (one worktree)',
};

const params = new URLSearchParams(location.hash.slice(1));
const s = {
  design: DESIGNS[params.get('design')] ? params.get('design') : 'b',
  scenario: SCENARIOS[params.get('state')] ? params.get('state') : 'default',
  open: true, filter: '', active: 0, showAll: false, resumed: null,
};
const LIMIT = 30;
const REPO = 'SkillBill';

function applyScenario() {
  s.filter = { filtered: 'qa', noMatch: 'billing export' }[s.scenario] ?? '';
  s.active = 0; s.open = true; s.showAll = false; s.resumed = null;
}
const runMode = () => s.scenario === 'run';
function visible() {
  if (s.scenario === 'empty') return [];
  let list = CHATS;
  if (runMode()) list = list.filter(c => c.repo === 'SkillBill' && c.branch === 'feat/SKILL-504-redesign-qa-results-view' || c.id === 2 || c.id === 8);
  else list = list.filter(c => c.repo === REPO);
  const q = s.filter.trim().toLowerCase();
  if (q) list = list.filter(c => [c.title, c.raw, c.branch, c.agent].some(v => v.toLowerCase().includes(q)));
  return list;
}
function shown() {
  const all = visible();
  return (s.showAll || s.filter.trim()) ? all : all.slice(0, LIMIT);
}
function hi(text) {
  const q = s.filter.trim();
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + q.length))}</mark>` + esc(text.slice(i + q.length));
}

/* ---------- Pieces ---------- */
function filterHTML(placeholder) {
  const scope = `<span class="where">${icon(runMode() ? 'branch' : 'folder', 'sm')}${runMode() ? 'SKILL-504 worktree' : REPO}</span>`;
  return `<div class="filter">${icon('search')}<input id="q" value="${esc(s.filter)}" placeholder="${placeholder}" aria-label="Filter chats" role="combobox" aria-expanded="true" aria-controls="chat-list" aria-activedescendant="chat-${s.active}" autocomplete="off">${scope}</div>`;
}
function keysHTML(extra = '') {
  const total = visible().length, n = shown().length;
  const count = s.scenario === 'empty' ? '' : (n < total ? `${n} of ${total} chats` : `${total} ${total === 1 ? 'chat' : 'chats'}`);
  return `<div class="foot-keys"><span><kbd>↑↓</kbd>move</span><span><kbd>↵</kbd>resume</span><span><kbd>esc</kbd>close</span>${extra}<span class="count">${count}</span></div>`;
}
function emptyHTML() {
  if (s.scenario === 'empty') return `<div class="message"><b>No saved chats yet</b>Chats you start here show up in this list.</div>`;
  return `<div class="message"><b>No chat matches "${esc(s.filter)}"</b>The filter checks titles, branches and agents.</div>`;
}
function grouped(list, rowFn) {
  let out = '', last = null;
  list.forEach((c, i) => {
    const g = groupOf(c.minutes);
    if (g !== last) { out += `<div class="group" role="presentation">${g}</div>`; last = g; }
    out += rowFn(c, i);
  });
  return out;
}
function moreHTML() {
  const total = visible().length;
  return (!s.showAll && !s.filter.trim() && total > LIMIT) ? `<button class="more" data-act="more">Show all ${total} chats</button>` : '';
}
const titleHTML = c => `<span class="title">${c.images.length ? icon('image', 'sm') : ''}${c.cli ? icon('terminal', 'sm') : ''}<span>${hi(c.title)}</span>${c.images.length > 1 ? `<span style="color:var(--fg-faint);font-size:var(--t-xs)">+${c.images.length - 1}</span>` : ''}</span>`;

function rowTwoLine(c, i) {
  const where = '';
  return `<div class="row ${s.active === i ? 'active' : ''}" id="chat-${i}" role="option" aria-selected="${s.active === i}" data-i="${i}" title="${esc(c.raw)}">
    <div class="body">${titleHTML(c)}
      <span class="sub">${where}<span class="mono branch">${hi(c.branch)}</span><span>·</span><span class="agent-dot ag-${c.agent}"></span><span>${hi(c.agent)}</span></span>
    </div>
    <span class="when">${ago(c.minutes)}</span>
  </div>`;
}
function rowOneLine(c, i) {
  return `<div class="row ${s.active === i ? 'active' : ''}" id="chat-${i}" role="option" aria-selected="${s.active === i}" data-i="${i}" title="${esc(c.raw)}\n${esc(c.branch)}">
    <div class="cols">
      <span>${c.images.length ? icon('image', 'sm') : c.cli ? icon('terminal', 'sm') : ''}</span>
      <span>${hi(c.title)}</span>
      <span class="c-agent"><span class="agent-dot ag-${c.agent}"></span>${hi(c.agent)}</span>
      <span class="c-when">${ago(c.minutes)}</span>
    </div>
  </div>`;
}

function previewHTML(c) {
  if (!c) return `<div class="preview"><div class="pv-empty">Pick a chat to see its latest messages.</div></div>`;
  const props = `<dl class="props">
      <dt>Branch</dt><dd class="mono" title="${esc(c.branch)}">${esc(c.branch)}</dd>
      <dt>Agent</dt><dd>${esc(c.agent)} · ${ago(c.minutes) === 'just now' ? 'just now' : ago(c.minutes) + ' ago'}</dd>
    </dl>`;
  const body = c.lines
    ? c.lines.map(l => `<div class="line ${l.you ? 'you' : ''}"><span class="who">${esc(l.who)}</span><span class="txt">${(l.images || []).map(f => `<span class="attach">${icon('image', 'sm')}${esc(f)}</span>`).join('')}${esc(l.txt)}</span></div>`).join('')
    : `<div class="pv-empty">${icon('terminal')}<br>This session lives in the ${esc(c.agent)} CLI. Its messages load when you resume it.</div>`;
  return `<div class="preview">
    <div class="pv-head"><h2>${esc(c.title)}</h2>${props}</div>
    <div class="pv-lines">${body}</div>
    <div class="pv-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="resume">Resume</button></div>
  </div>`;
}

/* ---------- Page ---------- */
function pageHTML(overlay) {
  const recent = CHATS.filter(c => c.repo === REPO).slice(0, 4).map(c => `<div class="home-row">${c.images.length ? icon('image', 'sm') : ''}<span>${esc(c.title)}</span><span class="meta">${ago(c.minutes)}</span></div>`).join('');
  const typed = s.open ? '<span class="cmd">/resume</span>' : '';
  return `<div class="head">${runMode() ? 'SKILL-504 · Chat' : 'New task'}</div>
    <div class="home"><div class="home-inner">
      <div><h1>${runMode() ? 'Redesign the QA results view' : 'What should we build?'}</h1><p>${runMode() ? 'Chat with the agent about this run. /resume lists chats from this worktree only.' : 'Describe the work. Skill Bill plans it, builds it, audits it and opens the PR.'}</p></div>
      ${runMode() ? '' : `<div><div class="section-head"><span>Recent chats</span><span>${CHATS.filter(c => c.repo === REPO).length}</span></div>${recent}</div>`}
      ${s.resumed ? `<p style="color:var(--st-done)">Resumed: ${esc(s.resumed)}</p>` : ''}
    </div></div>
    <div class="dock"><div class="composer">
      <div class="input-box"><textarea class="task" aria-label="Task" readonly></textarea><div class="fake-task">${typed}</div>${s.design === 'a' || s.design === 'c' ? overlay : ''}</div>
      <div class="foot">${runMode() ? '' : `<span class="pill">${icon('folder', 'sm')}SkillBill · main</span>`}<span class="pill">claude</span><span class="spacer"></span><button class="send" disabled>Send ↵</button></div>
    </div></div>
    ${s.design === 'b' ? overlay : ''}`;
}

function overlayHTML() {
  if (!s.open) return '';
  const list = shown();
  if (s.active >= list.length) s.active = Math.max(0, list.length - 1);
  const placeholder = runMode() ? 'Filter chats in this worktree' : 'Filter by title, branch or agent';
  if (s.design === 'a') {
    const body = list.length ? grouped(list, rowTwoLine) + moreHTML() : emptyHTML();
    return `<div class="pop" role="dialog" aria-label="Resume a chat">${filterHTML(placeholder)}<div class="list" id="chat-list" role="listbox" aria-label="Saved chats">${body}</div>${keysHTML()}</div>`;
  }
  if (s.design === 'b') {
    const body = list.length ? grouped(list, rowTwoLine) + moreHTML() : emptyHTML();
    return `<div class="scrim" data-act="close"></div>
      <div class="palette" role="dialog" aria-label="Resume a chat">${filterHTML(placeholder)}
        <div class="list" id="chat-list" role="listbox" aria-label="Saved chats">${body}</div>
        ${previewHTML(list[s.active])}
        ${keysHTML()}
      </div>`;
  }
  const head = `<div class="colhead"><div class="cols"><span></span><span>Chat</span><span>Agent</span><span style="text-align:right">Updated</span></div></div>`;
  const body = list.length ? grouped(list, rowOneLine) + moreHTML() : emptyHTML();
  return `<div class="pop table no-repo" role="dialog" aria-label="Resume a chat">${filterHTML(placeholder)}${list.length ? head : ''}<div class="list" id="chat-list" role="listbox" aria-label="Saved chats">${body}</div>${keysHTML()}</div>`;
}

/* ---------- Render and events ---------- */
const stage = document.getElementById('stage');
function render(keepCaret) {
  stage.innerHTML = pageHTML(overlayHTML());
  document.getElementById('note').innerHTML = DESIGNS[s.design].note;
  document.querySelectorAll('#designs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === s.design));
  location.hash = `design=${s.design}&state=${s.scenario}`;
  const q = document.getElementById('q');
  if (q) { q.focus(); if (keepCaret != null) q.setSelectionRange(keepCaret, keepCaret); }
  document.getElementById(`chat-${s.active}`)?.scrollIntoView({ block: 'nearest' });
}
function resume() {
  const c = shown()[s.active];
  if (!c) return;
  s.resumed = c.title; s.open = false; render();
}

stage.addEventListener('click', e => {
  const row = e.target.closest('[data-i]');
  if (row) {
    s.active = +row.dataset.i;
    if (s.design === 'b' && e.detail < 2) { render(); return; }
    resume(); return;
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'more') { s.showAll = true; render(); }
  if (act === 'resume') resume();
  if (act === 'close') { s.open = false; render(); }
});
stage.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  s.filter = e.target.value; s.active = 0; render(e.target.selectionStart);
});
document.addEventListener('keydown', e => {
  if (!s.open) return;
  const n = shown().length;
  if (e.key === 'ArrowDown') { s.active = Math.min(n - 1, s.active + 1); e.preventDefault(); render(document.getElementById('q')?.selectionStart); }
  else if (e.key === 'ArrowUp') { s.active = Math.max(0, s.active - 1); e.preventDefault(); render(document.getElementById('q')?.selectionStart); }
  else if (e.key === 'Enter') { e.preventDefault(); resume(); }
  else if (e.key === 'Escape') { s.open = false; render(); }
});

const designs = document.getElementById('designs');
designs.innerHTML = Object.entries(DESIGNS).map(([k, d]) => `<button data-d="${k}">${d.label}</button>`).join('');
designs.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; s.design = b.dataset.d; applyScenario(); render(); });
const sel = document.getElementById('scenario');
sel.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}" ${k === s.scenario ? 'selected' : ''}>${v}</option>`).join('');
sel.addEventListener('change', () => { s.scenario = sel.value; applyScenario(); render(); });
document.getElementById('reopen').addEventListener('click', () => { applyScenario(); render(); });

applyScenario();
render();
</script>
</body>
</html>
