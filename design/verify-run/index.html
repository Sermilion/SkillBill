<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify run detail</title>
<!-- Design reference only. Colors, type and spacing come from the Linear study tokens, which match SkillBillColors. Four scenarios use real feature_verify_workflows rows with home directories anonymized; "Running" is derived from a real row and "Approve with fixes" is sample data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../linear-study/ds/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }
  :focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
  code, .mono { font: 400 var(--t-xs) var(--font-mono); }
  code { color: var(--fg-2); background: var(--bg-active); padding: 1px 4px; border-radius: var(--r-xs); overflow-wrap: anywhere; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); font-size: var(--t-sm); }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .scenario { display: flex; align-items: center; gap: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .scenario select { height: 30px; padding: 0 var(--sp-2); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); }
  .chrome-btn { height: 30px; padding: 0 var(--sp-3); background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); }
  .chrome-btn:hover { color: var(--fg); background: var(--bg-hover); }

  .stage { flex: 1; min-height: 0; display: flex; gap: var(--sp-6); padding: var(--sp-3) var(--sp-4) var(--sp-4); overflow: auto; }
  .column { flex: none; width: 640px; display: flex; flex-direction: column; gap: 6px; min-height: 640px; }
  .column-label { flex: none; font-size: var(--t-xs); font-weight: 500; color: var(--fg-faint); }
  .notes { flex: 1 1 380px; min-width: 320px; max-width: 520px; overflow: auto; padding: 18px var(--sp-1) 0; font-size: var(--t-sm); color: var(--fg-muted); }
  .notes h2 { margin: 0 0 var(--sp-2); font-size: var(--t-sm); font-weight: 500; color: var(--fg); }
  .notes section + section { margin-top: var(--sp-5); }
  .notes ul { margin: 0; padding: 0 0 0 var(--sp-4); display: flex; flex-direction: column; gap: 6px; }
  .notes p { margin: 0 0 var(--sp-2); }
  .notes b { color: var(--fg-2); font-weight: 500; }
  .src { width: 100%; border-collapse: collapse; font-size: var(--t-xs); }
  .src td { padding: 5px 6px 5px 0; vertical-align: top; border-top: 1px solid var(--border-subtle); }
  .src td:first-child { color: var(--fg-2); white-space: nowrap; }
  .tag { display: inline-block; padding: 0 5px; border-radius: var(--r-xs); font-size: var(--t-2xs); line-height: 16px; background: var(--bg-active); color: var(--fg-muted); white-space: nowrap; }
  .tag.stored { background: rgba(63, 185, 80, 0.12); color: var(--st-done); }
  .tag.new { background: var(--accent-tint); color: var(--accent-text); }
  .tag.missing { background: rgba(248, 81, 73, 0.12); color: var(--st-failed); }

  /* Details pane */
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .head { flex: none; height: var(--header-h); display: flex; align-items: center; padding: 0 var(--sp-2) 0 var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
  .head h1 { margin: 0; font-size: var(--t-base); font-weight: 500; flex: 1; }
  .iconbtn { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; background: transparent; border: 0; border-radius: var(--r-sm); color: var(--fg-muted); }
  .iconbtn:hover { background: var(--bg-active); color: var(--fg); }
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: var(--sp-4) var(--sp-4) var(--sp-8); }

  /* Document header */
  .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: var(--sp-2); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-full); font-size: var(--t-xs); color: var(--fg-2); }
  .pill .dot { width: 7px; height: 7px; }
  .keytxt { font: 500 var(--t-xs) var(--font-mono); color: var(--fg-muted); }
  .title { margin: 0 0 6px; font-size: var(--t-xl); font-weight: 600; letter-spacing: -0.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px var(--sp-4); font-size: var(--t-sm); color: var(--fg-muted); margin-bottom: var(--sp-3); }
  .meta span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .meta .mono { color: var(--fg-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: var(--t-sm); color: var(--fg-2); }
  .btn:hover { background: var(--bg-overlay); color: var(--fg); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .chip { height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); font: 400 var(--t-2xs) var(--font-mono); color: var(--fg-2); }
  .chip:hover { border-color: var(--border-strong); color: var(--fg); }
  .link { background: none; border: 0; padding: 0; color: var(--accent-text); font-size: inherit; }
  .link:hover { text-decoration: underline; }
  .st-body .link { align-self: flex-start; }

  .banner { display: flex; gap: var(--sp-2); align-items: flex-start; padding: 10px var(--sp-3); border-radius: var(--r-md); font-size: var(--t-sm); margin: var(--sp-3) 0 0; border: 1px solid; }
  .banner.info { background: var(--accent-tint); border-color: rgba(113, 112, 255, 0.35); color: var(--fg-2); }
  .banner.warn { background: rgba(210, 153, 34, 0.08); border-color: rgba(210, 153, 34, 0.35); color: var(--fg-2); }
  .banner .ico { margin-top: 2px; }
  .banner b { color: var(--fg); font-weight: 500; }
  .banner .grow { flex: 1; }

  /* Outcome card */
  .outcome { margin-top: var(--sp-5); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-raised); overflow: hidden; }
  .outcome-top { display: flex; gap: var(--sp-3); padding: var(--sp-4); border-left: 3px solid var(--tone, var(--fg-faint)); }
  .outcome-icon { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); }
  .outcome-icon .ico { width: 18px; height: 18px; stroke-width: 2; }
  .outcome-main { flex: 1; min-width: 0; }
  .outcome-label { font-size: var(--t-xs); color: var(--fg-faint); margin-bottom: 1px; }
  .outcome-verdict { font-size: var(--t-lg); font-weight: 600; color: var(--tone); letter-spacing: 0.01em; }
  .outcome-when { font-size: var(--t-xs); color: var(--fg-faint); text-align: right; white-space: nowrap; }
  .outcome-when b { display: block; font-size: var(--t-sm); color: var(--fg-2); font-weight: 500; }
  .outcome-text { margin: var(--sp-2) 0 0; color: var(--fg-2); font-size: var(--t-sm); line-height: 1.5; }
  .score { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border-subtle); }
  .score-cell { padding: 10px var(--sp-3); min-width: 0; background: transparent; border: 0; border-right: 1px solid var(--border-subtle); text-align: left; color: inherit; }
  .score-cell:last-child { border-right: 0; }
  .score-cell:hover { background: var(--bg-hover); }
  .score-k { font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); font-family: var(--font-mono); }
  .score-v { font-size: var(--t-md); font-weight: 600; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
  .score-v small { font-size: var(--t-sm); font-weight: 400; color: var(--fg-muted); }
  .score-s { font-size: var(--t-xs); color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: flex; height: 4px; gap: 2px; border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; min-width: 3px; }
  .bar.empty { background: var(--bg-inset); }

  .tone-done { --tone: var(--st-done); color: var(--st-done); }
  .tone-failed { --tone: var(--st-failed); color: var(--st-failed); }
  .tone-blocked { --tone: var(--st-blocked); color: var(--st-blocked); }
  .tone-active { --tone: var(--st-active); color: var(--st-active); }
  .tone-accent { --tone: var(--accent-text); color: var(--accent-text); }
  .tone-faint { --tone: var(--fg-faint); color: var(--fg-muted); }
  .bg-done { background: var(--st-done); } .bg-failed { background: var(--st-failed); } .bg-blocked { background: var(--st-blocked); } .bg-faint { background: var(--border-strong); } .bg-accent { background: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }

  /* Sections */
  .sec { margin-top: var(--sp-6); }
  .sec-head { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
  .sec-head h2 { margin: 0; font-size: var(--t-base); font-weight: 500; }
  .sec-head .n { color: var(--fg-faint); font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
  .sec-head .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .seg button { height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); font-size: var(--t-xs); }
  .seg button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .sec-sub { font-size: var(--t-sm); color: var(--fg-muted); margin: -2px 0 var(--sp-3); }
  .box { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  .row + .row { border-top: 1px solid var(--border-subtle); }
  .row-head { width: 100%; display: grid; grid-template-columns: 22px 1fr auto; gap: 2px var(--sp-2); padding: 9px var(--sp-3); background: transparent; border: 0; text-align: left; align-items: start; }
  .row-head:hover { background: var(--bg-hover); }
  .row-head:focus-visible { outline-offset: -2px; }
  .row-title { min-width: 0; color: var(--fg); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .row-head[aria-expanded="true"] .row-title { display: block; }
  .row-side { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); white-space: nowrap; padding-top: 2px; }
  .row-side .chev { color: var(--fg-faint); transition: transform var(--dur-fast) var(--ease); }
  .row-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .row-body { padding: 0 var(--sp-3) var(--sp-3) 44px; font-size: var(--t-sm); color: var(--fg-2); display: flex; flex-direction: column; gap: var(--sp-2); }
  .row-body[hidden] { display: none; }
  .num { font: 500 var(--t-xs) var(--font-mono); color: var(--fg-faint); padding-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: var(--r-xs); font: 500 var(--t-2xs) var(--font-mono); letter-spacing: .03em; text-transform: uppercase; background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--tone); }
  .field-label { font-size: var(--t-xs); color: var(--fg-faint); margin-bottom: 2px; }
  .evid { display: flex; flex-wrap: wrap; gap: 4px; }
  .muted { color: var(--fg-muted); }
  .faint { color: var(--fg-faint); }
  .fold { margin-top: var(--sp-2); }
  .fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 0; font-size: var(--t-sm); color: var(--fg-muted); }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary .chev { transition: transform var(--dur-fast) var(--ease); color: var(--fg-faint); }
  .fold[open] > summary .chev { transform: rotate(90deg); }
  .fold ul { margin: 0 0 var(--sp-2); padding-left: 26px; display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); color: var(--fg-2); }

  /* Steps timeline */
  .steps { position: relative; }
  .st { position: relative; display: grid; grid-template-columns: 28px 1fr; }
  .st-rail { position: relative; display: flex; justify-content: center; }
  .st-rail::after { content: ""; position: absolute; top: 26px; bottom: -2px; width: 1px; background: var(--border); }
  .st:last-child .st-rail::after { display: none; }
  .st-node { position: relative; z-index: 1; margin-top: 9px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-panel); }
  .st-node .ico { width: 12px; height: 12px; stroke-width: 2.25; }
  .st-node.done { background: color-mix(in srgb, var(--st-done) 18%, var(--bg-panel)); color: var(--st-done); }
  .st-node.warn { background: color-mix(in srgb, var(--st-blocked) 18%, var(--bg-panel)); color: var(--st-blocked); }
  .st-node.bad { background: color-mix(in srgb, var(--st-failed) 18%, var(--bg-panel)); color: var(--st-failed); }
  .st-node.skip { border: 1.5px dashed var(--fg-faint); color: var(--fg-faint); }
  .st-node.pend { border: 1.5px solid var(--border-strong); }
  .st-node.run { border: 2px solid var(--st-active); }
  .st-node.run::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid rgba(63,185,80,.35); animation: pulse 1.6s var(--ease) infinite; }
  .st-node.wait { background: var(--accent-tint); color: var(--accent-text); }
  .st-node.stop { background: color-mix(in srgb, var(--st-blocked) 18%, var(--bg-panel)); color: var(--st-blocked); }
  @keyframes pulse { 0% { transform: scale(.8); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  .st-card { min-width: 0; margin: 2px 0 6px; border: 1px solid transparent; border-radius: var(--r-md); }
  .st-card.open { border-color: var(--border); background: var(--bg-raised); }
  .st-head { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 1px var(--sp-2); padding: 7px var(--sp-2); background: transparent; border: 0; border-radius: var(--r-md); text-align: left; }
  .st-head:hover { background: var(--bg-hover); }
  .st-head[disabled] { cursor: default; }
  .st-head[disabled]:hover { background: transparent; }
  .st-name { font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .st-name .idx { font: 400 var(--t-2xs) var(--font-mono); color: var(--fg-faint); }
  .st-sum { grid-column: 1 / 3; font-size: var(--t-sm); color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .st-side { font-size: var(--t-xs); color: var(--fg-faint); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .st-side .chev { transition: transform var(--dur-fast) var(--ease); }
  .st-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .st-body { padding: 2px var(--sp-3) var(--sp-3); font-size: var(--t-sm); color: var(--fg-2); display: flex; flex-direction: column; gap: var(--sp-3); }
  .st-body[hidden] { display: none; }
  .st.pending .st-name { color: var(--fg-faint); font-weight: 400; }
  .kv { display: grid; grid-template-columns: 112px 1fr; gap: 5px var(--sp-3); font-size: var(--t-sm); }
  .kv dt { color: var(--fg-faint); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .checks { display: flex; flex-direction: column; gap: 3px; }
  .check { display: flex; gap: 8px; align-items: center; }
  .dirs { display: flex; flex-direction: column; gap: 3px; }
  .dir { display: grid; grid-template-columns: minmax(0, 1fr) 120px 28px; gap: var(--sp-2); align-items: center; font-size: var(--t-xs); }
  .dir .p { font-family: var(--font-mono); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir .track { height: 6px; background: var(--bg-inset); border-radius: 3px; overflow: hidden; }
  .dir .track i { display: block; height: 100%; background: var(--data-1); border-radius: 3px; }
  .dir .c { text-align: right; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .finding { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--sp-2); padding: 8px 0; }
  .finding + .finding { border-top: 1px solid var(--border-subtle); }
  .finding .loc { font: 400 var(--t-2xs) var(--font-mono); color: var(--fg-muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .finding .desc { grid-column: 2; color: var(--fg-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; cursor: pointer; }
  .finding .desc.full { display: block; }
  .tests { display: flex; flex-direction: column; }
  .test { display: grid; grid-template-columns: 74px 1fr; gap: 2px var(--sp-2); padding: 7px 0; }
  .test + .test { border-top: 1px solid var(--border-subtle); }
  .test .what { color: var(--fg); font-weight: 500; }
  .test .why { grid-column: 2; color: var(--fg-muted); font-size: var(--t-xs); }
  .test .act { grid-column: 2; font-size: var(--t-xs); color: var(--fg-2); }
  .plan { display: grid; grid-template-columns: 74px 1fr; gap: 6px var(--sp-2); font-size: var(--t-sm); }
  .quote { margin: 0; padding: 8px var(--sp-3); border-left: 2px solid var(--border-strong); background: var(--bg-inset); border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--fg-2); font-size: var(--t-sm); white-space: pre-wrap; }
  .mini-rule { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--t-xs); color: var(--fg-faint); }
  .mini-rule::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }

  /* Today view */
  .today .chips .pill { border-radius: var(--r-full); }
  .t-metrics { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--r-md); margin-top: var(--sp-5); }
  .t-metrics > div { padding: var(--sp-3); }
  .t-metrics > div + div { border-left: 1px solid var(--border); }
  .t-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: var(--r-md); margin-top: var(--sp-2); font-family: var(--font-mono); font-size: var(--t-xs); }
  .t-grid > div { padding: 10px; }
  .t-grid > div + div { border-left: 1px solid var(--border); }
  .t-warn { display: flex; gap: 6px; align-items: center; color: var(--fg-2); font-size: var(--t-sm); margin-top: var(--sp-2); }
  .t-warn .ico { color: var(--st-blocked); }
  /* Inline QA results: same look as design/qa-results */
  .qa { display: flex; flex-direction: column; gap: var(--sp-3); }
  .qa .q-head { display: flex; align-items: center; gap: var(--sp-2); }
  .qa .verdict { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); font-weight: 500; }
  .qa .sentence { margin: 0; font-size: var(--t-base); line-height: 1.45; color: var(--fg); }
  .qa .group-label { display: flex; align-items: baseline; gap: 6px; margin: 0 0 6px; font-size: var(--t-xs); font-weight: 500; color: var(--fg-muted); }
  .qa .group-label .n { color: var(--fg-faint); font-variant-numeric: tabular-nums; font-weight: 400; }
  .qa .box { background: var(--bg-panel); }
  .qa .item + .item { border-top: 1px solid var(--border-subtle); }
  .qa .item-head { width: 100%; display: grid; grid-template-columns: 16px 1fr auto; gap: 2px var(--sp-2); padding: 10px var(--sp-3); background: transparent; border: 0; text-align: left; }
  .qa button.item-head:hover { background: var(--bg-hover); }

"criteria_summary": {
"acceptance_criteria": "1. On the first visit to contacts, prompt users without a phone on their profile to enter one and confirm that it is correct. A prefilled profile number must not be registered automatically.\n2. Request contacts permission, read the address book, normalize and hash numbers on the device, and sync them. The sync response populates the contacts screen.\n3. Show two users as contacts only when each has the other's phone number in their uploaded address book. If either removes the other's number and syncs again, the friendship disappears for both.\n4. Reject `POST /contacts/sync` with HTTP 400 when the caller has no phone on file. With a phone, each sync replaces the caller's complete uploaded hash set and is idempotent. An empty sync clears the set.\n5. Provide `GET /contacts` to reopen the same derived contacts view without uploading. Expose only profile ID, first name, and profile image for each match. The list must be available to viewer limiting in 0AC-52.\n6. Support saving, replacing, and deleting the user's phone. Saving or replacing it must update its hash atomically, remove the old hash on replacement, and make the user undiscoverable on deletion.\n7. Include `hasPhone` in the profile DTO. Keep self-asserted phone numbers unverified in v1.\n8. Cover mutual matching and removal, full replacement, phone and hash transactions, duplicate hash handling, soft deletion, and normalization and hash determinism in tests.",
"non_goals": "- Friend requests, pending states, acceptance, decline, and a request inbox.\n- Email-hash discovery, stable public handles, and QR-based adding.\n- SMS verification, blocking, and new-contact push notifications in v1.\n- A stored or pre-materialized friendship graph.\n- A separate endpoint for adding a contact by typing a phone number.",
"rollout_expectation": "",
"technical_constraints": "- Normalize phone numbers to E.164 using libphonenumber with SIM or region context on the client and equivalent defensive normalization on the server.\n- Compute `HMAC-SHA256(salt, e164_bytes)` on the device. The salt is environment-specific and shipped with the matching client build. Release builds require the production `CONTACT_HASH_SALT` secret.\n- Store the user's own phone in plaintext, but never send other people's plaintext numbers to the server. Persist uploaded address-book hashes with a unique `(profile_id, hash)` pair and delete them when the profile is deleted.\n- Derive friendship on read through mutual hash matches. Limit phone updates and contact sync per account, and cap sync uploads at approximately 5,000 hashes.\n- Use one migration for `phones` and `contact_book_hashes`. Enforce one active phone per profile and exclude soft-deleted rows.\n- The backend contacts module follows the standard five-file layout. Handlers require Swagger annotations, context as the first parameter, wrapped errors, and embedded-PostgreSQL repository tests that assert stored rows.\n- The issue contains conflicting statements about unmatched contacts. Its data model requires storing the full hashed address book, while its privacy section says unmatched hashes are discarded and its done criteria say a non-member leaves no server-side residue. It also says mutual removal dissolves the friendship for both users, while a privacy note says the other user retains their view until they also delete the number."

"- [F-001] Major | High | feature/overview/src/jvmMain/kotlin/com/zeroaccount/feature/overview/overview/ui/detail/QrImportDialog.kt:76 | **bill-kmp-code-review-architecture:** `QrScannerDialog` constructs `ZeroQrCodeParser` from `core.data` inside the composable instead of the injected domain `QrCodeParser`. Deep-link handling already uses the DI parser; this path uses a second instance with `Clock.System`. A parse-rule or clock change in one path will not apply to the other, and tests cannot substitute the parser. Concrete failure: an expired QR that the injected parser would reject can still navigate from the file-picker path, or the reverse.",
"- [F-002] Major | High | feature/overview/src/jvmMain/kotlin/com/zeroaccount/feature/overview/overview/ui/detail/QrImportDialog.kt:151 | **bill-kmp-code-review-platform-correctness:** `selectAndDecodeQrImage` shows a blocking `JFileChooser` on the Swing EDT and only skips `resume` after Compose cancellation. Dismissing the QR sheet cancels `rememberCoroutineScope` but leaves the chooser open. Choosing a file then does nothing (`continuation.isActive` is false), and a second QR click can open another chooser. Concrete failure: user closes the overlay, picks a file in the leftover dialog, and import never runs.",
"- [F-003] Major | High | composeApp/src/commonMain/kotlin/com/zeroaccount/zeroaccount/deeplink/DeepLinkBridge.kt:428 | **bill-kmp-code-review-reliability:** While a link is `AwaitingDecision`, `drain` skips it and dispatches the next pending URL. That second dispatch calls `requestExternalLeave`, which `cancel()`s the first prompt and reports `false`, dropping the first link. Concrete failure: dirty Personal data, first approval URL shows the unsaved-changes prompt, a second forwarded URL arrives, the first URL is discarded, and the second navigates after a fresh prompt. Two queued approvals while signed in are enough to trigger this.",
"- [F-004] Major | High | core/presentation/ui/src/commonMain/kotlin/com/zeroaccount/core/presentation/ui/unsavedchanges/UnsavedChangesPrompt.kt:93 | **bill-kmp-code-review-ui:** The desktop unsaved-changes prompt uses `ZeroDesktopDialog` without `onEnter`. `ZeroDialog` and non-destructive `ZeroConfirmationBottomSheet` submit on Enter; this prompt is the one sidebar and deep-link leave both use. Focus starts on the title, so the first Enter does nothing and the pending leave stays blocked until the user clicks Save or Discard.",
"- [F-005] Major | High | feature/overview/src/jvmMain/kotlin/com/zeroaccount/feature/overview/overview/ui/DesktopAvatarAction.kt:112 | **bill-kmp-code-review-ux-accessibility:** The camera control that updates the portrait is a 24dp `Surface`. Desktop tokens set a 36dp minimum, and when a portrait already exists the 80dp avatar opens preview instead of update. Pointer and assistive users miss or cannot reliably activate the only update control.",

function listItems(text, numbered) {
  const out = [];
  (text || '').split('\n').forEach(line => {
    const m = numbered ? line.match(/^\s*(\d+)[.)]\s+(.*)$/) : line.match(/^\s*[-*]\s+(.*)$/);
    if (m) out.push(numbered ? { n: +m[1], text: m[2] } : { text: m[1] });
    else if (line.trim() && out.length) out[out.length - 1].text += ' ' + line.trim();
  });
  return out;
}

function parseAudit(receipt) {
  if (!receipt) return null;
  const lines = receipt.findings;
  const res = { verdict: receipt.verdict, items: {} };
  let cur = null;
  lines.forEach(l => {
    const m = l.match(/^\[(PASS|PARTIAL|FAIL)\]\s*#(\d+):?\s*(.*)$/);
    if (m) { cur = { status: m[1], n: +m[2], evidence: [], missing: '', notFound: '' }; res.items[cur.n] = cur; return; }
    if (!cur) return;
    const t = l.trim();
    let k;
    if ((k = t.match(/^Evidence:\s*(.*)$/))) cur.evidence = [...k[1].matchAll(/`([^`]+)`/g)].map(x => x[1]).concat(k[1].includes('`') ? [] : k[1].split(/,\s*/));
    else if ((k = t.match(/^Missing[:—\s-]+(.*)$/))) cur.missing = k[1];
    else if ((k = t.match(/^Not found[:—\s-]+(.*)$/))) cur.notFound = k[1];
  });
  return res;
}

function parseFindings(receipt) {
  if (!receipt) return [];
  return receipt.findings.map(l => {
    const m = l.match(/^- \[(F-\d+)\]\s*(\w+)\s*\|\s*(\w+)\s*\|\s*([^|]+?)\s*\|\s*(.*)$/);
    if (!m) return null;
    let desc = m[5], specialist = '';
    const sp = desc.match(/\|\s*specialist=(.*)$/);
    if (sp) { specialist = sp[1]; desc = desc.slice(0, sp.index).trim(); }
    const pre = desc.match(/^\*{0,2}(bill-[a-z0-9-]+):\*{0,2}\s*/);
    if (pre) { specialist = specialist || pre[1]; desc = desc.slice(pre[0].length); }
    return { ref: m[1], severity: m[2], confidence: m[3], loc: m[4], desc, specialist: specialist.replace(/^bill-[a-z]+-code-review-/, '') };
  }).filter(Boolean);
}

function parseFlag(receipt) {
  if (!receipt) return null;
  if (receipt.verdict === 'skipped') return { verdict: 'skipped', reason: receipt.findings[0] };
  const joined = receipt.findings.join('\n');
  const at = joined.indexOf('FEATURE FLAG AUDIT');
  const body = (at >= 0 ? joined.slice(at) : joined).split('\n');
  const chatter = at > 0;
  const get = k => (body.find(l => l.startsWith(k)) || '').slice(k.length).trim();
  const checks = body.map(l => l.match(/^\[\s*(PASS|FAIL)\s*\]\s*(.*)$/)).filter(Boolean).map(m => ({ ok: m[1] === 'PASS', text: m[2] }));
  return { verdict: receipt.verdict, flag: get('Flag name:'), pattern: get('Pattern:'), issues: get('Issues:'), checks, chatter };
}

function parseTests(receipt) {
  if (!receipt) return null;
  if (receipt.verdict === 'skipped') return { skipped: receipt.findings[0] };
  const lines = receipt.findings;
  const field = k => { const l = lines.find(x => x.startsWith(`**${k}:**`)); return l ? l.slice(k.length + 5).trim() : ''; };
  const rows = lines.filter(l => l.startsWith('|') && !/^\|\s*-/.test(l) && !/^\|\s*Test or Area/.test(l)).map(l => {
    const c = l.split('|').slice(1, -1).map(s => s.trim());
    const files = [...c[3].matchAll(/\[([^\]]+)\]\(/g)].map(m => m[1]);
    return { area: c[0], verdict: c[1], confidence: c[2], files, why: c[4], action: c[5] };
  });
  const summary = lines.find(l => !l.startsWith('**') && !l.startsWith('|')) || '';
  const strip = s => s.replace(/\[([^\]]+)\]\([^)]+\)/g, '`$1`');
  return { overall: field('Overall verdict'), summary, rows, keep: strip(field('Keep')), rewrite: strip(field('Rewrite')), del: strip(field('Delete')), missing: strip(field('Missing high-value cases')) };
}

function parseQaReport(text) {
  if (!text) return null;
  const lines = text.split('\n');
  const verdict = ((lines.find(l => /^Verdict:/i.test(l)) || '').split(':')[1] || '').trim();
  const sectionOf = name => {
    const at = lines.findIndex(l => new RegExp(`^##\\s*${name}\\s*$`, 'i').test(l.trim()));
    if (at < 0) return [];
    const out = [];
    for (let i = at + 1; i < lines.length && !/^#{1,3}\s/.test(lines[i]); i++) out.push(lines[i]);
    return out;
  };
  const evidence = s => (s.match(/Evidence:\s*(.*)$/i) || [, ''])[1].split(/,\s*/).filter(Boolean);
  const noEvidence = s => s.replace(/\s*Evidence:.*$/i, '').trim();
  const coverage = sectionOf('Coverage').map(l => l.match(/^[-*]\s*([a-z][a-z0-9-]*)\s*:\s*(\w+)(?:.*reason:\s*([a-z_]+))?/)).filter(Boolean).map(m => ({ kind: m[1], verdict: m[2], reason: m[3] }));
  const assertions = sectionOf('Assertions').map(l => l.match(/^[-*]\s*\[(passed|failed|not_exercised)\]\s*([^:]+):\s*(.*)$/)).filter(Boolean)
    .map(m => ({ tag: m[1], title: m[2].trim(), detail: noEvidence(m[3]), evidence: evidence(m[3]) }));
  const findings = [];
  lines.forEach((l, i) => {
    const m = l.match(/^###\s+(QA-\d+)\s+(.*)$/);
    if (!m) return;
    const body = [];
    for (let j = i + 1; j < lines.length && !/^#{1,3}\s/.test(lines[j]); j++) body.push(lines[j]);
    const field = name => { const x = body.find(b => new RegExp(`^${name}:`, 'i').test(b.trim())); return x ? x.trim().slice(name.length + 1).trim() : ''; };
    findings.push({ id: m[1], title: m[2], steps: field('Steps'), expected: field('Expected'), observed: noEvidence(field('Observed')), evidence: evidence(field('Observed')) });
  });
  return { verdict, coverage, assertions, findings, text };
}
