  if (key === 'done') {
    state.marks.set('c:3', 'repo'); state.marks.set('c:4', 'repo');
    [['f:F-001', 'chat'], ['c:2', 'chat'], ['t:empty-address-book', 'chat'], ['c:6', 'goal']].forEach(([k, r]) => state.sel.set(k, r));
  }
}

function header(v) {
  const r = v.r, ic = v.ic;
  const status = v.r.live ? ['Running', 'tone-active'] : v.parked ? ['Awaiting you', 'tone-accent'] : v.superseded ? ['Superseded', 'tone-faint'] : v.stopped ? ['Stopped', 'tone-blocked'] : ['Finished', 'tone-done'];
  const intake = ic.intake || '';
  const isUrl = /^https?:\/\//.test(intake);
  const isSpec = intake.startsWith('spec:');
  const intakeLabel = isUrl ? intake.replace(/^https?:\/\/(www\.)?/, '').split('/').slice(0, 1)[0] + ' · ' + (intake.match(/\/issue\/([A-Z0-9]+-\d+)/) || [, ''])[1] : isSpec ? intake.slice(5) : 'Free-text intake';
  return `
    <div class="chips">
      <span class="pill ${status[1]}"><span class="dot"></span><span style="color:var(--fg-2)">${status[0]}</span></span>
      <span class="keytxt">${esc(r.issue_key || 'No issue key')}</span>
      <span class="pill">Verify</span>
    </div>
    <h2 class="title">Verify ${esc(r.issue_key || 'run')}</h2>
    <div class="meta">
      <span title="${esc(ic.repo_root)}">${ico('folder', 'sm')}<span class="mono">${esc(base(ic.repo_root || ''))}</span></span>
      <span>${ico('branch', 'sm')}<span class="mono">${esc(ic.target)}</span></span>
      <span>${ico('commit', 'sm')}<span class="mono">${short(ic.base_revision)}..${short(ic.head_revision)}</span></span>
      <span>${ico(isUrl ? 'link' : 'file', 'sm')}${isUrl ? `<button class="link" data-toast="Opens ${esc(intake)}">${esc(intakeLabel)}</button>` : `<span>${esc(intakeLabel)}</span>`}</span>
    </div>
    <div class="actions">${headerActions(v)}</div>
    ${v.superseded ? `<div class="banner info">${ico('info')}<div class="grow"><b>A newer verify run replaced this one.</b> Starting verify again for the same repository abandoned this run before you confirmed its criteria.</div><button class="btn" data-toast="Opens ${esc(v.superseded)}">Open newer run</button></div>` : ''}
    ${!v.parked && !isUrl && !isSpec && intake ? `<details class="fold"><summary>${ico('chev', 'chev sm')}Intake</summary><p class="quote">${esc(intake)}</p></details>` : ''}`;
}

function headerActions(v) {
  const changes = v.files.length ? `<button class="btn" data-toast="Opens the Changes window on ${short(v.ic.base_revision)}..${short(v.ic.head_revision)}">${ico('diff', 'sm')}Open changes <span class="faint">${v.files.length}</span></button>` : '';
  if (v.r.live) return `<button class="btn">${ico('stop', 'sm')}Stop</button>${changes}`;
  if (v.parked) return `<button class="btn primary" ${v.criteria.length ? '' : 'disabled title="No numbered criteria to audit"'}>${ico('check', 'sm')}Confirm criteria and run</button><button class="btn">${ico('edit', 'sm')}Adjust intake</button><button class="btn">${ico('x', 'sm')}Discard</button>`;
  if (v.superseded) return `<button class="btn">${ico('play', 'sm')}Run again</button>`;
  if (v.stopped) return `<button class="btn primary">${ico('resume', 'sm')}Resume from ${STEP_NAMES[v.stopStep?.step_id] || 'last step'}</button><button class="btn">${ico('play', 'sm')}Run again</button>${changes}`;
  return `<button class="btn">${ico('copy', 'sm')}Copy report</button>${changes}<button class="btn" data-toast="Starts a new Verify run on the same target and criteria, after fixes land">${ico('resume', 'sm')}Verify again</button>`;
}

function auditCounts(v) {
  const c = { PASS: 0, PARTIAL: 0, FAIL: 0 };
  if (v.audit) Object.values(v.audit.items).forEach(i => c[i.status]++);
  return c;
}

// One rule for every bar: green fine, amber needs a look, red blocking, in that order.
function scoreBar(parts) {
  const segs = parts.filter(([n]) => n > 0);
  if (!segs.length) return '<div class="bar empty"></div>';
  return `<div class="bar">${segs.map(([n, cls]) => `<i class="${cls}" style="flex:${n}"></i>`).join('')}</div>`;
}

function scoreCells(v) {
  const n = v.criteria.length;
  const c = auditCounts(v);
  const sev = v.findings.reduce((m, f) => (m[f.severity] = (m[f.severity] || 0) + 1, m), {});
  const tv = v.tests;
  const tcount = tv && tv.rows ? tv.rows.reduce((m, r) => (m[r.verdict] = (m[r.verdict] || 0) + 1, m), {}) : {};
  const cells = [];
  cells.push(`<button class="score-cell" data-jump="criteria"><div class="score-k">Criteria</div>
    <div class="score-v">${v.audit ? `${c.PASS}<small> / ${n} met</small>` : `${n}<small> extracted</small>`}</div>
    <div class="score-s">${v.audit ? [c.PARTIAL && `${c.PARTIAL} partial`, c.FAIL && `${c.FAIL} missing`].filter(Boolean).join(' · ') || 'all met' : 'not audited'}</div>
    ${scoreBar(v.audit ? [[c.PASS, 'bg-done'], [c.PARTIAL, 'bg-blocked'], [c.FAIL, 'bg-failed']] : [])}</button>`);
  cells.push(`<button class="score-cell" data-jump="code_review"><div class="score-k">Review</div>
    <div class="score-v">${v.a.code_review_receipt ? `${v.findings.length}<small> findings</small>` : '<small>—</small>'}</div>
    <div class="score-s">${v.a.code_review_receipt ? ['Nit', 'Minor', 'Major', 'Blocker'].filter(k => sev[k]).map(k => `${sev[k]} ${k.toLowerCase()}`).join(' · ') || 'clean' : v.stepMap.code_review?.status === 'running' ? '<span class="tone-active">running</span>' : 'not run'}</div>
    ${scoreBar(!v.a.code_review_receipt ? [] : v.findings.length ? [[sev.Nit || 0, 'bg-faint'], [sev.Minor || 0, 'bg-blocked'], [(sev.Major || 0) + (sev.Blocker || 0), 'bg-failed']] : [[1, 'bg-done']])}</button>`);
  cells.push(`<button class="score-cell" data-jump="unit_test_value_check"><div class="score-k">Tests</div>
    <div class="score-v">${tv ? tv.skipped ? '<small>skipped</small>' : `<small style="color:var(--fg)">${esc(tv.overall)}</small>` : '<small>—</small>'}</div>
    <div class="score-s">${tv && tv.rows ? ['Valuable', 'Weak', 'Harmful'].filter(k => tcount[k]).map(k => `${tcount[k]} ${k.toLowerCase()}`).join(' · ') : tv && tv.skipped ? 'no tests changed' : 'not run'}</div>
    ${scoreBar(tv && tv.rows ? [[tcount.Valuable || 0, 'bg-done'], [tcount.Weak || 0, 'bg-blocked'], [tcount.Harmful || 0, 'bg-failed']] : [])}</button>`);
  cells.push(`<button class="score-cell" data-jump="${v.qaOn ? 'qa' : 'feature_flag_audit'}"><div class="score-k">${v.qaOn ? 'QA' : 'Flag audit'}</div>
    <div class="score-v">${v.qaOn ? (v.qa ? (v.qa.findings.length ? `${v.qa.findings.length}<small> open</small>` : '<small style="color:var(--fg)">passed</small>') : '<small style="color:var(--fg)">pending</small>') : `<small style="color:var(--fg)">${v.flag ? (v.flag.verdict === 'skipped' ? 'skipped' : v.flag.verdict) : '—'}</small>`}</div>
    <div class="score-s">${v.qaOn ? (v.qa ? `${v.qa.assertions.filter(x => x.tag === 'passed').length} of ${v.qa.assertions.length} checks passed` : 'not run') : v.flag && v.flag.flag ? esc(v.flag.flag) : v.flag ? 'no flag required' : 'not run'}</div>
    ${scoreBar(v.qaOn
      ? (v.qa ? [['passed', 'bg-done'], ['not_exercised', 'bg-blocked'], ['failed', 'bg-failed']].map(([tag, cls]) => [v.qa.assertions.filter(x => x.tag === tag).length, cls]) : [])
      : (v.flag && v.flag.checks ? [[v.flag.checks.filter(x => x.ok).length, 'bg-done'], [v.flag.checks.filter(x => !x.ok).length, 'bg-failed']] : []))}</button>`);
  return `<div class="score">${cells.join('')}</div>`;
}

function outcome(v) {
  const r = v.r;
  if (r.live) {
    const step = r.steps.find(s => s.status === 'running');
    const idx = v.steps.indexOf(step) + 1;
    return `<div class="outcome"><div class="outcome-top tone-active"><div class="outcome-icon">${ico('play')}</div><div class="outcome-main">
      <div class="outcome-label">Step ${idx} of ${v.steps.length}</div><div class="outcome-verdict">${STEP_NAMES[step.step_id]}</div>
      <p class="outcome-text">Specialist reviewers are reading ${v.files.length} changed files. Results from earlier steps are below.</p></div>
      <div class="outcome-when"><b>4m 12s</b>running</div></div>${scoreCells(v)}</div>`;
  }
  if (v.parked) {
    const ok = v.criteria.length > 0;
    return `<div class="outcome"><div class="outcome-top ${ok ? 'tone-accent' : 'tone-blocked'}"><div class="outcome-icon">${ico(ok ? 'hand' : 'alert')}</div><div class="outcome-main">
      <div class="outcome-label">Step 2 of ${v.steps.length} · waiting for you</div><div class="outcome-verdict">${ok ? 'Confirm the criteria' : 'No criteria to audit'}</div>
      <p class="outcome-text">${ok ? `Verify extracted ${v.criteria.length} acceptance criteria. Check them before the review and audit start; the audit grades the code against exactly this list.` : 'Criteria extraction found no numbered acceptance criteria, so a confirmed run would audit nothing. Adjust the intake with the criteria pasted in, or point it at a spec file.'}</p></div>
      <div class="outcome-when"><b>${fmtTime(r.started_at)}</b>parked</div></div></div>`;
  }
  if (v.superseded || v.stopped) {
    const st = v.superseded ? v.stepMap.extract_criteria : v.stopStep;
    const idx = v.steps.findIndex(s => s.step_id === st.step_id) + 1;
    return `<div class="outcome"><div class="outcome-top tone-faint"><div class="outcome-icon">${ico(v.superseded ? 'x' : 'pause')}</div><div class="outcome-main">
      <div class="outcome-label">No verdict · stopped at step ${idx} of ${v.steps.length}</div><div class="outcome-verdict" style="color:var(--fg)">${STEP_NAMES[st.step_id]}</div>
      <p class="outcome-text">${v.superseded ? 'Abandoned while the criteria were waiting for confirmation.' : 'The run made no progress for 14 hours and was marked stale. Steps 1 to 5 finished and their results are kept below; resuming starts again at unit test value.'}</p></div>
      <div class="outcome-when"><b>${fmtTime(r.finished_at)}</b>${dur(r.started_at, r.finished_at)} after start</div></div>${v.superseded ? '' : scoreCells(v)}</div>`;
  }
  const vd = v.verdict;
  const tone = VERDICT_TONE[vd.verdict] || 'tone-faint';
  const text = vd.findings.filter(f => !f.startsWith('Warning:')).map(f => f.replace(/^\*\*[A-Z ]+\*\*\s*[—-]\s*/, '')).join(' ');
  const warn = vd.findings.find(f => f.startsWith('Warning:'));
  return `<div class="outcome"><div class="outcome-top ${tone}"><div class="outcome-icon">${ico(vd.verdict === 'APPROVE' ? 'check' : vd.verdict === 'REQUEST CHANGES' ? 'x' : 'alert')}</div><div class="outcome-main">
    <div class="outcome-label">Verdict</div><div class="outcome-verdict">${esc(vd.verdict)}</div>
    <p class="outcome-text">${inline(text)}</p>
    ${warn ? `<p class="outcome-text faint" style="font-size:var(--t-xs);display:flex;gap:6px;align-items:center">${ico('info', 'sm')} QA had open findings, so the runtime lowered APPROVE to APPROVE WITH FIXES.</p>` : ''}</div>
    <div class="outcome-when"><b>${dur(r.started_at, r.finished_at)}</b>${fmtTime(r.finished_at)}</div></div>${scoreCells(v)}</div>`;
}

// ---------- fix selection ----------
const LOC_RE = /([A-Za-z0-9_.-]+\.(?:kt|kts|swift|ts|tsx|py|java|xml|pbxproj|gradle)):(\d+)/g;
const locsIn = s => [...String(s || '').matchAll(LOC_RE)].map(m => `${m[1]}:${m[2]}`);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const canSelect = v => !v.r.live && !v.parked && !v.superseded;

function fixables(v) {
  const out = [];
  v.findings.forEach(f => out.push({ key: 'f:' + f.ref, label: f.ref, kind: 'finding', route: 'chat', locs: locsIn(base(f.loc)) }));
  if (v.audit) v.criteria.forEach(it => {
    const au = v.audit.items[it.n];
    if (au && au.status !== 'PASS') out.push({ key: 'c:' + it.n, label: '#' + it.n, kind: 'criterion', route: au.status === 'FAIL' ? 'goal' : 'chat', locs: locsIn(au.missing + ' ' + au.notFound) });
  });
  if (v.tests && v.tests.rows) v.tests.rows.forEach(r => {
    if (!/^keep\.?$/i.test(r.action.trim())) out.push({ key: 't:' + slug(r.area), label: r.area, kind: 'test', route: 'chat', locs: r.files.flatMap(locsIn) });
  });
  if (v.qa) v.qa.findings.forEach(f => out.push({ key: 'qa:' + f.id, label: f.id, kind: 'qa', route: 'chat', locs: locsIn(f.observed + ' ' + f.steps) }));
  return out;
}

function shared(v, key) {
  const me = v.fix.find(x => x.key === key);
  if (!me) return null;
  for (const loc of me.locs) {
    const others = v.fix.filter(x => x.key !== key && x.locs.includes(loc));
    if (others.length) return { loc, others };
  }
  return null;
}
function overlapHint(v, key) {
  const h = shared(v, key);
  return h ? `<span class="overlap">${ico('link', 'sm')}Same code as ${esc(h.others.map(o => o.label).join(', '))} · <code>${esc(h.loc)}</code></span>` : '';
}
function cb(v, key, label) {
  if (!canSelect(v)) return '';
  if (state.marks.has(key)) return `<span class="cb off" title="Marked, so it is left out of fixes">${ico('minus')}</span>`;
  const on = state.sel.has(key);
  return `<button class="cb" role="checkbox" aria-checked="${on}" aria-label="Select ${esc(label)}" data-sel="${esc(key)}">${on ? ico('check') : ''}</button>`;
}
function routeSeg(key) {
  if (!state.sel.has(key)) return '';
  const r = state.sel.get(key);
  return `<span class="route" role="group" aria-label="Fix with"><button data-route="${key}|chat" aria-pressed="${r === 'chat'}">Chat</button><button data-route="${key}|goal" aria-pressed="${r === 'goal'}">Goal</button></span>`;
}

function selectAll(v, kind) {
  if (!canSelect(v)) return '';
  const keys = v.fix.filter(x => x.kind === kind && !state.marks.has(x.key)).map(x => x.key);
  if (!keys.length) return '';
  const n = keys.filter(k => state.sel.has(k)).length;
  const st = n === 0 ? 'false' : n === keys.length ? 'true' : 'mixed';
  return `<button class="selall" role="checkbox" aria-checked="${st}" data-selectall="${kind}"><span class="cb">${st === 'true' ? ico('check') : st === 'mixed' ? ico('minus') : ''}</span>Select all <span class="n">${keys.length}</span></button>`;
}

function actionBar(v) {
  if (!canSelect(v) || !state.sel.size) return '';
  const items = v.fix.filter(x => state.sel.has(x.key));
  if (!items.length) return '';
  const chat = items.filter(x => state.sel.get(x.key) === 'chat');
  const goal = items.filter(x => state.sel.get(x.key) === 'goal');
  const counts = {};
  items.forEach(x => new Set(x.locs).forEach(l => { counts[l] = (counts[l] || 0) + 1; }));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const note = top && top[1] > 1 ? `${top[1]} of them touch <code>${esc(top[0])}</code>, so one agent gets them together` : '';
  return `<div class="selbar" role="region" aria-label="Selected for fixing">
    <div class="selbar-main"><b>${items.length} selected</b><span class="faint">${esc(items.map(x => x.label).join(', '))}</span>${note ? `<span class="selbar-note">${ico('link', 'sm')}<span>${note}</span></span>` : ''}</div>
    <div class="actions">${chat.length ? `<button class="btn primary" data-bar="chat">${ico('agent', 'sm')}Fix ${chat.length} in chat</button>` : ''}${goal.length ? `<button class="btn" data-bar="goal">${ico('play', 'sm')}Start goal with ${goal.length}</button>` : ''}<button class="btn" data-bar="clear">Clear</button></div></div>`;
}

function criteriaSection(v) {
  if (!v.criteria.length && !v.criteriaRaw) return '';
  if (!v.criteria.length) {
    return `<section class="sec" id="sec-criteria"><div class="sec-head"><h2>Acceptance criteria</h2><span class="n">0</span></div>
      <p class="quote">${inline(v.criteriaRaw)}</p></section>`;
  }
  const c = auditCounts(v);
  const filt = state.critFilter;
  const items = v.criteria.filter(it => {
    if (!v.audit || filt === 'all') return true;
    const st = v.audit.items[it.n]?.status;
    return filt === 'gaps' ? st !== 'PASS' : st === 'PASS';
  });
  const grid = canSelect(v) && !!v.audit;
  const rows = items.map(it => {
    const au = v.audit ? v.audit.items[it.n] : null;
    const sk = 'c:' + it.n;
    const gap = au && au.status !== 'PASS';
    const mark = state.marks.get(sk);
    const [label, tone] = mark ? [mark === 'repo' ? 'Not in this repo' : 'Spec question', 'tone-faint'] : au ? AUDIT[au.status] : [v.parked ? 'To confirm' : 'Not audited', 'tone-faint'];
    const key = 'c' + it.n;
    const open = state.open.has(key);
    const marks = grid && gap ? `<div class="marks">${mark
      ? `<span>${mark === 'repo' ? 'Left out of fixes: the work lives in another repository.' : 'Left out of fixes until the spec is settled.'}</span><button class="btn sm" data-mark="${sk}|none">Clear mark</button>`
      : `<span>Not a code gap here?</span><button class="btn sm" data-mark="${sk}|repo">Not in this repo</button><button class="btn sm" data-mark="${sk}|spec">Spec question</button>`}</div>` : '';
    const body = au ? `
      ${au.evidence.length ? `<div><div class="field-label">Evidence</div><div class="evid">${au.evidence.map(e => `<button class="chip" data-toast="Opens ${esc(e)} in the Changes window">${esc(e)}</button>`).join('')}</div></div>` : ''}
      ${au.missing ? `<div><div class="field-label">What's missing</div>${inline(au.missing)}</div>` : ''}
      ${au.notFound ? `<div><div class="field-label">Not found</div>${inline(au.notFound)}</div>` : ''}${marks}` : `<div class="muted">${v.parked ? 'The audit runs after you confirm.' : 'The completeness audit has not run yet.'}</div>`;
    return `<div class="row ${grid ? 'srow' : ''}" id="crit-${it.n}">${grid ? `<div class="sel-col">${gap ? cb(v, sk, '#' + it.n) : ''}</div>` : ''}<button class="row-head" aria-expanded="${open}" data-toggle="${key}">
      <span class="num">${it.n}</span><span class="row-title">${inline(it.text)}</span>
      <span class="row-side"><span class="badge ${tone}">${label}</span>${ico('chev', 'chev sm')}</span>${gap && grid ? overlapHint(v, sk) : ''}</button>
      ${grid ? `<div class="route-col">${routeSeg(sk)}</div>` : ''}
      <div class="row-body" ${open ? '' : 'hidden'}>${body}</div></div>`;
  }).join('');
  const ng = listItems(v.crit.non_goals), tc = listItems(v.crit.technical_constraints);
  return `<section class="sec" id="sec-criteria"><div class="sec-head"><h2>Acceptance criteria</h2><span class="n">${v.criteria.length}</span>
    ${v.audit ? `<div class="end"><div class="seg" role="group" aria-label="Filter criteria">
      <button data-filter="all" aria-pressed="${filt === 'all'}">All</button>
      <button data-filter="gaps" aria-pressed="${filt === 'gaps'}">Gaps ${c.PARTIAL + c.FAIL}</button>
      <button data-filter="met" aria-pressed="${filt === 'met'}">Met ${c.PASS}</button></div></div>` : ''}</div>
    ${v.audit ? '' : `<p class="sec-sub">${v.parked ? 'Extracted from the intake. The audit grades the code against this list once you confirm.' : v.superseded ? 'Extracted but never confirmed. The newer run extracted its own list.' : 'Extracted and confirmed. Grades appear after the completeness audit.'}</p>`}
    <div class="box">${grid && selectAll(v, 'criterion') ? `<div class="selall-row boxed">${selectAll(v, 'criterion')}</div>` : ''}${rows || '<div class="row"><div class="row-head"><span></span><span class="muted">Nothing in this filter.</span></div></div>'}</div>
    ${ng.length ? `<details class="fold"><summary>${ico('chev', 'chev sm')}Non-goals <span class="faint">${ng.length}</span></summary><ul>${ng.map(x => `<li>${inline(x.text)}</li>`).join('')}</ul></details>` : ''}
    ${tc.length ? `<details class="fold" style="margin-top:0"><summary>${ico('chev', 'chev sm')}Technical constraints <span class="faint">${tc.length}</span></summary><ul>${tc.map(x => `<li>${inline(x.text)}</li>`).join('')}</ul></details>` : ''}
    ${v.crit.rollout_expectation ? `<details class="fold" style="margin-top:0"><summary>${ico('chev', 'chev sm')}Rollout</summary><ul><li>${inline(v.crit.rollout_expectation)}</li></ul></details>` : ''}
  </section>`;
}

// ---- per-step summary and body ----
function stepInfo(v, s) {
  const a = v.a, ic = v.ic;
  const id = s.step_id;
  const pending = s.status === 'pending' && !(v.stopStep === s) && !(v.parked && id === 'extract_criteria');
  if (pending) return { sum: id === 'qa' && !v.qaOn ? 'Off for this run' : 'Not started', body: '' };
  switch (id) {
    case 'collect_inputs': return {
      sum: `<span>${esc(/^https?:/.test(ic.intake) ? 'Linear issue' : ic.intake?.startsWith('spec:') ? 'Spec file' : 'Free-text intake')}</span><span class="mono">${esc(ic.target)}</span><span>review ${esc(ic.review_mode)}</span><span>QA ${esc(ic.qa_selection)}</span>`,
      body: `<dl class="kv"><dt>Intake</dt><dd>${esc(ic.intake)}</dd><dt>Repository</dt><dd class="mono">${esc(ic.repo_root)}</dd><dt>Target</dt><dd class="mono">${esc(ic.target)}</dd>
        <dt>Range</dt><dd class="mono">${short(ic.base_revision)}..${short(ic.head_revision)}</dd><dt>Review mode</dt><dd>${esc(ic.review_mode)}</dd><dt>QA</dt><dd>${esc(ic.qa_selection)}</dd></dl>` };
    case 'extract_criteria': {
      const n = v.criteria.length, ng = listItems(v.crit.non_goals).length, tc = listItems(v.crit.technical_constraints).length;
      return { sum: n ? `<span>${n} criteria</span><span>${ng} non-goals</span><span>${tc} ${tc === 1 ? 'constraint' : 'constraints'}</span>${v.parked ? '<span class="tone-accent">waiting for your confirmation</span>' : ''}` : '<span class="tone-blocked">No numbered criteria found</span>',
        body: `<button class="link" data-jump="criteria">Show the criteria</button>` };
    }
    case 'gather_diff': {
      const dirs = groupDirs(v.files), max = dirs[0]?.[1] || 1, tests = v.files.filter(isTest).length;
      return { sum: `<span>${v.files.length} files</span><span>${tests} test files</span><span class="mono">${esc(a.diff_projection.comparison_scope.split('..').map(short).join('..'))}</span>`,
        body: `<div class="dirs">${dirs.slice(0, 7).map(([d, n]) => `<div class="dir"><span class="p">${esc(d)}</span><span class="track"><i style="width:${n / max * 100}%"></i></span><span class="c">${n}</span></div>`).join('')}
          ${dirs.length > 7 ? `<div class="dir"><span class="p faint">${dirs.length - 7} more directories</span><span></span><span class="c">${dirs.slice(7).reduce((t, d) => t + d[1], 0)}</span></div>` : ''}</div>
          <div class="actions"><button class="btn" data-toast="Opens the Changes window">${ico('diff', 'sm')}Open changes</button></div>` };
    }
    case 'feature_flag_audit': {
      const f = v.flag;
      if (f.verdict === 'skipped') return { sum: `<span>Skipped</span><span class="faint">${esc(f.reason)}</span>`, body: '', noBody: true };
      return { sum: `<span class="${f.verdict === 'pass' ? 'tone-done' : 'tone-failed'}">${f.verdict === 'pass' ? 'Passed' : 'Failed'}</span><span class="mono">${esc(f.flag)}</span><span>${f.checks.filter(c => c.ok).length}/${f.checks.length} checks</span>`,
        body: `<dl class="kv"><dt>Flag</dt><dd class="mono">${esc(f.flag)}</dd><dt>Pattern</dt><dd>${esc(f.pattern)}</dd><dt>Issues</dt><dd>${esc(f.issues)}</dd></dl>
          <div class="checks">${f.checks.map(c => `<div class="check"><span class="${c.ok ? 'tone-done' : 'tone-failed'}">${ico(c.ok ? 'check' : 'x', 'sm')}</span>${esc(c.text)}</div>`).join('')}</div>` };
    }
    case 'code_review': {
      if (s.status === 'running') return { sum: '<span class="tone-active">Reviewing</span><span>specialists run in parallel</span>', body: '', noBody: true };
      const fs = v.findings;
      const sev = fs.reduce((m, f) => (m[f.severity] = (m[f.severity] || 0) + 1, m), {});
      const vd = a.code_review_receipt.verdict.replace(/_/g, ' ');
      return { sum: `<span class="${vd.includes('changes') ? 'tone-failed' : 'tone-blocked'}">${esc(vd[0].toUpperCase() + vd.slice(1))}</span>${Object.entries(sev).map(([k, n]) => `<span>${n} ${k.toLowerCase()}</span>`).join('')}`,
        body: `<div class="finding-list">${canSelect(v) ? `<div class="selall-row">${selectAll(v, 'finding')}</div>` : ''}${fs.map(f => { const k = 'f:' + f.ref; const pick = canSelect(v); return `<div class="finding ${pick ? 'pick' : ''}" id="find-${esc(f.ref)}">${pick ? `<span>${cb(v, k, f.ref)}</span>` : ''}<span class="badge ${SEV[f.severity] || 'tone-faint'}">${esc(f.severity)}</span>
          <div class="loc"><span style="color:var(--fg-2)">${esc(f.ref)}</span><button class="chip" data-toast="Opens ${esc(f.loc)}">${esc(base(f.loc))}</button>${f.specialist ? `<span>${esc(f.specialist)}</span>` : ''}<span>${esc(f.confidence)} confidence</span>${routeSeg(k) ? `<span style="margin-left:auto">${routeSeg(k)}</span>` : ''}</div>
          <div class="desc" data-clamp>${inline(f.desc)}</div>${pick ? overlapHint(v, k) : ''}</div>`; }).join('')}</div>
          <div class="actions"><button class="btn" data-toast="Checks the code and records confirmed fixes without changing code">Verify findings</button></div>` };
    }
    case 'unit_test_value_check': {
      if (v.stopStep === s) return { sum: '<span class="tone-blocked">Stopped here</span><span>no receipt recorded</span>', body: '', noBody: true };
      const t = v.tests;
      if (t.skipped) return { sum: `<span>Skipped</span><span class="faint">${esc(t.skipped)}</span>`, body: '', noBody: true };
      const cnt = t.rows.reduce((m, r) => (m[r.verdict] = (m[r.verdict] || 0) + 1, m), {});
      const tone = { Valuable: 'tone-done', Weak: 'tone-blocked', Harmful: 'tone-failed' };
      return { sum: `<span style="color:var(--fg-2)">${esc(t.overall)}</span>${Object.entries(cnt).map(([k, n]) => `<span>${n} ${k.toLowerCase()}</span>`).join('')}`,
        body: `<div class="muted">${inline(t.summary)}</div>
          <div class="tests">${canSelect(v) ? `<div class="selall-row">${selectAll(v, 'test')}<span class="faint" style="font-size:var(--t-xs)">Keep rows are left out</span></div>` : ''}${t.rows.map(r => { const k = 't:' + slug(r.area); const pick = canSelect(v); const fixable = v.fix.some(x => x.key === k); return `<div class="test ${pick ? 'pick' : ''}">${pick ? `<span style="padding-top:1px">${fixable ? cb(v, k, r.area) : ''}</span>` : ''}<span><span class="badge ${tone[r.verdict] || 'tone-faint'}">${esc(r.verdict)}</span></span>
            <div class="what-line"><span class="what">${esc(r.area)}</span><span class="evid" style="display:inline-flex">${r.files.slice(0, 2).map(f => `<span class="chip">${esc(f)}</span>`).join('')}${r.files.length > 2 ? `<span class="faint" style="font-size:var(--t-2xs)">+${r.files.length - 2}</span>` : ''}</span>${routeSeg(k) ? `<span style="margin-left:auto">${routeSeg(k)}</span>` : ''}</div>
            <div class="why">${inline(r.why)}</div><div class="act">→ ${inline(r.action)}</div>${pick && fixable ? overlapHint(v, k) : ''}</div>`; }).join('')}</div>
          <div class="mini-rule">Plan</div>
          <div class="plan">${t.keep ? `<span class="badge tone-done">Keep</span><span>${inline(t.keep)}</span>` : ''}${t.rewrite ? `<span class="badge tone-blocked">Rewrite</span><span>${inline(t.rewrite)}</span>` : ''}${t.del && t.del !== 'None.' ? `<span class="badge tone-failed">Delete</span><span>${inline(t.del)}</span>` : ''}${t.missing ? `<span class="badge tone-accent">Add</span><span>${inline(t.missing)}</span>` : ''}</div>` };
    }
    case 'completeness_audit': {
      const c = auditCounts(v);
      return { sum: `<span class="tone-done">${c.PASS} met</span>${c.PARTIAL ? `<span class="tone-blocked">${c.PARTIAL} partial</span>` : ''}${c.FAIL ? `<span class="tone-failed">${c.FAIL} missing</span>` : ''}`,
        body: `<button class="link" data-jump="criteria">Show the graded criteria</button>` };
    }
    case 'qa': {
      const q = a.qa_report;
      if (!v.qaOn || q?.outcome === 'skipped') return { sum: '<span>Off for this run</span>', body: '', noBody: true };
      const r = v.qa;
      const passed = r.assertions.filter(x => x.tag === 'passed'), gaps = r.assertions.filter(x => x.tag === 'not_exercised');
      return { sum: `${r.findings.length ? `<span class="tone-failed">${r.findings.length} open finding${r.findings.length > 1 ? 's' : ''}</span>` : '<span class="tone-done">Passed</span>'}<span>${passed.length} of ${r.assertions.length} checks passed</span>${gaps.length ? `<span class="tone-blocked">${gaps.length} not tested</span>` : ''}`,
        body: qaResults(r, v) };
    }
    case 'verdict': {
      const vd = v.verdict;
      return { sum: `<span class="${VERDICT_TONE[vd.verdict]}">${esc(vd.verdict)}</span>`, body: '', noBody: true };
    }
  }
  return { sum: '', body: '' };
}

const QA_WORD = { passed: ['Passed', 'tone-done'], findings_open: ['Needs your review', 'tone-failed'], incomplete: ['Incomplete', 'tone-blocked'], skipped: ['Skipped', 'tone-faint'] };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function qaEvidence(paths) {
  return paths.length ? `<div class="evid">${paths.map(p => `<span class="chip file" title="${esc(p)}">${ico(/\.(png|jpe?g|mp4)$/.test(p) ? 'image' : 'file', 'sm')}${esc(base(p))}</span>`).join('')}</div>` : '';
}

function qaReportHtml(text) {
  const out = [];
  let list = null;
  const flush = () => { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } };
  const paths = h => h.replace(/~\/\.skill-bill\/qa\/[^\s,<]+/g, p => `<code>${esc(base(p))}</code>`);
  text.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line) { flush(); return; }
    if (line.startsWith('#')) { flush(); out.push(`<h3>${inline(line.replace(/^#+\s*/, ''))}</h3>`); return; }
    if (line.startsWith('- ')) { (list = list || []).push(`<li>${paths(inline(line.slice(2)))}</li>`); return; }
    flush(); out.push(`<p>${paths(inline(line))}</p>`);
  });
  flush();
  return out.join('');
}

function qaResults(r, v) {
  const pick = canSelect(v);
  const [word, tone] = QA_WORD[r.verdict] || ['Unknown', 'tone-faint'];
  const passed = r.assertions.filter(x => x.tag === 'passed');
  const gaps = r.assertions.filter(x => x.tag === 'not_exercised');
  const bits = [r.findings.length && `QA found ${plural(r.findings.length, 'problem', 'problems')}`, gaps.length && `could not test ${plural(gaps.length, 'thing', 'things')}`].filter(Boolean);
  const sentence = (bits.length ? bits.join(' and ') + '. ' : '') + (passed.length === r.assertions.length ? `All ${passed.length} checks passed.` : `${passed.length} ${passed.length === 1 ? 'check' : 'checks'} passed.`);
  const isOpen = k => state.open.has(k);
  const finding = f => {
    const k = 'q:' + f.id, o = isOpen(k), sk = 'qa:' + f.id;
    return `<div class="item ${pick ? 'srow' : ''}" id="qaf-${esc(f.id)}">${pick ? `<div class="sel-col">${cb(v, sk, f.id)}</div>` : ''}<button class="item-head" aria-expanded="${o}" data-toggle="${k}">
      <span class="glyph tone-failed">${ico('bug')}</span>
      <span class="item-title"><span class="ref">${esc(f.id)}</span>${esc(f.title)}</span>
      <span class="item-state tone-failed">Open${ico('chev', 'sm')}</span>
      ${f.observed ? `<span class="item-line">${inline(f.observed)}</span>` : ''}</button>
      ${pick ? `<div class="route-col">${routeSeg(sk)}</div>` : ''}
      ${o ? `<div class="item-body">
        ${f.expected ? `<div><div class="field-label">Expected</div>${inline(f.expected)}</div>` : ''}
        ${f.steps ? `<div><div class="field-label">Steps</div>${inline(f.steps)}</div>` : ''}
        ${qaEvidence(f.evidence)}</div>` : ''}</div>`;
  };
  const gap = g => `<div class="item"><div class="item-head"><span class="glyph tone-blocked">${ico('gap')}</span><span class="item-title">${esc(g.title)}</span><span></span><span class="item-line" style="display:block">${inline(g.detail)}</span></div></div>`;
  const fold = (k, glyph, label, preview, inner) => `<button class="q-fold" aria-expanded="${isOpen(k)}" data-toggle="${k}">${glyph}<span class="label">${esc(label)}</span><span class="preview">${esc(preview)}</span>${ico('chev', 'chev sm')}</button>${isOpen(k) ? inner : ''}`;
  const group = (label, n, inner) => `<div><div class="group-label">${esc(label)}<span class="n">${n}</span></div><div class="box">${inner}</div></div>`;
  const parts = [`<div class="q-head"><span class="verdict ${tone}"><span class="dot"></span>${esc(word)}</span></div><p class="sentence">${esc(sentence)}</p>`];
  if (r.findings.length) parts.push(`<div><div class="group-label">Needs you<span class="n">${r.findings.length}</span></div><div class="box">${pick ? `<div class="selall-row boxed">${selectAll(v, 'qa')}</div>` : ''}${r.findings.map(finding).join('')}</div></div>`);
  if (gaps.length) parts.push(group('Not tested', gaps.length, gaps.map(gap).join('')));
  const folds = [];
  if (passed.length) folds.push(`<div class="item">${fold('q:passed', `<span class="tone-done">${ico('check')}</span>`, `Passed · ${passed.length}`, passed.map(p => p.title).join(', '),
    `<div class="sublist">${passed.map(p => `<div class="sub"><b>${esc(p.title)}</b>${inline(p.detail)}${qaEvidence(p.evidence)}</div>`).join('')}</div>`)}</div>`);
  folds.push(`<div class="item">${fold('q:report', `<span class="faint">${ico('doc')}</span>`, 'Full report', "Isolation, cleanup and the agent's notes", `<div class="report">${qaReportHtml(r.text)}</div>`)}</div>`);
  parts.push(`<div class="box">${folds.join('')}</div>`);
  const cov = r.coverage.map(c => `<span><b>${esc(c.kind[0].toUpperCase() + c.kind.slice(1))}</b> ${c.verdict === 'skipped' ? (c.reason === 'empty_scope' ? 'not in scope' : 'skipped') : 'tested'}</span>`);
  if (cov.length) parts.push(`<div class="quiet">${cov.join('<span>·</span>')}</div>`);
  return `<div class="qa">${parts.join('')}</div>`;
}

function stepNode(v, s) {
  if (v.r.live && s.status === 'running') return ['run', ''];
  if (v.parked && s.step_id === 'extract_criteria') return ['wait', ico('hand')];
  if (v.stopStep === s && !v.superseded) return ['stop', ico('pause')];
  if (v.superseded && s.step_id === 'extract_criteria') return ['skip', ico('x')];
  if (s.status === 'skipped') return ['skip', ico('minus')];
  if (s.status === 'failed') return ['bad', ico('x')];
  if (s.status === 'completed') {
    const warnIds = { qa: !!(v.qa && (v.qa.findings.length || v.qa.assertions.some(x => x.tag === 'not_exercised'))), code_review: v.findings.length > 0, unit_test_value_check: !!(v.tests && v.tests.rows && v.tests.rows.some(r => r.verdict !== 'Valuable')), feature_flag_audit: v.flag && v.flag.verdict === 'fail', completeness_audit: v.audit && v.audit.verdict === 'had_gaps', verdict: v.verdict && v.verdict.verdict !== 'APPROVE' };
    if (s.step_id === 'verdict' && v.verdict?.verdict === 'REQUEST CHANGES') return ['bad', ico('x')];
    if (s.step_id === 'completeness_audit' && auditCounts(v).FAIL) return ['bad', ico('x')];
    return warnIds[s.step_id] ? ['warn', ico('alert')] : ['done', ico('check')];
  }
  return ['pend', ''];
}

function stepsSection(v) {
  const rows = v.steps.map((s, i) => {
    const info = stepInfo(v, s);
    const [node, glyph] = stepNode(v, s);
    const hasBody = info.body && !info.noBody;
    const open = hasBody && (state.allOpen || state.open.has('s-' + s.step_id));
    const pending = node === 'pend';
    return `<div class="st ${pending ? 'pending' : ''}" id="st-${s.step_id}"><div class="st-rail"><div class="st-node ${node}">${glyph}</div></div>
      <div class="st-card ${open ? 'open' : ''}"><button class="st-head" ${hasBody ? `aria-expanded="${open}" data-toggle="s-${s.step_id}"` : 'disabled'}>
        <span class="st-name"><span class="idx">${i + 1}</span>${STEP_NAMES[s.step_id]}</span>
        <span class="st-side">${s.attempt_count > 1 ? `attempt ${s.attempt_count}` : ''}${hasBody ? ico('chev', 'chev sm') : ''}</span>
        <span class="st-sum">${info.sum}</span></button>
        <div class="st-body" ${open ? '' : 'hidden'}>${info.body}</div></div></div>`;
  }).join('');
  return `<section class="sec" id="sec-steps"><div class="sec-head"><h2>Steps</h2><span class="n">${v.steps.filter(s => s.status === 'completed' || s.status === 'skipped').length} of ${v.steps.length}</span></div><div class="steps">${rows}</div></section>`;
}

function activityStub(v) {
  return `<section class="sec"><details class="fold"><summary>${ico('chev', 'chev sm')}<span style="color:var(--fg);font-weight:500">Activity</span> <span class="faint">agent output and tool calls, as today</span></summary>
    <div class="muted" style="padding:6px 0 0 20px">The existing Activity feed stays here, collapsed by default.</div></details></section>`;
}

function summarySection(v) {
  const vr = v.verdict;
  if (vr && !v.r.live && !v.stopped && !v.parked) {
    if (!vr.summary) return '';
    return `<section class="summary" aria-label="What this work does"><div class="sum-label">What this work does</div>
      <p class="sum-text">${inline(vr.summary)}</p></section>`;
  }
  if ((v.r.live || v.stopped || v.parked) && !v.superseded && v.criteria.length) {
    const first = v.criteria[0];
    return `<section class="summary" aria-label="What this work is meant to do"><div class="sum-label">What this work is meant to do <span class="faint">· from the extracted criteria</span></div>
      <p class="sum-text one" title="${esc(first.text)}">${inline(first.text)}</p>
      <div class="sum-foot">${v.criteria.length > 1 ? `${v.criteria.length - 1} more criteria below. ` : ''}${v.parked ? 'A summary of the change comes with the verdict, after you confirm.' : 'A summary of the change comes with the verdict.'}</div></section>`;
  }
  return '';
}

function renderNew(v) {
  return header(v) + summarySection(v) + outcome(v) + criteriaSection(v) + stepsSection(v) + activityStub(v) + actionBar(v);
}

function renderToday(v, sc) {
  const t = sc.today;
  return `<div class="today"><div class="chips"><span class="pill">${t.status}</span><span class="keytxt">${esc(v.r.issue_key || '')} ${esc(v.r.issue_key || '')}</span><span class="pill">operation</span>${t.status === 'Canceled' ? '<span class="pill"><span class="dot faint"></span>stale</span>' : ''}</div>
    <h2 class="title">Verify for ${esc(v.r.issue_key || '')}</h2>
    <div class="meta"><span>${ico('folder', 'sm')}${esc(v.ic.repo_root)}</span><span>${ico('branch', 'sm')}${esc(v.ic.target)}</span></div>
    <div class="actions"><button class="btn">${ico('play', 'sm')}Run again</button><button class="btn">${ico('agent', 'sm')}Choose agent</button></div>
    <div class="t-warn">${ico('alert')}This older entry has no complete launch details.</div>
    <div class="t-metrics"><div><div class="faint" style="font-size:var(--t-sm)">Step</div><div class="mono" style="font-size:var(--t-md);color:var(--fg);margin-top:6px">${t.step}</div></div>
      <div><div class="faint" style="font-size:var(--t-sm)">Total run time</div><div style="font-size:var(--t-md);margin-top:6px">${t.total}</div><div class="faint" style="font-size:var(--t-sm);margin-top:6px">${t.finished}</div></div></div>
    <div class="sec-head" style="margin-top:var(--sp-6)"><h2>Activity</h2><span class="n">1</span></div>
    <div class="t-grid"><div><div class="faint">PHASE TIME</div><div style="font-size:var(--t-md);margin:6px 0">&lt;1s</div><div class="faint">no long gaps</div></div><div><div class="faint">BLOCKS</div><div style="font-size:var(--t-md);margin:6px 0">0</div><div class="faint">none</div></div><div><div class="faint">RUNS</div><div style="font-size:var(--t-md);margin:6px 0">1</div><div class="faint">1 phase · 0 fixes</div></div><div><div class="faint">MODELS</div><div style="font-size:var(--t-md);margin:6px 0">none</div></div></div>
    <div class="box" style="margin-top:var(--sp-3)"><div class="row-head"><span class="tone-done"><span class="dot"></span></span><span class="mono">${esc(v.r.current)}</span><span></span></div></div></div>`;
}

// ---------- notes ----------
function notes(v, sc) {
  if (state.viewMode === 'today') return `<section><h2>What the screen shows today</h2><p>Every Verify run renders through the generic operation document. The runtime stores criteria, receipts and a verdict for each run, and none of it reaches this screen.</p>
    <ul><li>The issue key appears twice and the run is labelled "operation".</li><li>The step tile names one step with no position in the sequence.</li><li>Total run time shows a dash on finished runs that have <code>started_at</code> and <code>finished_at</code>.</li><li>Activity metrics use goal wording: "1 phase · 0 fixes".</li><li>A superseded run looks like a plain cancel; <code>session_notes.superseded_by</code> is never read.</li></ul></section>`;
  const T = (k, t) => `<span class="tag ${k}">${t}</span>`;
  return `
  <section><h2>Reading order</h2><p>The outcome card answers "can this merge?" first. The verdict sits next to four counts; each count jumps to its evidence. The criteria come next because they are what Verify grades. The steps list shows how the run reached the verdict, and each step opens to show its own receipt.</p></section>
  <section><h2>What this work does</h2>
    <p>Finished runs open with two or three sentences on what the change does. They come from a new <code>--- SUMMARY ---</code> block in the verdict step's output, next to the existing <code>--- VERDICT ---</code> block, stored as <code>verdict_result.summary</code>. The verdict step already reads the criteria, the diff projection and every receipt, so this adds no agent call and no extra wait.</p>
    <ul>
      <li><b>It describes the work, not the verdict.</b> The outcome card says whether the change is good, and the criteria and findings below say where it falls short. The summary is the one thing the page lacked: what the change is. A list of critical points was tried and dropped because it repeated the verdict sentence and the gaps.</li>
      <li><b>Unfinished runs</b> show one line of intent taken from the first extracted criterion. A later step could have <code>extract_criteria</code> write that line itself. Superseded runs, and finished runs recorded before the block existed, show no summary.</li>
      <li>The 0AC-85 summary here is a draft written by hand from that run's real receipts, not generated output.</li>
    </ul></section>
  <section><h2>Fixing from Verify</h2>
    <p>Fixes go through one selection and one action bar, not a Fix button per section. In 0AC-85, review finding F-001 and criteria #2, #3 and #4 all point at <code>ZeroContactsRepository.kt:87</code>, and the Empty address book test row shares <code>ZeroContactsRepositoryTest.kt:168</code> with criterion #8. A button per section would start several agents on the same line. The bar sends every selected item in one brief, and the "Same code as" hints are derived from the <code>file:line</code> references the receipts already contain.</p>
    <ul>
      <li><b>Default route per item.</b> A Missing criterion defaults to a goal, because new work needs a plan, review and QA. Partial criteria, review findings, QA findings and test rows default to chat. The Chat or Goal switch on a selected item overrides it. In this scenario #6 is switched to a goal: its gap is a phone replacement flow that does not exist yet.</li>
      <li><b>Not in this repo, Spec question.</b> These marks take a criterion out of the selection. Here #3 and #4 are marked because the server lives in another repository. Without the mark, Fix would send an agent to build a backend in the mobile app.</li>
      <li><b>Outcome bars.</b> All four count cells carry a bar with one colour rule: green fine, amber needs a look, red blocking, left to right. Review splits minor from major and blocker, tests split valuable, weak and harmful, QA splits passed, not tested and failed, and the flag audit splits passed and failed checks. A skipped or unrun step shows an empty track so the four bars stay aligned.</li>
      <li><b>Select all per section.</b> Criteria, code review, unit test value and QA each have a Select all checkbox with a count, always as the first row of the list with its checkbox in the same column as the item checkboxes. It shows mixed when part of the section is selected, and a second click clears the section. It skips marked criteria and Keep rows in the test table.</li>
      <li><b>Verify stays report-only.</b> The runtime decision log keeps edits out of every Verify step. Fix in chat and Start goal launch separate work on the verified branch and never resume this run. Verify again re-runs the audit once fixes land.</li>
      <li><b>The goal intake</b> lists the selected criteria with their evidence and missing text, and names the verified branch as the base. The operator types the issue key on the start card.</li>
    </ul></section>
  <section><h2>Where each part comes from</h2>
    <p>Every value below already sits in <code>feature_verify_workflows</code>. None of it reaches the desktop: <code>WorkDetailItem</code> has no Verify projection, so the runtime needs a <code>VerifyRunDetails</code> projection like <code>QaRunDetails</code>.</p>
    <table class="src">
      <tr><td>Verdict and sentence</td><td><code>verdict_result.verdict</code>, <code>.findings</code></td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>Work summary</td><td><code>verdict_result.summary</code> from a new verdict-step block</td><td>${T('missing', 'not stored')}</td></tr>
      <tr><td>Intake, range, mode</td><td><code>input_context</code></td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>Criteria list</td><td><code>criteria_summary.acceptance_criteria</code>, split on numbered lines</td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>Per-criterion grade</td><td><code>completeness_audit_receipt.findings</code>: <code>[PASS|PARTIAL|FAIL] #n</code>, then <code>Evidence</code>, <code>Missing</code> or <code>Not found</code></td><td>${T('new', 'parse')}</td></tr>
      <tr><td>Review findings</td><td><code>code_review_receipt.findings</code> in the register line format</td><td>${T('new', 'parse')}</td></tr>
      <tr><td>Flag audit checks</td><td><code>feature_flag_audit_receipt.findings</code>, <code>[ PASS ]</code> lines</td><td>${T('new', 'parse')}</td></tr>
      <tr><td>Test value table</td><td><code>unit_test_value_receipt.findings</code>, a Markdown table plus Keep, Rewrite, Delete and Missing lines</td><td>${T('new', 'parse')}</td></tr>
      <tr><td>Changed files</td><td><code>diff_projection.changed_files</code></td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>QA verdict</td><td><code>qa_outcome</code>, <code>qa_report.verdict</code></td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>QA findings and checks</td><td><code>qa_report.report_text</code> re-parsed with <code>QaReportParser</code></td><td>${T('new', 'parse')}</td></tr>
      <tr><td>QA evidence files</td><td>Invocation directory not stored</td><td>${T('missing', 'not stored')}</td></tr>
      <tr><td>Step status, attempts</td><td><code>steps_json</code></td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>Superseded link</td><td><code>session_notes.superseded_by</code></td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>Stale reason</td><td><code>feature_verify_sessions.stale_reason</code></td><td>${T('stored', 'stored')}</td></tr>
      <tr><td>Per-step time</td><td>No start or finish per step</td><td>${T('missing', 'not stored')}</td></tr>
      <tr><td>Shared code hints</td><td><code>file:line</code> references in review, audit and test receipts</td><td>${T('new', 'derived')}</td></tr>
      <tr><td>Item marks</td><td>Not in this repo, Spec question</td><td>${T('missing', 'not stored')}</td></tr>
      <tr><td>Criterion to finding link</td><td>No mapping between review findings and criteria</td><td>${T('missing', 'not stored')}</td></tr>
    </table></section>
  <section><h2>Data problems this turned up</h2><ul>
    <li><b>Agent narration in receipts.</b> The 0AC-86 flag audit receipt starts with "I'll audit the range…" before <code>FEATURE FLAG AUDIT</code>. The mock trims at that heading; the runtime should store only the report.</li>
    <li><b>Prose receipts.</b> Four receipts are lines of text, so the desktop would be parsing LLM output. Parsing in the runtime projection keeps that in one tested place. A structured receipt contract is better still.</li>
    <li><b>Failed extraction parks normally.</b> FP-5175 parked with "Unable to extract criteria…" as its only criterion. The mock disables Confirm when no numbered criteria exist.</li>
    <li><b>QA has no run of its own.</b> Verify runs QA inline as a step (<code>VerifyQaStep</code>), not as a standalone QA phase, so there is no QA work item and no <code>QaRunDetails</code> to link to. <code>qa_report</code> keeps only the verdict, outcome, reason, <code>report_text</code>, cleanup and warnings; the parsed findings and checks are dropped. The projection re-parses <code>qa_report.report_text</code> with <code>QaReportParser</code> and maps it with <code>QaRunDetailsMapping</code>, so the QA step renders the same results block as the QA view. Evidence shows as file names only: the QA invocation directory is not stored, so the chips cannot open files.</li>
    <li><b>No step timing.</b> The steps list shows status and attempt only. Per-step durations need <code>started_at</code> and <code>finished_at</code> on each <code>steps_json</code> entry.</li>
  </ul></section>
  <section><h2>This scenario</h2><p>${esc(sc.source)}.</p></section>`;
}

// ---------- wiring ----------
const sel = document.getElementById('scenario');
SCENARIOS.forEach(s => sel.insertAdjacentHTML('beforeend', `<option value="${s.key}">${esc(s.label)}</option>`));
function render() {
  const sc = SCENARIOS.find(s => s.key === state.scenario);
  const v = view(sc.run());
  v.fix = fixables(v);
  current = v;
  document.getElementById('source').textContent = state.viewMode === 'today' ? 'Today: generic operation document' : 'Redesign: Verify run document';
  document.getElementById('pane').innerHTML = state.viewMode === 'today' ? renderToday(v, sc) : renderNew(v);
  document.getElementById('notes').innerHTML = notes(v, sc);
  document.getElementById('expand').textContent = state.allOpen ? 'Collapse all steps' : 'Expand all steps';
}
sel.addEventListener('change', () => { state.scenario = sel.value; state.open.clear(); state.critFilter = 'all'; preset(state.scenario); render(); });
document.querySelectorAll('.designs button').forEach(b => b.addEventListener('click', () => {
  state.viewMode = b.dataset.view;
  document.querySelectorAll('.designs button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
document.getElementById('expand').addEventListener('click', () => { state.allOpen = !state.allOpen; if (!state.allOpen) [...state.open].filter(k => k.startsWith('s-')).forEach(k => state.open.delete(k)); render(); });
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
document.getElementById('pane').addEventListener('click', e => {
  const tg = e.target.closest('[data-toggle]');
  const jump = e.target.closest('[data-jump]');
  const filt = e.target.closest('[data-filter]');
  const tst = e.target.closest('[data-toast]:not([data-sel])');
  const clamp = e.target.closest('[data-clamp]');
  if (tst) { toast(tst.dataset.toast); return; }
  const pickEl = e.target.closest('[data-sel]');
  const routeEl = e.target.closest('[data-route]');
  const markEl = e.target.closest('[data-mark]');
  const allEl = e.target.closest('[data-selectall]');
  const barEl = e.target.closest('[data-bar]');
  const fixOf = k => current.fix.find(x => x.key === k);
  if (pickEl) { const k = pickEl.dataset.sel; state.sel.has(k) ? state.sel.delete(k) : state.sel.set(k, fixOf(k).route); render(); return; }
  if (routeEl) { const [k, r] = routeEl.dataset.route.split('|'); state.sel.set(k, r); render(); return; }
  if (markEl) { const [k, m] = markEl.dataset.mark.split('|'); if (m === 'none') state.marks.delete(k); else { state.marks.set(k, m); state.sel.delete(k); } render(); return; }
  if (allEl) {
    const items = current.fix.filter(x => x.kind === allEl.dataset.selectall && !state.marks.has(x.key));
    const all = items.every(x => state.sel.has(x.key));
    items.forEach(x => all ? state.sel.delete(x.key) : (!state.sel.has(x.key) && state.sel.set(x.key, x.route)));
    render(); return;
  }
  if (barEl) {
    const items = current.fix.filter(x => state.sel.has(x.key));
    const by = r => items.filter(x => state.sel.get(x.key) === r).map(x => x.label).join(', ');
    const target = current.ic.target;
    if (barEl.dataset.bar === 'clear') { state.sel.clear(); render(); return; }
    toast(barEl.dataset.bar === 'chat'
      ? `Opens agent chat on ${target} with one brief: ${by('chat')}. This Verify run stays as it is.`
      : `Opens the New task card: goal intake lists ${by('goal')} with their evidence, base ${target}. You type the issue key.`);
    return;
  }
  if (clamp) { clamp.classList.toggle('full'); return; }
  if (filt) { state.critFilter = filt.dataset.filter; render(); return; }
  if (jump) {
    const id = jump.dataset.jump;
    if (id !== 'criteria') { state.open.add('s-' + id); render(); }
    const el = document.getElementById(id === 'criteria' ? 'sec-criteria' : 'st-' + id);
    el && el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (tg) {
    const k = tg.dataset.toggle;
    if (state.allOpen && k.startsWith('s-')) { state.allOpen = false; document.querySelectorAll('[data-toggle^="s-"][aria-expanded="true"]').forEach(x => state.open.add(x.dataset.toggle)); }
    state.open.has(k) ? state.open.delete(k) : state.open.add(k);
    render();
  }
});
const qs = new URLSearchParams(location.search);
if (qs.get('scenario')) { state.scenario = qs.get('scenario'); sel.value = state.scenario; }
if (qs.get('view')) { state.viewMode = qs.get('view'); document.querySelectorAll('.designs button').forEach(x => x.setAttribute('aria-pressed', x.dataset.view === state.viewMode)); }
preset(state.scenario);
if (qs.get('open') === 'all') state.allOpen = true;
(qs.get('keys') || '').split(',').filter(Boolean).forEach(k => state.open.add(k));
render();
</script>
