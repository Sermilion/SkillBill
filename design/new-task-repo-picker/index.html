<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New task: repository and branch picker</title>
<!-- Design reference only. Colors, type and spacing come from the Linear study tokens, which match SkillBillColors. All data is sample data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../linear-study/ds/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--fg); font: 400 var(--t-base)/1.45 var(--font-sans); display: flex; flex-direction: column; }
  button, input, textarea, select { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 12px; height: 12px; }

  /* Review chrome: not part of the design */
  .chrome { flex: none; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px dashed var(--border-strong); }
  .chrome-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .designs { display: flex; gap: 2px; padding: 2px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-md); }
  .designs button { height: 26px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; font-size: var(--t-sm); display: flex; align-items: center; gap: 6px; }
  .designs button:hover { color: var(--fg); }
  .designs button[aria-pressed="true"] { background: var(--bg-overlay); color: var(--fg); }
  .pick-tag { font-size: var(--t-2xs); color: var(--accent-text); }
  .scenario { display: flex; align-items: center; gap: var(--sp-2); color: var(--fg-muted); font-size: var(--t-sm); }
  .scenario select { height: 30px; padding: 0 var(--sp-2); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-sm); }
  .note { margin: 0; max-width: 980px; color: var(--fg-muted); font-size: var(--t-sm); }
  .note b { color: var(--fg-2); font-weight: 500; }

  /* App panel */
  .window { flex: 1; min-height: 0; padding: var(--sp-2); display: flex; }
  .panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); overflow: hidden; }
  .home { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: var(--sp-6); }
  .home-inner { width: 100%; max-width: 728px; margin: auto 0; display: flex; flex-direction: column; gap: var(--sp-10); }
  .home h1 { margin: 0 0 var(--sp-2); font-size: var(--t-2xl); font-weight: 500; letter-spacing: -0.01em; }
  .home p { margin: 0; color: var(--fg-muted); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-2); font-size: var(--t-sm); font-weight: 500; color: var(--fg-muted); }
  .section-head span + span { font-weight: 400; color: var(--fg-faint); }
  .home-row { height: 36px; display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-2); margin: 0 calc(var(--sp-2) * -1); border-radius: var(--r-sm); }
  .home-row:hover { background: var(--bg-hover); }
  .home-row .key { font: 400 var(--t-sm) var(--font-mono); color: var(--fg-muted); }
  .home-row .title { font-weight: 500; }
  .home-row .why, .home-row .kind { margin-left: auto; font-size: var(--t-sm); color: var(--fg-muted); }
  .readiness { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); font-size: var(--t-sm); color: var(--fg-muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .dot.ok { background: var(--st-done); }

  /* Composer */
  .dock { flex: none; display: flex; justify-content: center; padding: var(--sp-3) var(--sp-6) var(--sp-4); border-top: 1px solid var(--border-subtle); }
  .composer { width: 100%; max-width: 728px; display: flex; flex-direction: column; gap: var(--sp-2); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 26px; padding: 0 10px; background: transparent; border: 1px solid var(--border); border-radius: var(--r-full); color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; }
  .chip:hover { background: var(--bg-hover); }
  textarea.task { width: 100%; height: 64px; resize: none; padding: var(--sp-2) 10px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-sm); outline: none; display: block; }
  textarea.task::placeholder { color: var(--fg-faint); }
  textarea.task:focus { border-color: var(--accent-ring); }
  .foot { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .spacer { flex: 1; }
  .send { flex: none; height: 26px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: var(--r-sm); font-size: var(--t-sm); font-weight: 500; cursor: pointer; }
  .send:disabled { background: var(--bg-control, #1F1F24); color: var(--fg-faint); cursor: default; }
  .send kbd { font: inherit; opacity: 0.7; }

  /* Pills */
  .anchor { position: relative; min-width: 0; display: flex; }
  .pill { height: 26px; min-width: 0; max-width: 100%; padding: 0 var(--sp-2) 0 9px; display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--border); border-radius: var(--r-full); color: var(--fg-muted); font: 400 var(--t-sm) var(--font-mono); cursor: pointer; }
  .pill:hover:not([disabled]) { background: var(--bg-hover); color: var(--fg-2); border-color: var(--border-strong); }
  .pill[aria-expanded="true"] { background: var(--bg-active); color: var(--fg); border-color: var(--border-strong); }
  .pill[disabled] { cursor: default; color: var(--fg-faint); }
  .pill.static { cursor: default; padding-right: 10px; }
  .pill.static:hover { background: transparent !important; color: var(--fg-muted) !important; border-color: var(--border) !important; }
  .pill.need { color: var(--accent-text); border-color: var(--accent-ring); }
  .pill .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pill .faint { color: var(--fg-faint); }
  .pill .chev { color: var(--fg-faint); }
  .pill:focus-visible, .chip:focus-visible, .send:focus-visible, .tab:focus-visible, .link:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
  .a-repo { flex: 0 0 auto; max-width: 190px; }
  .a-branch { flex: 0 1 auto; max-width: 240px; }
  .agent { flex: 0 100 auto; min-width: 64px; max-width: 210px; }
  .crumb { flex: 0 1 auto; max-width: 400px; }

  /* Popover */
  .pop { position: absolute; left: 0; bottom: calc(100% + 4px); z-index: 10; width: 320px; display: flex; flex-direction: column; background: var(--bg-overlay); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-pop); overflow: hidden; }
  .filter { flex: none; display: flex; align-items: center; gap: var(--sp-2); height: 36px; padding: 0 var(--sp-3); border-bottom: 1px solid var(--border-subtle); color: var(--fg-faint); }
  .filter input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: var(--fg); }
  .filter input::placeholder { color: var(--fg-faint); }
  .list { flex: 1 1 auto; min-height: 0; max-height: 296px; overflow: auto; padding: var(--sp-1); outline: none; }
  .group { padding: var(--sp-2) var(--sp-2) var(--sp-1); font-size: var(--t-2xs); font-weight: 500; color: var(--fg-faint); }
  .opt { height: 30px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2); border-radius: var(--r-sm); color: var(--fg-2); cursor: pointer; }
  .opt:hover { background: var(--bg-hover); }
  .opt.active { background: var(--bg-active); color: var(--fg); }
  .opt .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .mono { font: 400 var(--t-sm) var(--font-mono); }
  .opt .meta { margin-left: auto; flex: none; padding-left: var(--sp-2); font-size: var(--t-xs); color: var(--fg-faint); white-space: nowrap; }
  .opt .tag { flex: none; font-size: var(--t-2xs); color: var(--fg-faint); }
  .opt .tick { flex: none; width: 14px; color: var(--accent); }
  .opt .tick svg { visibility: hidden; }
  .opt[aria-selected="true"] { color: var(--fg); }
  .opt[aria-selected="true"] .tick svg { visibility: visible; }
  .action { flex: none; border-top: 1px solid var(--border-subtle); padding: var(--sp-1); }
  .action .opt { color: var(--fg-muted); }
  .message { padding: var(--sp-3); font-size: var(--t-sm); color: var(--fg-muted); }
  .message b { display: block; color: var(--fg-2); font-weight: 500; margin-bottom: 2px; }
  .problem { display: flex; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); font-size: var(--t-sm); color: var(--fg-2); border-top: 1px solid var(--border-subtle); }
  .problem svg { color: var(--st-blocked); margin-top: 2px; }
  .link { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; font-size: var(--t-sm); }
  .skeleton { height: 30px; display: flex; align-items: center; padding: 0 var(--sp-2); }
  .skeleton i { display: block; height: 8px; border-radius: 4px; background: var(--bg-active); }

  /* B: two-column popup */
  .target-panel { width: min(620px, calc(100vw - 96px)); display: grid; grid-template-columns: minmax(190px, 1fr) minmax(0, 2fr); }
  .col { min-width: 0; display: flex; flex-direction: column; height: 264px; }
  .col + .col { border-left: 1px solid var(--border-subtle); }
  .col-head { flex: none; height: 32px; padding: 0 var(--sp-3); display: flex; align-items: center; font-size: var(--t-xs); font-weight: 500; color: var(--fg-muted); border-bottom: 1px solid var(--border-subtle); }
  .col .filter { height: 32px; }
  .col .list { max-height: none; }

  /* C: repo tabs */
  .tabs-wrap { display: flex; flex-direction: column; gap: 6px; }
  .tabs { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .tab { height: 28px; flex: 0 1 auto; min-width: 0; max-width: 190px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: var(--r-sm); color: var(--fg-muted); font-size: var(--t-sm); cursor: pointer; }
  .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab:hover { background: var(--bg-hover); color: var(--fg-2); }
  .tab[aria-selected="true"] { background: var(--bg-active); color: var(--fg); font-weight: 500; box-shadow: inset 0 -1.5px 0 var(--accent); border-radius: var(--r-sm) var(--r-sm) 0 0; }
  .tab.more { flex: none; color: var(--fg-faint); }
  .more-anchor { flex: none; }
  .more-anchor .pop { left: auto; right: 0; }
  .tab.add { flex: none; width: 28px; padding: 0; justify-content: center; color: var(--fg-faint); }
  .tab.locked { cursor: default; }
  .tab-problem { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--t-sm); color: var(--fg-2); }
  .tab-problem svg { color: var(--st-blocked); }
</style>
</head>
<body>
<header class="chrome">
  <div class="chrome-row">
    <div class="designs" id="designs" role="group" aria-label="Design direction"></div>
    <label class="scenario">State
      <select id="scenario"></select>
    </label>
  </div>
  <p class="note" id="note"></p>
</header>
<main class="window"><div class="panel" id="stage"></div></main>

<script>
const ICON = {
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
};
const icon = (name, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const LONG_BRANCH = '0AC-86-implement-the-new-desktop-app-onboarding-flow';
const BASE_REPOS = [
  { name: 'SkillBill', parent: '~/IdeaProjects', def: 'main',
    local: [['feat/SKILL-464-descriptive-titles', '2h'], ['feat/SKILL-480-fix-audit-recovery-path', '1d'], ['feat/SKILL-479-goal-worktrees', '1d'], ['feat/SKILL-474-run-board-filters', '3d'], ['fix/agent-detection-timeout', '5d']],
    remote: [['origin/feat/SKILL-471-spec-inventory', '6d'], ['origin/release/0.3', '2w']] },
  { name: 'readian-android', parent: '~/AndroidStudioProjects', def: 'develop',
    local: [['feature/offline-sync', '4h'], ['feature/reader-themes', '2d'], ['fix/article-parser-crash', '6d']],
    remote: [['origin/main', '1w'], ['origin/release/2.14', '3w']] },
  { name: 'ZeroAccount', parent: '~/IdeaProjects', def: 'main',
    local: [[LONG_BRANCH, '3h'], ['0AC-79-session-refresh', '2d'], ['0AC-72-passkey-enrollment', '4d'], ['chore/gradle-9-upgrade', '1w']],
    remote: [['origin/0AC-68-audit-log-export', '2w'], ['origin/release/1.8', '1mo']] },
  { name: 'space-anime-survivors', parent: '~/Development/Games', def: 'main',
    local: [['boss-wave-3', '1d'], ['controller-remap', '1w']],
    remote: [] },
];
const EXTRA_REPOS = ['billing-service', 'design-tokens', 'infra-terraform', 'mobile-gateway', 'notes-sync', 'push-relay', 'search-indexer', 'web-console']
  .map(name => ({ name, parent: '~/Work', def: 'main', local: [['develop', '1d']], remote: [] }));

const DESIGNS = {
  a: { label: 'A. Two pickers',
    note: '<b>One pill and one short list for each choice.</b> Still a popup, but each one does a single job, so the form-inside-a-menu problem goes away. A long branch name can no longer hide the repo. <b>Trade-off:</b> you see the other repos only after a click. Smallest build, since it reuses SbPopover.' },
  b: { label: 'B. Two-column popup', tag: 'your pick',
    note: '<b>Both lists side by side in one popup.</b> It floats over the page, so nothing moves. Picking a repo keeps it open and moves to the branch list. Enter takes the default branch and closes it. Esc or a click outside also closes it, and your picks stay. <b>Trade-off:</b> it covers the input while open.' },
  c: { label: 'C. Repo tabs',
    note: '<b>Repos stay on screen.</b> One click to switch, no popup for the common case, and the wrong repo is hard to miss. Branch keeps a short list. <b>Trade-off:</b> a permanent extra row in the composer, and past five repos it needs a "more" overflow.' },
};
const SCENARIOS = {
  default: 'Default',
  longBranch: 'Long branch name',
  firstRun: 'First run, no repository',
  manyRepos: '12 repositories',
  noMatch: 'Filter with no match',
  loading: 'Reading branches',
  branchError: 'Branch list failed',
  badFolder: 'Added folder is not a repository',
  locked: 'Locked after the chat starts',
};

const params = new URLSearchParams(location.hash.slice(1));
const s = {
  design: DESIGNS[params.get('design')] ? params.get('design') : 'b',
  scenario: SCENARIOS[params.get('state')] ? params.get('state') : 'default',
  repos: [], repo: 'ZeroAccount', branch: null, open: null,
  filter: { repo: '', branch: '' }, active: { repo: 0, branch: 0 },
  addError: null, text: '', focusNext: null,
};

function applyScenario() {
  const sc = s.scenario;
  s.repos = sc === 'manyRepos' ? [...BASE_REPOS, ...EXTRA_REPOS] : [...BASE_REPOS];
  s.repo = sc === 'firstRun' ? null : 'ZeroAccount';
  s.branch = sc === 'longBranch' ? LONG_BRANCH : null;
  s.filter = { repo: '', branch: sc === 'noMatch' ? 'SKILL-999' : '' };
  s.addError = sc === 'badFolder' ? '~/Downloads/photos is not a git repository.' : null;
  const opensOn = { manyRepos: 'repo', noMatch: 'branch', loading: 'branch', branchError: 'branch', badFolder: 'repo' }[sc] ?? null;
  s.open = null;
  if (opensOn) openPicker(opensOn, sc === 'noMatch' ? 'branch' : null);
}

const currentRepo = () => s.repos.find(r => r.name === s.repo) ?? null;
const locked = () => s.scenario === 'locked';
const matches = (text, q) => text.toLowerCase().includes(q.trim().toLowerCase());

function repoItems() {
  const items = s.repos.filter(r => matches(r.name, s.filter.repo)).map(r => ({ kind: 'repo', id: r.name, repo: r }));
  items.push({ kind: 'add', id: '__add' });
  return items;
}
function branchItems() {
  const r = currentRepo();
  if (!r) return [];
  if (s.scenario === 'loading') return [];
  const q = s.filter.branch;
  const items = [];
  if (matches(r.def, q) || matches('default', q)) items.push({ kind: 'default', id: '__default', name: r.def });
  if (s.scenario === 'branchError') return items;
  r.local.filter(b => matches(b[0], q)).forEach(b => items.push({ kind: 'local', id: b[0], name: b[0], age: b[1] }));
  r.remote.filter(b => matches(b[0], q)).forEach(b => items.push({ kind: 'remote', id: b[0], name: b[0], age: b[1] }));
  return items;
}
const usesRepoFilter = () => s.repos.length > 7;
const selectedBranchName = () => s.branch ?? currentRepo()?.def ?? '';

function openPicker(which, focus) {
  s.open = which;
  if (which === 'repo' || which === 'panel') {
    s.filter.repo = '';
    s.active.repo = Math.max(0, repoItems().findIndex(i => i.id === s.repo));
  }
  if (which === 'branch' || which === 'panel') {
    if (s.scenario !== 'noMatch') s.filter.branch = '';
    s.active.branch = Math.max(0, branchItems().findIndex(i => s.branch ? i.id === s.branch : i.kind === 'default'));
  }
  s.focusNext = focus ?? (which === 'branch' ? 'branch' : 'repo');
}
function closePicker(returnTo) {
  const was = s.open;
  s.open = null;
  s.focusNext = returnTo ?? (was === 'panel' ? 'trigger:panel' : `trigger:${was}`);
}
function pickRepo(name) {
  const changed = name !== s.repo;
  s.repo = name;
  if (changed) s.branch = null;
  s.addError = null;
  if (s.open === 'panel') {
    s.filter.branch = '';
    s.active.branch = 0;
    s.focusNext = 'branch';
  } else {
    closePicker('task');
  }
}
function pickBranch(item) {
  s.branch = item.kind === 'default' ? null : item.id;
  closePicker('task');
}
function addRepository() {
  if (s.scenario === 'badFolder') {
    s.addError = '~/Downloads/photos is not a git repository.';
    return;
  }
  const name = `new-repo-${s.repos.length + 1}`;
  s.repos.push({ name, parent: '~/IdeaProjects', def: 'main', local: [['develop', '1d']], remote: [] });
  pickRepo(name);
}

/* ---------- Lists ---------- */
function repoListHTML() {
  const items = repoItems();
  const rows = items.filter(i => i.kind === 'repo').map(i => {
    const index = items.indexOf(i);
    return `<div class="opt ${s.active.repo === index ? 'active' : ''}" id="repo-${index}" role="option" aria-selected="${i.id === s.repo}" data-act="pick" data-list="repo" data-i="${index}" title="${esc(i.repo.parent)}/${esc(i.id)}">
      <span class="name">${esc(i.id)}</span>
      <span class="meta"></span>
      <span class="tick">${icon('check')}</span>
    </div>`;
  }).join('');
  const addIndex = items.length - 1;
  const empty = items.length === 1 ? `<div class="message">No repository matches "${esc(s.filter.repo)}".</div>` : '';
  const filter = usesRepoFilter() ? `<div class="filter">${icon('search')}<input data-filter="repo" value="${esc(s.filter.repo)}" placeholder="Filter repositories" aria-label="Filter repositories" role="combobox" aria-expanded="true" aria-controls="repo-list" aria-activedescendant="repo-${s.active.repo}"></div>` : '';
  const problem = s.addError ? `<div class="problem">${icon('warn')}<span>${esc(s.addError)} <button class="link" data-act="add">Choose another folder</button></span></div>` : '';
  return `${filter}
    <div class="list" id="repo-list" role="listbox" aria-label="Repositories" ${usesRepoFilter() ? '' : `tabindex="0" data-keys="repo" aria-activedescendant="repo-${s.active.repo}"`}>${rows}${empty}</div>
    ${problem}
    <div class="action"><div class="opt ${s.active.repo === addIndex ? 'active' : ''}" id="repo-${addIndex}" role="option" aria-selected="false" data-act="pick" data-list="repo" data-i="${addIndex}">${icon('plus')}<span class="name">Add repository…</span></div></div>`;
}

function branchListHTML() {
  const r = currentRepo();
  if (!r) return `<div class="message"><b>Choose a repository first</b>Branches come from the repository you pick.</div>`;
  const items = branchItems();
  const row = i => {
    const index = items.indexOf(i);
    const selected = i.kind === 'default' ? !s.branch : s.branch === i.id;
    return `<div class="opt ${s.active.branch === index ? 'active' : ''}" id="branch-${index}" role="option" aria-selected="${selected}" data-act="pick" data-list="branch" data-i="${index}" title="${esc(i.name)}">
      <span class="name mono">${esc(i.name)}</span>
      ${i.kind === 'default' ? '<span class="tag">default</span>' : ''}
      ${i.age ? `<span class="meta">${esc(i.age)}</span>` : '<span class="meta"></span>'}
      <span class="tick">${icon('check')}</span>
    </div>`;
  };
  const group = (label, kind) => {
    const list = items.filter(i => i.kind === kind);
    return list.length ? `<div class="group" role="presentation">${label}</div>${list.map(row).join('')}` : '';
  };
  let body = items.filter(i => i.kind === 'default').map(row).join('') + group('Local', 'local') + group('Remote', 'remote');
  if (s.scenario === 'loading') {
    body = [62, 78, 54, 70].map(w => `<div class="skeleton"><i style="width:${w}%"></i></div>`).join('') + '<span class="sr-only" hidden>Reading branches</span>';
  } else if (!items.length) {
    body = `<div class="message"><b>No branch matches "${esc(s.filter.branch)}"</b>Only branches already fetched appear here.</div>`;
  }
  const problem = s.scenario === 'branchError' ? `<div class="problem">${icon('warn')}<span>Could not read branches for ${esc(r.name)}. The default branch still works. <button class="link" data-act="retry">Retry</button></span></div>` : '';
  return `<div class="filter">${icon('search')}<input data-filter="branch" value="${esc(s.filter.branch)}" placeholder="Filter branches" aria-label="Filter branches" role="combobox" aria-expanded="true" aria-controls="branch-list" aria-activedescendant="branch-${s.active.branch}"></div>
    <div class="list" id="branch-list" role="listbox" aria-label="Branches">${body}</div>${problem}`;
}

/* ---------- Triggers ---------- */
function repoPill() {
  if (locked()) return `<div class="anchor a-repo"><span class="pill static" title="${esc(s.repo)}">${icon('folder', 'sm')}<span class="txt">${esc(s.repo)}</span></span></div>`;
  const need = !s.repo;
  return `<div class="anchor a-repo">
    <button class="pill ${need ? 'need' : ''}" data-act="toggle" data-which="repo" data-trigger="repo" aria-haspopup="listbox" aria-expanded="${s.open === 'repo'}" aria-label="Repository: ${esc(s.repo ?? 'none selected')}" title="${esc(s.repo ?? '')}">
      ${icon('folder', 'sm')}<span class="txt">${esc(s.repo ?? 'Choose repository')}</span>${icon('chev', 'sm chev')}
    </button>
    ${s.open === 'repo' ? `<div class="pop">${repoListHTML()}</div>` : ''}
  </div>`;
}
function branchPill() {
  const name = selectedBranchName();
  if (locked()) return `<div class="anchor a-branch"><span class="pill static" title="${esc(name)}">${icon('branch', 'sm')}<span class="txt">${esc(name)}</span></span></div>`;
  const noRepo = !s.repo;
  return `<div class="anchor a-branch">
    <button class="pill" data-act="toggle" data-which="branch" data-trigger="branch" ${noRepo ? 'disabled' : ''} aria-haspopup="listbox" aria-expanded="${s.open === 'branch'}" aria-label="Base branch: ${esc(name || 'none')}" title="${esc(name)}">
      ${icon('branch', 'sm')}<span class="txt">${esc(name || 'Base branch')}</span>${icon('chev', 'sm chev')}
    </button>
    ${s.open === 'branch' ? `<div class="pop">${branchListHTML()}</div>` : ''}
  </div>`;
}
function crumbPill() {
  const name = selectedBranchName();
  const inner = `${icon('folder', 'sm')}<span class="txt">${esc(s.repo ?? 'Choose repository')}${s.repo ? ` <span class="faint">/</span> ${esc(name)}` : ''}</span>`;
  if (locked()) return `<div class="anchor crumb"><span class="pill static">${inner}</span></div>`;
  return `<div class="anchor crumb"><button class="pill ${!s.repo ? 'need' : ''}" data-act="toggle" data-which="panel" data-trigger="panel" aria-expanded="${s.open === 'panel'}" aria-haspopup="dialog" aria-controls="target-panel" title="${esc(s.repo ?? '')} / ${esc(name)}">${inner}${icon('chev', 'sm chev')}</button>${s.open === 'panel' ? inlinePanel() : ''}</div>`;
}
const agentPill = () => `<div class="anchor agent"><span class="pill static">${icon('cpu', 'sm')}<span class="txt">claude · claude-opus-5-5</span></span></div>`;

function inlinePanel() {
  return `<section class="pop target-panel" id="target-panel" aria-label="Repository and base branch">
    <div class="col"><div class="col-head">Repository</div>${repoListHTML()}</div>
    <div class="col"><div class="col-head">Base branch</div>${branchListHTML()}</div>
  </section>`;
}

const MAX_TABS = 5;
function repoTabs() {
  if (locked()) return `<div class="tabs-wrap"><div class="tabs" role="tablist" aria-label="Repository"><span class="tab locked" aria-selected="true"><span>${esc(s.repo)}</span></span></div></div>`;
  let visible = s.repos.slice(0, MAX_TABS);
  const selected = s.repos.find(r => r.name === s.repo);
  if (selected && !visible.includes(selected)) visible = [...visible.slice(0, MAX_TABS - 1), selected];
  const hidden = s.repos.length - visible.length;
  const tabs = visible.map(r => `<button class="tab" role="tab" aria-selected="${r.name === s.repo}" data-act="tab" data-name="${esc(r.name)}" title="${esc(r.parent)}/${esc(r.name)}"><span>${esc(r.name)}</span></button>`).join('');
  const more = hidden > 0 ? `<div class="anchor more-anchor"><button class="tab more" data-act="toggle" data-which="repo" data-trigger="repo" aria-haspopup="listbox" aria-expanded="${s.open === 'repo'}"><span>${hidden} more</span>${icon('chev', 'sm')}</button>${s.open === 'repo' ? `<div class="pop">${repoListHTML()}</div>` : ''}</div>` : '';
  const problem = s.addError ? `<div class="tab-problem">${icon('warn')}<span>${esc(s.addError)} <button class="link" data-act="add">Choose another folder</button></span></div>` : '';
  return `<div class="tabs-wrap">
    <div class="tabs" role="tablist" aria-label="Repository">${tabs}${more}<button class="tab add" data-act="add" aria-label="Add repository" title="Add repository">${icon('plus')}</button></div>
    ${problem}
  </div>`;
}

/* ---------- Page ---------- */
function homeHTML() {
  const firstRun = s.scenario === 'firstRun';
  const body = firstRun ? `<div>
      <div class="section-head"><span>Try one of these</span></div>
      <div class="home-row"><span>Add CSV export to the history screen</span><span class="kind">Goal run</span></div>
      <div class="home-row"><span>Review my current branch</span><span class="kind">Standalone review</span></div>
      <div class="home-row"><span>APP-123</span><span class="kind">From an issue</span></div>
      <div class="readiness"><span class="dot ${s.repo ? 'ok' : ''}"></span>${s.repo ? `Ready: claude found, ${esc(s.repo)} selected` : 'Not ready: choose a repository'}</div>
    </div>` : `<div>
      <div class="section-head"><span>Needs you</span><span>2 running · 5 finished today</span></div>
      <div class="home-row"><span class="key">0AC-91</span><span class="title">Passkey recovery screen</span><span class="why">Waiting on your review</span></div>
      <div class="home-row"><span class="key">SKILL-479</span><span class="title">Goal worktrees</span><span class="why">Paused after audit</span></div>
    </div>`;
  return `<div class="home"><div class="home-inner">
    <div><h1>What should we ship?</h1><p>Describe the work or paste an issue. Skill Bill plans it, builds it, audits it and opens the PR.</p></div>
    ${body}
  </div></div>`;
}

function dockHTML() {
  const d = s.design;
  const placeholder = locked() ? 'Reply, or press Start goal run' : 'Describe the work, or paste an issue key or spec path';
  const chips = locked() ? '' : `<div class="chips">${['Review my branch', 'Run the checks', 'QA my branch', 'Open a PR'].map(c => `<button class="chip">${c}</button>`).join('')}</div>`;
  const pickers = d === 'a' ? repoPill() + branchPill() : d === 'b' ? crumbPill() : branchPill();
  return `<div class="dock"><div class="composer">
    ${chips}
    ${d === 'c' ? repoTabs() : ''}
    <textarea class="task" data-task placeholder="${placeholder}" aria-label="Task">${esc(s.text)}</textarea>
    <div class="foot">
      ${pickers}
      ${agentPill()}
      <div class="spacer"></div>
      <button class="send" data-send ${s.repo && s.text.trim() ? '' : 'disabled'}>Send <kbd>↵</kbd></button>
    </div>
  </div></div>`;
}

const stage = document.getElementById('stage');

function render() {
  document.getElementById('designs').innerHTML = Object.entries(DESIGNS).map(([k, v]) =>
    `<button data-design="${k}" aria-pressed="${s.design === k}">${v.label}${v.tag ? ` <span class="pick-tag">${v.tag}</span>` : ''}</button>`).join('');
  document.getElementById('note').innerHTML = DESIGNS[s.design].note;
  stage.innerHTML = homeHTML() + dockHTML();
  history.replaceState(null, '', `#design=${s.design}&state=${s.scenario}`);
  applyFocus();
  stage.querySelectorAll('.opt.active').forEach(el => el.scrollIntoView({ block: 'nearest' }));
}

function applyFocus() {
  const target = s.focusNext;
  s.focusNext = null;
  if (!target) return;
  let el = null;
  if (target === 'task') el = stage.querySelector('[data-task]');
  else if (target.startsWith('trigger:')) el = stage.querySelector(`[data-trigger="${target.slice(8)}"]`);
  else el = stage.querySelector(`[data-filter="${target}"]`) ?? stage.querySelector(`[data-keys="${target}"]`);
  if (!el) return;
  el.focus();
  if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length);
}

/* ---------- Events ---------- */
stage.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'toggle') {
    const which = el.dataset.which;
    if (s.open === which) closePicker(`trigger:${which}`);
    else openPicker(which);
  } else if (act === 'pick') {
    choose(el.dataset.list, Number(el.dataset.i));
  } else if (act === 'tab') {
    pickRepo(el.dataset.name);
    s.open = null;
    s.focusNext = 'task';
  } else if (act === 'add') {
    addRepository();
    if (!s.addError) { s.open = null; s.focusNext = 'task'; }
  } else if (act === 'retry') {
    s.scenario = 'default';
    s.focusNext = 'branch';
  }
  render();
});

function choose(list, index) {
  if (list === 'repo') {
    const item = repoItems()[index];
    if (!item) return;
    if (item.kind === 'add') addRepository();
    else pickRepo(item.id);
  } else {
    const item = branchItems()[index];
    if (item) pickBranch(item);
  }
}

stage.addEventListener('input', e => {
  if (e.target.matches('[data-task]')) {
    s.text = e.target.value;
    stage.querySelector('[data-send]').disabled = !(s.repo && s.text.trim());
    return;
  }
  const list = e.target.dataset.filter;
  if (!list) return;
  s.filter[list] = e.target.value;
  s.active[list] = 0;
  s.focusNext = list;
  render();
});

stage.addEventListener('keydown', e => {
  const list = e.target.dataset.filter ?? e.target.dataset.keys;
  if (e.key === 'Escape' && s.open) {
    e.preventDefault();
    closePicker();
    render();
    return;
  }
  if (!list) return;
  const count = list === 'repo' ? repoItems().length : branchItems().length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!count) return;
    const step = e.key === 'ArrowDown' ? 1 : -1;
    s.active[list] = (s.active[list] + step + count) % count;
    s.focusNext = list;
    render();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    choose(list, s.active[list]);
    render();
  }
});

document.addEventListener('mousedown', e => {
  if (!s.open) return;
  if (e.target.closest('.pop') || e.target.closest(`[data-trigger="${s.open}"]`)) return;
  s.open = null;
  render();
});

document.getElementById('designs').addEventListener('click', e => {
  const b = e.target.closest('[data-design]');
  if (!b) return;
  s.design = b.dataset.design;
  applyScenarioForDesign();
  render();
});

const scenarioSelect = document.getElementById('scenario');
scenarioSelect.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
scenarioSelect.value = s.scenario;
scenarioSelect.addEventListener('change', () => {
  s.scenario = scenarioSelect.value;
  applyScenarioForDesign();
  render();
});

/* B has one popup instead of separate lists, and C only has a repo list when repos overflow. */
function applyScenarioForDesign() {
  applyScenario();
  if (!s.open) return;
  if (s.design === 'b') {
    const focus = s.open === 'repo' ? 'repo' : 'branch';
    openPicker('panel', focus);
  } else if (s.design === 'c' && s.open === 'repo' && s.scenario === 'badFolder') {
    s.open = null;
    s.focusNext = null;
  }
}

applyScenarioForDesign();
render();
</script>
</body>
</html>
