platform: go
contract_version: "1.8"
display_name: Go

routing_signals:
  strong:
    - "go.mod"
    - "go.sum"
    - "go.work"
    - "go.work.sum"
    - ".go"
    - "*.go"
    - "Gopkg.toml"
    - "Gopkg.lock"
    - "golangci.yml"
    - ".golangci.yml"
    - "staticcheck.conf"
  tie_breakers:
    - "Prefer Go when module/workspace metadata, Go source files, or Go test files dominate the changed product surface."
    - "Do not prefer Go for adjacent mixed repositories where Go appears only as generated clients, tooling, one-off scripts, or vendored dependencies around another dominant stack."
    - "Exclude vendor directories, generated protobuf/OpenAPI clients, build outputs, and generated mocks from dominance scoring unless the generator or generated contract is intentionally changed."
  path: ["go.mod", "go.work", ".go", "*.go"]
  content: ["package ", "func ", "go routine", "context.Context"]

declared_code_review_areas:
  - api-contracts
  - architecture
  - performance
  - persistence
  - platform-correctness
  - reliability
  - security
  - testing
  - ui
  - ux-accessibility
  - code-quality

declared_files:
  baseline: code-review/bill-go-code-review/content.md
  areas:
    api-contracts: code-review/bill-go-code-review-api-contracts/content.md
    architecture: code-review/bill-go-code-review-architecture/content.md
    performance: code-review/bill-go-code-review-performance/content.md
    persistence: code-review/bill-go-code-review-persistence/content.md
    platform-correctness: code-review/bill-go-code-review-platform-correctness/content.md
    reliability: code-review/bill-go-code-review-reliability/content.md
    security: code-review/bill-go-code-review-security/content.md
    testing: code-review/bill-go-code-review-testing/content.md
    ui: code-review/bill-go-code-review-ui/content.md
    ux-accessibility: code-review/bill-go-code-review-ux-accessibility/content.md
    code-quality: code-review/bill-go-code-review-code-quality/content.md
area_metadata:
  api-contracts:
    focus: "net/http and applicable RPC validation, cancellation, JSON/protobuf evolution, response ordering, idempotency, and compatibility"
  architecture:
    focus: "Package and module dependency direction, interface ownership, composition roots, component lifecycles, and goroutine scope ownership"
  performance:
    focus: "Measured pprof and benchmark evidence, allocations, retention, lock contention, scheduler pressure, batching, and bounded resources"
  persistence:
    focus: "database/sql row and transaction lifecycles, isolation, locking, pools, migrations, mapping, and applicable data libraries"
  platform-correctness:
    focus: "Goroutine exits, protocol-specific channel ownership, context cancellation, wrapped errors, typed nils, aliasing, synchronization, races, and deadlocks"
  reliability:
    focus: "Graceful server, hijacked-connection, worker, and queue shutdown; delivery semantics, deadlines, retries, backpressure, and partial failure"
  security:
    focus: "Sessions, OAuth/OIDC, authorization, template trust, bounded parsing, symlink-safe paths, process options, connection-time SSRF, and dependencies"
  testing:
    focus: "Behavioral regression proof, subtests, parallel capture, deterministic concurrency and time, race tests, fuzzing, and weak assertions"
  ui:
    focus: "Go-owned HTML templates and components, forms, htmx fragment ownership, repository-defined view states, interactive CLI and TUI output"
  ux-accessibility:
    focus: "Accessible names, error association, conditional focus restoration, keyboard flow, semantics, live feedback, localization, and terminal interaction"
  code-quality:
    focus: "Go language constructs, clear helpers, cohesive state, error handling, ownership, and standard-library choices"

lane_conditions:
  architecture: { required: true }
  platform-correctness: { required: true }
  performance: { content: ["benchmark", "pprof", "allocation", "mutex"] }
  security: { content: ["oauth", "authorization", "secret", "tls"] }
  testing: { path: ["_test.go"] }
  api-contracts: { content: ["http.Handler", "json", "protobuf", "grpc"] }
  persistence: { content: ["database/sql", "transaction", "query"] }
  reliability: { content: ["retry", "deadline", "shutdown", "queue"] }
  ui: { content: ["template", "htmx", "tui", "form"] }
  ux-accessibility: { content: ["aria-", "focus", "keyboard", "localization"] }
  code-quality: { required: true }
qa_capability:
  platforms: [backend]
  guidance_file: qa/backend-qa.md
validation_gate:
  full_gate_command:
    - go
    - test
    - ./...
  cache_bypassing_full_gate_command:
    - go
    - test
    - -count=1
    - ./...
  collect_all_full_gate_command:
    - go
    - test
    - ./...
  cache_bypassing_collect_all_full_gate_command:
    - go
    - test
    - -count=1
    - ./...
  build_command:
    - go
    - build
    - ./...
  cache_bypassing_build_command:
    - go
    - build
    - -a
    - ./...
  findings:
    format: junit_xml
    artifact_globs:
      - "**/junit.xml"
      - "**/test-results/**/*.xml"
    compiler_diagnostics:
      format: gradle_kotlin_compiler_stdout
  suppression_markers:
    - "//nolint"

