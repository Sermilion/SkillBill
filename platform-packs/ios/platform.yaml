        - offline-conflict-resolution.md
  code-review/bill-ios-code-review-reliability:
    - slug: offline-first
      entrypoint: offline-first-review.md
      activation:
        any_of_all_content:
          - ["grdb", "sync"]
          - ["sqlite", "sync"]
          - ["core data", "sync"]
          - ["realm", "sync"]
        any_content: ["background sync", "sync queue", "conflict handling", "download for offline"]
        exclude_content: ["pure in-memory"]
      companion_pointers:
        - offline-background-reliability.md
        - offline-sync-consistency.md
  code-review/bill-ios-code-review-platform-correctness:
    - slug: offline-first
      entrypoint: offline-first-review.md
      activation:
        any_of_all_content:
          - ["grdb", "sync"]
          - ["sqlite", "sync"]
          - ["core data", "sync"]
          - ["realm", "sync"]
        any_content: ["background sync", "sync queue", "conflict handling", "download for offline"]
        exclude_content: ["pure in-memory"]
      companion_pointers:
        - offline-conflict-resolution.md

