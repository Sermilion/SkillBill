platform: kotlin
contract_version: "1.8"
display_name: Kotlin

routing_signals:
  strong:
    - ".kt"
    - "*.kt"
    - ".kts"
    - "*.kts"
    - "build.gradle"
    - "build.gradle.kts"
    - "settings.gradle.kts"
    - "gradle/libs.versions.toml"
    - "detekt.yml"
    - "kotlin/"
  tie_breakers:
    - "Prefer this Kotlin pack when Kotlin/JVM source and Gradle Kotlin markers dominate the owned diff."
    - "Do not prefer this pack over the adjacent KMP pack when Android/KMP markers (androidMain, iosMain, AndroidManifest.xml, expect/actual) establish KMP ownership."
    - "Exclude generated and vendored files from dominance scoring."
  path: [".kt", "*.kt", ".kts", "*.kts", "build.gradle", "build.gradle.kts", "settings.gradle.kts"]
  content: ["kotlin", "coroutine", "flow"]

declared_code_review_areas:
  - architecture
  - performance
  - platform-correctness
  - security
  - testing
  - api-contracts
  - persistence
  - reliability
  - ui
  - ux-accessibility
  - code-quality

declared_files:
  baseline: code-review/bill-kotlin-code-review/content.md
  areas:
    architecture: code-review/bill-kotlin-code-review-architecture/content.md
    performance: code-review/bill-kotlin-code-review-performance/content.md
    platform-correctness: code-review/bill-kotlin-code-review-platform-correctness/content.md
    security: code-review/bill-kotlin-code-review-security/content.md
    testing: code-review/bill-kotlin-code-review-testing/content.md
    api-contracts: code-review/bill-kotlin-code-review-api-contracts/content.md
    persistence: code-review/bill-kotlin-code-review-persistence/content.md
    reliability: code-review/bill-kotlin-code-review-reliability/content.md
    ui: code-review/bill-kotlin-code-review-ui/content.md
    ux-accessibility: code-review/bill-kotlin-code-review-ux-accessibility/content.md
    code-quality: code-review/bill-kotlin-code-review-code-quality/content.md

area_metadata:
  architecture:
    focus: "Kotlin use-case and transaction ownership, injected CoroutineScope lifecycles, internal visibility, and Gradle module boundaries"
  performance:
    focus: "Kotlin runBlocking and dispatcher starvation, Flow backpressure, eager collections, and ORM hydration costs"
  platform-correctness:
    focus: "Kotlin CancellationException propagation, SupervisorJob isolation, Mutex reentrancy, and StateFlow or SharedFlow delivery invariants"
  security:
    focus: "Kotlin dangerous input sinks, object authorization, tenant isolation, unsafe deserialization, and JWT verification"
  testing:
    focus: "Kotlin runTest virtual time, test dispatcher ordering, Flow sequence assertions, and real persistence effects"
  api-contracts:
    focus: "Kotlin explicitNulls and encodeDefaults compatibility, Jackson module behavior, validation, and stable error contracts"
  persistence:
    focus: "Kotlin Exposed newSuspendedTransaction boundaries, Spring proxy transactions, Hibernate sessions, and scoped atomic writes"
  reliability:
    focus: "Kotlin consumer supervision, TimeoutCancellationException classification, bounded replay, outbox ordering, and failure telemetry"
  ui:
    focus: "Kotlin Compose Desktop state and lifecycle, Swing or JavaFX thread interop, server rendering, and CLI or TUI behavior"
  ux-accessibility:
    focus: "Kotlin desktop semantics and focus, semantic server output, terminal accessibility, keyboard use, and localization"
  code-quality:
    focus: "Kotlin/JVM null and collection handling, sealed lifecycle state, coroutine structure, and backend framework conventions"

lane_conditions:
  architecture: { required: true }
  platform-correctness: { required: true }
  performance: { content: ["runBlocking", "buffer", "allocation", "memory"] }
  security: { content: ["authorization", "jwt", "secret", "unsafe"] }
  testing: { path: ["Test.kt", "Spec.kt"] }
  api-contracts: { content: ["encodeDefaults", "explicitNulls", "serialization", "schema"] }
  persistence: { content: ["transaction", "hibernate", "exposed", "database"] }
  reliability: { content: ["retry", "timeout", "shutdown", "supervisor"] }
  ui: { content: ["compose", "swing", "javafx", "render"] }
  ux-accessibility: { content: ["semantics", "focus", "keyboard", "localization"] }
  code-quality: { required: true }
qa_capability:
  platforms: [backend]
  guidance_file: qa/backend-qa.md
validation_gate:
  full_gate_command:
    - ./gradlew
    - check
    - --parallel
    - -q
    - --warning-mode
    - none
  cache_bypassing_full_gate_command:
    - ./gradlew
    - check
    - --no-build-cache
    - --parallel
    - -q
    - --warning-mode
    - none
  collect_all_full_gate_command:
    - ./gradlew
    - check
    - --continue
    - --parallel
    - -q
    - --warning-mode
    - none
  build_command:
    - ./gradlew
    - compileKotlin
  cache_bypassing_build_command:
    - ./gradlew
    - compileKotlin
    - --no-build-cache
  cache_bypassing_collect_all_full_gate_command:
    - ./gradlew
    - check
    - --continue
    - --no-build-cache
    - --parallel
    - -q
    - --warning-mode
    - none
  findings:
    format: junit_xml
    artifact_globs:
      - "runtime-kotlin/**/build/test-results/**/*.xml"
      - "runtime-kotlin/**/build/reports/detekt/*.xml"
    compiler_diagnostics:
      format: gradle_kotlin_compiler_stdout
    executed_work:
      format: gradle_actionable_summary
  suppression_markers:
    - "@Suppress"
    - "@file:Suppress"

