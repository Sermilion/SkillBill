$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/acceptance-criterion-repair-state.yaml
title: Acceptance criterion repair state
type: object
additionalProperties: false
required:
  - contract_version
  - catalog_id
  - execution_id
  - spec_digest
  - criteria
  - dependencies
  - unresolved_queue
  - current_criterion_ref
  - reservation
  - outcomes
  - charged_attempts
  - late_findings
  - repair_changed_paths
  - revision
  - mode
  - stage
  - completed_repair_evidence_ref
  - admitted_tree_digest
  - admitted_checkpoint_id
  - source_transitions
  - interaction_trace
properties:
  contract_version: { const: '0.3' }
  catalog_id: { type: string, minLength: 1, maxLength: 256 }
  execution_id: { type: string, minLength: 1, maxLength: 256 }
  spec_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  criteria:
    type: array
    minItems: 1
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [canonical_ref, original_alias, original_text, ordinal, source_disposition, validation_obligation, validation_owner_available, evidence_ref, closure_evidence_ref, closure_tree_digest, closure_checkpoint_id, gaps, plan_generation, escalated]
      properties:
        canonical_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        original_alias: { type: [string, 'null'], maxLength: 128 }
        original_text: { type: string, minLength: 1, maxLength: 8192 }
        ordinal: { type: integer, minimum: 1, maximum: 256 }
        source_disposition: { enum: [not_applicable, source_closed, source_unresolved] }
        validation_obligation: { enum: [required, deferred, not_required] }
        validation_owner_available: { type: boolean }
        evidence_ref: { type: string, minLength: 1 }
        closure_evidence_ref: { type: [string, 'null'], minLength: 1 }
        closure_tree_digest: { type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$' }
        closure_checkpoint_id: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        gaps:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [gap_id, gap_text, gap_citation, gap_status, gap_origin, gap_closed_revision]
            properties:
              gap_id: { type: string, pattern: '^AC-[0-9]{3}\.G[1-9][0-9]?$' }
              gap_text: { type: string, minLength: 1, maxLength: 2048 }
              gap_citation: { type: string, minLength: 1, maxLength: 512 }
              gap_status: { enum: [open, closed] }
              gap_origin: { enum: [discovery, repair] }
              gap_closed_revision: { type: [integer, 'null'], minimum: 1 }
        plan_generation: { type: integer, minimum: 0, maximum: 2 }
        escalated: { type: boolean }
  dependencies:
    type: array
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required: [dependent_ref, prerequisite_ref, reason, declaring_output_ref, source_evidence_ref]
      properties:
        dependent_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        prerequisite_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        declaring_output_ref: { type: string, minLength: 1, maxLength: 512 }
        source_evidence_ref: { type: string, minLength: 1 }
  unresolved_queue:
    type: array
    maxItems: 256
    uniqueItems: true
    items: { type: string, pattern: '^AC-[0-9]{3}$' }
  current_criterion_ref: { type: [string, 'null'], pattern: '^AC-[0-9]{3}$' }
  reservation:
    oneOf:
      - type: 'null'
      - type: object
        additionalProperties: false
        required: [reservation_id, criterion_ref, revision, stage_revision]
        properties:
          reservation_id: { type: string, minLength: 1, maxLength: 256 }
          criterion_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
          revision: { type: integer, minimum: 1 }
          stage_revision: { type: integer, minimum: 1 }
  outcomes:
    type: array
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required: [outcome_id, reservation_id, criterion_ref, digest, outcome_kind, evidence_ref, expected_revision, tree_digest, checkpoint_id, charged, open_gaps_before, open_gaps_after]
      properties:
        outcome_id: { type: string, minLength: 1, maxLength: 256 }
        reservation_id: { type: string, minLength: 1, maxLength: 256 }
        criterion_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        outcome_kind: { enum: [targeted_success, incomplete, blocked, targeted_failure] }
        expected_revision: { type: [integer, 'null'], minimum: 0 }
        audit_binding_digest: { type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$' }
        tree_digest: { type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$' }
        checkpoint_id: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        evidence_ref: { type: string, minLength: 1 }
        charged: { type: boolean }
        open_gaps_before: { type: integer, minimum: 0, maximum: 32 }
        open_gaps_after: { type: integer, minimum: 0, maximum: 32 }
  charged_attempts:
    type: object
    maxProperties: 256
    additionalProperties: false
    patternProperties:
      '^AC-[0-9]{3}$': { type: integer, minimum: 0, maximum: 3 }
  revision: { type: integer, minimum: 0 }
  mode: { enum: [initial_discovery, current_criterion_targeted, accepted] }
  stage: { enum: [discovery_admitted, read_only_audit_required, repair_reserved, repair_completed_awaiting_targeted_verification, accepted, budget_blocked, interaction_trace_required] }
  completed_repair_evidence_ref: { type: [string, 'null'], minLength: 1 }
  admitted_tree_digest: { type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$' }
  admitted_checkpoint_id: { type: [string, 'null'], minLength: 1, maxLength: 256 }
  source_transitions:
    type: array
    maxItems: 16384
    items:
      type: object
      additionalProperties: false
      required: [canonical_ref, revision, from_disposition, to_disposition, producing_id, producing_digest, evidence_ref, tree_digest, checkpoint_id]
      properties:
        canonical_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        revision: { type: integer, minimum: 1 }
        from_disposition: { enum: [not_applicable, source_closed, source_unresolved] }
        to_disposition: { enum: [not_applicable, source_closed, source_unresolved] }
        producing_id: { type: string, minLength: 1, maxLength: 256 }
        producing_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        evidence_ref: { type: string, minLength: 1 }
        tree_digest: { type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$' }
        checkpoint_id: { type: [string, 'null'], minLength: 1, maxLength: 256 }
  pending_audit_refs: { type: array, maxItems: 256, uniqueItems: true, items: { type: string, pattern: '^AC-[0-9]{3}$' } }
  prose_audits:
    type: array
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required: [id, revision, criterion_ref, satisfied, digest, prose, tree_digest, checkpoint_id]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: integer, minimum: 1 }
        criterion_ref: { type: [string, 'null'], pattern: '^AC-[0-9]{3}$' }
        satisfied: { type: boolean }
        digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        prose: { type: string, minLength: 1 }
        tree_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        checkpoint_id: { type: string, minLength: 1, maxLength: 256 }
  pending_clarification_question: { type: [string, 'null'], maxLength: 1024 }
  late_findings:
    type: array
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [criterion_ref, finding_text, finding_citation, revision]
      properties:
        criterion_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        finding_text: { type: string, minLength: 1, maxLength: 2048 }
        finding_citation: { type: [string, 'null'], minLength: 1, maxLength: 512 }
        revision: { type: integer, minimum: 1 }
  repair_changed_paths:
    type: array
    maxItems: 512
    uniqueItems: true
    items: { type: string, minLength: 1, maxLength: 1024 }
  interaction_trace:
    type: object
    additionalProperties: false
    required:
      - pending_scenario_refs
      - traced_scenario_refs
      - broken_scenario_refs
      - repaired_scenario_refs
      - unknown_scenario_refs
      - recheck_refs
      - recheck_any_change_refs
      - traced_spec_digest
    properties:
      pending_scenario_refs: { $ref: '#/$defs/scenario_ref_list' }
      traced_scenario_refs: { $ref: '#/$defs/scenario_ref_list' }
      broken_scenario_refs: { $ref: '#/$defs/scenario_ref_list' }
      repaired_scenario_refs: { $ref: '#/$defs/scenario_ref_list' }
      unknown_scenario_refs: { $ref: '#/$defs/scenario_ref_list' }
      recheck_refs: { $ref: '#/$defs/scenario_ref_list' }
      recheck_any_change_refs: { $ref: '#/$defs/scenario_ref_list' }
      traced_spec_digest: { type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$' }
$defs:
  scenario_ref_list:
    type: array
    maxItems: 64
    uniqueItems: true
    items: { type: string, minLength: 1, maxLength: 16 }
x-coherence-checks:
  - id: unique-catalog-identities
    description: Criteria have unique canonical references and ordinals, and every queue, dependency, reservation, outcome and counter reference resolves to one admitted criterion.
  - id: dependency-dag
    description: Dependencies have no self-edge, duplicate edge or cycle; unresolved queue order is stable topological order with ordinal ties.
  - id: active-position
    description: Current criterion is the first unresolved queue entry; a reservation names that current criterion and at most one reservation is live.
  - id: monotonic-budget
    description: Charged attempts name catalog criteria, stay between zero and three, and do not exceed retained outcomes marked charged. Successful outcomes are uncharged, counts of two or three imply escalation, and budget-blocked state has a current criterion at three attempts.
  - id: criterion-gaps
    description: Gap identifiers match their criterion and one-based list position, bounds match the runtime limits, open gaps have no closure revision, closed gaps have a closure revision no later than state revision, and source-closed criteria have no open gaps. Late findings name catalog criteria and repair changed paths appear only while awaiting targeted verification.
  - id: accepted-queue
    description: An empty focused queue with no pending audit is accepted; settled criteria are trusted, and accepted criteria are re-checked only when the runtime lists them in interaction-trace or re-check scope.
  - id: immutable-transition-history
    description: Accepted source closures and focused-audit reopenings retain their producing identity and evidence through the authoritative state lifetime.
  - id: utf8-capacity
    description: The runtime refuses serialized artifacts above 12582912 UTF-8 bytes before persistence.
