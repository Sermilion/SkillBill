$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/qa-repair-state-schema.yaml"
title: QA repair state
type: object
additionalProperties: false
required:
  - contract_version
  - subtask_id
  - qa_fix_step_id
  - max_attempts
  - consumed_attempts
  - attempts
  - open_findings
  - last_receipt_tree_identity
properties:
  contract_version: { const: "0.1" }
  subtask_id: { type: integer, minimum: 1 }
  qa_fix_step_id: { const: "qa_fix" }
  max_attempts: { const: 3 }
  consumed_attempts: { type: integer, minimum: 0, maximum: 3 }
  attempts:
    type: array
    maxItems: 3
    items:
      type: object
      additionalProperties: false
      required: [attempt_number, receipt_tree_identity, consumed_finding_ids, repair_output_ref, outcome]
      properties:
        attempt_number: { type: integer, minimum: 1, maximum: 3 }
        receipt_tree_identity: { type: string, minLength: 1, maxLength: 256 }
        consumed_finding_ids:
          type: array
          uniqueItems: true
          maxItems: 256
          items: { type: string, minLength: 1, maxLength: 256 }
        repair_output_ref: { type: string, minLength: 1, maxLength: 512 }
        outcome: { enum: [completed, blocked] }
  open_findings:
    type: array
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [id, affected_criteria, receipt_ref]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        affected_criteria:
          type: array
          uniqueItems: true
          maxItems: 256
          items: { type: string, pattern: "^AC-[0-9]{3}$" }
        receipt_ref: { type: string, minLength: 1, maxLength: 512 }
  last_receipt_tree_identity: { type: [string, "null"], minLength: 1, maxLength: 256 }
x-coherence-checks:
  - id: attempt-accounting
    description: consumed_attempts equals the number of retained attempts, attempt numbers are consecutive, and each attempt consumed no more than max_attempts.
  - id: unique-open-findings
    description: Open finding ids are unique and evidence remains by reference only.
