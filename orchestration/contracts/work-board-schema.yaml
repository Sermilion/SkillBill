$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/work-board-schema.yaml"
title: "Machine-wide work board"
type: object
additionalProperties: false
required: [contract_version, items, observed_at, finished_within, diagnostics, page_size, next_cursor]
properties:
  contract_version:
    type: string
    const: "1.3"
  page_size:
    type: integer
    minimum: 1
    maximum: 100
  next_cursor:
    type: [string, "null"]
    minLength: 1
  items:
    type: array
    items:
      $ref: "#/$defs/item"
  observed_at:
    type: string
    format: date-time
  finished_within:
    type: string
    enum: [6h, 24h, 7d]
  diagnostics:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        workflow_id: {type: string, minLength: 1}
        invocation_id: {type: string, minLength: 1}
        repository_identity: {type: [string, "null"]}
        reason:
          type: string
          enum:
            [
              missing_repository_identity,
              invalid_repository_identity,
              missing_completion_time,
              incompatible_record,
            ]
  problem:
    type: object
    additionalProperties: false
    required: [code, message]
    properties:
      code: {type: string, const: absent_database}
      message: {type: string, minLength: 1}
$defs:
  item:
    type: object
    additionalProperties: false
    required: [snapshot, repository_root]
    properties:
      snapshot:
        $ref: "https://skill-bill.dev/contracts/ide-status-schema.yaml"
      repository_root:
        type: string
        minLength: 1
      finished_at:
        type: [string, "null"]
        format: date-time
      finished_at_source:
        type: [string, "null"]
        enum: [standalone_finished_at, workflow_completion, goal_completion, goal_state_entry, estimated_goal_state_entry, null]
      build:
        anyOf:
          - $ref: "#/$defs/build"
          - type: "null"
  build:
    type: object
    additionalProperties: false
    required: [state, command, short_command, tool, project_kind, pid, started_at, elapsed_ms, elapsed_as_of, usual_ms, exit_code, finished_at, previous]
    properties:
      state: {type: string, enum: [running, passed, failed, finished]}
      command: {type: string, minLength: 1}
      short_command: {type: string, minLength: 1}
      tool: {type: string, minLength: 1}
      project_kind: {type: string, minLength: 1}
      pid: {type: integer, minimum: 0}
      started_at: {type: string, format: date-time}
      elapsed_ms: {type: [integer, "null"], minimum: 0}
      elapsed_as_of: {type: [string, "null"], format: date-time}
      usual_ms: {type: [integer, "null"], minimum: 0}
      sample_count: {type: [integer, "null"], minimum: 0, maximum: 20}
      exit_code: {type: [integer, "null"]}
      finished_at: {type: [string, "null"], format: date-time}
      previous:
        anyOf:
          - $ref: "#/$defs/build_previous"
          - type: "null"
  build_previous:
    type: object
    additionalProperties: false
    required: [state, duration_ms, finished_at]
    properties:
      state: {type: string, enum: [passed, failed, finished]}
      duration_ms: {type: integer, minimum: 0}
      finished_at: {type: string, format: date-time}
