$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/app-run-config-schema.yaml
title: App-run checkout configuration
description: >
  Optional tracked .skill-bill/app-run.yaml settings for the app-run command.
  Omitting variant selects debug.
type: object
additionalProperties: false
required: [contract_version]
properties:
  contract_version:
    type: string
    const: "0.1"
  module:
    type: string
    pattern: '^:?[A-Za-z0-9_.-]+(:[A-Za-z0-9_.-]+)*$'
  variant:
    type: string
    pattern: '^[a-z][A-Za-z0-9]{0,63}$'
