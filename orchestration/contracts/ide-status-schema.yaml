$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/ide-status-schema.yaml"
title: "IDE status snapshot"
description: >
  SKILL-148 Subtask 1: single read-only status snapshot for IDE consumers.
  Projects the currently relevant Skill Bill work for an explicit repository
  root without exposing SQLite row shapes, workflow snapshot artifacts,
  prompts, diffs, or database paths.
type: object
additionalProperties: false
required:
  - contract_version
  - repository_identity
  - lifecycle_state
  - current_step
  - updated_at
  - freshness
  - summary
properties:
  contract_version:
    type: string
    const: "0.3"
    description: >
      Pinned to IDE_STATUS_CONTRACT_VERSION. Bump the schema const and Kotlin
      constant together.
  repository_identity:
    type: string
    minLength: 1
    description: "Canonical repo-root-realpath-v1 identity for the queried repository."
  branch_correlation:
    type: string
    minLength: 1
    maxLength: 256
    description: "The checked-out branch correlated with an execution-bearing snapshot."
  issue_key:
    type: string
    minLength: 1
  workflow_id:
    type: string
    minLength: 1
  workflow_family:
    type: string
    enum:
      - feature-task-runtime
      - feature-verify
      - feature-goal
    description: >
      Present when matching work was selected. The retired prose
      `feature-task-prose` family is quarantined (read-only history, never
      projected live) and is excluded from this enum. Omitted for
      idle/unavailable problem snapshots that carry no work identity.
  execution_scope:
    type: string
    enum:
      - workflow
      - standalone_phase
  execution_id:
    type: string
    minLength: 1
  status_store_id:
    type: string
    minLength: 1
  run_sequence:
    type: string
    pattern: "^[1-9][0-9]*$"
  status_revision:
    type: string
    pattern: "^[1-9][0-9]*$"
  invocation_id:
    type: string
    minLength: 1
  phase_id:
    type: string
    minLength: 1
    maxLength: 64
  current_activity:
    type: string
    minLength: 1
    maxLength: 160
    pattern: "^[^\\u0000-\\u001F\\u007F]*$"
  lifecycle_state:
    type: string
    enum:
      - active
      - paused
      - blocked
      - failed
      - terminal
      - idle
  current_step:
    type: object
    additionalProperties: false
    required:
      - id
      - label
    properties:
      id:
        type: string
        minLength: 1
      label:
        type: string
        minLength: 1
  progress:
    type: object
    additionalProperties: false
    required:
      - completed
      - total
    properties:
      completed:
        type: integer
        minimum: 0
      total:
        type: integer
        minimum: 0
  started_at:
    type: string
    minLength: 1
    description: >
      Authoritative goal/work start instant from durable runtime state. Omitted
      when the scope does not exist or legacy state cannot provide it. Never
      synthesized from updated_at.
  current_subtask:
    type: object
    additionalProperties: false
    required:
      - id
    properties:
      id:
        type: string
        minLength: 1
      started_at:
        type: string
        minLength: 1
        description: >
          Durable current-subtask start instant. Omitted when the subtask scope
          does not exist or legacy state cannot provide it.
      active_duration_ms:
        type: integer
        minimum: 0
        description: >
          Time the current subtask spent actually executing, accumulated from lease
          heartbeats. Not wall clock since started_at: pause, block, and unattended
          gaps are excluded. Omitted when no execution was recorded for this subtask.
          Consumers add now - active_duration_as_of while that field is present.
      active_duration_as_of:
        type: string
        minLength: 1
        description: >
          Instant active_duration_ms is current as of. Present only while a lease is
          live so a reader can tick the live tail without double counting. Absent means
          the accumulated value is final.
  current_model:
    type: object
    additionalProperties: false
    description: >
      The model the current phase's child was launched with, as rendered to the
      agent CLI. Omitted entirely when the current phase has no recorded model,
      and never emitted for a completed phase or a terminal goal — a finished
      unit's model is history, not the model in force.
      `effort` is omitted when the model string already carries it (Cursor's
      merged `model[effort=...]` form) or when no effort was resolved.
      The length bounds are the contract, not a client concern: a consumer that
      truncated instead would display a model identifier that never existed.
    required:
      - model
    properties:
      model:
        type: string
        minLength: 1
        maxLength: 120
      effort:
        type: string
        minLength: 1
        maxLength: 40
      phase_id:
        type: string
        minLength: 1
        maxLength: 64
        description: >
          The runtime phase the model belongs to. A goal's `current_step` is a
          goal-level label — often `planning` — so without this the payload
          names a model whose phase appears nowhere in it. Omitted only by a
          producer that cannot resolve the phase.
  planning:
    type: object
    additionalProperties: false
    description: >
      Goal planning progress. Present only for feature-goal snapshots whose goal
      status projection carries a planning block.
    required:
      - state
      - shared_preplan_prepared
      - planned_subtask_count
      - total_subtask_count
    properties:
      state:
        type: string
        enum:
          - not_started
          - preplanned
          - partially_planned
          - blocked
          - prepared
      shared_preplan_prepared:
        type: boolean
      planned_subtask_count:
        type: integer
        minimum: 0
      total_subtask_count:
        type: integer
        minimum: 0
      current_planning_subtask_id:
        type: string
        minLength: 1
      planning_wave_subtask_ids:
        type: array
        minItems: 1
        maxItems: 5
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 40
        description: >
          The bounded set of subtasks the next planning wave covers, in manifest order, capped at
          the planning fan-out cap (GOAL_PLANNING_WAVE_CAP). Never includes a subtask whose plan is
          already checkpointed. Absent when planning has not started, is prepared, or is blocked.
          `current_planning_subtask_id` stays single-valued and equals the lowest id in this set
          while a wave is reported.
      reason:
        type: string
        minLength: 1
  current_phase_execution:
    type: object
    additionalProperties: false
    description: >
      Authoritative current-phase execution measure for the phase that is current
      in the same snapshot. Omitted when no reliable value exists, during goal
      planning (use `planning` instead), and for idle/problem snapshots. Never
      carries a completed neighbouring phase's historical loop or pass.
      `kind` distinguishes semantic loops/passes from generic attempts and from
      bounded edge iterations; `total` is present only for a meaningful bounded
      edge cap and must be absent for every other kind.
    required:
      - phase_id
      - kind
      - count
    properties:
      phase_id:
        type: string
        minLength: 1
        maxLength: 64
      kind:
        type: string
        enum:
          - pass
          - semantic_loop
          - gate_run
          - bounded_edge
          - attempt
      count:
        type: integer
        minimum: 1
      total:
        type: integer
        minimum: 1
    allOf:
      - if:
          properties:
            kind:
              enum:
                - pass
                - semantic_loop
                - gate_run
                - attempt
          required:
            - kind
        then:
          not:
            required:
              - total
  pause_requested:
    type: boolean
    description: >
      A pause is requested but not yet consumed at a boundary; the goal is still
      genuinely running. Present only for feature-goal snapshots.
  paused_at:
    type: string
    minLength: 1
    description: >
      Instant the pause took effect, from the durable control record. Omitted when
      the paused projection is inferred from lease expiry rather than recorded.
  pause_reason:
    type: object
    additionalProperties: false
    required:
      - code
    description: >
      Why a paused or blocked lifecycle is waiting. Present on paused snapshots so a
      consumer can tell "waiting for you" from "waiting for capacity", and on blocked
      feature-goal or feature-task-runtime snapshots when the runtime needs a bounded
      operator decision before resume. `awaiting_operator_decision` means the current
      subtask stopped pending a bounded operator decision and will not resume on its
      own; the remaining codes mirror the durable goal control record. Payload-free by
      construction: `label` is the same sanitized goal-facing reason the CLI reports,
      carrying severity counts and bounded finding labels but never a diff hunk, path,
      line number, construct body, or raw review output.
    properties:
      code:
        type: string
        enum:
          - awaiting_operator_decision
          - operator_request
          - stop_after_subtask
          - operator_stop
          - runner_interrupted
      label:
        type: string
        minLength: 1
        maxLength: 512
  active_duration_ms:
    type: integer
    minimum: 0
    description: >
      Time the goal spent actually executing, accumulated from lease heartbeats. This is
      not the wall clock since started_at: intervals where the goal sat blocked, paused,
      or unattended between runs are excluded. Omitted for snapshots with no durable
      control record. Consumers add now - active_duration_as_of while that field is present.
  active_duration_as_of:
    type: string
    minLength: 1
    description: >
      Instant active_duration_ms is current as of. Present only while a lease is live, so
      a reader can tick the live tail without double counting -- the next heartbeat folds
      that same tail into active_duration_ms. Absent means the accumulated value is final.
  last_agent_activity_at:
    type: string
    minLength: 1
    description: >
      Instant of the latest durable agent-activity stamp while the current agent phase is
      running. Informational only; does not drive updated_at or freshness. Omitted with
      last_agent_activity_label when no stamp exists.
  last_agent_activity_label:
    type: string
    enum:
      - worktree write
      - stdout
      - durable progress
      - evidence read
      - tool stream
    description: >
      Closed vocabulary for the latest agent-activity stamp. Omitted with
      last_agent_activity_at when no stamp exists.
  updated_at:
    type: string
    minLength: 1
    description: "Authoritative update time used for freshness classification."
  freshness:
    type: string
    enum:
      - fresh
      - stale
      - unknown
  summary:
    type: string
    minLength: 1
  problem:
    type: object
    additionalProperties: false
    required:
      - code
      - message
    properties:
      code:
        type: string
        enum:
          - missing_repository_identity
          - absent_database
          - no_matching_work
          - incompatible_record
          - invalid_repository_input
          - schema_incompatible
      message:
        type: string
        minLength: 1
      details:
        type: object
        additionalProperties: true
allOf:
  - if:
      required:
        - execution_scope
    then:
      required:
        - execution_id
        - status_store_id
        - run_sequence
        - status_revision
  - if:
      required:
        - execution_id
    then:
      required:
        - execution_scope
  - if:
      required:
        - status_store_id
    then:
      required:
        - execution_scope
  - if:
      required:
        - run_sequence
    then:
      required:
        - execution_scope
  - if:
      required:
        - status_revision
    then:
      required:
        - execution_scope
  - if:
      required:
        - invocation_id
    then:
      required:
        - execution_scope
  - if:
      required:
        - phase_id
    then:
      required:
        - execution_scope
  - if:
      required:
        - current_activity
    then:
      required:
        - execution_scope
  - if:
      properties:
        execution_scope:
          const: standalone_phase
      required:
        - execution_scope
    then:
      required:
        - invocation_id
        - phase_id
  - if:
      properties:
        execution_scope:
          const: workflow
      required:
        - execution_scope
    then:
      not:
        anyOf:
          - required:
              - invocation_id
          - required:
              - phase_id
  - if:
      required:
        - last_agent_activity_at
    then:
      required:
        - last_agent_activity_label
  - if:
      required:
        - last_agent_activity_label
    then:
      required:
        - last_agent_activity_at
  - if:
      properties:
        lifecycle_state:
          const: blocked
      required:
        - lifecycle_state
    then:
      properties:
        pause_reason:
          properties:
            code:
              const: awaiting_operator_decision
