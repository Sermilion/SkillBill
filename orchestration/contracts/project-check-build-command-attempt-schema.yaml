$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/project-check-build-command-attempt-schema.yaml
title: Project check build command attempt
type: object
additionalProperties: false
required:
  - contract_version
  - list_identity
  - commands
properties:
  contract_version:
    const: '0.1'
  list_identity:
    type: string
    minLength: 1
  commands:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [argv, working_directory, outcome, exit_code, duration_ms, command]
      properties:
        argv:
          type: array
          minItems: 1
          items: { type: string }
        working_directory:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        exit_code: { type: integer }
        duration_ms: { type: integer, minimum: 0 }
        outcome:
          enum: [passed, failed, rejected_zero_work]
        stdout_excerpt:
          type: string
          maxLength: 8192
