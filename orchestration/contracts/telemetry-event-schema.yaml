# Telemetry event wire schema (canonical source of truth).
#
# This file describes the shape of every telemetry envelope the Skill
# Bill runtime emits at its MCP tool seams (the `*_started/*_finished`,
# `*_workflow_*`, and other invocation tools exposed by
# `McpToolRegistry.tools`). It is authored in YAML for human
# readability and consumed as a JSON Schema (Draft 2020-12) by the
# Kotlin runtime (`TelemetryEventSchemaValidator` in `runtime-mcp`).
#
# What lives here vs. in Kotlin:
#
# - This file defines, for every event, its `event_name` (a const),
#   the pinned `contract_version`, and the typed payload fields the
#   event carries on the wire. The payload shape mirrors
#   `McpInputSchemaProjection` for `tools/list` advertisement.
#   `McpTelemetrySchemaEnumParityTest` pins YAML enum constraints to
#   their Kotlin owners and keeps every tool branch registered.
# - Cross-field "coherence" rules that JSON Schema cannot express
#   cleanly stay in Kotlin, in `TelemetryEventSchemaValidator`
#   (`validateCoherence`). Every such rule is named below under
#   `x-coherence-checks` so the schema document alone fully describes
#   the contract.
#
# Discriminator strategy:
#
# - Top-level `oneOf` keyed by `event_name`. Each branch lives under
#   `$defs/<eventCamelCaseName>Event` and pins `event_name` as a const,
#   so a single envelope payload always selects exactly one branch.
# - `discriminator.propertyName: event_name` gives validators a fast
#   path to the matching branch and gives readers a clear hint about
#   how the union is keyed. `oneOf` (not `anyOf`) because the branches
#   are mutually exclusive — `event_name` is a const in each branch.
#
# Versioning rule:
#
# - `contract_version` is pinned by `TELEMETRY_EVENT_CONTRACT_VERSION` in
#   `runtime-kotlin/runtime-mcp/src/main/kotlin/skillbill/mcp/telemetry/TelemetryEventSchemaValidator.kt`,
#   and this file's on-disk location by `TelemetryEventSchemaPaths` in
#   `runtime-kotlin/runtime-mcp/src/repoTest/kotlin/skillbill/mcp/telemetry/`.
# - The parity test `TelemetryEventSchemaContractVersionTest` fails the
#   build if they diverge. To bump the contract, edit BOTH constants in
#   the same change.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/telemetry-event-schema.yaml"
title: "Telemetry event wire payload"
description: >
  Schema for every telemetry event the Skill Bill runtime emits at its
  MCP tool seams. Describes SHAPE only and never hard-codes
  caller-specific identifiers (concrete session ids, repo paths, etc.).
  New telemetry events ship as long as the wire envelope matches this
  schema and the coherence checks below.
type: object
# Top-level shape is the discriminated union — every payload field lives
# on the per-event branch under `$defs/<event>Event` (see `oneOf`
# below). The branch sets `additionalProperties` (`false` for strict
# events, `true` for open events), so declaring `additionalProperties`
# here would double-reject every payload field after the branch already
# validated it. We pin the envelope keys (`event_name`,
# `contract_version`) on the branch itself instead — every branch
# re-states both as consts so each branch is self-contained when read
# in isolation.
required:
  - event_name
  - contract_version
properties:
  event_name:
    type: string
    minLength: 1
    description: >
      Discriminator for the per-event branch under `oneOf`. Pinned per
      branch as a const; every value MUST appear in
      `McpToolRegistry.toolNames`.
  contract_version:
    type: string
    const: "1.12.0"
    description: >
      Pinned to `TELEMETRY_EVENT_CONTRACT_VERSION` (currently "1.12.0").
      The parity test `TelemetryEventSchemaContractVersionTest` keeps
      the two in lockstep.

discriminator:
  propertyName: event_name

# Per-event branch table. Each branch under `$defs/<event>Event`:
# - pins `event_name` as a const (matching the `McpToolRegistry.toolNames` value).
# - re-states `contract_version` as a const so the branch is
#   self-contained when a tool reads a single branch in isolation.
# - declares the payload fields that `McpInputSchemaProjection` copies
#   into the advertised `inputSchema` (minus `event_name`,
#   `contract_version`, and the quality-check runtime-owned keys).
#   Open-object tools use `additionalProperties: true` on the branch.
oneOf:
  - $ref: "#/$defs/addLearningEvent"
  - $ref: "#/$defs/doctorEvent"
  - $ref: "#/$defs/featureTaskPhaseBlockEvent"
  - $ref: "#/$defs/featureTaskPhaseCompleteEvent"
  - $ref: "#/$defs/featureVerifyFinishedEvent"
  - $ref: "#/$defs/featureVerifyStatsEvent"
  - $ref: "#/$defs/featureVerifyStartedEvent"
  - $ref: "#/$defs/featureVerifyWorkflowGetEvent"
  - $ref: "#/$defs/featureVerifyWorkflowLatestEvent"
  - $ref: "#/$defs/featureVerifyWorkflowListEvent"
  - $ref: "#/$defs/featureVerifyWorkflowContinueEvent"
  - $ref: "#/$defs/featureVerifyWorkflowOpenEvent"
  - $ref: "#/$defs/featureVerifyWorkflowResumeEvent"
  - $ref: "#/$defs/featureVerifyWorkflowUpdateEvent"
  - $ref: "#/$defs/goalStartedEvent"
  - $ref: "#/$defs/goalSubtaskFinishedEvent"
  - $ref: "#/$defs/goalFinishedEvent"
  - $ref: "#/$defs/goalIssueFinishedEvent"
  - $ref: "#/$defs/goalStatsEvent"
  - $ref: "#/$defs/importReviewEvent"
  - $ref: "#/$defs/newSkillScaffoldEvent"
  - $ref: "#/$defs/prDescriptionGeneratedEvent"
  - $ref: "#/$defs/qualityCheckFinishedEvent"
  - $ref: "#/$defs/qualityCheckStartedEvent"
  - $ref: "#/$defs/skillbillReviewFinishedEvent"
  - $ref: "#/$defs/skillbillReviewStageDegradationEvent"
  - $ref: "#/$defs/skillbillReviewFinishedLegacyRegeneratedEvent"
  - $ref: "#/$defs/resolveLearningsEvent"
  - $ref: "#/$defs/reviewStatsEvent"
  - $ref: "#/$defs/telemetryProxyCapabilitiesEvent"
  - $ref: "#/$defs/telemetryRemoteStatsEvent"
  - $ref: "#/$defs/triageFindingsEvent"
  - $ref: "#/$defs/updateCheckEvent"

$defs:
  # ---------------------------------------------------------------------
  # Shared enum/shape table for branches and projection inlining.
  # ---------------------------------------------------------------------
  featureTaskRuntimeFailureDispositionEnum:
    type: string
    enum:
      - retryable
      - non_retryable_policy_conflict
      - needs_user_action
      - process_failure
      - invalid_output
  historySignalEnum:
    type: string
    enum:
      - "none"
      - irrelevant
      - low
      - medium
      - high
  qualityCheckScopeEnum:
    type: string
    enum:
      - files
      - working_tree
      - branch_diff
      - repo
  # Mirrors `TelemetryMeasurementAvailability`. A consumer reads the availability before the value, so
  # an absent measurement can never be mistaken for a measured zero.
  telemetryMeasurementAvailabilityEnum:
    type: string
    enum:
      - measured
      - unavailable_no_durable_state
      - unavailable_unsupported
      - unavailable_incomplete
      - unknown
  # Mirrors `LifecycleSessionCompletion`: how a lifecycle session reached its terminal row.
  lifecycleSessionCompletionEnum:
    type: string
    enum:
      - operator_completed
      - reconciler_stale
  specInputTypeEnum:
    type: string
    enum:
      - raw_text
      - pdf
      - markdown_file
      - image
      - directory
  workflowImplementStatusEnum:
    type: string
    enum:
      - pending
      - running
      - completed
      - failed
      - abandoned
      - blocked
  workflowVerifyStatusEnum:
    type: string
    enum:
      - pending
      - running
      - completed
      - failed
      - abandoned
  workflowImplementStepIdEnum:
    type: string
    enum:
      - assess
      - create_branch
      - preplan
      - plan
      - implement
      - review
      - audit
      - validate
      - write_history
      - commit_push
      - pr_description
      - finish
  workflowVerifyStepIdEnum:
    type: string
    enum:
      - collect_inputs
      - extract_criteria
      - gather_diff
      - feature_flag_audit
      - code_review
      - unit_test_value_check
      - completeness_audit
      - verdict
      - finish
  workflowStepStatusEnum:
    type: string
    enum:
      - pending
      - running
      - completed
      - failed
      - blocked
      - skipped
      - paused
  # SKILL-66 Subtask 1: terminal-status enums for the decomposed-goal
  # telemetry family. Deliberately NOT reusing `workflowStepStatusEnum`:
  # the goal subtask terminal set is `complete` (not `completed`),
  # `blocked`, `skipped`, and the goal-run terminal set is `completed`
  # (not `complete`) / `blocked`. Single-sourced here for Subtasks 2/3.
  goalSubtaskStatusEnum:
    type: string
    enum:
      - complete
      - blocked
      - skipped
  goalFinishedStatusEnum:
    type: string
    enum:
      - completed
      - paused
      - blocked
      - abandoned
  goalRunnerStopReasonEnum:
    type: string
    enum:
      - FAILED
      - BLOCKED
      - POLICY_BLOCKED
      - INTERRUPTED
      - TIMEOUT
      - NO_TERMINAL_STORE_OUTCOME
      - PULL_REQUEST_FAILED
      - DEPENDENCIES_BLOCKED
      - RECONCILED_RESUMABLE
      # SKILL-142: the child paused for the bounded operator decision. Resumable, not stopped.
      - AWAITING_OPERATOR_DECISION
      # SKILL-154: the goal parent reached a durable operator or stop-after pause boundary.
      - PAUSED
  freeObjectShape:
    type: object
  reviewChildStep:
    type: object
    additionalProperties: true
    required:
      - skill
      - total_findings
      - accepted_findings
      - rejected_findings
      - unresolved_findings
      - accepted_rate
      - rejected_rate
    properties:
      skill:
        type: string
      total_findings:
        type: integer
      accepted_findings:
        type: integer
      rejected_findings:
        type: integer
      unresolved_findings:
        type: integer
      accepted_rate:
        type: number
      rejected_rate:
        type: number
      accepted_finding_details:
        type: array
        items:
          $ref: "#/$defs/reviewChildFindingDetail"
      rejected_finding_details:
        type: array
        items:
          $ref: "#/$defs/reviewChildFindingDetail"
  reviewChildFindingDetail:
    type: object
    additionalProperties: true
    required:
      - issue_category
      - severity
      - confidence
      - outcome_type
    properties:
      issue_category:
        type: string
      severity:
        type: string
        enum:
          - Blocker
          - Major
          - Minor
      confidence:
        type: string
        enum:
          - High
          - Medium
          - Low
          - high
          - medium
          - low
      outcome_type:
        type: string
        enum:
          - finding_accepted
          - fix_applied
          - finding_edited
          - fix_rejected
          - false_positive
  qualityCheckChildStep:
    type: object
    additionalProperties: true
    required:
      - skill
      - result
      - iterations
      - initial_failure_count
      - final_failure_count
    properties:
      skill:
        type: string
      result:
        type: string
        enum:
          - pass
          - fail
          - skipped
          - unsupported_stack
      iterations:
        type: integer
      initial_failure_count:
        type: integer
      final_failure_count:
        type: integer
      failing_check_names:
        type: array
        items:
          type: string
      failing_check_details:
        type: array
        items:
          $ref: "#/$defs/freeObjectShape"
  prDescriptionChildStep:
    type: object
    additionalProperties: true
    required:
      - skill
      - pr_created
      - commit_count
      - files_changed_count
    properties:
      skill:
        type: string
      pr_created:
        type: boolean
      commit_count:
        type: integer
      files_changed_count:
        type: integer
  emptyObjectShape:
    type: object
    additionalProperties: false
    properties: {}
    required: []
  stepUpdateImplementShape:
    type: object
    additionalProperties: false
    required:
      - step_id
      - status
      - attempt_count
    properties:
      step_id:
        $ref: "#/$defs/workflowImplementStepIdEnum"
      status:
        $ref: "#/$defs/workflowStepStatusEnum"
      attempt_count:
        type: integer
  stepUpdateVerifyShape:
    type: object
    additionalProperties: false
    required:
      - step_id
      - status
      - attempt_count
    properties:
      step_id:
        $ref: "#/$defs/workflowVerifyStepIdEnum"
      status:
        $ref: "#/$defs/workflowStepStatusEnum"
      attempt_count:
        type: integer
  addLearningEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - scope
      - title
      - rule_text
      - source_review_run_id
      - source_finding_id
    properties:
      event_name:
        const: add_learning
      contract_version:
        const: "1.12.0"
      scope:
        type: string
        enum:
          - global
          - repo
          - skill
      scope_key:
        type: string
      title:
        type: string
        minLength: 1
      rule_text:
        type: string
        minLength: 1
      reason:
        type: string
      source_review_run_id:
        type: string
        minLength: 1
      source_finding_id:
        type: string
        minLength: 1
  doctorEvent:
    type: object
    additionalProperties: true
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: doctor
      contract_version:
        const: "1.12.0"

  featureTaskPhaseCompleteEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - workflow_id
      - phase_id
      - attempt
      - value
    properties:
      event_name:
        const: feature_task_phase_complete
      contract_version:
        const: "1.12.0"
      workflow_id:
        type: string
        minLength: 1
      phase_id:
        type: string
        enum: [preplan, plan, implement, simplify, implement_fix, review, build, verify_findings, audit, audit_plan_fix, audit_implement_fix, validate, write_history, pr]
      attempt:
        type: integer
        minimum: 1
      value:
        type: string
        minLength: 1
      prompt:
        type: string
        minLength: 1
      summary:
        type: string
        minLength: 1
      verdict:
        type: string
        minLength: 1

  featureTaskPhaseBlockEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - workflow_id
      - phase_id
      - attempt
      - reason
    properties:
      event_name:
        const: feature_task_phase_block
      contract_version:
        const: "1.12.0"
      workflow_id:
        type: string
        minLength: 1
      phase_id:
        type: string
        enum: [preplan, plan, implement, simplify, implement_fix, review, build, verify_findings, audit, audit_plan_fix, audit_implement_fix, validate, write_history, pr]
      attempt:
        type: integer
        minimum: 1
      reason:
        type: string
        minLength: 1
      failure_disposition:
        $ref: "#/$defs/featureTaskRuntimeFailureDispositionEnum"
      verdict:
        type: string
        minLength: 1

  updateCheckEvent:
    type: object
    additionalProperties: true
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: update_check
      contract_version:
        const: "1.12.0"

  featureVerifyStatsEvent:
    type: object
    additionalProperties: true
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: feature_verify_stats
      contract_version:
        const: "1.12.0"

  reviewStatsEvent:
    type: object
    additionalProperties: true
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: review_stats
      contract_version:
        const: "1.12.0"
      # Commit-focused sparse specialist accounting. Every field is an identity, a count, or a lane
      # name: no commit subject, path, diff text, or company identifier reaches telemetry.
      commit_sequence_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
      routing_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
      commit_count:
        type: integer
        minimum: 0
      lane_count:
        type: integer
        minimum: 0
      focused_commit_count:
        type: integer
        minimum: 0
      skipped_commit_count:
        type: integer
        minimum: 0
      focused_pair_count:
        type: integer
        minimum: 0
      skipped_pair_count:
        type: integer
        minimum: 0
      lane_bundle_sizes:
        description: Per-lane assembled bundle size in bytes, keyed by lane skill name.
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      lane_segment_counts:
        description: Per-lane bundle segment count, keyed by lane skill name.
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      incomplete_lanes:
        description: >
          Lanes that ended incomplete — budget exhaustion, or a lane run that did not succeed.
          These are non-clean coverage; the
          integration pass never compensates for them.
        type: array
        items:
          type: string
      parent_analysis_pairs:
        type: integer
        minimum: 0
      parent_analysis_bytes:
        type: integer
        minimum: 0
      integration_terminal_outcome:
        type: string
        enum:
          - completed
          - skipped_not_applicable
          - review_context_budget_exceeded
          - failed
          - timeout
          - interrupted
          - spawn_failure
          - process_failure
          - unsupported_provider
          - no_op_resume
      integration_commit_sequence_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
      integration_finding_count:
        type: integer
        minimum: 0

  telemetryProxyCapabilitiesEvent:
    type: object
    additionalProperties: true
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: telemetry_proxy_capabilities
      contract_version:
        const: "1.12.0"

  telemetryRemoteStatsEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - workflow
    properties:
      event_name:
        const: telemetry_remote_stats
      contract_version:
        const: "1.12.0"
      workflow:
        type: string
        enum:
          - verify
          - bill-feature-verify
          - feature-task-runtime
      since:
        type: string
      date_from:
        type: string
      date_to:
        type: string
      group_by:
        type: string
        enum:
          - ""
          - day
          - week

  # --- Strict branches (mirror `inputSchemas` entries verbatim) ---

  featureVerifyStartedEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - acceptance_criteria_count
      - rollout_relevant
      - spec_summary
    properties:
      event_name:
        const: feature_verify_started
      contract_version:
        const: "1.12.0"
      acceptance_criteria_count:
        type: integer
      rollout_relevant:
        type: boolean
      spec_summary:
        type: string
      orchestrated:
        type: boolean

  featureVerifyFinishedEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - feature_flag_audit_performed
      - review_iterations
      - audit_result
      - completion_status
      - session_id
      - gaps_found
      - orchestrated
      - acceptance_criteria_count
      - rollout_relevant
      - spec_summary
      - duration_seconds
    properties:
      event_name:
        const: feature_verify_finished
      contract_version:
        const: "1.12.0"
      feature_flag_audit_performed:
        type: boolean
      review_iterations:
        type: integer
      audit_result:
        type: string
        enum:
          - all_pass
          - had_gaps
          - skipped
      completion_status:
        type: string
        enum:
          - completed
          - abandoned_at_review
          - abandoned_at_audit
          - error
          - stale
      history_relevance:
        $ref: "#/$defs/historySignalEnum"
      history_helpfulness:
        $ref: "#/$defs/historySignalEnum"
      session_id:
        type: string
      gaps_found:
        type: array
        items:
          type: string
      orchestrated:
        type: boolean
      acceptance_criteria_count:
        type: integer
      rollout_relevant:
        type: boolean
      spec_summary:
        type: string
      # Null whenever `duration_seconds_availability` is not `measured`: a
      # reconciler-closed (`stale`) run never observed its end.
      duration_seconds:
        type:
          - integer
          - "null"
      duration_seconds_availability:
        $ref: "#/$defs/telemetryMeasurementAvailabilityEnum"

  featureVerifyWorkflowContinueEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - workflow_id
    properties:
      event_name:
        const: feature_verify_workflow_continue
      contract_version:
        const: "1.12.0"
      workflow_id:
        type: string

  featureVerifyWorkflowGetEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - workflow_id
    properties:
      event_name:
        const: feature_verify_workflow_get
      contract_version:
        const: "1.12.0"
      workflow_id:
        type: string

  featureVerifyWorkflowLatestEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: feature_verify_workflow_latest
      contract_version:
        const: "1.12.0"

  featureVerifyWorkflowListEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: feature_verify_workflow_list
      contract_version:
        const: "1.12.0"
      limit:
        type: integer

  featureVerifyWorkflowOpenEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
    properties:
      event_name:
        const: feature_verify_workflow_open
      contract_version:
        const: "1.12.0"
      session_id:
        type: string
      current_step_id:
        type: string
      issue_key:
        type: string
      repository_identity:
        type: string
        description: >
          Canonical repository identity: the literal prefix 'repo-root-realpath-v1:' followed by the absolute real path of the Git top-level directory. Example: repo-root-realpath-v1:/home/me/projects/app
        pattern: "^repo-root-realpath-v1:/"
      governed_spec_path:
        type: string

  featureVerifyWorkflowResumeEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - workflow_id
    properties:
      event_name:
        const: feature_verify_workflow_resume
      contract_version:
        const: "1.12.0"
      workflow_id:
        type: string

  featureVerifyWorkflowUpdateEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - workflow_id
      - workflow_status
      - current_step_id
    properties:
      event_name:
        const: feature_verify_workflow_update
      contract_version:
        const: "1.12.0"
      workflow_id:
        type: string
      workflow_status:
        $ref: "#/$defs/workflowVerifyStatusEnum"
      current_step_id:
        $ref: "#/$defs/workflowVerifyStepIdEnum"
      step_updates:
        type: array
        items:
          $ref: "#/$defs/stepUpdateVerifyShape"
      artifacts_patch:
        $ref: "#/$defs/freeObjectShape"
      session_id:
        type: string

  # SKILL-65 Subtask 4 (AC3): EXPERIMENTAL feature-task-runtime workflow-family
  # branches. Payload fields mirror McpToolRegistry.inputSchemas for each tool.
  goalStartedEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - issue_key
      - feature_name
      - workflow_id
      - subtask_total
      - resumed
      - started_at
      - status
      - mode
    properties:
      event_name:
        const: goal_started
      contract_version:
        const: "1.12.0"
      issue_key:
        type: string
      feature_name:
        type: string
      workflow_id:
        type: string
      subtask_total:
        type: integer
        minimum: 1
        maximum: 2147483647
      resumed:
        type: boolean
      started_at:
        type: string
        minLength: 1
        description: ISO-8601 timestamp the goal run started at.
      status:
        type: string
        enum:
          - running
        description: Runtime status at goal-start emission time.
      mode:
        type: string
        enum:
          - runtime

  goalSubtaskFinishedEvent:
    type: object
    additionalProperties: false
    required:
      - event_name
      - contract_version
      - issue_key
      - workflow_id
      - subtask_id
      - subtask_name
      - status
      - started_at
      - finished_at
      - duration_seconds
      - attempt_count
      - blocked_reason
    properties:
      event_name:
        const: goal_subtask_finished
      contract_version:
        const: "1.12.0"
      issue_key:
        type: string
      workflow_id:
        type: string
      subtask_id:
        type: integer
        minimum: 1
        maximum: 2147483647
      subtask_name:
        type: string
      status:
        $ref: "#/$defs/goalSubtaskStatusEnum"
      started_at:
        type: string
        minLength: 1
        description: ISO-8601 timestamp the subtask started at.
      finished_at:
        type: string
        minLength: 1
        description: ISO-8601 timestamp the subtask finished at.
      duration_seconds:
        type: integer
        minimum: 0
        maximum: 2147483647
      attempt_count:
        type: integer
        minimum: 0
        maximum: 2147483647
      blocked_reason:
        type:
          - string
          - "null"
        description: >
          Category-prefixed blocked reason when `status` is `blocked`; `null`
          otherwise. Required key with a nullable value. Prefixes are `limit:`,
          `validation:`, `fix_loop:`, `git:`, `store_lock:`, `needs_human:`,
          `schema:`, `runtime:`, and `unknown:`.
      finalizing_agent_id:
        type:
          - string
          - "null"
        description: >
          Resolved agent that finalized the subtask (the terminal COMPLETE/BLOCKED ledger
          entry); `null` when no agent attribution was rolled up. Additive-optional: legacy
          payloads omit the key.
      participating_agent_ids:
        type: array
        items:
          type: string
        description: >
          Order-stable distinct resolved agents that executed a phase of the subtask. Enables
          per-agent finalized vs handoff-participant aggregation. Additive-optional: legacy
          payloads omit the key.
      boundary_history_value:
        $ref: "#/$defs/historySignalEnum"
        description: >
          History-usefulness rating the subtask's feature-task run produced for the
          boundary history.md it read on entry. Additive-optional: legacy payloads omit the key.
      boundary_history_written:
        type: boolean
        description: >
          Whether the subtask's feature-task run wrote a boundary history.md entry.
          Additive-optional: legacy payloads omit the key.

