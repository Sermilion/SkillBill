$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/project-check-config-schema.yaml
title: Project check configuration
type: object
additionalProperties: false
required:
  - contract_version
  - project_id
  - build_commands
  - lint_commands
  - test_commands
  - formatting_commands
  - validation_commands
properties:
  contract_version:
    const: '0.1'
  project_id:
    type: string
    minLength: 1
    pattern: '\S'
  build_commands: { $ref: '#/$defs/category' }
  lint_commands: { $ref: '#/$defs/category' }
  test_commands: { $ref: '#/$defs/category' }
  formatting_commands: { $ref: '#/$defs/category' }
  validation_commands: { $ref: '#/$defs/category' }
$defs:
  category:
    oneOf:
      - type: 'null'
      - type: object
        additionalProperties: false
        required: [commands]
        properties:
          commands:
            type: array
            items: { $ref: '#/$defs/command' }
  command:
    type: object
    additionalProperties: false
    required: [argv, working_directory]
    properties:
      argv:
        type: array
        minItems: 1
        prefixItems:
          - type: string
            minLength: 1
            pattern: '\S'
        items: { type: string }
      working_directory:
        type: string
        minLength: 1
        pattern: '^(\.|(?!/)(?![A-Za-z]:)(?!.*(^|/)(?:\.|\.\.)(/|$))[^/\\]+(?:/[^/\\]+)*)$'
