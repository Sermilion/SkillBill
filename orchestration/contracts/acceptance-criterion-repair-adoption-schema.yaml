$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/acceptance-criterion-repair-adoption.yaml
title: Acceptance criterion repair adoption
type: object
additionalProperties: false
required: [contract_version, composition, semantic_revision, descriptor_digest, policy_digest, skeleton_digest, declared_contract_versions, catalog_id, spec_digest, execution_id, tree_digest, checkpoint_id, stopped_owner_generation, stopped_owner_evidence_ref, pristine_history_digest, retained_evidence_refs, prospective_budget, structured_discovery_required, original_artifacts]
properties:
  contract_version: { const: '0.2' }
  original_artifacts: { type: object, minProperties: 1, maxProperties: 128 }
  composition: { enum: [standalone, goal_child_build, goal_child_validate] }
  semantic_revision: { type: integer, enum: [1, 2, 3] }
  descriptor_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  policy_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  skeleton_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  declared_contract_versions:
    type: object
    minProperties: 1
    maxProperties: 32
    additionalProperties: false
    required: [contract_version, phase_output_contract_version]
    properties:
      contract_version: { enum: ['0.1', '0.2'] }
      phase_output_contract_version: { enum: ['0.6', '0.7'] }
  catalog_id: { type: string, minLength: 1, maxLength: 256 }
  spec_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  execution_id: { type: string, minLength: 1, maxLength: 256 }
  tree_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  checkpoint_id: { type: string, minLength: 1, maxLength: 256 }
  stopped_owner_generation: { type: integer, minimum: 0 }
  stopped_owner_evidence_ref: { type: string, minLength: 1, maxLength: 512 }
  pristine_history_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  retained_evidence_refs:
    type: array
    minItems: 1
    maxItems: 256
    uniqueItems: true
    items: { type: string, minLength: 1, maxLength: 512 }
  prospective_budget: { const: true }
  structured_discovery_required: { const: true }
  standalone_source_proof:
    type: object
    additionalProperties: false
    required: [repository_identity, normalized_issue_key, spec_path, checkpoint_commit, source_text]
    properties:
      repository_identity: { type: string, minLength: 1, maxLength: 512 }
      normalized_issue_key: { type: string, minLength: 1, maxLength: 256 }
      spec_path: { type: string, minLength: 1, maxLength: 4096 }
      checkpoint_commit: { type: string, pattern: '^[a-fA-F0-9]{40,64}$' }
      source_text: { type: string, maxLength: 1048576 }
allOf:
  - if:
      properties:
        composition: { const: standalone }
      required: [composition]
    then:
      required: [standalone_source_proof]
    else:
      not:
        required: [standalone_source_proof]
x-coherence-checks:
  - id: supported-legacy-composition
    description: Composition and semantic revision must be derived from exactly one retained AUDIT strategy and the retained execution-plan definition and quality-gate selection. Only standalone, goal-child build, and goal-child validate at audit revisions one through three admit adoption.
  - id: original-evidence-retained
    description: Descriptor, policy, canonical skeleton, phase-output and pristine-history digests must each match their retained source. Declared execution-plan and phase-output versions must match the original descriptor and selected audit-entry output. Goal-child source provenance must match the retained planning import and continuation identity. Standalone source provenance must retain the repository and issue identity, governed spec path, exact checkpoint commit and exact source text whose digest and ordered catalog match the receipt and original run invariants. Tree/checkpoint claims must match the selected audit-entry output and its phase-bound checkpoint identity. The stopped-owner evidence reference and retained evidence references must match their receipt fields and original artifacts. Engine admission independently reads and rechecks standalone source at the checkpoint and compares the historical repository fingerprint. Adoption preserves original evidence without reconstructing serial attempts.
  - id: utf8-capacity
    description: The runtime refuses serialized artifacts above 12582912 UTF-8 bytes before persistence.
