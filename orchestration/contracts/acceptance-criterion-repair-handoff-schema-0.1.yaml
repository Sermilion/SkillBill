$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/acceptance-criterion-repair-handoff.yaml
title: Acceptance criterion repair handoff
type: object
additionalProperties: false
required: [contract_version, catalog_id, spec_digest, execution_id, revision, criterion_ref, stage, reservation_id, unsuccessful_used, unsuccessful_remaining, queue_position, queue_size, actionable_gap, evidence_ref, tree_digest, checkpoint_id, dependencies, prerequisite_facts]
properties:
  contract_version: { const: '0.1' }
  catalog_id: { type: string, minLength: 1, maxLength: 256 }
  spec_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  execution_id: { type: string, minLength: 1, maxLength: 256 }
  revision: { type: integer, minimum: 0 }
  criterion_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
  stage: { enum: [discovery_admitted, repair_reserved, repair_completed_awaiting_targeted_verification] }
  reservation_id: { type: [string, 'null'], minLength: 1, maxLength: 256 }
  unsuccessful_used: { type: integer, minimum: 0, maximum: 3 }
  unsuccessful_remaining: { type: integer, minimum: 0, maximum: 3 }
  queue_position: { type: integer, minimum: 1, maximum: 256 }
  queue_size: { type: integer, minimum: 1, maximum: 256 }
  actionable_gap: { type: string, minLength: 1, maxLength: 4096 }
  evidence_ref: { type: string, minLength: 1 }
  tree_digest: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  checkpoint_id: { type: string, minLength: 1, maxLength: 256 }
  dependencies:
    type: array
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [prerequisite_ref, reason, declaring_output_ref, source_evidence_ref]
      properties:
        prerequisite_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        declaring_output_ref: { type: string, minLength: 1, maxLength: 512 }
        source_evidence_ref: { type: string, minLength: 1 }
  prerequisite_facts:
    type: array
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [criterion_ref, source_disposition, validation_obligation, validation_owner_available, evidence_ref]
      properties:
        criterion_ref: { type: string, pattern: '^AC-[0-9]{3}$' }
        source_disposition: { enum: [not_applicable, source_closed, source_unresolved] }
        validation_obligation: { enum: [required, deferred, not_required] }
        validation_owner_available: { type: boolean }
        evidence_ref: { type: string, minLength: 1 }
x-coherence-checks:
  - id: current-authority-only
    description: The handoff grants repair authority for exactly the current criterion and carries no mutable owner token.
  - id: budget-and-queue
    description: Used and remaining unsuccessful outcomes agree with durable state and queue position is in range.
  - id: utf8-capacity
    description: The runtime refuses serialized artifacts above 65536 UTF-8 bytes before persistence.
