$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/project-check-command-snapshot-schema.yaml
title: Project check command snapshot
type: object
additionalProperties: false
required:
  - contract_version
  - project_id
  - build_commands
  - validation_commands
  - parser_metadata
  - gradle_wrapper
properties:
  contract_version:
    const: '0.1'
  project_id:
    type: string
    minLength: 1
    pattern: '\S'
  build_commands: { $ref: '#/$defs/category' }
  validation_commands: { $ref: '#/$defs/category' }
  parser_metadata:
    oneOf:
      - type: 'null'
      - $ref: '#/$defs/parser_metadata'
  gradle_wrapper:
    type: ['string', 'null']
    minLength: 1
$defs:
  category:
    oneOf:
      - type: 'null'
      - type: object
        additionalProperties: false
        required: [commands]
        properties:
          commands:
            type: array
            items: { $ref: '#/$defs/command' }
  command:
    type: object
    additionalProperties: false
    required: [argv, working_directory]
    properties:
      argv:
        type: array
        minItems: 1
        prefixItems:
          - type: string
            minLength: 1
            pattern: '\S'
        items: { type: string }
      working_directory:
        type: string
        minLength: 1
        pattern: '^(\.|(?!/)(?![A-Za-z]:)(?!.*(^|/)(?:\.|\.\.)(/|$))[^/\\]+(?:/[^/\\]+)*)$'
  parser_metadata:
    type: object
    additionalProperties: false
    required: [pack_slug, findings, suppression_markers]
    properties:
      pack_slug:
        type: string
        minLength: 1
        pattern: '^[a-z0-9][a-z0-9-]*$'
      findings:
        type: object
        additionalProperties: false
        required: [format, artifact_globs, compiler_diagnostics]
        properties:
          format:
            enum: [junit_xml]
          artifact_globs:
            type: array
            items:
              type: string
              minLength: 1
          compiler_diagnostics:
            type: object
            additionalProperties: false
            required: [format]
            properties:
              format:
                enum: [gradle_kotlin_compiler_stdout]
          executed_work:
            oneOf:
              - type: 'null'
              - type: object
                additionalProperties: false
                required: [format]
                properties:
                  format:
                    enum: [gradle_actionable_summary]
      suppression_markers:
        type: array
        items:
          type: string
          minLength: 1
