            audit_binding_digest:
              type: string
              pattern: ^[a-fA-F0-9]{64}$
            resolved_obligations:
              type: array
              maxItems: 256
              items:
                type: object
                additionalProperties: false
                required:
                - obligation_id
                - obligation
                - baseline_citations
                - current_citations
                properties:
                  obligation_id:
                    type: string
                    minLength: 1
                    maxLength: 256
                  obligation:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  baseline_citations:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: string
                      minLength: 1
                  current_citations:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: string
                      minLength: 1
            preserved_obligations:
              type: array
              maxItems: 256
              items:
                type: object
                additionalProperties: false
                required:
                - obligation_id
                - obligation
                - current_citations
                properties:
                  obligation_id:
                    type: string
                    minLength: 1
                    maxLength: 256
                  obligation:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  current_citations:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: string
                      minLength: 1
            remaining_gaps:
              type: array
