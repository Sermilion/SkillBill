          additionalProperties: false
          required:
          - criterion_ref
          - repair_attempt_id
          - baseline_tree_digest
          - current_tree_digest
          - baseline_checkpoint_id
          - current_checkpoint_id
          - verification_revision
          - audit_binding_digest
          - resolved_obligations
          - preserved_obligations
          - remaining_gaps
