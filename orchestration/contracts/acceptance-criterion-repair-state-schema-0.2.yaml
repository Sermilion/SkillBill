              maxLength: 256
            execution_id:
              type: string
              minLength: 1
              maxLength: 256
            worker_execution_id:
              type: string
              minLength: 1
              maxLength: 256
            baseline_checkpoint_id:
              type: string
              minLength: 1
              maxLength: 256
            current_checkpoint_id:
              type: string
              minLength: 1
              maxLength: 256
            spec_digest:
              type: string
              pattern: ^[a-fA-F0-9]{64}$
            worker_output_digest:
              type: string
              pattern: ^[a-fA-F0-9]{64}$
            baseline_tree_digest:
              type: string
              pattern: ^[a-fA-F0-9]{64}$
            current_tree_digest:
              type: string
              pattern: ^[a-fA-F0-9]{64}$
            criterion_ref:
              type: string
              pattern: ^AC-[0-9]{3}$
            established_obligations:
              type: array
              maxItems: 256
              items:
                type: object
                additionalProperties: false
                required:
                - obligation_id
                - obligation
                - current_citations
                properties:
                  obligation_id:
                    type: string
                    minLength: 1
                    maxLength: 256
                  obligation:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  current_citations:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: string
                      minLength: 1
                      maxLength: 4096
            reservation_id:
              type: string
              minLength: 1
              maxLength: 256
            checker_execution_id:
              type: string
              minLength: 1
              maxLength: 256
            checker_output_id:
              type: string
              minLength: 1
              maxLength: 256
            checker_output_digest:
              type: string
              pattern: ^[a-fA-F0-9]{64}$
            verification_revision:
              type: integer
              minimum: 0
            audit_binding_digest:
              type: string
              pattern: ^[a-fA-F0-9]{64}$
            source_unchanged_during_check:
              type: boolean
            baseline_citations:
              type: array
              maxItems: 65536
              items:
                type: string
                minLength: 1
                maxLength: 4096
            current_citations:
              type: array
              maxItems: 65536
              items:
                type: string
                minLength: 1
                maxLength: 4096
            verified_resolved_obligations:
              type: array
              maxItems: 256
              items:
                type: object
                additionalProperties: false
                required:
                - obligation_id
                - obligation
                - baseline_citations
                - current_citations
                properties:
                  obligation_id:
                    type: string
                    minLength: 1
                    maxLength: 256
                  obligation:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  baseline_citations:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: string
                      minLength: 1
                  current_citations:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: string
                      minLength: 1
            verified_preserved_obligations:
              type: array
              maxItems: 256
              items:
                type: object
                additionalProperties: false
