                properties:
                  obligation_id:
                    type: string
                    minLength: 1
                    maxLength: 256
                  obligation:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  current_citations:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: string
