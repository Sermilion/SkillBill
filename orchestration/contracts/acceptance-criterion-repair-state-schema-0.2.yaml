$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/acceptance-criterion-repair-state.yaml
title: Acceptance criterion repair state
type: object
additionalProperties: false
required:
- contract_version
- catalog_id
- execution_id
- spec_digest
- criteria
- dependencies
- unresolved_queue
- current_criterion_ref
- reservation
- outcomes
- unsuccessful_totals
- revision
- mode
- stage
- completed_repair_evidence_ref
- admitted_tree_digest
- admitted_checkpoint_id
- source_transitions
- interaction_trace
properties:
  contract_version:
    const: '0.2'
  catalog_id:
    type: string
    minLength: 1
    maxLength: 256
  execution_id:
    type: string
    minLength: 1
    maxLength: 256
  spec_digest:
    type: string
    pattern: ^[a-fA-F0-9]{64}$
  criteria:
    type: array
    minItems: 1
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required:
      - canonical_ref
      - original_alias
      - original_text
      - ordinal
      - source_disposition
      - validation_obligation
      - validation_owner_available
      - evidence_ref
      - closure_evidence_ref
      - closure_tree_digest
      - closure_checkpoint_id
      properties:
        canonical_ref:
          type: string
          pattern: ^AC-[0-9]{3}$
        original_alias:
          type:
          - string
          - 'null'
          maxLength: 128
        original_text:
          type: string
          minLength: 1
          maxLength: 8192
        ordinal:
          type: integer
          minimum: 1
          maximum: 256
        source_disposition:
          enum:
          - not_applicable
          - source_closed
          - source_unresolved
        validation_obligation:
          enum:
          - required
          - deferred
          - not_required
        validation_owner_available:
          type: boolean
        evidence_ref:
          type: string
          minLength: 1
        closure_evidence_ref:
          type:
          - string
          - 'null'
          minLength: 1
        closure_tree_digest:
          type:
          - string
          - 'null'
          pattern: ^[a-fA-F0-9]{64}$
        closure_checkpoint_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
  dependencies:
    type: array
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required:
      - dependent_ref
      - prerequisite_ref
      - reason
      - declaring_output_ref
      - source_evidence_ref
      properties:
        dependent_ref:
          type: string
          pattern: ^AC-[0-9]{3}$
        prerequisite_ref:
          type: string
          pattern: ^AC-[0-9]{3}$
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        declaring_output_ref:
          type: string
          minLength: 1
          maxLength: 512
        source_evidence_ref:
          type: string
          minLength: 1
  unresolved_queue:
    type: array
    maxItems: 256
    uniqueItems: true
    items:
      type: string
      pattern: ^AC-[0-9]{3}$
  current_criterion_ref:
    type:
    - string
    - 'null'
    pattern: ^AC-[0-9]{3}$
  reservation:
    oneOf:
    - type: 'null'
    - type: object
      additionalProperties: false
      required:
      - reservation_id
      - criterion_ref
      - revision
      - stage_revision
      properties:
        reservation_id:
          type: string
          minLength: 1
          maxLength: 256
        criterion_ref:
          type: string
          pattern: ^AC-[0-9]{3}$
        revision:
          type: integer
          minimum: 1
        stage_revision:
          type: integer
          minimum: 1
  outcomes:
    type: array
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required:
      - outcome_id
      - reservation_id
      - criterion_ref
      - digest
      - outcome_kind
      - evidence_ref
      - expected_revision
      - tree_digest
      - checkpoint_id
      properties:
        outcome_id:
          type: string
          minLength: 1
          maxLength: 256
        reservation_id:
          type: string
          minLength: 1
          maxLength: 256
        criterion_ref:
          type: string
          pattern: ^AC-[0-9]{3}$
        digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        outcome_kind:
          enum:
          - targeted_success
          - incomplete
          - blocked
          - targeted_failure
        expected_revision:
          type:
          - integer
          - 'null'
          minimum: 0
        audit_binding_digest:
          type:
          - string
          - 'null'
          pattern: ^[a-fA-F0-9]{64}$
        tree_digest:
          type:
          - string
          - 'null'
          pattern: ^[a-fA-F0-9]{64}$
        checkpoint_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
        evidence_ref:
          type: string
          minLength: 1
  budget_start_outcome_index:
    type: integer
    minimum: 0
    maximum: 4096
  unsuccessful_totals:
    type: object
    maxProperties: 256
    additionalProperties: false
    patternProperties:
      ^AC-[0-9]{3}$:
        type: integer
        minimum: 0
        maximum: 3
  revision:
    type: integer
    minimum: 0
  mode:
    enum:
    - initial_discovery
    - current_criterion_targeted
    - accepted
  stage:
    enum:
    - discovery_admitted
    - read_only_audit_required
    - repair_reserved
    - repair_completed_awaiting_targeted_verification
    - accepted
    - budget_blocked
    - interaction_trace_required
  completed_repair_evidence_ref:
    type:
    - string
    - 'null'
    minLength: 1
  admitted_tree_digest:
    type:
    - string
    - 'null'
    pattern: ^[a-fA-F0-9]{64}$
  admitted_checkpoint_id:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 256
  source_transitions:
    type: array
    maxItems: 16384
    items:
      type: object
      additionalProperties: false
      required:
      - canonical_ref
      - revision
      - from_disposition
      - to_disposition
      - producing_id
      - producing_digest
      - evidence_ref
      - tree_digest
      - checkpoint_id
      properties:
        canonical_ref:
          type: string
          pattern: ^AC-[0-9]{3}$
        revision:
          type: integer
          minimum: 1
        from_disposition:
          enum:
          - not_applicable
          - source_closed
          - source_unresolved
        to_disposition:
          enum:
          - not_applicable
          - source_closed
          - source_unresolved
        producing_id:
          type: string
          minLength: 1
          maxLength: 256
        producing_digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        evidence_ref:
          type: string
          minLength: 1
        tree_digest:
          type:
          - string
          - 'null'
          pattern: ^[a-fA-F0-9]{64}$
        checkpoint_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
  pending_audit_refs:
    type: array
    maxItems: 256
    uniqueItems: true
    items:
      type: string
      pattern: ^AC-[0-9]{3}$
  prose_audits:
    type: array
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - criterion_ref
      - satisfied
      - digest
      - prose
      - tree_digest
      - checkpoint_id
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: integer
          minimum: 1
        criterion_ref:
          type:
          - string
          - 'null'
          pattern: ^AC-[0-9]{3}$
        satisfied:
          type: boolean
        digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        prose:
          type: string
          minLength: 1
        tree_digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        checkpoint_id:
          type: string
          minLength: 1
          maxLength: 256
  pending_clarification_question:
    type:
    - string
    - 'null'
    maxLength: 1024
  interaction_trace:
    type: object
    additionalProperties: false
    required:
    - pending_scenario_refs
    - traced_scenario_refs
    - broken_scenario_refs
    - repaired_scenario_refs
    - unknown_scenario_refs
    - recheck_refs
    - recheck_any_change_refs
    - traced_spec_digest
    properties:
      pending_scenario_refs:
        $ref: '#/$defs/scenario_ref_list'
      traced_scenario_refs:
        $ref: '#/$defs/scenario_ref_list'
      broken_scenario_refs:
        $ref: '#/$defs/scenario_ref_list'
      repaired_scenario_refs:
        $ref: '#/$defs/scenario_ref_list'
      unknown_scenario_refs:
        $ref: '#/$defs/scenario_ref_list'
      recheck_refs:
        $ref: '#/$defs/scenario_ref_list'
      recheck_any_change_refs:
        $ref: '#/$defs/scenario_ref_list'
      traced_spec_digest:
        type:
        - string
        - 'null'
        pattern: ^[a-fA-F0-9]{64}$
  completed_mutations:
    type: array
    maxItems: 4096
    items: &id001
      type: object
      additionalProperties: false
      required:
      - catalog_id
      - spec_digest
      - execution_id
      - criterion_ref
      - repair_attempt_id
      - worker_execution_id
      - worker_output_id
      - worker_output_digest
      - baseline_tree_digest
      - baseline_checkpoint_id
      - current_tree_digest
      - current_checkpoint_id
      - established_obligations
      properties:
        catalog_id:
          type: string
          minLength: 1
          maxLength: 256
        execution_id:
          type: string
          minLength: 1
          maxLength: 256
        repair_attempt_id:
          type: string
          minLength: 1
          maxLength: 256
        worker_execution_id:
          type: string
          minLength: 1
          maxLength: 256
        worker_output_id:
          type: string
          minLength: 1
          maxLength: 256
        baseline_checkpoint_id:
          type: string
          minLength: 1
          maxLength: 256
        current_checkpoint_id:
          type: string
          minLength: 1
          maxLength: 256
        spec_digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        worker_output_digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        baseline_tree_digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        current_tree_digest:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        criterion_ref:
          type: string
          pattern: ^AC-[0-9]{3}$
        established_obligations:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required:
            - obligation_id
            - obligation
            - current_citations
            properties:
              obligation_id:
                type: string
                minLength: 1
                maxLength: 256
              obligation:
                type: string
                minLength: 1
                maxLength: 4096
              current_citations:
                type: array
                minItems: 1
                maxItems: 256
                items:
                  type: string
                  minLength: 1
                  maxLength: 4096
  independent_checks:
    type: array
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required:
      - mutation
      - comparison
      - context
      properties:
        mutation: *id001
        comparison:
