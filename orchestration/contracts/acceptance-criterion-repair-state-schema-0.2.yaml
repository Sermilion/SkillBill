$defs:
  scenario_ref_list:
    type: array
    maxItems: 64
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 16
x-coherence-checks:
- id: unique-catalog-identities
  description: Criteria have unique canonical references and ordinals, and every queue, dependency, reservation, outcome and counter reference
    resolves to one admitted criterion.
- id: dependency-dag
  description: Dependencies have no self-edge, duplicate edge or cycle; unresolved queue order is stable topological order with ordinal ties.
- id: active-position
  description: Current criterion is the first unresolved queue entry; a reservation names that current criterion and at most one reservation is
    live.
- id: monotonic-budget
  description: Unsuccessful totals equal accepted unsuccessful outcomes at or after budget_start_outcome_index, which defaults to zero and cannot
    exceed the retained outcome count. Each criterion admits at most three failures per budget. Explicit operator resume of a budget-blocked child
    advances the index to the retained outcome count and clears the active totals without deleting history. Budget-blocked state has an exhausted
    criterion anywhere in the unresolved queue; discovery, reserved, and awaiting-verification stages have no exhausted unresolved criterion.
- id: accepted-queue
  description: An empty focused queue with no pending audit is accepted; settled criteria are trusted, and accepted criteria are re-checked only
    when the runtime lists them in interaction-trace or re-check scope.
- id: immutable-transition-history
  description: Accepted source closures and focused-audit reopenings retain their producing identity and evidence through the authoritative state
    lifetime.
- id: utf8-capacity
  description: The runtime refuses serialized artifacts above 12582912 UTF-8 bytes before persistence.
