$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/work-detail-schema.yaml"
title: "Work item detail"
type: object
additionalProperties: false
required: [contract_version, observed_at, item, page_size, next_cursor]
properties:
  contract_version: {type: string, const: "1.10"}
  page_size: {type: integer, minimum: 1, maximum: 100}
  next_cursor: {type: [string, "null"], minLength: 1}
  observed_at: {type: string, format: date-time}
  item:
    oneOf:
      - type: "null"
      - $ref: "#/$defs/item"
  problem:
    type: object
    additionalProperties: false
    required: [code, message]
    properties:
      code: {type: string, enum: [absent_database, unknown_work_item, ambiguous_work_item, invalid_repository_identity]}
      message: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        item: {type: "null"}
      required: [item]
    then:
      required: [problem]
  - if:
      properties:
        item: {type: object}
      required: [item]
    then:
      not:
        required: [problem]
$defs:
  build: { type: object, additionalProperties: false, required: [state, command, short_command, tool, project_kind, pid, started_at, elapsed_ms, elapsed_as_of, usual_ms, exit_code, finished_at, previous], properties: { state: {type: string, enum: [running, passed, failed, finished]}, command: {type: string, minLength: 1}, short_command: {type: string, minLength: 1}, tool: {type: string, minLength: 1}, project_kind: {type: string, minLength: 1}, pid: {type: integer, minimum: 0}, started_at: {type: string, format: date-time}, elapsed_ms: {type: [integer, "null"], minimum: 0}, elapsed_as_of: {type: [string, "null"], format: date-time}, usual_ms: {type: [integer, "null"], minimum: 0}, exit_code: {type: [integer, "null"]}, finished_at: {type: [string, "null"], format: date-time}, previous: { anyOf: [ { $ref: "#/$defs/build_previous" }, { type: "null"} ] } } }
  build_previous: { type: object, additionalProperties: false, required: [state, duration_ms, finished_at], properties: { state: {type: string, enum: [passed, failed, finished]}, duration_ms: {type: integer, minimum: 0}, finished_at: {type: string, format: date-time} } }
  item:
    type: object
    additionalProperties: true
    required: [snapshot, repository_root, step_pipeline]
    properties:
      snapshot: { $ref: "https://skill-bill.dev/contracts/ide-status-schema.yaml" }
      repository_root: {type: string, minLength: 1}
      finished_at: {type: [string, "null"], format: date-time}
      finished_at_source:
        type: [string, "null"]
        enum: [standalone_finished_at, workflow_completion, goal_completion, goal_state_entry, estimated_goal_state_entry, null]
      build: { anyOf: [ { $ref: "#/$defs/build" }, { type: "null" } ] }
      feature_title: {type: string}
      subtasks: {type: array, maxItems: 100, description: "One page of up to 100 goal subtasks, whatever page_size was requested.", items: {type: object}}
      phases: {type: array, items: {type: object}}
      current_phase: {type: [string, "null"]}
      complete_count: {type: integer, minimum: 0}
      pending_count: {type: integer, minimum: 0}
      blocked_count: {type: integer, minimum: 0}
      execution_history:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [invocation_id, execution_id, lifecycle_state, started_at, updated_at, finished_at, result]
          properties:
            invocation_id: {type: string, minLength: 1}
            execution_id: {type: string, minLength: 1}
            lifecycle_state: {type: string, minLength: 1}
            started_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            finished_at: {type: [string, "null"], format: date-time}
            result: {type: [string, "null"]}
      step_pipeline: {type: array, items: {type: string}}
      plan_activity:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, phase_id, kind, text, at, updated_at, agent_id, path, status, duration_ms, exit_code, subtask_id]
          properties:
            id: {type: string, minLength: 1}
            phase_id: {type: string, minLength: 1}
            kind: {enum: [read, write, search, command, mcp, note, tool, stream, error]}
            text: {type: string, maxLength: 8192}
            at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            agent_id: {type: string}
            path: {type: [string, "null"]}
            status: {enum: [started, completed, failed]}
            duration_ms: {type: [integer, "null"], minimum: 0}
            exit_code: {type: [integer, "null"]}
            subtask_id: {type: [integer, "null"], minimum: 1}
      plan_output_lines:
        type: array
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required: [id, text, at, subtask_id, sequence, raw]
          properties:
            id: {type: string, minLength: 1}
            text: {type: string, maxLength: 65536}
            at: {type: string, format: date-time}
            subtask_id: {type: [integer, "null"], minimum: 1}
            sequence: {type: integer, minimum: 1}
            raw: {type: boolean}
      plan_output_tail: {type: array, maxItems: 4, items: {type: string, maxLength: 160}}
      plan_output_updated_at: {type: [string, "null"], format: date-time}
      plan_subtask_latest_lines:
        type: object
        maxProperties: 32
        additionalProperties: {type: string, maxLength: 160}
      standalone_plan_progress:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/standalone_plan_progress"
      goal_finish_pipeline: {type: array, items: {type: string}}
      active_agent: {type: [string, "null"]}
      execution_liveness: {type: [string, "null"]}
      progress_stalled_since: {type: string, format: date-time}
      phase_attempt_counts: {type: object}
      cumulative_fix_iterations: {type: object}
      re_attempt_cause_counts: {type: object}
      findings_in_scope: {type: [integer, "null"]}
      supervisor_kill_count: {type: integer, minimum: 0}
      latest_observability_event: {type: [object, "null"]}
      latest_worktree_edit: {type: [object, "null"]}
      completed_subtask_validation:
        type: [array, "null"]
        items:
          type: object
          additionalProperties: false
          required: [subtask_id, validation_passed, validation_evidence, validation_result, integrity_problem]
          properties:
            subtask_id: {type: integer, minimum: 1}
            validation_passed: {type: [boolean, "null"]}
            validation_evidence:
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [contract_version, results]
                  properties:
                    contract_version: {type: string, const: "0.2"}
                    results:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        required: [command, exit_code]
                        properties:
                          command: {type: string, minLength: 1}
                          exit_code: {type: integer}
            validation_result:
              type: [object, "null"]
              required: [validation_status, checks, gate_run_count, gate_runs]
              properties:
                validation_status: {type: string, minLength: 1}
                checks: {type: array, items: {type: string}}
                repository_checkpoint:
                  type: object
                  required: [fingerprint]
                  properties:
                    fingerprint: {type: string, minLength: 1}
                gate_run_count: {type: integer, minimum: 0}
                gate_runs:
                  type: array
                  items:
                    type: object
                    required: [duration_ms, outcome, cache_mode, executed_work_units]
                    properties:
                      duration_ms: {type: integer, minimum: 0}
                      outcome: {type: string}
                      cache_mode: {type: string}
                      executed_work_units: {type: integer, minimum: 0}
                      executed_checks: {type: array, items: {type: string}}
                      command: {type: [string, "null"]}
                      exit_code: {type: [integer, "null"]}
                      repository_checkpoint: {type: [string, "null"]}
            integrity_problem: {type: [string, "null"]}
      goal_assessment:
        type: object
        additionalProperties: false
        required: [state, round, exit_reason, fix_ran, open_finding_refs, findings]
        properties:
          state: {type: string, enum: [pending, running, blocked, completed, skipped]}
          round: {type: integer, minimum: 0}
          exit_reason:
            type: [string, "null"]
            enum: [converged, round_cap, persistent_finding, assessment_unavailable, skipped_no_changes, null]
          fix_ran: {type: boolean}
          open_finding_refs:
            type: array
            items: {type: string, pattern: "^GA-[0-9]{3}$"}
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [finding_ref, severity, path, line, failure_scenario, verification, state, evidence]
              properties:
                finding_ref: {type: string, pattern: "^GA-[0-9]{3}$"}
                severity: {type: string, enum: [blocker, major, minor]}
                path: {type: string, minLength: 1}
                line: {type: integer, minimum: 1}
                failure_scenario: {type: string, minLength: 1}
                verification: {type: string, enum: [confirmed, refuted, unverified, not_required]}
                state: {type: string, enum: [open, fixed, refuted]}
                evidence: {type: string}
  standalone_plan_progress:
    type: object
    additionalProperties: false
    required: [report, stages, planned_subtask_count, total_subtask_count, current_planning_subtask_id, planning_wave_subtask_ids, planning_wave_number, planning_wave_capacity, planning_wave_history_complete, blocked_subtask_id, blocked_reason, units, stalled_since]
    properties:
      report:
        oneOf:
          - type: "null"
          - type: object
            additionalProperties: false
            required: [feature_name, parent_spec_path, subtasks, bundle_files]
            properties:
              feature_name: {type: string, minLength: 1}
              parent_spec_path: {type: string, minLength: 1}
              bundle_files: {type: array, items: {type: string, minLength: 1}}
              subtasks:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [subtask_id, name, spec_path, depends_on]
                  properties:
                    subtask_id: {type: integer, minimum: 1}
                    name: {type: string, minLength: 1}
                    spec_path: {type: string, minLength: 1}
                    depends_on: {type: array, items: {type: integer, minimum: 1}}
      stages:
        type: array
        minItems: 3
        maxItems: 3
        items:
          type: object
          additionalProperties: false
          required: [phase_id, first_started_at, finished_at, briefing_text, status]
          properties:
            phase_id: {type: string, enum: [preplan, plan, plan_subtasks]}
            first_started_at: {type: [string, "null"], format: date-time}
            finished_at: {type: [string, "null"], format: date-time}
            briefing_text: {type: [string, "null"]}
            status: {type: [string, "null"], enum: [pending, running, completed, failed, blocked, paused, skipped, null]}
      planned_subtask_count: {type: integer, minimum: 0}
      total_subtask_count: {type: integer, minimum: 0}
      current_planning_subtask_id: {type: [integer, "null"], minimum: 1}
      planning_wave_subtask_ids:
        type: array
        maxItems: 5
        items: {type: integer, minimum: 1}
      planning_wave_number: {type: [integer, "null"], minimum: 1}
      planning_wave_capacity: {type: [integer, "null"], minimum: 1}
      planning_wave_history_complete: {type: boolean}
      waves:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [number, subtask_ids, started_at]
          properties:
            number: {type: [integer, "null"], minimum: 1}
            subtask_ids: {type: array, items: {type: integer, minimum: 1}}
            started_at: {type: [string, "null"], format: date-time}
      blocked_subtask_id: {type: [integer, "null"], minimum: 1}
      blocked_reason: {type: [string, "null"]}
      units:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [subtask_id, name, spec_path, depends_on, state, started_at, finished_at, blocked_reason, latest_output, latest_output_at]
          properties:
            subtask_id: {type: integer, minimum: 1}
            name: {type: string, minLength: 1}
            spec_path: {type: string, minLength: 1}
            depends_on: {type: array, items: {type: integer, minimum: 1}}
            state: {type: string, enum: [blocked, saved, writing, queued]}
            started_at: {type: [string, "null"], format: date-time}
            finished_at: {type: [string, "null"], format: date-time}
            blocked_reason: {type: [string, "null"]}
            latest_output: {type: [string, "null"], maxLength: 160}
            latest_output_at: {type: [string, "null"], format: date-time}
      stalled_since: {type: [string, "null"], format: date-time}
