class: quality-check-shell
contract_version: "1.8"

matchers:
  - exact: bill-code-check

pointers:
  - shell-ceremony
  - stack-routing
  - telemetry-contract

sections:
  - heading: Shell Role
    body: |
      This skill is a governed shell. It owns ceremony, stack routing, and contract enforcement for the quality-check family. Stack-specific check commands live in the dominant pack `validation_gate`, not in a second pack skill.

      Keep this shell thin:

      - detect the dominant stack in the current unit of work via manifest-driven discovery
      - resolve the dominant pack from the manifest-declared routing signals
      - run that pack's `validation_gate.collect_all_full_gate_command`, then after in-session repair run `validation_gate.cache_bypassing_collect_all_full_gate_command` once
      - refuse to run when the dominant pack has no `validation_gate` — never silently fall back to another pack or a sidecar

      The shell targets shell contract version `1.8`.

  - heading: Setup
    body: |
      Determine the current unit of work:

      - specific files
      - working tree diff
      - branch diff / PR scope
      - repo-wide validation when the caller explicitly requests it

      Inspect the changed files and repo markers before routing.

  - heading: Routing Rules
    body: |
      Stack detection and routing are manifest-driven. The shell discovers every `platform-packs/<slug>/platform.yaml` from the skill-adjacent installed `platform-packs` link (or `~/.skill-bill/platform-packs/` / the install-published review catalog), not from the reviewed repository root unless that repository is itself the Skill Bill source tree. It reads each pack's declared routing signals and chooses the dominant stack using manifest-declared tie-breakers.

      - Routing selects the winning pack slug; `routed_skill` for telemetry and output is always `bill-code-check`.
      - Collect-all and confirmation argv come only from the winning pack `validation_gate`. Do not read `declared_quality_check_file`, sibling sidecars, or rediscover build files, wrappers, or CI configuration.
      - When Kotlin/JVM and KMP ownership share one scope, adjacent-pack dominance still applies; argv always come from the winning pack gate.
      - A pack without `validation_gate` loud-fails with `MissingValidationGateError`; the shell never substitutes another pack.

  - heading: Delegation Contract
    body: |
      Pass along:

      - the current unit of work and changed files
      - the detected stack and key signals
      - relevant `AGENTS.md` guidance and matching `.agents/skill-overrides.md` sections
      - the pack `validation_gate` argv as the only full-suite commands

  - heading: Output Format
    body: |
      ```text
      Routed to: bill-code-check
      Detected stack: <stack> | Mixed | Unknown/Unsupported
      Signals: <markers>
      Reason: <why this pack was selected>

      <quality-check output>
      ```

  - heading: Telemetry
    body: |
      This shell emits quality-check lifecycle telemetry via `quality_check_started` and `quality_check_finished` with `routed_skill` always `bill-code-check`.

      Standalone invocation (user runs `bill-code-check` directly):

      1. Call `quality_check_started` once stack routing is decided, with `routed_skill` set to `bill-code-check`, `detected_stack`, `fallback`, `scope_type` (`files` / `working_tree` / `branch_diff` / `repo`), and `initial_failure_count` (0 if the first check has not run yet). Include `fallback_reason` when `fallback=true` or a reason is known.
      2. Save the returned `session_id`.
      3. Call `quality_check_finished` when the quality-check loop finishes, with `session_id`, `final_failure_count`, `iterations`, `result` (`pass` / `fail` / `skipped` / `unsupported_stack`), optional `failing_check_names` and `unsupported_reason`.

      Orchestrated invocation (invoked by another workflow skill that passes `orchestrated=true`):

      1. Skip `quality_check_started` entirely.
      2. Call `quality_check_finished` once with `orchestrated=true` and all started+finished fields combined (`routed_skill` must be `bill-code-check`, `detected_stack`, `fallback`, `scope_type`, `initial_failure_count`, `final_failure_count`, `iterations`, `result`, `failing_check_names`, `unsupported_reason`, `duration_seconds`, and optional `fallback_reason`).
      3. The tool returns `{"mode": "orchestrated", "telemetry_payload": {...}}`. Return that payload to the orchestrator — it will embed it in its own finished event.

      The orchestrated flag must come from the caller. Never assume orchestrated mode from ambient state.

ceremony_lines:
  - "Follow the shell ceremony in [shell-ceremony.md](shell-ceremony.md)."
  - "When stack routing applies, follow [stack-routing.md](stack-routing.md)."
  - "When telemetry applies, follow [telemetry-contract.md](telemetry-contract.md)."
