[versions]
kotlin = "2.4.21"
compose = "1.12.1"
tray = "2.1.6"
native-os = "2.5.18"
serialization = "1.9.0"
coroutines = "1.10.2"
junit = "5.12.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
compose-native-tray = { module = "dev.nucleusframework:composenativetray", version.ref = "tray" }
compose-native-tray-app = { module = "dev.nucleusframework:composenativetray-app", version.ref = "tray" }
nucleus-notification-common = { module = "dev.nucleusframework:nucleus.notification-common", version.ref = "native-os" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "native-os" }
nucleus-decorated-window-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "native-os" }
nucleus-autolaunch = { module = "dev.nucleusframework:nucleus.autolaunch", version.ref = "native-os" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
