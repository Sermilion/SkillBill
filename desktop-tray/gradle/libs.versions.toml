[versions]
kotlin = "2.4.21"
compose = "1.12.1"
tray = "2.1.6"
native-os = "2.5.18"
serialization = "1.9.0"
coroutines = "1.10.2"
junit = "5.12.2"
ksp = "2.3.12"
room = "3.0.3"
sqlite = "2.7.1"
datastore = "1.2.1"
paging = "3.5.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
compose-native-tray = { module = "dev.nucleusframework:composenativetray", version.ref = "tray" }
nucleus-notification-common = { module = "dev.nucleusframework:nucleus.notification-common", version.ref = "native-os" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "native-os" }
nucleus-autolaunch = { module = "dev.nucleusframework:nucleus.autolaunch", version.ref = "native-os" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
