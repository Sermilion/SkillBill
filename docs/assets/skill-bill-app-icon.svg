<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Skill Bill</title>
  <desc id="desc">Skill Bill application icon: amber run ring, the Active status icon, on a dark tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1E24"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3C462"/>
      <stop offset="0.55" stop-color="#E9A81C"/>
      <stop offset="1" stop-color="#C98A0E"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="36" y="36" width="952" height="952" rx="220" fill="none" stroke="url(#edge)" stroke-width="8"/>

  <!-- Active status icon from the design system (ring r=5.5, pie r=3.5 in a 14 px box), scaled up.
       The pie covers 68% of the turn, clockwise from 12 o'clock. -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#amber)" stroke-width="68"/>
  <path d="M512 512L512 362A150 150 0 1 1 376.3 575.9Z" fill="url(#amber)"/>
</svg>
